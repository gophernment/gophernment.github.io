<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-label="กับดักการจัดสรรที่ไม่ตรงขอบ: 172.16.0.32/26 ใช้ไม่ได้ และการฝืน AND ทำให้ทับกัน">
<style>
text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12.5px; fill: #1a1a1a; }
.hdr { font-weight: 700; font-size: 17.5px; }
.sub { fill: #57606a; font-size: 12.5px; }
.ptitle { font-weight: 700; font-size: 14px; }
.txt { font-size: 12.5px; }
.lbl { fill: #57606a; font-size: 11px; }
.small { fill: #57606a; font-size: 10.5px; }
.big { font-weight: 700; font-size: 20px; fill: #0550ae; }
.mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 11.5px; fill: #0a3069; }
.monom { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; fill: #0a3069; }
.monos { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 10.5px; fill: #57606a; }
.bit { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #0550ae; }
.boxg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
.boxb { fill: #eef4ff; stroke: #0969da; stroke-width: 1.5; }
.boxy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
.boxi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
.boxr { fill: #fdeff0; stroke: #b62324; stroke-width: 1.4; }
.bit0 { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
.bit1 { fill: #dbeafe; stroke: #0969da; stroke-width: 1; }
.segA { fill: #dbeafe; stroke: #0969da; stroke-width: 1.2; }
.segB { fill: #e6f4ea; stroke: #1a7f37; stroke-width: 1.2; }
.segC { fill: #fff4d6; stroke: #bf8700; stroke-width: 1.2; }
.segD { fill: #f3e8fd; stroke: #8250df; stroke-width: 1.2; }
.segE { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
.segR { fill: #fdeff0; stroke: #b62324; stroke-width: 1.2; }
.wire { stroke: #8c959f; stroke-width: 1.8; fill: none; }
.wire2 { stroke: #b6bfc8; stroke-width: 1.2; fill: none; stroke-dasharray: 5 5; }
.head { fill: #8c959f; }
.rule { stroke: #d0d7de; stroke-width: 1.2; }
.brk { stroke: #57606a; stroke-width: 1.2; fill: none; }
</style>
<rect x="0" y="0" width="920" height="420" fill="#ffffff"/>
<text class="hdr" x="40" y="36" text-anchor="start">กับดัก: ที่อยู่ "ถัดไป" ไม่ใช่ network address</text>
<text class="sub" x="40" y="60" text-anchor="start">/26 ยาว 64 ที่อยู่ จึงเริ่มได้เฉพาะที่ 0, 64, 128, ... เท่านั้น</text>
<line class="rule" x1="48.0" y1="84.0" x2="872.0" y2="84.0"/>
<line class="rule" x1="48.0" y1="78.0" x2="48.0" y2="90.0"/>
<text class="small" x="48" y="74" text-anchor="start">0</text>
<line class="rule" x1="460.0" y1="78.0" x2="460.0" y2="90.0"/>
<text class="small" x="460" y="74" text-anchor="middle">64</text>
<line class="rule" x1="872.0" y1="78.0" x2="872.0" y2="90.0"/>
<text class="small" x="872" y="74" text-anchor="end">128</text>
<rect class="segA" x="48.0" y="100.0" width="206.0" height="44.0" rx="3"/>
<text class="onbar" x="151" y="126" text-anchor="middle">sales /27</text>
<rect class="boxg" x="254.0" y="100.0" width="206.0" height="44.0" rx="3" stroke-dasharray="6 4"/>
<text class="lbl" x="357" y="126" text-anchor="middle">ว่าง 32 ใบ</text>
<rect class="segB" x="460.0" y="100.0" width="412.0" height="44.0" rx="3"/>
<text class="onbar" x="666" y="126" text-anchor="middle">172.16.0.64/26 (ที่ถูก)</text>
<line class="brk" x1="254.0" y1="148.0" x2="254.0" y2="168.0"/>
<text class="mono" x="248" y="186" text-anchor="end">next_free 172.16.0.32</text>
<text class="lbl" x="248" y="208" text-anchor="end">ไม่ใช่ network address</text>
<rect class="boxr" x="40.0" y="232.0" width="420.0" height="84.0" rx="8"/>
<text class="ptitle" x="58" y="256" text-anchor="start">ถ้าฝืน AND ให้เป็น network</text>
<text class="mono" x="58" y="278" text-anchor="start">172.16.0.0/26 ทับ sales /27</text>
<text class="small" x="58" y="300" text-anchor="start">แผนเสียแบบเงียบ ๆ — ไม่มี error ให้เห็น</text>
<rect class="boxi" x="472.0" y="232.0" width="408.0" height="84.0" rx="8"/>
<text class="ptitle" x="490" y="256" text-anchor="start">ถ้าขยับไปขอบถัดไป</text>
<text class="mono" x="490" y="278" text-anchor="start">172.16.0.64/26</text>
<text class="small" x="490" y="300" text-anchor="start">ช่วง 32–63 ยังว่าง แต่เล็กกว่าที่ต้องการ</text>
<text class="txt" x="40" y="348" text-anchor="start">กฎที่ใช้ได้กับทุก prefix: block ขนาด 2^n เริ่มได้เฉพาะที่ผลคูณของ 2^n</text>
<text class="small" x="40" y="374" text-anchor="start">การเรียงจากมากไปน้อยทำให้ตัวชี้ตรงขอบเสมอ — ไม่ต้องขยับเลย</text>
</svg>
