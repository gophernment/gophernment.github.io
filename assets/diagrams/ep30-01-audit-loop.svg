<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" role="img">
<defs>
<style>
  .t  { font-family: sans-serif; font-size: 14px; fill: #12263a; }
  .s  { font-family: sans-serif; font-size: 12px; fill: #3b4a5a; }
  .sm { font-family: sans-serif; font-size: 11px; fill: #4a5b6c; }
  .h  { font-family: sans-serif; font-size: 21px; font-weight: 700; fill: #0b2545; }
  .hd { font-family: sans-serif; font-size: 14px; font-weight: 700; fill: #0b2545; }
  .n  { font-family: sans-serif; font-size: 19px; font-weight: 700; fill: #0b2545; }
  .m  { font-family: monospace; font-size: 12px; fill: #0b2545; }
  .mm { font-family: monospace; font-size: 11px; fill: #3b4a5a; }
  .bad { font-family: sans-serif; font-size: 12px; fill: #7a1f1f; }
  .good{ font-family: sans-serif; font-size: 12px; fill: #14532d; }
  .big { font-family: sans-serif; font-size: 26px; font-weight: 700; fill: #0b2545; }
  .huge{ font-family: sans-serif; font-size: 40px; font-weight: 700; fill: #0b2545; }
</style>
</defs>
<text x="40" y="44" class="h">วงจร audit 7 ขั้น — ทุกขั้นมีของส่งออกที่ขั้นถัดไปใช้</text>
<text x="40" y="68" class="s">ขั้นที่ 7 ไม่ใช่จุดจบ: มันย้อนกลับไปขั้นที่ 1 ด้วยกฎและ probe ชุดเดิม</text>
<rect x="40" y="100" width="250" height="78" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<circle cx="66" cy="126" r="13" fill="#4a7bb5" stroke="#ffffff" stroke-width="2"/>
<text x="66" y="131" class="sm" text-anchor="middle">1</text>
<text x="90" y="132" class="hd">กำหนดขอบเขต</text>
<text x="56" y="160" class="sm">scope + rules of engagement</text>
<line x1="292" y1="139" x2="328" y2="139" stroke="#7d93a8" stroke-width="1.6"/>
<polygon points="328,139 320,134 320,144" fill="#7d93a8"/>
<rect x="330" y="100" width="250" height="78" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<circle cx="356" cy="126" r="13" fill="#4a7bb5" stroke="#ffffff" stroke-width="2"/>
<text x="356" y="131" class="sm" text-anchor="middle">2</text>
<text x="380" y="132" class="hd">ทำแผนที่จุดโจมตี</text>
<text x="346" y="160" class="sm">attack surface · trust boundary</text>
<line x1="582" y1="139" x2="618" y2="139" stroke="#7d93a8" stroke-width="1.6"/>
<polygon points="618,139 610,134 610,144" fill="#7d93a8"/>
<rect x="620" y="100" width="250" height="78" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<circle cx="646" cy="126" r="13" fill="#4a7bb5" stroke="#ffffff" stroke-width="2"/>
<text x="646" y="131" class="sm" text-anchor="middle">3</text>
<text x="670" y="132" class="hd">static: อ่านโค้ด</text>
<text x="636" y="160" class="sm">กฎ AST + CWE ที่รู้จัก</text>
<line x1="872" y1="139" x2="908" y2="139" stroke="#7d93a8" stroke-width="1.6"/>
<polygon points="908,139 900,134 900,144" fill="#7d93a8"/>
<rect x="910" y="100" width="250" height="78" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<circle cx="936" cy="126" r="13" fill="#4a7bb5" stroke="#ffffff" stroke-width="2"/>
<text x="936" y="131" class="sm" text-anchor="middle">4</text>
<text x="960" y="132" class="hd">dynamic: ยิง probe</text>
<text x="926" y="160" class="sm">payload เดียวกัน วัดผลจริง</text>
<rect x="910" y="250" width="250" height="78" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<circle cx="936" cy="276" r="13" fill="#4a7bb5" stroke="#ffffff" stroke-width="2"/>
<text x="936" y="281" class="sm" text-anchor="middle">5</text>
<text x="960" y="282" class="hd">จัดลำดับความเสี่ยง</text>
<text x="926" y="310" class="sm">CVSS + ผลกระทบทางธุรกิจ</text>
<rect x="620" y="250" width="250" height="78" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<circle cx="646" cy="276" r="13" fill="#4a7bb5" stroke="#ffffff" stroke-width="2"/>
<text x="646" y="281" class="sm" text-anchor="middle">6</text>
<text x="670" y="282" class="hd">เขียนรายงาน</text>
<text x="636" y="310" class="sm">finding register + หลักฐาน</text>
<rect x="330" y="250" width="250" height="78" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<circle cx="356" cy="276" r="13" fill="#4a7bb5" stroke="#ffffff" stroke-width="2"/>
<text x="356" y="281" class="sm" text-anchor="middle">7</text>
<text x="380" y="282" class="hd">retest</text>
<text x="346" y="310" class="sm">กฎและ probe ชุดเดิม</text>
<line x1="1035" y1="180" x2="1035" y2="248" stroke="#7d93a8" stroke-width="1.6"/>
<polygon points="1035,248 1030,240 1040,240" fill="#7d93a8"/>
<line x1="908" y1="289" x2="872" y2="289" stroke="#7d93a8" stroke-width="1.6"/>
<polygon points="872,289 880,284 880,294" fill="#7d93a8"/>
<line x1="618" y1="289" x2="582" y2="289" stroke="#7d93a8" stroke-width="1.6"/>
<polygon points="582,289 590,284 590,294" fill="#7d93a8"/>
<path d="M 455 330 L 455 392 L 165 392 L 165 186" fill="none" stroke="#c05050" stroke-width="1.6" stroke-dasharray="6 4"/>
<polygon points="165,180 160,192 170,192" fill="#c05050"/>
<text x="470" y="386" class="bad">แก้แล้วตรวจซ้ำ — ไม่มีขั้นไหนจบด้วยคำว่า "แก้เสร็จ"</text>
<text x="40" y="440" class="sm">ขั้นที่ 5–6 คือที่ที่รายงานส่วนใหญ่พัง: คะแนนที่ไม่มีที่มา และ finding ที่ไม่มีหลักฐาน</text>
</svg>
