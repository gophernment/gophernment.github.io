<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img">
<defs>
<style>
  .t  { font-family: sans-serif; font-size: 14px; fill: #12263a; }
  .s  { font-family: sans-serif; font-size: 12px; fill: #3b4a5a; }
  .sm { font-family: sans-serif; font-size: 11px; fill: #4a5b6c; }
  .h  { font-family: sans-serif; font-size: 21px; font-weight: 700; fill: #0b2545; }
  .hd { font-family: sans-serif; font-size: 15px; font-weight: 700; fill: #0b2545; }
  .n  { font-family: sans-serif; font-size: 19px; font-weight: 700; fill: #0b2545; }
  .m  { font-family: monospace; font-size: 12px; fill: #0b2545; }
  .mm { font-family: monospace; font-size: 11px; fill: #3b4a5a; }
  .bad { font-family: sans-serif; font-size: 12px; fill: #7a1f1f; }
  .good{ font-family: sans-serif; font-size: 12px; fill: #14532d; }
</style>
</defs>
<text x="24" y="38" class="h">เก็บรหัสผ่าน 4 วิธี — ผู้โจมตีต้องจ่ายเท่าไร</text>
<text x="24" y="62" class="s">ฐานข้อมูลที่รั่ว 6 ผู้ใช้ · พจนานุกรมของโจมตี 6 คำ · ตัวเลขจาก out/01_hash.txt</text>
<rect x="24" y="90" width="224" height="250" rx="10" fill="#f5f7f9" stroke="#9aa9b8" stroke-width="1.5"/>
<text x="34" y="120" class="hd">1) plaintext</text>
<text x="34" y="156" class="m">ต้นทุน = 0</text>
<text x="34" y="196" class="bad">ได้รหัสคืน 6/6</text>
<text x="34" y="236" class="s">ไม่ต้องคำนวณอะไรเลย</text>
<text x="34" y="276" class="s">รหัสจริงหลุดทั้งก้อน</text>
<rect x="260" y="90" width="224" height="250" rx="10" fill="#fdeeee" stroke="#c05050" stroke-width="1.5"/>
<text x="270" y="120" class="hd">2) sha256 ไม่มี salt</text>
<text x="270" y="156" class="m">ต้นทุน = 6</text>
<text x="270" y="196" class="bad">ได้รหัสคืน 4/6</text>
<text x="270" y="236" class="s">เห็นรหัสซ้ำ alice=dave</text>
<text x="270" y="276" class="s">ตารางสำเร็จรูปใช้ซ้ำได้</text>
<rect x="496" y="90" width="224" height="250" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="1.5"/>
<text x="506" y="120" class="hd">3) sha256 + salt</text>
<text x="506" y="156" class="m">ต้นทุน = 36</text>
<text x="506" y="196" class="bad">ได้รหัสคืน 4/6</text>
<text x="506" y="236" class="good">ไม่เห็นรหัสซ้ำแล้ว</text>
<text x="506" y="276" class="s">ตารางต้องสร้างใหม่รายคน</text>
<rect x="732" y="90" width="224" height="250" rx="10" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="742" y="120" class="hd">4) PBKDF2 + salt</text>
<text x="742" y="156" class="m">ต้นทุน = 21,600,000</text>
<text x="742" y="196" class="bad">ได้รหัสคืน 4/6</text>
<text x="742" y="236" class="s">ช้ากว่าเดิม 3,600,000 เท่า</text>
<text x="742" y="276" class="s">iteration = 600,000</text>
<rect x="24" y="372" width="932" height="160" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<text x="40" y="402" class="hd">สองกลไกทำงานคนละหน้าที่ — และทั้งคู่ไม่ได้แก้ปัญหารหัสผ่านอ่อน</text>
<text x="40" y="432" class="s">salt  : ทำให้ตารางที่คำนวณล่วงหน้า (rainbow table) ใช้ซ้ำกับคนอื่นไม่ได้ และซ่อนว่ารหัสผ่านซ้ำกัน</text>
<text x="40" y="456" class="s">ช้า    : จำนวนรอบ (iteration) ทำให้การเดาแต่ละครั้งมีต้นทุนจริง — ผู้ใช้จ่ายครั้งเดียวตอนล็อกอิน</text>
<text x="40" y="480" class="bad">ที่ยังเหลือ : รหัสผ่านที่อยู่ในพจนานุกรมยังถูกเดาได้ทั้ง 3 วิธีที่แฮช (4 จาก 6) · plaintext อ่านออกครบ 6/6</text>
<text x="40" y="508" class="sm">ตัวเลขบนภาพทุกตัวอ่านจาก out/01_hash.txt — ไม่มีตัวไหนพิมพ์ด้วยมือ</text>
</svg>
