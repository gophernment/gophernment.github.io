<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 760" width="1060" height="760" role="img" aria-label="Turing machine: เทปไม่สิ้นสุด หัวอ่าน สถานะจำกัด และตารางเปลี่ยนสถานะ">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 19px; }
    .sub { fill: #57606a; font-size: 12.5px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .btitle { font-weight: 700; font-size: 12.5px; }
    .lbl { fill: #57606a; font-size: 11.5px; }
    .lblb { fill: #0550ae; font-size: 11.5px; font-weight: 700; }
    .lblr { fill: #cf222e; font-size: 11.5px; font-weight: 700; }
    .lblg { fill: #1a7f37; font-size: 11.5px; font-weight: 700; }
    .lblo { fill: #9a6700; font-size: 11.5px; font-weight: 700; }
    .mono { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 12px; }
    .monos { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 11.5px; }
    .monob { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #0550ae; }
    .monor { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #cf222e; }
    .monog { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #1a7f37; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .bandw { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .bandc { fill: #eef4ff; stroke: #0969da; stroke-width: 1.4; }
    .bandg { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
    .bandr { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.4; }
    .bandy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
    .cell { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.1; }
    .cellt { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.1; }
    .cellg { fill: #eafaf0; stroke: #1a7f37; stroke-width: 1.3; }
    .cellr { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.3; }
    .celly { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.3; }
    .celld { fill: #e7f0ff; stroke: #0969da; stroke-width: 2.4; }
    .diagmark { fill: none; stroke: #0969da; stroke-width: 2.6; }
    .head { fill: #fff8e5; stroke: #bf8700; stroke-width: 2.2; }
    .arrow { stroke: #57606a; stroke-width: 2; fill: none; }
    .arrowb { stroke: #0550ae; stroke-width: 2.2; fill: none; }
    .arrowg { stroke: #1a7f37; stroke-width: 2.2; fill: none; }
    .arrowr { stroke: #cf222e; stroke-width: 2.2; fill: none; }
    .dash { stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0550ae"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect x="0.0" y="0.0" width="1060.0" height="760.0" class="bandw"/>
  <text x="30.0" y="36.0" class="hdr">Turing machine = สถานะจำกัด + เทปไม่จำกัด + หัวอ่านที่เขียนทับและเดินสองทาง</text>
  <text x="30.0" y="60.0" class="sub">ตัวเลขทุกตัวในภาพนี้มาจากผลรันจริงของโปรแกรม 01 (ซิมูเลเตอร์ที่รันบน Raspberry Pi 5)</text>
  <text x="30.0" y="96.0" class="ptitle">1) เทป (tape) — ไม่สิ้นสุดทั้งสองข้าง เซลล์ละ 1 สัญลักษณ์ · '_' = ช่องว่าง</text>
  <rect x="30.0" y="110.0" width="60.0" height="44.0" class="cell"/>
  <text x="60.0" y="139.0" class="monob" text-anchor="middle">_</text>
  <rect x="90.0" y="110.0" width="60.0" height="44.0" class="cell"/>
  <text x="120.0" y="139.0" class="monob" text-anchor="middle">_</text>
  <rect x="150.0" y="110.0" width="60.0" height="44.0" class="cell"/>
  <text x="180.0" y="139.0" class="monob" text-anchor="middle">_</text>
  <rect x="210.0" y="110.0" width="60.0" height="44.0" class="cell"/>
  <text x="240.0" y="139.0" class="monob" text-anchor="middle">_</text>
  <rect x="270.0" y="110.0" width="60.0" height="44.0" class="head"/>
  <text x="300.0" y="139.0" class="monob" text-anchor="middle">X</text>
  <rect x="330.0" y="110.0" width="60.0" height="44.0" class="cell"/>
  <text x="360.0" y="139.0" class="monob" text-anchor="middle">b</text>
  <rect x="390.0" y="110.0" width="60.0" height="44.0" class="cell"/>
  <text x="420.0" y="139.0" class="monob" text-anchor="middle">c</text>
  <rect x="450.0" y="110.0" width="60.0" height="44.0" class="cell"/>
  <text x="480.0" y="139.0" class="monob" text-anchor="middle">_</text>
  <rect x="510.0" y="110.0" width="60.0" height="44.0" class="cell"/>
  <text x="540.0" y="139.0" class="monob" text-anchor="middle">_</text>
  <rect x="570.0" y="110.0" width="60.0" height="44.0" class="cell"/>
  <text x="600.0" y="139.0" class="monob" text-anchor="middle">_</text>
  <rect x="630.0" y="110.0" width="60.0" height="44.0" class="cell"/>
  <text x="660.0" y="139.0" class="monob" text-anchor="middle">_</text>
  <text x="30.0" y="174.0" class="lbl">เทปหลังเขียนในก้าวที่ 0 ของ input "abc": a ตัวแรกถูกทับด้วย X</text>
  <text x="300.0" y="200.0" class="lblr" text-anchor="middle">▲</text>
  <text x="314.0" y="200.0" class="lblr">หัวอ่าน (head): อ่านช่องนี้ → เขียนทับ → เลื่อน L หรือ R</text>
  <text x="314.0" y="218.0" class="lbl">ต่างจาก PDA (ตอนที่ 23): หัวอ่านกลับทิศได้ และเขียนทับได้</text>
  <rect x="30.0" y="244.0" width="480.0" height="200.0" class="bandc"/>
  <text x="46.0" y="270.0" class="ptitle">2) finite control — สถานะจำกัด (สมองของเครื่อง)</text>
  <text x="46.0" y="290.0" class="lbl">มีสถานะเท่านี้ตลอด ไม่ว่าจะรันนานแค่ไหน · ตัวเลข = จำนวนกฎของสถานะนั้น</text>
  <rect x="52.0" y="320.0" width="140.0" height="30.0" class="cellt"/>
  <text x="62.0" y="340.0" class="monob">q0</text>
  <text x="128.0" y="340.0" class="lbl">4 กฎ</text>
  <rect x="204.0" y="320.0" width="140.0" height="30.0" class="cellt"/>
  <text x="214.0" y="340.0" class="monob">q1</text>
  <text x="280.0" y="340.0" class="lbl">6 กฎ</text>
  <rect x="356.0" y="320.0" width="140.0" height="30.0" class="cellt"/>
  <text x="366.0" y="340.0" class="monob">q2</text>
  <text x="432.0" y="340.0" class="lbl">4 กฎ</text>
  <rect x="52.0" y="360.0" width="140.0" height="30.0" class="cellt"/>
  <text x="62.0" y="380.0" class="monob">q3</text>
  <text x="128.0" y="380.0" class="lbl">4 กฎ</text>
  <rect x="204.0" y="360.0" width="140.0" height="30.0" class="cellt"/>
  <text x="214.0" y="380.0" class="monob">q4</text>
  <text x="280.0" y="380.0" class="lbl">6 กฎ</text>
  <rect x="356.0" y="360.0" width="140.0" height="30.0" class="cellt"/>
  <text x="366.0" y="380.0" class="monob">q5</text>
  <text x="432.0" y="380.0" class="lbl">3 กฎ</text>
  <rect x="52.0" y="400.0" width="140.0" height="30.0" class="cellt"/>
  <text x="62.0" y="420.0" class="monob">q6</text>
  <text x="128.0" y="420.0" class="lbl">5 กฎ</text>
  <rect x="204.0" y="400.0" width="140.0" height="30.0" class="cellt"/>
  <text x="214.0" y="420.0" class="monob">qaccept</text>
  <text x="280.0" y="420.0" class="lbl">0 กฎ</text>
  <rect x="356.0" y="400.0" width="140.0" height="30.0" class="cellt"/>
  <text x="366.0" y="420.0" class="monob">qreject</text>
  <text x="432.0" y="420.0" class="lbl">0 กฎ</text>
  <text x="52.0" y="462.0" class="lbl">qaccept = รับ · qreject = ปฏิเสธ · ช่องไม่มีกฎ = หยุดทันที</text>
  <text x="540.0" y="252.0" class="ptitle">3) ตารางเปลี่ยนสถานะ (δ) — ตัวอย่าง 8 จาก 32 กฎ</text>
  <text x="540.0" y="272.0" class="lbl">อ่านว่า: อยู่สถานะ [1] อ่าน [2] → เขียน [3] เลื่อน [4] ไป [5]</text>
  <rect x="540.0" y="284.0" width="470.0" height="26.0" class="cellt"/>
  <text x="552.0" y="302.0" class="btitle">สถานะ</text>
  <text x="614.0" y="302.0" class="btitle">อ่าน</text>
  <text x="670.0" y="302.0" class="btitle">เขียน</text>
  <text x="728.0" y="302.0" class="btitle">เลื่อน</text>
  <text x="784.0" y="302.0" class="btitle">→ สถานะ</text>
  <rect x="540.0" y="310.0" width="470.0" height="26.0" class="cell"/>
  <text x="552.0" y="328.0" class="monos">q0</text>
  <text x="614.0" y="328.0" class="monos">a</text>
  <text x="670.0" y="328.0" class="monos">X</text>
  <text x="728.0" y="328.0" class="monos">R</text>
  <text x="784.0" y="328.0" class="monos">q1</text>
  <rect x="540.0" y="336.0" width="470.0" height="26.0" class="cell"/>
  <text x="552.0" y="354.0" class="monos">q1</text>
  <text x="614.0" y="354.0" class="monos">a</text>
  <text x="670.0" y="354.0" class="monos">a</text>
  <text x="728.0" y="354.0" class="monos">R</text>
  <text x="784.0" y="354.0" class="monos">q1</text>
  <rect x="540.0" y="362.0" width="470.0" height="26.0" class="cell"/>
  <text x="552.0" y="380.0" class="monos">q1</text>
  <text x="614.0" y="380.0" class="monos">Y</text>
  <text x="670.0" y="380.0" class="monos">Y</text>
  <text x="728.0" y="380.0" class="monos">R</text>
  <text x="784.0" y="380.0" class="monos">q1</text>
  <rect x="540.0" y="388.0" width="470.0" height="26.0" class="cell"/>
  <text x="552.0" y="406.0" class="monos">q1</text>
  <text x="614.0" y="406.0" class="monos">b</text>
  <text x="670.0" y="406.0" class="monos">Y</text>
  <text x="728.0" y="406.0" class="monos">R</text>
  <text x="784.0" y="406.0" class="monos">q2</text>
  <rect x="540.0" y="414.0" width="470.0" height="26.0" class="cell"/>
  <text x="552.0" y="432.0" class="monos">q2</text>
  <text x="614.0" y="432.0" class="monos">b</text>
  <text x="670.0" y="432.0" class="monos">b</text>
  <text x="728.0" y="432.0" class="monos">R</text>
  <text x="784.0" y="432.0" class="monos">q2</text>
  <rect x="540.0" y="440.0" width="470.0" height="26.0" class="cell"/>
  <text x="552.0" y="458.0" class="monos">q2</text>
  <text x="614.0" y="458.0" class="monos">Z</text>
  <text x="670.0" y="458.0" class="monos">Z</text>
  <text x="728.0" y="458.0" class="monos">R</text>
  <text x="784.0" y="458.0" class="monos">q2</text>
  <rect x="540.0" y="466.0" width="470.0" height="26.0" class="cell"/>
  <text x="552.0" y="484.0" class="monos">q2</text>
  <text x="614.0" y="484.0" class="monos">c</text>
  <text x="670.0" y="484.0" class="monos">Z</text>
  <text x="728.0" y="484.0" class="monos">R</text>
  <text x="784.0" y="484.0" class="monos">q3</text>
  <rect x="540.0" y="492.0" width="470.0" height="26.0" class="cell"/>
  <text x="552.0" y="510.0" class="monos">q3</text>
  <text x="614.0" y="510.0" class="monos">c</text>
  <text x="670.0" y="510.0" class="monos">c</text>
  <text x="728.0" y="510.0" class="monos">R</text>
  <text x="784.0" y="510.0" class="monos">q3</text>
  <text x="540.0" y="536.0" class="lbl">อีก 24 กฎที่เหลืออยู่ใน out/01 · เครื่องนี้มี 7 สถานะทำงาน</text>
  <rect x="30.0" y="552.0" width="1000.0" height="196.0" class="bandg"/>
  <text x="46.0" y="578.0" class="ptitle">4) ค่าใช้จ่ายจริงจากการรัน (หน่วย: ก้าว = 1 ครั้งที่หัวอ่านอ่าน+เขียน+เลื่อน)</text>
  <text x="46.0" y="600.0" class="lbl">ตรวจไฟล์ข้อมูล machines/anbncn.tm กับตารางในโค้ด: 32 กฎ = 32 กฎ · ตรงกัน true</text>
  <text x="46.0" y="630.0" class="btitle">input</text>
  <text x="160.0" y="630.0" class="monob">"abc" → 10 ก้าว</text>
  <text x="310.0" y="630.0" class="monob">"aabbcc" → 29 ก้าว</text>
  <text x="46.0" y="652.0" class="btitle">n (จำนวน a/b/c)</text>
  <text x="190.0" y="652.0" class="monos">n=1 (ยาว 3) → 10 ก้าว</text>
  <text x="340.0" y="652.0" class="monos">n=2 (ยาว 6) → 29 ก้าว</text>
  <text x="490.0" y="652.0" class="monos">n=3 (ยาว 9) → 58 ก้าว</text>
  <text x="640.0" y="652.0" class="monos">n=4 (ยาว 12) → 97 ก้าว</text>
  <text x="46.0" y="674.0" class="btitle">n ×8</text>
  <text x="160.0" y="674.0" class="lbl">ก้าวโต 35.3 เท่า (10 → 353) · สูตรที่สังเกตได้: 5n²+4n+1 ตรง 8/8 ค่า</text>
  <text x="46.0" y="700.0" class="btitle">หัวอ่านเดิน</text>
  <text x="160.0" y="700.0" class="lbl">input ยาว 9 ช่อง (aaabbbccc): เลื่อนขวา 33 ครั้ง · เลื่อนซ้าย 24 ครั้ง → กลับทิศได้จริง</text>
  <text x="46.0" y="724.0" class="btitle">PDA เทียบ</text>
  <text x="160.0" y="724.0" class="lbl">PDA อ่าน input ทางเดียว (เลื่อนซ้าย 0 ครั้ง) และเขียนทับไม่ได้ — นี่คือส่วนที่ TM เพิ่มเข้ามา</text>
</svg>
