<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660" role="img">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="#3b4a5a"/>
</marker>
<style>
  .t  { font-family: sans-serif; font-size: 15px; fill: #12263a; }
  .s  { font-family: sans-serif; font-size: 13px; fill: #3b4a5a; }
  .h  { font-family: sans-serif; font-size: 20px; font-weight: 700; fill: #0b2545; }
  .hd { font-family: sans-serif; font-size: 15px; font-weight: 700; fill: #0b2545; }
  .m  { font-family: monospace; font-size: 13px; fill: #0b2545; }
  .bad { font-family: sans-serif; font-size: 13px; fill: #7a1f1f; }
  .good{ font-family: sans-serif; font-size: 13px; fill: #14532d; }
</style>
</defs>
<text x="560" y="40" class="h" text-anchor="middle">Log4Shell: ข้อความ log ที่มาจากผู้ใช้ กลายเป็นคำสั่ง</text>
<text x="560" y="64" class="s" text-anchor="middle">จำลองกลไก message lookup ของ Log4j 2 (CVE-2021-44228) — ไม่ใช่ Log4j จริง</text>
<rect x="50" y="90" width="300" height="78" rx="10" fill="#fdeeee" stroke="#c05050" stroke-width="1.5"/>
<text x="200.0" y="123.0" class="hd" text-anchor="middle">① ผู้โจมตี</text>
<text x="200.0" y="145.0" class="s" text-anchor="middle">ส่งข้อความที่ฝัง ${...}</text>
<rect x="410" y="90" width="300" height="78" rx="10" fill="#f5f7f9" stroke="#9aa9b8" stroke-width="1.5"/>
<text x="560.0" y="123.0" class="hd" text-anchor="middle">② HTTP request</text>
<text x="560.0" y="145.0" class="s" text-anchor="middle">header / form / search</text>
<rect x="770" y="90" width="300" height="78" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<text x="920.0" y="123.0" class="hd" text-anchor="middle">③ แอปพลิเคชัน</text>
<text x="920.0" y="145.0" class="s" text-anchor="middle">บันทึกข้อความลง log</text>
<line x1="352" y1="129" x2="408" y2="129" stroke="#3b4a5a" stroke-width="2" marker-end="url(#ah)"/>
<line x1="712" y1="129" x2="768" y2="129" stroke="#3b4a5a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="50" y="205" width="300" height="78" rx="10" fill="#fdeeee" stroke="#c05050" stroke-width="1.5"/>
<text x="200.0" y="238.0" class="m" text-anchor="middle">④ Logger.log(msg)</text>
<text x="200.0" y="260.0" class="s" text-anchor="middle">ข้อความมาจากผู้ใช้</text>
<rect x="410" y="200" width="300" height="88" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="1.5"/>
<text x="560.0" y="227.0" class="m" text-anchor="middle">⑤ StrSubstitutor</text>
<text x="560.0" y="249.0" class="m" text-anchor="middle">เจอ ${jndi:ldap://...}</text>
<text x="560.0" y="271.0" class="s" text-anchor="middle">แล้วตีความเป็น lookup</text>
<rect x="770" y="205" width="300" height="78" rx="10" fill="#fdeeee" stroke="#c05050" stroke-width="1.5"/>
<text x="920.0" y="227.0" class="m" text-anchor="middle">⑥ JNDI → LDAP</text>
<text x="920.0" y="249.0" class="s" text-anchor="middle">ไปดึง Java class</text>
<text x="920.0" y="271.0" class="s" text-anchor="middle">จาก server ผู้โจมตี</text>
<line x1="352" y1="244" x2="408" y2="244" stroke="#3b4a5a" stroke-width="2" marker-end="url(#ah)"/>
<line x1="712" y1="244" x2="768" y2="244" stroke="#3b4a5a" stroke-width="2" marker-end="url(#ah)"/>
<path d="M920,170 L920,186 L200,186 L200,202" fill="none" stroke="#3b4a5a" stroke-width="2" marker-end="url(#ah)"/>
<line x1="920" y1="283" x2="920" y2="320" stroke="#3b4a5a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="200" y="322" width="720" height="54" rx="10" fill="#fdeeee" stroke="#c05050" stroke-width="1.5"/>
<text x="560.0" y="354.0" class="bad" text-anchor="middle">⑦ โหลดและเรียก constructor ของ class นั้น = remote code execution (RCE)</text>
<rect x="60" y="420" width="480" height="130" rx="10" fill="#fdeeee" stroke="#c05050" stroke-width="1.5"/>
<text x="300.0" y="446.0" class="hd" text-anchor="middle">Log4j 2.0-beta9 – 2.14.1 (ค่าเริ่มต้น)</text>
<text x="300.0" y="468.0" class="bad" text-anchor="middle">lookup ทำงานทุก prefix</text>
<text x="300.0" y="490.0" class="s" text-anchor="middle">ข้อความจากผู้ใช้ = คำสั่ง → RCE</text>
<text x="300.0" y="512.0" class="s" text-anchor="middle">ผลรันจริง: remote_code = 1</text>
<text x="300.0" y="534.0" class="s" text-anchor="middle">ทุก payload ที่ฝัง lookup (B, C, D)</text>
<rect x="580" y="420" width="480" height="130" rx="10" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="820.0" y="457.0" class="hd" text-anchor="middle">Log4j 2.16.0 ขึ้นไป</text>
<text x="820.0" y="479.0" class="s" text-anchor="middle">ปิด message lookup + ปิด JNDI by default</text>
<text x="820.0" y="501.0" class="good" text-anchor="middle">${jndi:...} กลายเป็นข้อความธรรมดา</text>
<text x="820.0" y="523.0" class="s" text-anchor="middle">ผลรันจริง: remote_code = 0 ทุก payload</text>
<text x="560" y="596" class="s" text-anchor="middle">บทเรียน: ตัวกรองที่ "ไล่แบนคำ" ไม่พอ — allowlist ของ prefix ต่างหากที่ปิดช่องนี้</text>
<text x="560" y="624" class="s" text-anchor="middle">ภัยนี้อยู่ในความสัมพันธ์ระหว่าง ข้อมูลจากผู้ใช้ + ชั้นที่ตีความข้อความเป็นคำสั่ง</text>
</svg>
