<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 690" width="980" height="690" role="img">
<defs>
<style>
  .t  { font-family: sans-serif; font-size: 14px; fill: #12263a; }
  .s  { font-family: sans-serif; font-size: 12px; fill: #3b4a5a; }
  .sm { font-family: sans-serif; font-size: 11px; fill: #4a5b6c; }
  .h  { font-family: sans-serif; font-size: 21px; font-weight: 700; fill: #0b2545; }
  .hd { font-family: sans-serif; font-size: 14px; font-weight: 700; fill: #0b2545; }
  .n  { font-family: sans-serif; font-size: 19px; font-weight: 700; fill: #0b2545; }
  .m  { font-family: monospace; font-size: 12px; fill: #0b2545; }
  .mm { font-family: monospace; font-size: 11px; fill: #3b4a5a; }
  .bad { font-family: sans-serif; font-size: 12px; fill: #7a1f1f; }
  .good{ font-family: sans-serif; font-size: 12px; fill: #14532d; }
</style>
</defs>
<text x="24" y="36" class="h">ใครเห็นอะไร: ตารางที่ควรมีก่อนเชื่อเครื่องมือตัวใดตัวหนึ่ง</text>
<text x="24" y="58" class="s">แถวคือช่องโหว่ที่จงใจฝังไว้ 8 ข้อ · คอลัมน์คือเครื่องมือที่รันใน CI</text>
<text x="24" y="82" class="sm">เห็น = เครื่องมือนั้นรายงาน finding · จุด = ไม่รายงาน</text>
<text x="40" y="118" class="hd">ช่องโหว่ที่ฝังไว้</text>
<text x="430" y="118" class="hd" text-anchor="middle">SAST</text>
<text x="560" y="118" class="hd" text-anchor="middle">DAST</text>
<text x="690" y="118" class="hd" text-anchor="middle">SCA</text>
<text x="790" y="118" class="hd">สรุป</text>
<rect x="24" y="140" width="932" height="38" rx="6" fill="#eefaf1" stroke="#e3e9f0" stroke-width="1"/>
<text x="40" y="165" class="s">1. SQL ต่อสตริง</text>
<rect x="400" y="148" width="60" height="22" rx="6" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="430" y="164" class="good" text-anchor="middle">เห็น</text>
<rect x="530" y="148" width="60" height="22" rx="6" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="560" y="164" class="good" text-anchor="middle">เห็น</text>
<text x="690" y="164" class="sm" text-anchor="middle">·</text>
<rect x="24" y="186" width="932" height="38" rx="6" fill="#ffffff" stroke="#e3e9f0" stroke-width="1"/>
<text x="40" y="211" class="s">2. XSS สะท้อนกลับ</text>
<text x="430" y="210" class="sm" text-anchor="middle">·</text>
<rect x="530" y="194" width="60" height="22" rx="6" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="560" y="210" class="good" text-anchor="middle">เห็น</text>
<text x="690" y="210" class="sm" text-anchor="middle">·</text>
<rect x="24" y="232" width="932" height="38" rx="6" fill="#eefaf1" stroke="#e3e9f0" stroke-width="1"/>
<text x="40" y="257" class="s">3. path traversal ที่ /file</text>
<text x="430" y="256" class="sm" text-anchor="middle">·</text>
<rect x="530" y="240" width="60" height="22" rx="6" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="560" y="256" class="good" text-anchor="middle">เห็น</text>
<text x="690" y="256" class="sm" text-anchor="middle">·</text>
<rect x="24" y="278" width="932" height="38" rx="6" fill="#ffffff" stroke="#e3e9f0" stroke-width="1"/>
<text x="40" y="303" class="s">4. credential ฝังในซอร์ส</text>
<rect x="400" y="286" width="60" height="22" rx="6" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="430" y="302" class="good" text-anchor="middle">เห็น</text>
<text x="560" y="302" class="sm" text-anchor="middle">·</text>
<text x="690" y="302" class="sm" text-anchor="middle">·</text>
<rect x="24" y="324" width="932" height="38" rx="6" fill="#eefaf1" stroke="#e3e9f0" stroke-width="1"/>
<text x="40" y="349" class="s">5. ปิดตรวจใบรับรอง TLS</text>
<rect x="400" y="332" width="60" height="22" rx="6" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="430" y="348" class="good" text-anchor="middle">เห็น</text>
<text x="560" y="348" class="sm" text-anchor="middle">·</text>
<text x="690" y="348" class="sm" text-anchor="middle">·</text>
<rect x="24" y="370" width="932" height="38" rx="6" fill="#ffffff" stroke="#e3e9f0" stroke-width="1"/>
<text x="40" y="395" class="s">6. dependency web.Render</text>
<text x="430" y="394" class="sm" text-anchor="middle">·</text>
<text x="560" y="394" class="sm" text-anchor="middle">·</text>
<rect x="660" y="378" width="60" height="22" rx="6" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="690" y="394" class="good" text-anchor="middle">เห็น</text>
<rect x="24" y="416" width="932" height="38" rx="6" fill="#eefaf1" stroke="#e3e9f0" stroke-width="1"/>
<text x="40" y="441" class="s">7. dependency cache.Get</text>
<text x="430" y="440" class="sm" text-anchor="middle">·</text>
<text x="560" y="440" class="sm" text-anchor="middle">·</text>
<rect x="660" y="424" width="60" height="22" rx="6" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="690" y="440" class="good" text-anchor="middle">เห็น</text>
<rect x="24" y="462" width="932" height="38" rx="6" fill="#ffffff" stroke="#e3e9f0" stroke-width="1"/>
<text x="40" y="487" class="s">8. ไม่มี authz ที่ /admin</text>
<text x="430" y="486" class="sm" text-anchor="middle">·</text>
<text x="560" y="486" class="sm" text-anchor="middle">·</text>
<text x="690" y="486" class="sm" text-anchor="middle">·</text>
<text x="790" y="487" class="bad">ไม่มีใครเห็น</text>
<rect x="24" y="516" width="932" height="136" rx="10" fill="#fdeeee" stroke="#c05050" stroke-width="1.5"/>
<text x="40" y="544" class="hd">อ่านตารางนี้ยังไง</text>
<text x="34" y="570" class="s">มีช่องเดียวที่ถูกจับได้สองเครื่องมือ (SQL ต่อสตริง) — จึงรวมกันได้ 7 ไม่ใช่ 8</text>
<text x="34" y="596" class="s">ช่องที่ 8 คือคำตอบ 200 ที่ไม่ผิดรูปแบบ: ไม่มีเครื่องมือไหนรู้ว่ามันผิด เพราะไม่มีใครบอกว่า "ควรเป็น 403"</text>
<text x="34" y="622" class="bad">แปลว่า coverage ของเครื่องมือ ≠ coverage ของช่องโหว่ — ต้องมีคนอ่านโค้ดและรู้ business logic</text>
</svg>
