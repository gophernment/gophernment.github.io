<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 780" width="1040" height="780" role="img" aria-label="ขั้นตอนของ context switch จาก user mode เข้า kernel แล้วกลับออกมา พร้อมราคาที่วัดได้จริง">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 18px; }
    .sub { fill: #57606a; font-size: 12.5px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .lbl { fill: #57606a; font-size: 11.5px; }
    .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; }
    .monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #0550ae; }
    .monor { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #cf222e; }
    .monog { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #1a7f37; }
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .bandc { fill: #eef4ff; stroke: #0969da; stroke-width: 1.4; }
    .bandg { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
    .bandr { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.4; }
    .bandy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
    .cell { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.1; }
    .arrow { stroke: #57606a; stroke-width: 2; fill: none; }
    .arrowg { stroke: #1a7f37; stroke-width: 2.4; fill: none; }
    .arrowb { stroke: #0550ae; stroke-width: 2.4; fill: none; }
    .arrowr { stroke: #cf222e; stroke-width: 2.2; fill: none; }
    .dash { stroke: #8c959f; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="a-n" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="a-g" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="a-b" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0550ae"/></marker>
    <marker id="a-r" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  </defs>
  <rect x="0" y="0" width="1040" height="780" fill="#ffffff"/>

<text class="hdr" x="520" y="36" text-anchor="middle">Context switch: สลับงาน 1 ครั้ง เกิดอะไรขึ้น (และแพงแค่ไหน)</text>
<text class="sub" x="520" y="60" text-anchor="middle">ราคาทุกตัววัดจริงด้วย ctxswitch_demo บนเครื่องนี้ (20000 รอบ, CLOCK_MONOTONIC)</text>
<rect x="40" y="92" width="148" height="96" rx="9" fill="#eef4ff" stroke="#0969da" stroke-width="1.4"/>
<text class="monob" x="114.0" y="116" text-anchor="middle" fill="#0969da">1. user mode</text>
<text class="lbl" x="114.0" y="140" text-anchor="middle">โปรแกรมเรา</text>
<text class="lbl" x="114.0" y="158" text-anchor="middle">กำลังคิดเลขอยู่</text>
<line class="arrow" x1="189" y1="140.0" x2="200" y2="140.0" marker-end="url(#a-n)"/>
<rect x="201" y="92" width="148" height="96" rx="9" fill="#fff8e5" stroke="#bf8700" stroke-width="1.4"/>
<text class="monob" x="275.0" y="116" text-anchor="middle" fill="#bf8700">2. syscall</text>
<text class="lbl" x="275.0" y="140" text-anchor="middle">ขอเข้าเคอร์เนล</text>
<text class="lbl" x="275.0" y="158" text-anchor="middle">(read/write/นอนรอ)</text>
<line class="arrow" x1="350" y1="140.0" x2="361" y2="140.0" marker-end="url(#a-n)"/>
<rect x="362" y="92" width="148" height="96" rx="9" fill="#f6f8fa" stroke="#57606a" stroke-width="1.4"/>
<text class="monob" x="436.0" y="116" text-anchor="middle" fill="#57606a">3. บันทึก context</text>
<text class="lbl" x="436.0" y="140" text-anchor="middle">เก็บรีจิสเตอร์/PC</text>
<text class="lbl" x="436.0" y="158" text-anchor="middle">+ stack pointer</text>
<line class="arrow" x1="511" y1="140.0" x2="522" y2="140.0" marker-end="url(#a-n)"/>
<rect x="523" y="92" width="148" height="96" rx="9" fill="#f6f8fa" stroke="#57606a" stroke-width="1.4"/>
<text class="monob" x="597.0" y="116" text-anchor="middle" fill="#57606a">4. ตัวจัดคิวเลือก</text>
<text class="lbl" x="597.0" y="140" text-anchor="middle">หยิบงานถัดไป</text>
<text class="lbl" x="597.0" y="158" text-anchor="middle">จากคิวที่พร้อมรัน</text>
<line class="arrow" x1="672" y1="140.0" x2="683" y2="140.0" marker-end="url(#a-n)"/>
<rect x="684" y="92" width="148" height="96" rx="9" fill="#fdf2f2" stroke="#cf222e" stroke-width="1.4"/>
<text class="monob" x="758.0" y="116" text-anchor="middle" fill="#cf222e">5. สลับ + กู้คืน</text>
<text class="lbl" x="758.0" y="140" text-anchor="middle">ถ้าเป็นโปรเซสอื่น:</text>
<text class="lbl" x="758.0" y="158" text-anchor="middle">สลับ page table</text>
<line class="arrow" x1="833" y1="140.0" x2="844" y2="140.0" marker-end="url(#a-n)"/>
<rect x="845" y="92" width="148" height="96" rx="9" fill="#eefaf1" stroke="#1a7f37" stroke-width="1.4"/>
<text class="monob" x="919.0" y="116" text-anchor="middle" fill="#1a7f37">6. กลับ user mode</text>
<text class="lbl" x="919.0" y="140" text-anchor="middle">โปรแกรมเดิม</text>
<text class="lbl" x="919.0" y="158" text-anchor="middle">ทำงานต่อจากเดิม</text>
<text class="lbl" x="40" y="212">การสลับแบบนี้เกิด "ข้างในเคอร์เนล" ทั้งหมด — โปรแกรมของเราไม่รู้ตัวเลยนอกจากเวลาที่หายไป</text>
<rect class="band" x="40" y="236" width="960" height="278" rx="10"/>
<text class="ptitle" x="60" y="266">ราคาที่วัดได้จริงบนเครื่องนี้</text>
<text class="lbl" x="60" y="292">สิ่งที่วัด</text>
<text class="lbl" x="360" y="292">ผลที่ได้</text>
<text class="lbl" x="620" y="292">คิดเป็น</text>
<text class="lbl" x="60" y="318">ปิงปองโปรเซส 20000 รอบ</text>
<text class="monoc mono" x="360" y="318">0.088 วินาที</text>
<text class="lbl" x="620" y="318">4402 ns/รอบ = 2201 ns ต่อการสลับ 1 ครั้ง</text>
<line class="dash" x1="60" y1="326" x2="980" y2="326"/>
<text class="lbl" x="60" y="348">ปิงปองเธรด 20000 รอบ</text>
<text class="monoc mono" x="360" y="348">0.085 วินาที</text>
<text class="lbl" x="620" y="348">4226 ns/รอบ = 2113 ns ต่อการสลับ 1 ครั้ง</text>
<line class="dash" x1="60" y1="356" x2="980" y2="356"/>
<text class="lbl" x="60" y="378">syscall เปล่า (getppid)</text>
<text class="monoc mono" x="360" y="378">178 ns ต่อครั้ง</text>
<text class="lbl" x="620" y="378">1 รอบปิงปอง = 4 syscall ≈ 712 ns</text>
<line class="dash" x1="60" y1="386" x2="980" y2="386"/>
<text class="lbl" x="60" y="408">voluntary_ctxt_switches</text>
<text class="monoc mono" x="360" y="408">18,345 / 18,597</text>
<text class="lbl" x="620" y="408">ทุกครั้งที่โปรเซสยอมปล่อย CPU เอง (แม่ / ลูก)</text>
<line class="dash" x1="60" y1="416" x2="980" y2="416"/>
<text class="lbl" x="60" y="438">nonvoluntary_ctxt_switches</text>
<text class="monoc mono" x="360" y="438">1,652 / 1,400</text>
<text class="lbl" x="620" y="438">ถูกตัดกลางคัน — เคอร์เนลยึด CPU คืนให้คนอื่น</text>
<line class="dash" x1="60" y1="446" x2="980" y2="446"/>
<text class="lbl" x="60" y="468">time slice ที่ตั้งไว้ (base_slice_ns)</text>
<text class="monoc mono" x="360" y="468">2,100,000 ns</text>
<text class="lbl" x="620" y="468">≈ 954 ครั้งของการสลับ (ที่ 2201 ns/ครั้ง)</text>
<line class="dash" x1="60" y1="476" x2="980" y2="476"/>
<text class="lbl" x="60" y="512">ข้อควรระวัง: ปิงปองโปรเซสกับเธรดได้เลขเท่ากัน — ราคาตรง ๆ ของ "การสลับ page table"</text>
<text class="lbl" x="60" y="532">ถูกกลบด้วยราคา syscall/การปลุก จึงวัดแยกไม่ได้จากไมโครเบนช์มาร์กนี้ (ต้นทุนจริงไปโผล่ที่ cache/TLB ตอนทำงานต่อ)</text>
<text class="mono" x="60" y="556">$ ./ctxswitch_demo process 20000 | ./ctxswitch_demo thread 20000 | ./ctxswitch_demo syscall 1000000</text>
</svg>