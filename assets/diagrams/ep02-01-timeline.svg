<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 548" width="1040" height="548" role="img" aria-label="ไทม์ไลน์เหตุการณ์ Morris Worm 1988 ตั้งแต่ปล่อยหนอนจนถึงการก่อตั้ง CERT/CC">
<style>
text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
.hdr { font-weight: 700; font-size: 17.5px; }
.ptitle { font-weight: 700; font-size: 14.5px; }
.sub { fill: #57606a; font-size: 12.5px; }
.lbl { fill: #57606a; font-size: 11.5px; }
.txt { font-size: 13px; }
.small { fill: #57606a; font-size: 11px; }
.mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
.monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #0550ae; }
.boxn { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.6; }
.boxi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.6; }
.boxg { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.3; }
.boxw { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
.boxy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
.boxb { fill: #eef4ff; stroke: #0969da; stroke-width: 1.4; }
.chipd { fill: #ffffff; stroke: #8250df; stroke-width: 1.2; }
.wire { stroke: #57606a; stroke-width: 1.8; fill: none; }
</style>
<defs>
<marker id="a-n" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="a-r" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
</defs>
<rect x="0" y="0" width="1040" height="548" fill="#ffffff"/>
<text class="hdr" x="520" y="36" text-anchor="middle">ไทม์ไลน์: Morris Worm — คืนเดียวที่ internet ยุคแรกหยุดชะงัก</text>
<text class="sub" x="520" y="60" text-anchor="middle">2 พฤศจิกายน 1988 → แพร่ไปราว 6,000 เครื่อง → กำเนิด CERT/CC</text>
<rect class="chipd" x="40" y="88" width="188" height="62" rx="9"/>
<text class="monob" x="134" y="112" text-anchor="middle">2 พ.ย. 1988 ~18:00</text>
<text class="small" x="134" y="134" text-anchor="middle">(เวลา EST โดยประมาณ)</text>
<rect class="boxg" x="252" y="88" width="748" height="62" rx="9"/>
<text class="txt" x="268" y="114">ปล่อยจากเครื่องที่ MIT — เขียนโดยนักศึกษาปริญญาโท Cornell (Robert T. Morris)</text>
<rect class="chipd" x="40" y="168" width="188" height="62" rx="9"/>
<text class="monob" x="134" y="192" text-anchor="middle">คืน 2–3 พ.ย. 1988</text>
<text class="small" x="134" y="214" text-anchor="middle">(เวลา EST โดยประมาณ)</text>
<rect class="boxg" x="252" y="168" width="748" height="62" rx="9"/>
<text class="txt" x="268" y="194">แพร่ไปราว 6,000 เครื่อง (~10% ของทั้ง internet ~60,000 เครื่อง) — server</text>
<text class="txt" x="268" y="214">ช้าจนล็อกอินไม่ได้</text>
<rect class="chipd" x="40" y="248" width="188" height="62" rx="9"/>
<text class="monob" x="134" y="272" text-anchor="middle">3 พ.ย. 1988 05:58</text>
<text class="small" x="134" y="294" text-anchor="middle">(เวลา EST โดยประมาณ)</text>
<rect class="boxg" x="252" y="248" width="748" height="62" rx="9"/>
<text class="txt" x="268" y="274">Keith Bostic (Berkeley) โพสต์แพตช์ sendmail — Berkeley/MIT/Purdue</text>
<text class="txt" x="268" y="294">ถอดรหัสและออกแพตช์ภายในวันเดียว</text>
<rect class="chipd" x="40" y="328" width="188" height="62" rx="9"/>
<text class="monob" x="134" y="352" text-anchor="middle">พ.ย. 1988</text>
<text class="small" x="134" y="374" text-anchor="middle">(เวลา EST โดยประมาณ)</text>
<rect class="boxg" x="252" y="328" width="748" height="62" rx="9"/>
<text class="txt" x="268" y="354">DARPA สั่ง SEI (Carnegie Mellon) ตั้ง CERT/CC — หน่วยตอบเหตุความปลอดภัยแห่งแรกของโลก</text>
<text class="txt" x="268" y="374">(ประกาศ 7 ธ.ค. 1988)</text>
<rect class="chipd" x="40" y="408" width="188" height="62" rx="9"/>
<text class="monob" x="134" y="432" text-anchor="middle">1989–1990</text>
<text class="small" x="134" y="454" text-anchor="middle">(เวลา EST โดยประมาณ)</text>
<rect class="boxg" x="252" y="408" width="748" height="62" rx="9"/>
<text class="txt" x="268" y="434">ถูกฟ้องและตัดสิน guilty คนแรกภายใต้ CFAA 1986 — ปรับ + probation + งานสังคม 400 ชม.</text>
<rect class="boxb" x="40" y="486" width="960" height="40" rx="9"/>
<text class="lbl" x="520" y="512" text-anchor="middle">บทเรียน: หนอนตัวนั้นไม่ได้เก่ง — มันแค่ใช้ช่องที่ทุกคน “เชื่อ” กันไว้</text>
</svg>
