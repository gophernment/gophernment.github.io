<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="ตัวแปร x อยู่ในหน่วยความจำ และ pointer p ชี้ไปที่ address ของมัน">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 17.5px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .sub { fill: #57606a; font-size: 12.5px; }
    .lbl { fill: #57606a; font-size: 11.5px; }
    .tiny { fill: #57606a; font-size: 11px; }
    .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
    .monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #0550ae; }
    .big { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 20px; font-weight: 700; fill: #1a7f37; }
    .addr { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #57606a; }
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .cell { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .cellhi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.9; }
    .notebox { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.3; }
    .cbox { fill: #eef4ff; stroke: #0969da; stroke-width: 1.3; }
    .gobox { fill: #e6f4ff; stroke: #0a7ea4; stroke-width: 1.3; }
    .rowband { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .wire { stroke: #1a7f37; stroke-width: 2.2; fill: none; }
    .wire2 { stroke: #57606a; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="arr-n" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="620" fill="#ffffff"/>

<text class="hdr" x="480" y="34" text-anchor="middle">pointer คือตัวแปรที่เก็บ "address" (เลขที่ช่อง) ของตัวแปรอื่น</text>
<text class="sub" x="480" y="58" text-anchor="middle">โค้ด: int x = 5; int y = 9; int *p = &amp;x;   — ด้านซ้ายคือตัวแปร p ด้านขวาคือหน่วยความจำจริง</text>
<rect class="panel" x="40" y="177" width="300" height="148" rx="10"/>
<text class="ptitle" x="56" y="203">ตัวแปร p (ชนิด: int *)</text>
<text class="mono" x="56" y="227">int *p = &amp;x;</text>
<text class="lbl" x="56" y="249">เก็บค่าอะไร? เก็บ "เลขที่ช่อง" ของ x</text>
<rect class="cellhi" x="56" y="261" width="268" height="34" rx="6"/>
<text class="addr" x="68" y="283">0x7ffd1234cf9c</text>
<text class="lbl" x="312" y="283" text-anchor="end">= address ของ x</text>
<line class="wire" x1="344" y1="251" x2="520" y2="251" marker-end="url(#arr-g)"/>
<text class="lbl" x="432" y="243" text-anchor="middle">ชี้ไปที่</text>
<rect class="cell" x="524" y="150" width="396" height="62" rx="8"/>
<text class="addr" x="540" y="174">0x7ffd1234cfa0</text>
<text class="big" x="540" y="200">(ช่องอื่น)</text>
<text class="lbl" x="904" y="190" text-anchor="end">ว่าง/ไม่ได้ใช้</text>
<rect class="cellhi" x="524" y="220" width="396" height="62" rx="8"/>
<text class="addr" x="540" y="244">0x7ffd1234cf9c</text>
<text class="big" x="540" y="270">5</text>
<text class="monob" x="904" y="260" text-anchor="end">ตัวแปร x</text>
<rect class="cell" x="524" y="290" width="396" height="62" rx="8"/>
<text class="addr" x="540" y="314">0x7ffd1234cf98</text>
<text class="big" x="540" y="340">9</text>
<text class="monob" x="904" y="330" text-anchor="end">ตัวแปร y</text>
<rect class="cell" x="524" y="360" width="396" height="62" rx="8"/>
<text class="addr" x="540" y="384">0x7ffd1234cf94</text>
<text class="big" x="540" y="410">(ช่องอื่น)</text>
<text class="lbl" x="904" y="400" text-anchor="end">ว่าง/ไม่ได้ใช้</text>
<path class="wire2" d="M 928 223.0 L 928 279.0" marker-start="url(#arr-n)" marker-end="url(#arr-n)"/>
<text class="lbl" x="904" y="142" text-anchor="end">แต่ละช่อง = 1 address — ช่องละ 4 ไบต์ เพราะ int = 4 ไบต์ (address บนเครื่อง 64 บิตยาวระดับนี้)</text>
<rect class="notebox" x="40" y="470" width="880" height="120" rx="10"/>
<text class="ptitle" x="60" y="498">จุดสำคัญ 3 ข้อจากภาพนี้</text>
<text class="mono" x="60" y="524">1) address = เลขที่ช่องในหน่วยความจำ เหมือนเลขบ้าน — ช่องที่อยู่ติดกันห่างกัน 4 (เพราะ int กว้าง 4 ไบต์)</text>
<text class="mono" x="60" y="550">2) &amp;x = "ขอ address ของ x" → ได้ 0x7ffd1234cf9c แล้วเอาไปเก็บใส่ตัวแปร p ได้ (p จึงมีชนิดเป็น int *)</text>
<text class="mono" x="60" y="576">3) *p = "ไปที่ address ที่ p เก็บ แล้วอ่าน/เขียนค่าที่นั่น" — ดังนั้น *p = 42 จึงเท่ากับ x = 42 (ตัวเดียวกัน)</text>
</svg>
