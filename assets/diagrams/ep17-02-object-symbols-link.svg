<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 800" width="1040" height="800" role="img" aria-label="ตาราง symbol ของ object file สองไฟล์ และวิธีที่ linker ต่อ symbol ที่หายไปเข้ากับนิยามจริง">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 18px; }
    .sub { fill: #57606a; font-size: 12.5px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .lbl { fill: #57606a; font-size: 11.5px; }
    .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; }
    .monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #0550ae; }
    .monor { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #cf222e; }
    .monog { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #1a7f37; }
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .bandc { fill: #eef4ff; stroke: #0969da; stroke-width: 1.4; }
    .bandg { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
    .bandr { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.4; }
    .bandy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
    .cell { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.1; }
    .arrow { stroke: #57606a; stroke-width: 2; fill: none; }
    .arrowg { stroke: #1a7f37; stroke-width: 2.4; fill: none; }
    .arrowb { stroke: #0550ae; stroke-width: 2.4; fill: none; }
    .arrowr { stroke: #cf222e; stroke-width: 2.2; fill: none; }
    .dash { stroke: #8c959f; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="a-n" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="a-g" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="a-b" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0550ae"/></marker>
    <marker id="a-r" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  </defs>
  <rect x="0" y="0" width="1040" height="800" fill="#ffffff"/>

<text class="hdr" x="520" y="36" text-anchor="middle">object file = ตาราง symbol + ที่อยู่ที่ยังว่าง (linker คือคนเติมให้ครบ)</text>
<text class="sub" x="520" y="60" text-anchor="middle">ผลจาก nm main.o · nm mathx.o · readelf -r main.o (ของจริงจากเครื่องนี้)</text>
<rect class="band" x="40" y="88" width="440" height="360" rx="10"/>
<text class="ptitle" x="60" y="116">main.o — ยังไม่สมบูรณ์</text>
<text class="mono" x="60" y="140">$ nm main.o</text>
<text class="mono" x="60" y="164" fill="#1a7f37">0000000000000000 T main</text>
<text class="mono" x="60" y="186" fill="#cf222e">                 U mathx_version</text>
<text class="mono" x="60" y="208" fill="#cf222e">                 U mathx_clamp</text>
<text class="mono" x="60" y="230" fill="#cf222e">                 U mathx_sum_odd</text>
<text class="mono" x="60" y="252" fill="#cf222e">                 U printf</text>
<text class="mono" x="60" y="274" fill="#cf222e">                 U fprintf</text>
<text class="mono" x="60" y="296" fill="#cf222e">                 U stderr</text>
<text class="mono" x="60" y="318" fill="#cf222e">                 U strtol</text>
<line class="dash" x1="60" y1="344" x2="460" y2="344"/>
<text class="lbl" x="60" y="368">T = นิยามไว้ในไฟล์นี้ (text = โค้ด)</text>
<text class="lbl" x="60" y="390">U = ใช้แต่ไม่มีนิยามในไฟล์นี้ (undefined)</text>
<text class="lbl" x="60" y="418">main.o ร้องขอ symbol จากข้างนอก 7 ตัว</text>
<text class="lbl" x="60" y="440">แต่มีแค่ main ที่ให้เองในไฟล์นี้</text>
<rect class="bandg" x="560" y="88" width="440" height="360" rx="10"/>
<text class="ptitle" x="580" y="116">mathx.o — ผู้ให้</text>
<text class="mono" x="580" y="140">$ nm mathx.o</text>
<text class="mono" x="580" y="164" fill="#1a7f37">0000000000000000 T mathx_clamp</text>
<text class="mono" x="580" y="186" fill="#1a7f37">0000000000000074 T mathx_sum_odd</text>
<text class="mono" x="580" y="208" fill="#1a7f37">00000000000000ec T mathx_version</text>
<text class="lbl" x="580" y="260">ตัวเลขข้างหน้า = ตำแหน่งในไฟล์นี้</text>
<text class="lbl" x="580" y="282">(ยังไม่ใช่ที่อยู่ใน RAM — ได้ของจริงตอน link)</text>
<text class="lbl" x="580" y="306">libc.so.6 เป็นผู้ให้ printf · stderr</text>
<text class="lbl" x="580" y="350">symbol ของ libc ถูกเติม "ตอนรัน"</text>
<text class="lbl" x="580" y="372">(dynamic) — ถ้าอยากฝังไว้เลยใช้ gcc -static</text>
<text class="lbl" x="580" y="416">ไฟล์ main แบบ static = 705,336 ไบต์ (ใหญ่ขึ้น 10 เท่า)</text>
<line class="arrowg" x1="560" y1="184" x2="482" y2="184" marker-end="url(#a-g)"/>
<line class="arrowg" x1="560" y1="208" x2="482" y2="208" marker-end="url(#a-g)"/>
<line class="arrowg" x1="560" y1="232" x2="482" y2="232" marker-end="url(#a-g)"/>
<text class="lbl" x="521" y="174" text-anchor="middle">ld ต่อให้</text>
<rect class="bandc" x="40" y="464" width="960" height="112" rx="10"/>
<text class="ptitle" x="60" y="490">ใน main.o คำสั่งเรียกฟังก์ชันยังเป็น "ช่องว่าง" — linker ต้องมาเติม</text>
<text class="mono" x="60" y="514">$ readelf -r main.o   →   R_AARCH64_CALL26  0000000000000000  mathx_version + 0</text>
<text class="lbl" x="60" y="538">ที่ offset 0x10 ของส่วน .text มีคำสั่ง "bl" ที่ยังชี้ไปที่ 0 — ยังไม่มีใครรู้ว่า mathx_version จะอยู่ที่ไหน</text>
<text class="lbl" x="60" y="558">พอ link แล้ว: nm main → 00000000000009a0 T mathx_clamp · 0000000000000a14 T mathx_sum_odd (ได้ที่อยู่จริงแล้ว)</text>
<rect class="bandr" x="40" y="594" width="960" height="192" rx="10"/>
<text class="ptitle" x="60" y="620">ถ้า symbol หาไม่เจอ — ข้อความจริงตอน link ล้มเหลว</text>
<text class="mono" x="60" y="644">$ gcc -o main_broken main.o        # ลืมส่ง mathx.o</text>
<text class="mono" x="60" y="665">/usr/bin/ld: main.o: in function `main':</text>
<text class="monor" x="60" y="686">main.c:(.text+0x10): undefined reference to `mathx_version'</text>
<text class="monor" x="60" y="707">/usr/bin/ld: main.c:(.text+0x30): undefined reference to `mathx_clamp'</text>
<text class="monor" x="60" y="728">/usr/bin/ld: main.c:(.text+0x48): undefined reference to `mathx_sum_odd'</text>
<text class="monor" x="60" y="749">/usr/bin/ld: main.c:(.text+0xfc): undefined reference to `mathx_clamp'</text>
<text class="mono" x="60" y="770">collect2: error: ld returned 1 exit status</text>
</svg>