<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-label="โปรแกรมบวกเลขใน RAM และตารางเดินเครื่องทีละก้าว">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12.5px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 17px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .sub { fill: #57606a; font-size: 12px; }
    .tiny { font-size: 11px; fill: #57606a; }
    .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; fill: #0969da; }
    .monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #1a1a1a; }
    .val { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
    .th { font-weight: 700; font-size: 12px; fill: #57606a; }
    .lbl { font-size: 12px; fill: #57606a; }
    .bold { font-weight: 700; fill: #1a1a1a; }
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .panelb { fill: #f6f8fa; stroke: #0969da; stroke-width: 1.4; }
    .block { fill: #eef4ff; stroke: #0969da; stroke-width: 1.6; }
    .ctrl { fill: #fff4e5; stroke: #bc4c00; stroke-width: 1.6; }
    .ff { fill: #f3f0ff; stroke: #6639ba; stroke-width: 1.6; }
    .mem { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.6; }
    .dashed { fill: #fbfcfd; stroke: #8250df; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .wire { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .ctrlw { stroke: #bc4c00; stroke-width: 1.6; fill: none; }
    .clkw { stroke: #1a7f37; stroke-width: 2; fill: none; }
    .row { fill: #ffffff; stroke: #eaeef2; stroke-width: 1; }
    .rowg { fill: #f6f8fa; stroke: #eaeef2; stroke-width: 1; }
    .hrow { fill: #eaeef2; }
    .thline { stroke: #d0d7de; stroke-width: 1.2; }
    .dot { fill: #57606a; }
    .badge { fill: #0969da; }
    .badget { fill: #ffffff; font-weight: 700; font-size: 11px; }
  </style>
  <defs>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="a-ctrl" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
    <marker id="a-clk" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
  </defs>
  <text class="hdr" x="480" y="32" text-anchor="middle">โปรแกรมบวกเลข 2 ตัว (3 + 4) ที่ CPU จิ๋วรันจริง</text>
  <rect class="panel" x="20" y="52" width="920" height="240" rx="10"/>
  <text class="ptitle" x="40" y="80" text-anchor="start">A. โปรแกรมใน RAM โปรแกรม (พิมพ์ครั้งเดียวตอนเริ่มเครื่อง)</text>
  <text class="sub" x="40" y="102" text-anchor="start">วิธีเขียน: ตั้ง ADDRESS และ DATA IN ตามตาราง แล้วสลับ WRITE เป็น 1 ชั่วครู่ — วิธีเดียวกับที่เรียนในตอน 10</text>
  <rect class="hrow" x="60" y="118" width="860" height="26" rx="4"/>
  <text class="th" x="125.0" y="135" text-anchor="middle">address</text>
  <text class="th" x="255.0" y="135" text-anchor="middle">คำสั่ง 4 บิต</text>
  <text class="th" x="380.0" y="135" text-anchor="middle">opcode</text>
  <text class="th" x="520.0" y="135" text-anchor="middle">operand</text>
  <text class="th" x="760.0" y="135" text-anchor="middle">คนอ่านว่าอย่างไร</text>
  <rect class="row" x="60" y="144" width="860" height="27" rx="10"/>
  <text class="val" x="125.0" y="162" text-anchor="middle">00</text>
  <text class="val" x="255.0" y="162" text-anchor="middle">0010</text>
  <text class="val" x="380.0" y="162" text-anchor="middle">00 LOAD</text>
  <text class="val" x="520.0" y="162" text-anchor="middle">10 (address 2)</text>
  <text class="lbl" x="612" y="162" text-anchor="start">LOAD 10 → ACC = ค่าจากช่อง 10 (= 3)</text>
  <rect class="rowg" x="60" y="171" width="860" height="27" rx="10"/>
  <text class="val" x="125.0" y="189" text-anchor="middle">01</text>
  <text class="val" x="255.0" y="189" text-anchor="middle">0111</text>
  <text class="val" x="380.0" y="189" text-anchor="middle">01 ADD</text>
  <text class="val" x="520.0" y="189" text-anchor="middle">11 (address 3)</text>
  <text class="lbl" x="612" y="189" text-anchor="start">ADD 11 → ACC = ACC + ค่าช่อง 11 (= 4)</text>
  <rect class="row" x="60" y="198" width="860" height="27" rx="10"/>
  <text class="val" x="125.0" y="216" text-anchor="middle">10</text>
  <text class="val" x="255.0" y="216" text-anchor="middle">1011</text>
  <text class="val" x="380.0" y="216" text-anchor="middle">10 STORE</text>
  <text class="val" x="520.0" y="216" text-anchor="middle">11 (address 3)</text>
  <text class="lbl" x="612" y="216" text-anchor="start">STORE 11 → เขียนค่า ACC ลงช่อง 11</text>
  <rect class="rowg" x="60" y="225" width="860" height="27" rx="10"/>
  <text class="val" x="125.0" y="243" text-anchor="middle">11</text>
  <text class="val" x="255.0" y="243" text-anchor="middle">1100</text>
  <text class="val" x="380.0" y="243" text-anchor="middle">11 OUT</text>
  <text class="val" x="520.0" y="243" text-anchor="middle">00 (ไม่ใช้)</text>
  <text class="lbl" x="612" y="243" text-anchor="start">OUT → แสดงค่า ACC ที่ LED</text>
  <line class="thline" x1="190" y1="118" x2="190" y2="252"/>
  <line class="thline" x1="320" y1="118" x2="320" y2="252"/>
  <line class="thline" x1="440" y1="118" x2="440" y2="252"/>
  <line class="thline" x1="600" y1="118" x2="600" y2="252"/>
  <text class="lbl" x="60" y="276" text-anchor="start">ข้อมูลตั้งต้นใน RAM ข้อมูล: ช่อง 10 = 0011 (3) · ช่อง 11 = 0100 (4) · ช่อง 00 และ 01 = 0000</text>
  <rect class="panelb" x="20" y="310" width="920" height="370" rx="10"/>
  <text class="ptitle" x="40" y="338" text-anchor="start">B. เดินเครื่องจริง: กดปุ่ม Clock หนึ่งครั้ง = เดินหนึ่งก้าว</text>
  <text class="sub" x="40" y="358" text-anchor="start">หนึ่งครั้งที่กด = register ทุกตัวขยับพร้อมกันหนึ่งจังหวะ — สังเกตว่าคำสั่งที่เห็นใน IR จะออกฤทธิ์เต็มที่ในการกดครั้งถัดไป</text>
  <rect class="hrow" x="60" y="374" width="860" height="26" rx="4"/>
  <text class="th" x="115.0" y="391" text-anchor="middle">กดครั้งที่</text>
  <text class="th" x="215.0" y="391" text-anchor="middle">PC</text>
  <text class="th" x="330.0" y="391" text-anchor="middle">IR (คำสั่ง)</text>
  <text class="th" x="460.0" y="391" text-anchor="middle">ACC</text>
  <text class="th" x="590.0" y="391" text-anchor="middle">RAM ข้อมูล[11]</text>
  <text class="th" x="790.0" y="391" text-anchor="middle">สิ่งที่เห็น</text>
  <rect class="row" x="60" y="400" width="860" height="27" rx="10"/>
  <text class="lbl" x="115.0" y="418" text-anchor="middle">1</text>
  <text class="val" x="215.0" y="418" text-anchor="middle">01</text>
  <text class="val" x="330.0" y="418" text-anchor="middle">0010 LOAD 10</text>
  <text class="val" x="460.0" y="418" text-anchor="middle">0000 (0)</text>
  <text class="val" x="590.0" y="418" text-anchor="middle">0100 (4)</text>
  <text class="lbl" x="672" y="418" text-anchor="start">fetch ได้คำสั่งแรกแล้ว (LOAD 10)</text>
  <rect class="rowg" x="60" y="427" width="860" height="27" rx="10"/>
  <text class="lbl" x="115.0" y="445" text-anchor="middle">2</text>
  <text class="val" x="215.0" y="445" text-anchor="middle">10</text>
  <text class="val" x="330.0" y="445" text-anchor="middle">0111 ADD 11</text>
  <text class="val" x="460.0" y="445" text-anchor="middle">0011 (3)</text>
  <text class="val" x="590.0" y="445" text-anchor="middle">0100 (4)</text>
  <text class="lbl" x="672" y="445" text-anchor="start">LOAD ทำงาน: ACC = 3</text>
  <rect class="row" x="60" y="454" width="860" height="27" rx="10"/>
  <text class="lbl" x="115.0" y="472" text-anchor="middle">3</text>
  <text class="val" x="215.0" y="472" text-anchor="middle">11</text>
  <text class="val" x="330.0" y="472" text-anchor="middle">1011 STORE 11</text>
  <text class="val" x="460.0" y="472" text-anchor="middle">0111 (7)</text>
  <text class="val" x="590.0" y="472" text-anchor="middle">0100 (4)</text>
  <text class="lbl" x="672" y="472" text-anchor="start">ADD ทำงาน: ACC = 3 + 4 = 7</text>
  <rect class="rowg" x="60" y="481" width="860" height="27" rx="10"/>
  <text class="lbl" x="115.0" y="499" text-anchor="middle">4</text>
  <text class="val" x="215.0" y="499" text-anchor="middle">00</text>
  <text class="val" x="330.0" y="499" text-anchor="middle">1100 OUT</text>
  <text class="val" x="460.0" y="499" text-anchor="middle">0111 (7)</text>
  <text class="val" x="590.0" y="499" text-anchor="middle">0111 (7)</text>
  <text class="lbl" x="672" y="499" text-anchor="start">STORE เขียน 7 ลง RAM[11]</text>
  <rect class="row" x="60" y="508" width="860" height="27" rx="10"/>
  <text class="lbl" x="115.0" y="526" text-anchor="middle">5</text>
  <text class="val" x="215.0" y="526" text-anchor="middle">01</text>
  <text class="val" x="330.0" y="526" text-anchor="middle">0010 LOAD 10</text>
  <text class="val" x="460.0" y="526" text-anchor="middle">0111 (7)</text>
  <text class="val" x="590.0" y="526" text-anchor="middle">0111 (7)</text>
  <text class="lbl" x="672" y="526" text-anchor="start">OUT เปิด LED = 7 แล้ว fetch รอบใหม่</text>
  <line class="thline" x1="170" y1="374" x2="170" y2="535"/>
  <line class="thline" x1="260" y1="374" x2="260" y2="535"/>
  <line class="thline" x1="400" y1="374" x2="400" y2="535"/>
  <line class="thline" x1="520" y1="374" x2="520" y2="535"/>
  <line class="thline" x1="660" y1="374" x2="660" y2="535"/>
  <text class="lbl" x="60" y="562" text-anchor="start">อ่านตารางนี้แล้วจะเห็น 'การไหล' ของโปรแกรม: PC เดินหน้าทีละ 1 ทุกครั้งที่กด · IR เปลี่ยนตาม · ACC สะสมผล · LED โผล่ผลลัพธ์ตอนคำสั่ง OUT</text>
  <text class="lbl" x="60" y="586" text-anchor="start">กดต่ออีกไม่กี่ครั้ง LED จะกลายเป็น 1010 (10) แล้ว 1101 (13) — โปรแกรมวนซ้ำและบวก 3 เพิ่มทุกรอบ เพราะไม่มีคำสั่งหยุด</text>
  <text class="lbl" x="60" y="610" text-anchor="start">นี่คือคำตอบของคำถาม 'ทำไมโปรแกรมบางตัววิ่งไม่หยุด' — ไม่ใช่เพราะซีพียูขี้เกียจ แต่เพราะไม่มีคำสั่งที่สั่งให้มันหยุด (HALT)</text>
  <text class="lbl" x="60" y="634" text-anchor="start">ในโจทย์ท้ายบท เราจะเพิ่มคำสั่ง HALT เพื่อให้โปรแกรมหยุดได้จริง</text>
</svg>
