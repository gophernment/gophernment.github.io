<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 800" width="1040" height="800" role="img" aria-label="stack frame ของ check_login ที่มีบัฟเฟอร์ 16 ไบต์ เปรียบเทียบแบบไม่มี canary กับมี canary">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 17.5px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .sub { fill: #57606a; font-size: 12.5px; }
    .lbl { fill: #57606a; font-size: 11.5px; }
    .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
    .monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #0550ae; }
    .monor { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #cf222e; }
    .monog { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #1a7f37; }
    .big { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 19px; font-weight: 700; fill: #1a7f37; }
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .cell { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .cellw { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .cellhi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.9; }
    .cellbad { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.9; }
    .cellcanary { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.9; }
    .notebox { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.3; }
    .cbox { fill: #eef4ff; stroke: #0969da; stroke-width: 1.3; }
    .gobox { fill: #e6f4ff; stroke: #0a7ea4; stroke-width: 1.3; }
    .warnbox { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.3; }
    .rowband { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .wire { stroke: #1a7f37; stroke-width: 2.2; fill: none; }
    .wirer { stroke: #cf222e; stroke-width: 2.2; fill: none; }
    .wire2 { stroke: #57606a; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
    <marker id="arr-n" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect x="0" y="0" width="1040" height="800" fill="#ffffff"/>

<text class="hdr" x="520" y="34" text-anchor="middle">เขียน 64 ไบต์ลงบัฟเฟอร์ 16 ไบต์: เฟรมจริงบน stack เป็นอย่างไร</text>
<text class="sub" x="520" y="58" text-anchor="middle">offset ทุกตัวอ่านจาก assembly จริง (gcc -S -O0 · aarch64 · เฟรม 64 ไบต์) ไม่ใช่การเดา</text>
<text class="ptitle" x="40" y="92">ไม่มี canary — marker = 0x4141414141414141 (ถูกทับ)</text>
<rect class="cell" x="40" y="104" width="460" height="40" rx="7"/>
<text class="mono" x="52" y="130">sp+0</text>
<text class="mono" x="132" y="130">x29 (ตัวชี้เฟรมเดิม)</text>
<rect class="cellbad" x="40" y="148" width="460" height="40" rx="7"/>
<text class="mono" x="52" y="174">sp+8</text>
<text class="mono" x="132" y="174">x30 = return address (ที่กลับไป)</text>
<rect class="cellw" x="40" y="192" width="460" height="40" rx="7"/>
<text class="mono" x="52" y="218">sp+16</text>
<text class="mono" x="132" y="218">ที่ว่าง (ตัวจัดแนว)</text>
<rect class="cell" x="40" y="236" width="460" height="40" rx="7"/>
<text class="mono" x="52" y="262">sp+24</text>
<text class="mono" x="132" y="262">ตัวชี้ input (argument)</text>
<rect class="cellw" x="40" y="280" width="460" height="40" rx="7"/>
<text class="mono" x="52" y="306">sp+32</text>
<text class="mono" x="132" y="306">ที่ว่าง (ตัวจัดแนว)</text>
<rect class="cellhi" x="40" y="324" width="460" height="40" rx="7"/>
<text class="mono" x="52" y="350">sp+40</text>
<text class="mono" x="132" y="350">buf[16] ← เขียน 64 ไบต์จากตรงนี้</text>
<rect class="cellbad" x="40" y="368" width="460" height="40" rx="7"/>
<text class="mono" x="52" y="394">sp+56</text>
<text class="mono" x="132" y="394">marker (ตัวแปรเพื่อนบ้าน)</text>
<rect class="notebox" x="40" y="433" width="460" height="100" rx="9"/>
<text class="ptitle" x="54" y="459">ผลรันจริง: marker ถูกเขียนทับทั้ง 8 ไบต์</text>
<text class="lbl" x="54" y="485">แล้วการเขียนล้นไปต่อถึงเฟรมของผู้เรียก</text>
<line class="wirer" x1="470" y1="396" x2="470" y2="150" marker-end="url(#arr-r)"/>
<text class="lbl" x="460" y="421" text-anchor="end">การเขียน 64 ไบต์ล้นขึ้นไป</text>
<text class="lbl" x="40" y="575">main กลับเข้าตัวเองได้ (เห็นข้อความ "กลับมาถึง main เรียบร้อย")</text>
<text class="lbl" x="40" y="597">แล้วตายตอนคืนค่าด้วย Bus error · exit code 135 (128+7)</text>
<text class="ptitle" x="540" y="92">มี canary — ตรวจเจอก่อนคืนค่า</text>
<rect class="cellw" x="540" y="104" width="460" height="40" rx="7"/>
<text class="mono" x="552" y="130">sp+0</text>
<text class="mono" x="632" y="130">ที่ว่าง</text>
<rect class="cell" x="540" y="148" width="460" height="40" rx="7"/>
<text class="mono" x="552" y="174">sp+8</text>
<text class="mono" x="632" y="174">ตัวชี้ input (argument)</text>
<rect class="cellhi" x="540" y="192" width="460" height="40" rx="7"/>
<text class="mono" x="552" y="218">sp+16</text>
<text class="mono" x="632" y="218">marker = 0xaabbccddeeff0011 (รอด!)</text>
<rect class="cellhi" x="540" y="236" width="460" height="40" rx="7"/>
<text class="mono" x="552" y="262">sp+24</text>
<text class="mono" x="632" y="262">buf[16] ← เขียน 64 ไบต์จากตรงนี้</text>
<rect class="cellcanary" x="540" y="280" width="460" height="40" rx="7"/>
<text class="mono" x="552" y="306">sp+40</text>
<text class="mono" x="632" y="306">canary (ค่าลับจาก __stack_chk_guard)</text>
<rect class="cellbad" x="540" y="324" width="460" height="40" rx="7"/>
<text class="mono" x="552" y="350">sp+48</text>
<text class="mono" x="632" y="350">x29 (ตัวชี้เฟรมเดิม)</text>
<rect class="cellbad" x="540" y="368" width="460" height="40" rx="7"/>
<text class="mono" x="552" y="394">sp+56</text>
<text class="mono" x="632" y="394">x30 = return address</text>
<rect class="notebox" x="540" y="421" width="460" height="112" rx="9"/>
<text class="ptitle" x="554" y="447">ผลรันจริง: marker ไม่ถูกแตะ แต่ canary โดนทับ</text>
<text class="lbl" x="554" y="473">ตอนจบฟังก์ชัน: *** stack smashing detected ***</text>
<text class="lbl" x="554" y="499">โปรแกรมถูกสั่งหยุด (exit code 134) — ไม่ยอมคืนค่า</text>
<line class="wirer" x1="970" y1="410" x2="970" y2="330" marker-end="url(#arr-r)"/>
<text class="lbl" x="554" y="563">canary = กับดักที่วางติดบัฟเฟอร์ ใครล้นโดนก่อน</text>
<text class="lbl" x="554" y="585">เปิดด้วย -fstack-protector-strong (default ไม่เปิด)</text>
<rect class="cbox" x="40" y="619" width="960" height="86" rx="10"/>
<text class="ptitle" x="56" y="644">อ่านภาพนี้ให้เป็น: การเขียนเกินขอบเขตไม่ได้พังตรงนั้นทันที —</text>
<text class="lbl" x="56" y="672">มันไปแก้ข้อมูลที่โปรแกรมใช้ตัดสินใจ แล้วเพิ่งพังตอนใช้ข้อมูลนั้น (หรือไม่พังเลย)</text>
<text class="lbl" x="56" y="700">ตำแหน่งแต่ละช่องขึ้นกับคอมไพเลอร์ — ที่เห็นคือของจริงจาก GCC 14.2.0 บน aarch64 ที่นี่เท่านั้น</text>
</svg>
