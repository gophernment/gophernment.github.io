  <text x="50.0" y="254.0" class="lbl" text-anchor="end">#-32</text>
  <rect x="60.0" y="268.0" width="300.0" height="30.0" rx="8.0" class="bandc"/>
  <text x="74.0" y="288.0" class="mono">a = [x29, #-40]  (int)</text>
  <text x="50.0" y="288.0" class="lbl" text-anchor="end">#-40</text>
  <path d="M 240.0 308.0 L 240.0 320.0" class="arrowb" marker-end="url(#ab)"/>
  <text x="60.0" y="328.0" class="lblb">sp (stack pointer)</text>
  <text x="120.0" y="362.0" class="lbl">ช่องน้ำเงิน = 'a' ตัวในบล็อก (shadowing) ได้ช่องใหม่ ไม่ทับ a ตัวนอก</text>
  <text x="24.0" y="386.0" class="lbl">go version go1.24.4 linux/arm64 · Linux 6.18.39+rpt-rpi-2712 aarch64 · 2026-10-03</text>
