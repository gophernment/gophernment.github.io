  <text x="74.0" y="186.0" class="mono">a = [x29, #-16]  (int)</text>
  <text x="50.0" y="186.0" class="lbl" text-anchor="end">#-16</text>
  <rect x="60.0" y="200.0" width="300.0" height="30.0" rx="8.0" class="band"/>
  <text x="74.0" y="220.0" class="mono">b = [x29, #-24]  (int)</text>
  <text x="50.0" y="220.0" class="lbl" text-anchor="end">#-24</text>
  <rect x="60.0" y="234.0" width="300.0" height="30.0" rx="8.0" class="band"/>
