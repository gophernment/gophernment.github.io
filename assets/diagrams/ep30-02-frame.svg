  <text x="24.0" y="32.0" class="hdr">ผังเฟรม: ตัวแปร = ช่องบน stack (มีที่อยู่จริง)</text>
  <text x="24.0" y="54.0" class="sub">codegen จองช่องถอยลงจาก x29 ทีละ 8 ไบต์ · ชื่อซ้ำในบล็อกได้ช่องใหม่</text>
  <text x="60.0" y="96.0" class="lblb">x29 (frame pointer)</text>
