<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" role="img" aria-label="ขอบเขตความเชื่อถือ (trust boundary) และสี่คำที่ต้องรู้: asset, trust, threat, vulnerability">
<style>
text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
.hdr { font-weight: 700; font-size: 17.5px; }
.ptitle { font-weight: 700; font-size: 14.5px; }
.sub { fill: #57606a; font-size: 12.5px; }
.lbl { fill: #57606a; font-size: 11.5px; }
.txt { font-size: 13px; }
.small { fill: #57606a; font-size: 11px; }
.mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
.monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #0550ae; }
.boxn { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.6; }
.boxi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.6; }
.boxg { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.3; }
.boxw { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
.boxy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
.boxb { fill: #eef4ff; stroke: #0969da; stroke-width: 1.4; }
.chip { fill: #ffffff; stroke: #1a7f37; stroke-width: 1.2; }
.dash { stroke: #8250df; stroke-width: 2.2; stroke-dasharray: 9 7; fill: none; }
.wire { stroke: #57606a; stroke-width: 1.8; fill: none; }
</style>
<defs>
<marker id="a-n" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
</defs>
<rect x="0" y="0" width="1040" height="640" fill="#ffffff"/>
<text class="hdr" x="520" y="36" text-anchor="middle">ขอบเขตความเชื่อถือ (trust boundary) และสี่คำที่ต้องรู้</text>
<text class="sub" x="520" y="60" text-anchor="middle">ข้อมูลจาก “ข้างนอก” จะกลายเป็นความเสี่ยง ก็ต่อเมื่อ “ข้างใน” เชื่อมันโดยไม่ตรวจ</text>
<rect class="boxn" x="40" y="116" width="330" height="250" rx="9"/>
<text class="ptitle" x="56" y="148">ข้างนอกระบบ — untrusted</text>
<text class="small" x="56" y="170">(ไม่น่าเชื่อถือ = คุมไม่ได้)</text>
<text class="txt" x="56" y="204">• ผู้ใช้ / อินเทอร์เน็ต / อุปกรณ์</text>
<text class="txt" x="56" y="238">• ไฟล์ที่โหลดมาจากที่อื่น</text>
<text class="txt" x="56" y="272">• dependency จากบุคคลที่สาม</text>
<text class="txt" x="56" y="306">• ผู้โจมตี (attacker) ก็ยืนอยู่ตรงนี้</text>
<line class="wire" x1="376" y1="250" x2="442" y2="250" marker-end="url(#a-n)"/>
<text class="lbl" x="408" y="236" text-anchor="middle">input</text>
<line class="dash" x1="406" y1="108" x2="406" y2="222"/>
<line class="dash" x1="406" y1="244" x2="406" y2="392"/>
<text class="lbl" x="406" y="100" text-anchor="middle">trust boundary</text>
<rect class="boxi" x="442" y="116" width="558" height="250" rx="9"/>
<text class="ptitle" x="458" y="148">ข้างในระบบ — สิ่งที่เราต้องปกป้อง (asset)</text>
<rect class="chip" x="458" y="168" width="526" height="36" rx="9"/>
<text class="txt" x="472" y="192">ข้อมูลผู้ใช้ (ชื่อ, ที่อยู่, ประวัติ)</text>
<rect class="chip" x="458" y="214" width="526" height="36" rx="9"/>
<text class="txt" x="472" y="238">ยอดเงิน / สิทธิ์การเข้าถึง</text>
<rect class="chip" x="458" y="260" width="526" height="36" rx="9"/>
<text class="txt" x="472" y="284">ไฟล์ระบบและความลับ (secret)</text>
<rect class="chip" x="458" y="306" width="526" height="36" rx="9"/>
<text class="txt" x="472" y="330">ชื่อเสียงและความน่าเชื่อถือของบริการ</text>
<rect class="boxy" x="40" y="400" width="960" height="200" rx="9"/>
<text class="ptitle" x="56" y="432">สี่คำที่ต้องรู้ก่อนไปต่อ</text>
<text class="monob" x="56" y="470">asset</text>
<text class="txt" x="150" y="470">= สิ่งที่มีค่าและต้องปกป้อง (ข้อมูล, เงิน, สิทธิ์, ชื่อเสียง)</text>
<text class="monob" x="56" y="506">trust</text>
<text class="txt" x="150" y="506">= การยอมเชื่อสิ่งหนึ่ง แล้วลดการตรวจสอบมันลง — ทุกครั้งที่เชื่อ มีความเสี่ยงตามมา</text>
<text class="monob" x="56" y="542">threat</text>
<text class="txt" x="150" y="542">= ใคร/อะไรที่พร้อมทำร้าย asset ของเรา ถ้ามีช่องทาง</text>
<text class="monob" x="56" y="578">vulnerability</text>
<text class="txt" x="196" y="578">= จุดอ่อนในระบบที่ทำให้ threat ทำได้จริง (เช่น ไม่ตรวจสอบ input)</text>
</svg>
