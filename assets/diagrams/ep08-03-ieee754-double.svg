<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="โครงสร้าง 64 บิตของ float64 ตามมาตรฐาน IEEE 754 แบ่งเป็น sign 1 บิต exponent 11 บิต mantissa 52 บิต และสาธิตว่าเหตุใด 0.1 บวก 0.2 จึงไม่เท่ากับ 0.3">
  <style>
    text { font-family: "Noto Sans Thai", -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 17px; }
    .hdrsm { font-weight: 700; font-size: 14.5px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #0969da; }
    .mono2 { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #1a1a1a; }
    .monos { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #57606a; }
    .lbl { fill: #57606a; font-size: 12px; }
    .lblred { fill: #cf222e; font-size: 12px; font-weight: 700; }
    .lblgreen { fill: #1a7f37; font-size: 12.5px; font-weight: 700; }
    .lblblue { fill: #0969da; font-size: 12.5px; font-weight: 700; }
    .lblpurple { fill: #8250df; font-size: 12.5px; font-weight: 700; }
    .panel { fill: #f6f8fa; stroke: #0969da; stroke-width: 1.5; }
    .panelg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .fldsign { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.4; }
    .fldexp { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.4; }
    .fldman { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.4; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
  </style>

  <text class="hdr" x="450" y="30" text-anchor="middle">float64 เก็บทศนิยมยังไง — ต้นตอของ 0.1 + 0.2 ที่ไม่เท่ากับ 0.3</text>

  <!-- ===== Panel A: โครงสร้าง 64 บิต ===== -->
  <rect class="panel" x="30" y="52" width="840" height="180" rx="10"/>
  <text class="hdrsm" x="50" y="78">มาตรฐาน IEEE 754 double precision: 64 บิต = 1 + 11 + 52</text>

  <text class="lblpurple" x="37" y="106">sign</text>
  <text class="lblblue" x="200" y="106">exponent (ตัวชี้กำลัง)</text>
  <text class="lblgreen" x="560" y="106">mantissa (ตัวเลขจริง)</text>

  <rect class="fldsign" x="30" y="114" width="14" height="46" rx="3"/>
  <rect class="fldexp" x="44" y="114" width="144" height="46" rx="3"/>
  <rect class="fldman" x="188" y="114" width="682" height="46" rx="3"/>

  <text class="monos" x="37" y="176" text-anchor="middle">1</text>
  <text class="monos" x="116" y="176" text-anchor="middle">11 บิต</text>
  <text class="monos" x="529" y="176" text-anchor="middle">52 บิต</text>

  <text class="lbl" x="60" y="200">บวก/ลบ · 0 = บวก, 1 = ลบ</text>
  <text class="lbl" x="230" y="200">จุดทศนิยมอยู่ตรงไหน (มี bias 1023)</text>
  <text class="lbl" x="560" y="200">เศษส่วนที่เหลือ — ทศนิยมจริงมีแค่ 52 บิต</text>
  <text class="lbl" x="560" y="220">คิดเป็นทศนิยมฐานสิบได้ประมาณ 15–17 หลัก</text>

  <!-- ===== Panel B: 0.1 ในรูปบิตจริง ===== -->
  <rect class="panelg" x="30" y="248" width="840" height="150" rx="10"/>
  <text class="hdrsm" x="50" y="274">0.1 ถูกเก็บจริงเป็นแบบนี้ (ผลรันจริงจาก math.Float64bits)</text>
  <text class="mono2" x="50" y="300">0011 1111 1011 1001 1001 1001 1001 1001 1001 1001 1001 1001 1001 1001 1001 1010</text>
  <text class="lblpurple" x="50" y="324">s=0</text>
  <text class="lblblue" x="100" y="324">exp = 01111111011₂ = 1019 → 1019 − 1023 = −4</text>
  <text class="lblgreen" x="440" y="324">mantissa = 1001100110011001...1010₂</text>
  <text class="mono" x="50" y="350">ค่าเก็บจริง = 0.100000000000000005551115123126…</text>
  <text class="lbl" x="50" y="374">จะเห็นว่าทศนิยม "1001" ซ้ำไม่มีวันจบ — แต่ mantissa มีแค่ 52 บิต จึงต้องตัดทิ้งตรงกลาง</text>
  <text class="lblred" x="50" y="392">นี่คือความคลาดเคลื่อนที่ฝังมาในตัวเลขตั้งแต่แรก ไม่ใช่บั๊กของภาษา</text>

  <!-- ===== Panel C: เทียบ 4 ค่า ===== -->
  <rect class="panelg" x="30" y="416" width="840" height="182" rx="10"/>
  <text class="hdrsm" x="50" y="442">สาธิต: ค่าที่ "ควรจะ" เป็น กับค่าที่ "เก็บได้จริง"</text>

  <rect class="box" x="50" y="454" width="800" height="30" rx="4"/>
  <text class="mono2" x="64" y="474">0.1</text>
  <text class="mono" x="120" y="474">= 0.100000000000000005551115123126…</text>
  <text class="lblgreen" x="740" y="474">คลาด</text>

  <rect class="box" x="50" y="488" width="800" height="30" rx="4"/>
  <text class="mono2" x="64" y="508">0.2</text>
  <text class="mono" x="120" y="508">= 0.200000000000000011102230246252…</text>
  <text class="lblgreen" x="740" y="508">คลาด</text>

  <rect class="box" x="50" y="522" width="800" height="30" rx="4"/>
  <text class="mono2" x="64" y="542">ผลบวก</text>
  <text class="mono" x="120" y="542">= 0.300000000000000044408920985006…</text>
  <text class="lblred" x="740" y="542">ไม่เท่ากับ ↓</text>

  <rect class="box" x="50" y="556" width="800" height="30" rx="4"/>
  <text class="mono2" x="64" y="576">0.3</text>
  <text class="mono" x="120" y="576">= 0.299999999999999988897769753748…</text>
  <text class="lblred" x="740" y="576">ต่างกัน</text>
</svg>
