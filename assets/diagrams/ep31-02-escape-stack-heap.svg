<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-label="escape analysis stack vs heap">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12.5px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 19px; }
    .sub { fill: #57606a; font-size: 12.5px; }
    .btitle { font-weight: 700; font-size: 12.5px; }
    .lbl { fill: #57606a; font-size: 11.5px; }
    .lblb { fill: #0550ae; font-size: 11.5px; font-weight: 700; }
    .lblg { fill: #1a7f37; font-size: 11.5px; font-weight: 700; }
    .lblr { fill: #cf222e; font-size: 11.5px; font-weight: 700; }
    .mono { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 11.5px; }
    .mono10 { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 10px; fill: #57606a; }
    .monob { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 11.5px; font-weight: 700; fill: #0550ae; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .bandw { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .bandc { fill: #eef4ff; stroke: #0969da; stroke-width: 1.6; }
    .bandg { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
    .bandy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
    .bandr { fill: #fff0f0; stroke: #cf222e; stroke-width: 1.4; }
    .bandk { fill: #e8e8e8; stroke: #1a1a1a; stroke-width: 1.4; }
    .arrow { stroke: #57606a; stroke-width: 1.8; fill: none; }
    .arrowb { stroke: #0550ae; stroke-width: 2; fill: none; }
    .arrowg { stroke: #1a7f37; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0550ae"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/>
    </marker>
  </defs>
  <text x="24.0" y="32.0" class="hdr">escape analysis: compiler ตัดสินเองว่าตัวแปรอยู่ stack หรือ heap</text>
  <text x="24.0" y="54.0" class="sub">ผลจริงจาก go build -gcflags='-m' บน 01_escape/main.go ของตอนนี้</text>
  <rect x="24.0" y="84.0" width="376.0" height="150.0" rx="8.0" class="bandg"/>
  <text x="38.0" y="108.0" class="lblg">อยู่บน stack — เร็ว เก็บกวาดฟรีตอน return</text>
  <text x="38.0" y="132.0" class="mono">stayInt()  : x := 42; return x</text>
  <text x="38.0" y="152.0" class="mono">staySlice(): s := [3]int{1,2,3}</text>
  <text x="38.0" y="180.0" class="lbl">compiler ไม่พิมพ์ข้อความ escapes</text>
  <text x="38.0" y="198.0" class="lbl">→ ไม่ต้องใช้ heap เลย</text>
  <text x="38.0" y="220.0" class="lblb">ไม่ต้องรอ GC เก็บกวาด → เร็วที่สุด</text>
  <rect x="420.0" y="84.0" width="376.0" height="150.0" rx="8.0" class="bandr"/>
  <text x="434.0" y="108.0" class="lblr">หนีไป heap — โปรแกรมยังต้องใช้ต่อ</text>
  <text x="434.0" y="130.0" class="mono10">01_escape/main.go:19:2: moved to heap: x</text>
  <text x="434.0" y="150.0" class="mono10">01_escape/main.go:35:11: make([]int, n) escapes to heap</text>
  <text x="434.0" y="170.0" class="mono10">01_escape/main.go:47:9: x escapes to heap</text>
  <rect x="24.0" y="254.0" width="772.0" height="76.0" rx="8.0" class="bandc"/>
  <text x="38.0" y="280.0" class="lblb">กฎ: pointer ที่ชี้ไปยัง stack ต้องไม่รอดชีวิตข้ามการ return ของฟังก์ชัน</text>
  <text x="38.0" y="302.0" class="lbl">ถ้าที่อยู่ของตัวแปร 'หนี' ออกไปได้ (คืน pointer / ยัดใส่ interface / เก็บใน global)</text>
  <text x="38.0" y="320.0" class="lblg">→ compiler ย้ายตัวแปรนั้นไป heap ให้เอง · ต่างจาก C ที่เรา malloc/free เอง (ตอน 16)</text>
  <text x="24.0" y="406.0" class="lbl">go version go1.24.4 linux/arm64 · Linux 6.18.39+rpt-rpi-2712 aarch64 · 2026-10-06</text>
</svg>
