<text x="40" y="724" class="s">ข้ามแบบไม่ติดกัน (วาดเป็นเส้นตรงไม่ได้ ไม่ใช่เพราะไม่มีอะไรเกิดขึ้น): internet↔edge = F01, F07 · app↔internet = F06</text>
<text x="1220" y="724" class="sm" text-anchor="end">รวม 10 เส้น = 7 ติดกัน + 3 ไม่ติดกัน</text>
<text x="1220" y="744" class="sm" text-anchor="end">5 boundary = คู่โซนที่มีเส้นข้าม (ช่องว่าง 0 เส้นไม่นับ)</text>
<rect x="40" y="748" width="380" height="128" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<text x="64" y="800" class="n">84</text>
<text x="64" y="828" class="hd">ภัยที่ STRIDE ผลิตออกมา</text>
<text x="64" y="850" class="sm">จาก 11 องค์ประกอบ × ชนิดของมัน</text>
<rect x="440" y="748" width="380" height="128" rx="10" fill="#f5f7f9" stroke="#9aa9b8" stroke-width="1.5"/>
<text x="464" y="800" class="n">74</text>
<text x="464" y="828" class="hd">อยู่บนองค์ประกอบหรือเส้น</text>
<text x="464" y="846" class="hd">ที่แตะ boundary</text>
<text x="464" y="868" class="sm">= 88.1% ของทั้งหมด</text>
<rect x="840" y="748" width="380" height="128" rx="10" fill="#f5f7f9" stroke="#9aa9b8" stroke-width="1.5"/>
<text x="864" y="800" class="n">0</text>
<text x="864" y="828" class="hd">มีมาตรการประกาศไว้</text>
<text x="864" y="850" class="sm">ยังไม่มีใครตัดสินใจอะไรกับเส้นไหนเลย</text>
<text x="630" y="906" class="sm" text-anchor="middle">ตัวเลขทั้งหมดอ่านจาก out/01_dfd.txt ของเดโมจริง (ไม่ใช่ค่าที่พิมพ์มือ)</text>
