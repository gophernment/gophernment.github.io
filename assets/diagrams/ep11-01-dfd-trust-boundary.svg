<text x="630" y="40" class="h" text-anchor="middle">ระบบหนึ่งระบบใน DFD: 5 zone · 11 องค์ประกอบ · 10 เส้นที่ข้าม trust boundary</text>
<text x="630" y="62" class="s" text-anchor="middle">เส้นรอบ zone (ประ) = trust boundary · ลูกศร = เส้นข้อมูลที่ข้าม boundary</text>
<text x="630" y="82" class="sm" text-anchor="middle">เส้นจุดจางที่ไม่มีลูกศร = ไม่มีเส้นข้าม (internet↔corp = 0 เส้น) จึงไม่นับเป็น boundary</text>
