<rect class="boxg" x="922" y="118" width="138" height="62" rx="8"/>
<text class="monos" x="991" y="154" text-anchor="middle">none</text>
<rect class="boxg" x="40" y="192" width="96" height="62" rx="8"/>
<text class="ptitle" x="88" y="220" text-anchor="middle">2G</text>
<text class="small" x="88" y="240" text-anchor="middle">1991</text>
<rect class="boxg" x="150" y="192" width="230" height="62" rx="8"/>
<text class="mono" x="162" y="218" text-anchor="start">digital-TDMA</text>
<text class="small" x="162" y="238" text-anchor="start">อากาศ: digital</text>
<rect class="boxg" x="396" y="192" width="262" height="62" rx="8"/>
<text class="mono" x="408" y="218" text-anchor="start">MSC+SGSN/GGSN</text>
<text class="small" x="408" y="238" text-anchor="start">CS + PS (GPRS)</text>
<rect class="boxy" x="674" y="192" width="232" height="62" rx="8"/>
<text class="mono" x="686" y="218" text-anchor="start">circuit-64k</text>
<text class="small" x="686" y="238" text-anchor="start">จองช่องไว้ตลอดสาย</text>
<rect class="boxg" x="922" y="192" width="138" height="62" rx="8"/>
<text class="monos" x="991" y="228" text-anchor="middle">9.6-kbit/s</text>
<rect class="boxg" x="40" y="266" width="96" height="62" rx="8"/>
<text class="ptitle" x="88" y="294" text-anchor="middle">3G</text>
<text class="small" x="88" y="314" text-anchor="middle">2001</text>
<rect class="boxg" x="150" y="266" width="230" height="62" rx="8"/>
<text class="mono" x="162" y="292" text-anchor="start">W-CDMA</text>
<text class="small" x="162" y="312" text-anchor="start">อากาศ: digital</text>
<rect class="boxg" x="396" y="266" width="262" height="62" rx="8"/>
<text class="mono" x="408" y="292" text-anchor="start">CS+PS-domain</text>
<text class="small" x="408" y="312" text-anchor="start">CS + PS</text>
<rect class="boxy" x="674" y="266" width="232" height="62" rx="8"/>
<text class="mono" x="686" y="292" text-anchor="start">circuit-64k</text>
<text class="small" x="686" y="312" text-anchor="start">จองช่องไว้ตลอดสาย</text>
<rect class="boxg" x="922" y="266" width="138" height="62" rx="8"/>
<text class="monos" x="991" y="302" text-anchor="middle">144-kbit/s</text>
<rect class="boxg" x="40" y="340" width="96" height="62" rx="8"/>
<text class="ptitle" x="88" y="368" text-anchor="middle">4G</text>
<text class="small" x="88" y="388" text-anchor="middle">2009</text>
<rect class="boxg" x="150" y="340" width="230" height="62" rx="8"/>
<text class="mono" x="162" y="366" text-anchor="start">OFDMA-LTE</text>
<text class="small" x="162" y="386" text-anchor="start">อากาศ: digital</text>
<rect class="boxg" x="396" y="340" width="262" height="62" rx="8"/>
<text class="mono" x="408" y="366" text-anchor="start">EPC-all-IP</text>
<text class="small" x="408" y="386" text-anchor="start">all-IP (ไม่มี CS)</text>
<rect class="boxi" x="674" y="340" width="232" height="62" rx="8"/>
<text class="mono" x="686" y="366" text-anchor="start">VoLTE-packet</text>
<text class="small" x="686" y="386" text-anchor="start">เป็น packet ธรรมดา</text>
<rect class="boxg" x="922" y="340" width="138" height="62" rx="8"/>
<text class="monos" x="991" y="376" text-anchor="middle">1-Gbit/s</text>
<rect class="boxg" x="40" y="414" width="96" height="62" rx="8"/>
<text class="ptitle" x="88" y="442" text-anchor="middle">5G</text>
<text class="small" x="88" y="462" text-anchor="middle">2018</text>
<rect class="boxg" x="150" y="414" width="230" height="62" rx="8"/>
<text class="mono" x="162" y="440" text-anchor="start">OFDM-NR</text>
<text class="small" x="162" y="460" text-anchor="start">อากาศ: digital</text>
<rect class="boxg" x="396" y="414" width="262" height="62" rx="8"/>
<text class="mono" x="408" y="440" text-anchor="start">5GC+slicing</text>
