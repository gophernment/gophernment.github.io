<rect x="0" y="0" width="1100" height="690" fill="#ffffff"/>
<text class="hdr" x="550" y="40" text-anchor="middle">จากวงจรเสียงถึง IP ทุกชั้น: ห้ารุ่นที่เปลี่ยนวิธีส่งเสียง</text>
<text class="sub" x="550" y="66" text-anchor="middle">circuit จองช่องสัญญาณไว้ตลอดสาย — packet ส่งเฉพาะตอนมีข้อมูลจริง</text>
<text class="lbl" x="40" y="104" text-anchor="start">รุ่น</text>
<text class="lbl" x="150" y="104" text-anchor="start">air interface</text>
<text class="lbl" x="400" y="104" text-anchor="start">core network</text>
<text class="lbl" x="674" y="104" text-anchor="start">เสียงวิ่งบน</text>
<text class="lbl" x="922" y="104" text-anchor="start">peak data</text>
<rect class="boxg" x="40" y="118" width="96" height="62" rx="8"/>
<text class="ptitle" x="88" y="146" text-anchor="middle">1G</text>
<text class="small" x="88" y="166" text-anchor="middle">1979</text>
<rect class="boxg" x="150" y="118" width="230" height="62" rx="8"/>
<text class="mono" x="162" y="144" text-anchor="start">analog-FM</text>
<text class="small" x="162" y="164" text-anchor="start">อากาศ: analog</text>
<rect class="boxg" x="396" y="118" width="262" height="62" rx="8"/>
