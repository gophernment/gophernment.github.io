<rect class="boxi" x="674" y="414" width="232" height="62" rx="8"/>
<text class="mono" x="686" y="440" text-anchor="start">VoNR-packet</text>
<text class="small" x="686" y="460" text-anchor="start">เป็น packet ธรรมดา</text>
<rect class="boxg" x="922" y="414" width="138" height="62" rx="8"/>
<text class="monos" x="991" y="450" text-anchor="middle">20-Gbit/s</text>
<rect class="boxy" x="40" y="494" width="14" height="14" rx="3"/>
<text class="small" x="62" y="506" text-anchor="start">เสียงบนวงจร (circuit)</text>
<rect class="boxi" x="250" y="494" width="14" height="14" rx="3"/>
<text class="small" x="272" y="506" text-anchor="start">เสียงบน packet</text>
<text class="small" x="430" y="506" text-anchor="start">ตัวเลขทุกตัวในภาพนี้อ่านจากผลรันใน out/01_chain.txt</text>
<rect class="boxy" x="40" y="526" width="1020" height="128" rx="8"/>
<text class="ptitle" x="60" y="554" text-anchor="start">ทำไม circuit แพงกว่า — ทั้งที่ส่งข้อมูลเท่ากัน</text>
<text class="txt" x="60" y="580" text-anchor="start">วงจรเสียงหนึ่งวงจรกัน 64 kbit/s ไว้ตลอดเวลา แม้ตอนที่อีกฝั่งกำลังฟังอยู่เฉย ๆ</text>
<text class="txt" x="60" y="599" text-anchor="start">ช่องสัญญาณ 1,920 kbit/s จึงรับได้เพียง 30 สาย — แต่ถ้าส่งเป็น packet ที่ออกเสียง 40% ของเวลา รับได้ 75 สาย</text>
<text class="txt" x="60" y="619" text-anchor="start">circuit domain หายไปที่รุ่น 4G: จากนั้นเสียงเป็นเพียง packet หนึ่งในหลาย ๆ อย่างบน IP</text>
</svg>
