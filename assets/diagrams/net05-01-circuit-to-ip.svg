.slot-send { fill: #1a7f37; }
.slot-idle { fill: #eaeef2; }
.slot-hit { fill: #b62324; }
.onbar { fill: #ffffff; font-size: 10.5px; }
.bar1 { fill: #0969da; }
.bar2 { fill: #bf8700; }
