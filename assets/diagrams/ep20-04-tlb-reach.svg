<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 958" width="1040" height="958" role="img" aria-label="กราฟวัดจริง: ns ต่อการแตะตามขนาดพื้นที่ และผลของจำนวนการแตะต่อหน้า">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 18px; }
    .sub { fill: #57606a; font-size: 12.5px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .btitle { font-weight: 700; font-size: 12.5px; }
    .lbl { fill: #57606a; font-size: 11.5px; }
    .lbl2 { fill: #1a1a1a; font-size: 11.5px; }
    .mono { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 12px; }
    .monob { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #0550ae; }
    .monor { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #cf222e; }
    .monog { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #1a7f37; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .bandc { fill: #eef4ff; stroke: #0969da; stroke-width: 1.4; }
    .bandg { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
    .bandr { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.4; }
    .bandy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
    .cell { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.1; }
    .cellc { fill: #ffffff; stroke: #0969da; stroke-width: 1.3; }
    .arrow { stroke: #57606a; stroke-width: 2; fill: none; }
    .arrowb { stroke: #0550ae; stroke-width: 2.4; fill: none; }
    .arrowr { stroke: #cf222e; stroke-width: 2.2; fill: none; }
    .arrowg { stroke: #1a7f37; stroke-width: 2.2; fill: none; }
    .dash { stroke: #8c959f; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="a-n" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="a-b" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0550ae"/></marker>
    <marker id="a-r" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
    <marker id="a-g" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
  </defs>
  <rect x="0" y="0" width="1040" height="958" fill="#ffffff"/>

<text class="hdr" x="520" y="36" text-anchor="middle">TLB: แคชของการแปลที่อยู่ — วัดจริงบนเครื่องนี้</text>
<text class="sub" x="520" y="60" text-anchor="middle">จาก 07_tlb_stride.c · Cortex-A76 2.4 GHz · เดินแบบสุ่มด้วย pointer chase · ใช้เวลาที่ดีที่สุดจาก 3 รอบ</text>
<rect class="bandc" x="40" y="84" width="960" height="288" rx="10"/>
<text class="ptitle" x="60" y="112">การทดลอง 1: พื้นที่ยิ่งใหญ่ ราคาต่อการแตะยิ่งแพง (แท่ง = ns ต่อการแตะ)</text>
<text class="lbl2" x="60" y="154">64 KiB</text>
<text class="lbl" x="790" y="154">4 หน้า</text>
<rect class="bandg" x="150" y="140" width="12.1" height="22" rx="4"/>
<text class="monob" x="172.1" y="156">2.6 ns</text>
<text class="lbl2" x="60" y="188">256 KiB</text>
<text class="lbl" x="790" y="188">16 หน้า</text>
<rect class="bandg" x="150" y="174" width="21.5" height="22" rx="4"/>
<text class="monob" x="181.5" y="190">4.6 ns</text>
<text class="lbl2" x="60" y="222">1 MiB</text>
<text class="lbl" x="790" y="222">64 หน้า</text>
<rect class="bandg" x="150" y="208" width="52.3" height="22" rx="4"/>
<text class="monob" x="212.3" y="224">11.2 ns</text>
<text class="lbl2" x="60" y="256">4 MiB</text>
<text class="lbl" x="790" y="256">256 หน้า</text>
<rect class="bandg" x="150" y="242" width="288.9" height="22" rx="4"/>
<text class="monob" x="448.9" y="258">61.9 ns</text>
<text class="lbl2" x="60" y="290">16 MiB</text>
<text class="lbl" x="790" y="290">1024 หน้า</text>
<rect class="bandg" x="150" y="276" width="448.5" height="22" rx="4"/>
<text class="monob" x="608.5" y="292">96.1 ns</text>
<text class="lbl2" x="60" y="324">64 MiB</text>
<text class="lbl" x="790" y="324">4096 หน้า</text>
<rect class="bandg" x="150" y="310" width="518.9" height="22" rx="4"/>
<text class="monob" x="678.9" y="326">111.2 ns</text>
<text class="lbl" x="60" y="356">อ่านผล: 4 หน้า (64 KiB) เร็วสุดเพราะทั้งชุดข้อมูลและค่าแปลอยู่ในแคช · 4 MiB ขึ้นไปกระโดดเป็น ~62-111 ns = ต้องรอ DRAM</text>
<rect class="bandg" x="40" y="388" width="960" height="160" rx="10"/>
<text class="ptitle" x="60" y="416">การทดลอง 2: พื้นที่ 64 MiB เท่ากัน เปลี่ยนแค่ขนาดก้าวเดิน (stride)</text>
<text class="lbl2" x="76" y="440">stride 64 B</text>
<text class="lbl" x="330" y="440">256 ครั้งต่อหน้า</text>
<text class="mono" x="560" y="440">4.64 ns</text>
<text class="lbl" x="720" y="440">แตะต่อเนื่อง (อยู่ในหน้าเดิมบ่อย)</text>
<text class="lbl2" x="76" y="462">stride 16 KiB (= 1 หน้า)</text>
<text class="lbl" x="330" y="462">1 ครั้งต่อหน้า</text>
<text class="mono" x="560" y="462">11.87 ns</text>
<text class="lbl" x="720" y="462">ทุกครั้งข้ามหน้า — ต้องแปลใหม่</text>
<text class="lbl2" x="76" y="484">stride 256 KiB</text>
<text class="lbl" x="330" y="484">0.06 ครั้งต่อหน้า</text>
<text class="mono" x="560" y="484">47.46 ns</text>
<text class="lbl" x="720" y="484">กระโดดไกล — ต้องรอ DRAM</text>
<text class="lbl2" x="76" y="506">stride 1 MiB</text>
<text class="lbl" x="330" y="506">0.02 ครั้งต่อหน้า</text>
<text class="mono" x="560" y="506">11.62 ns</text>
<text class="lbl" x="720" y="506">แตะแค่ 64 ตำแหน่ง = อยู่ในแคช L1</text>
<text class="lbl" x="60" y="536">แถวล่าง (stride 1 MiB) เร็วเพราะแตะแค่ 64 ตำแหน่งบนพื้นที่ 64 MiB = ทั้งหมดยังอยู่ในแคช L1</text>
<rect class="bandy" x="40" y="564" width="960" height="212" rx="10"/>
<text class="ptitle" x="60" y="592">การทดลอง 3: พื้นที่ 16 MiB เท่ากันทุกแถว — ต่างแค่ "กี่ครั้งต่อหน้า"</text>
<text class="lbl" x="60" y="614">หลักการ: แตะ VA ที่อยู่หน้าเดียวกันซ้ำ ๆ = MMU ใช้ค่าแปลเดิมที่ TLB จำไว้ ไม่ต้องเดินตารางใหม่</text>
<text class="lbl2" x="60" y="654">stride 1024 B</text>
<text class="lbl" x="210" y="654">16 ครั้งต่อหน้า</text>
<rect class="bandr" x="420" y="640" width="186.8" height="22" rx="4"/>
<text class="monor" x="616.8" y="656">11.21 ns</text>
<text class="lbl2" x="60" y="686">stride 4096 B</text>
<text class="lbl" x="210" y="686">4 ครั้งต่อหน้า</text>
<rect class="bandr" x="420" y="672" width="224.0" height="22" rx="4"/>
<text class="monor" x="654.0" y="688">13.44 ns</text>
<text class="lbl2" x="60" y="718">stride 16384 B</text>
<text class="lbl" x="210" y="718">1 ครั้งต่อหน้า (ข้ามหน้า)</text>
<rect class="bandr" x="420" y="704" width="198.8" height="22" rx="4"/>
<text class="monor" x="628.8" y="720">11.93 ns</text>
<text class="lbl" x="60" y="740">stride 16384 (ข้ามหน้าทุกครั้ง) กลับไม่ช้าสุด · stride 4096 (4 ครั้ง/หน้า) ช้าสุด — TLB ปนกับแคชจนแยก "ราคาแปลหน้า" ออกมาไม่ได้</text>
<text class="lbl" x="60" y="762">ถ้าไม่มี TLB เลย ทุกการแตะต้องเดินตาราง 3 ชั้น (อ่านหน่วยความจำเพิ่มอย่างน้อย 3 ครั้งต่อการแตะ)</text>
<rect class="band" x="40" y="792" width="960" height="150" rx="10"/>
<text class="ptitle" x="60" y="820">ข้อควรระวังก่อนเอาไปอ้าง</text>
<text class="lbl" x="60" y="844">ตัวเลขนี้ผสมทั้งผลของ TLB และแคชข้อมูล (L1D 64 KiB/คอร์ · L2 512 KiB/คอร์ รวม 2 MiB · L3 2 MiB แชร์ 4 คอร์)</text>
<text class="lbl" x="60" y="866">การแยกสองอย่างออกจากกันจริง ๆ ต้องใช้ตัวนับ PMU (perf) ซึ่งเครื่องนี้ไม่มีติดตั้ง</text>
<text class="lbl" x="60" y="888">จำนวน entry ของ TLB เป็นรายละเอียดใน Cortex-A76 Technical Reference Manual ไม่ได้ยืนยันจากตัวเลขชุดนี้</text>
<text class="lbl" x="60" y="910">ที่สำคัญคือทิศทาง: ทำงานในพื้นที่เล็กและแตะหน้าเดิมซ้ำ = ถูกกว่าเสมอ</text>
</svg>