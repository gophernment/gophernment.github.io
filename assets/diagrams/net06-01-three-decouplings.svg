<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="1100" height="660" role="img" aria-label="สามการแยกที่ทำให้ network กลายเป็นซอฟต์แวร์">
<style>
text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12.5px; fill: #1a1a1a; }
.hdr { font-weight: 700; font-size: 17.5px; }
.sub { fill: #57606a; font-size: 12.5px; }
.ptitle { font-weight: 700; font-size: 14px; }
.txt { font-size: 12.5px; }
.lbl { fill: #57606a; font-size: 11px; }
.small { fill: #57606a; font-size: 10.5px; }
.big { font-weight: 700; font-size: 20px; fill: #0550ae; }
.mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 11.5px; fill: #0a3069; }
.monos { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 10.5px; fill: #57606a; }
.boxg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
.boxb { fill: #eef4ff; stroke: #0969da; stroke-width: 1.5; }
.boxy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
.boxi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
.boxr { fill: #fdeff0; stroke: #b62324; stroke-width: 1.4; }
.bgw { fill: #ffffff; stroke: none; }
.wire { stroke: #8c959f; stroke-width: 1.8; fill: none; }
.wire2 { stroke: #b6bfc8; stroke-width: 1.2; fill: none; stroke-dasharray: 5 5; }
.head { fill: #8c959f; }
.rule { stroke: #d0d7de; stroke-width: 1.2; }
.c1 { stroke: #0969da; stroke-width: 2.6; fill: none; }
.c2 { stroke: #bf8700; stroke-width: 2.2; fill: none; stroke-dasharray: 7 5; }
.ctl { stroke: #8250df; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
.onbar { fill: #ffffff; font-size: 10.5px; }
.bar1 { fill: #0969da; }
.bar2 { fill: #bf8700; }
.bar3 { fill: #b62324; }
.seg-o { fill: #fdeff0; stroke: #b62324; stroke-width: 1.2; }
.seg-v { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.2; }
.seg-i { fill: #eef4ff; stroke: #0969da; stroke-width: 1.2; }
</style>
<rect x="0" y="0" width="1100" height="660" fill="#ffffff"/>
<text class="hdr" x="30" y="40" text-anchor="start">สามการแยกที่ทำให้ network กลายเป็นซอฟต์แวร์</text>
<text class="sub" x="30" y="66" text-anchor="start">แต่ละช่องคือการย้ายงานหนึ่งอย่างออกจากกล่องเดิม — ลูกศรชี้ทางเดียวกันทั้งหมด</text>
<rect class="boxg" x="30" y="92" width="320" height="480" rx="8"/>
<rect class="boxg" x="390" y="92" width="320" height="480" rx="8"/>
<rect class="boxg" x="750" y="92" width="320" height="480" rx="8"/>
<text class="ptitle" x="46" y="122" text-anchor="start">1. SDN</text>
<text class="lbl" x="46" y="146" text-anchor="start">control ออกจาก data plane</text>
<rect class="boxb" x="70" y="164" width="240" height="46" rx="8"/>
<text class="mono" x="190" y="184" text-anchor="middle">controller</text>
<text class="small" x="190" y="200" text-anchor="middle">คิดเส้นทาง + ถือ state</text>
<rect class="boxg" x="52" y="262" width="82" height="52" rx="8"/>
<text class="small" x="93" y="282" text-anchor="middle">switch 1</text>
<text class="monos" x="93" y="298" text-anchor="middle">match→act</text>
<line class="ctl" x1="190" y1="210" x2="93" y2="258"/>
<polygon class="head" points="93.0,258.0 98.9,251.2 102.0,257.5"/>
<rect class="boxg" x="146" y="262" width="82" height="52" rx="8"/>
<text class="small" x="187" y="282" text-anchor="middle">switch 2</text>
<text class="monos" x="187" y="298" text-anchor="middle">match→act</text>
<line class="ctl" x1="190" y1="210" x2="187" y2="258"/>
<polygon class="head" points="187.0,258.0 184.0,249.5 191.0,249.9"/>
<rect class="boxg" x="240" y="262" width="82" height="52" rx="8"/>
<text class="small" x="281" y="282" text-anchor="middle">switch 3</text>
<text class="monos" x="281" y="298" text-anchor="middle">match→act</text>
<line class="ctl" x1="190" y1="210" x2="281" y2="258"/>
<polygon class="head" points="281.0,258.0 272.0,257.2 275.3,251.0"/>
<rect class="bgw" x="148" y="226" width="86" height="20" rx="3"/>
<text class="small" x="191" y="240" text-anchor="middle">flow_mod</text>
<text class="small" x="46" y="356" text-anchor="start">ก่อน: router คิด + ส่งต่อ</text>
<text class="small" x="46" y="372" text-anchor="start">อยู่ในกล่องเดียว</text>
<text class="small" x="46" y="388" text-anchor="start">ทุกกล่องตัดสินใจเอง</text>
<text class="small" x="46" y="404" text-anchor="start">เห็นแค่เพื่อนบ้าน</text>
<rect class="boxy" x="46" y="440" width="288" height="112" rx="8"/>
<text class="small" x="60" y="466" text-anchor="start">หลัง: สมองอยู่ที่เดียว</text>
<text class="small" x="60" y="482" text-anchor="start">เห็นทั้งเครือข่าย</text>
<text class="small" x="60" y="498" text-anchor="start">switch ไม่ตัดสินใจเอง</text>
<text class="small" x="60" y="514" text-anchor="start">นโยบายแก้ที่จุดเดียว</text>
<text class="ptitle" x="406" y="122" text-anchor="start">2. NFV</text>
<text class="lbl" x="406" y="146" text-anchor="start">function ออกจากกล่อง hardware</text>
<rect class="boxr" x="408" y="164" width="62" height="44" rx="8"/>
<text class="mono" x="439" y="191" text-anchor="middle">fw</text>
<rect class="boxr" x="480" y="164" width="62" height="44" rx="8"/>
<text class="mono" x="511" y="191" text-anchor="middle">nat</text>
<rect class="boxr" x="552" y="164" width="62" height="44" rx="8"/>
<text class="mono" x="583" y="191" text-anchor="middle">lb</text>
<rect class="boxr" x="624" y="164" width="62" height="44" rx="8"/>
<text class="mono" x="655" y="191" text-anchor="middle">ids</text>
<text class="small" x="550" y="226" text-anchor="middle">กล่องละหนึ่งยี่ห้อ ดูแลแยกกัน</text>
<line class="wire" x1="550" y1="238" x2="550" y2="268"/>
<polygon class="head" points="550.0,268.0 546.5,259.7 553.5,259.7"/>
<rect class="boxg" x="408" y="274" width="284" height="96" rx="8"/>
<text class="small" x="550" y="294" text-anchor="middle">server ธรรมดา (VM / container)</text>
<rect class="boxi" x="420" y="310" width="56" height="40" rx="8"/>
<text class="mono" x="448" y="335" text-anchor="middle">fw</text>
<rect class="boxi" x="486" y="310" width="56" height="40" rx="8"/>
<text class="mono" x="514" y="335" text-anchor="middle">nat</text>
<rect class="boxi" x="552" y="310" width="56" height="40" rx="8"/>
<text class="mono" x="580" y="335" text-anchor="middle">lb</text>
<rect class="boxi" x="618" y="310" width="56" height="40" rx="8"/>
<text class="mono" x="646" y="335" text-anchor="middle">ids</text>
<text class="small" x="550" y="388" text-anchor="middle">ติดตั้งเป็น image เรียงลำดับเป็น config</text>
<rect class="boxy" x="406" y="440" width="288" height="112" rx="8"/>
<text class="small" x="420" y="466" text-anchor="start">ฟังก์ชัน = โปรแกรม</text>
<text class="small" x="420" y="482" text-anchor="start">เพิ่ม/ถอด/สลับลำดับได้</text>
<text class="small" x="420" y="498" text-anchor="start">แต่ลำดับเปลี่ยนความหมาย</text>
<text class="small" x="420" y="514" text-anchor="start">(ดูตัวเลข 25 กับ 0 ในบท)</text>
<text class="ptitle" x="766" y="122" text-anchor="start">3. Overlay</text>
<text class="lbl" x="766" y="146" text-anchor="start">กายภาพเดียว หลายเครือข่ายเสมือน</text>
<rect class="seg-o" x="768" y="164" width="284" height="30" rx="8"/>
<text class="small" x="910" y="184" text-anchor="middle">outer eth</text>
<rect class="seg-o" x="768" y="197" width="284" height="30" rx="8"/>
<text class="small" x="910" y="217" text-anchor="middle">outer IP</text>
<rect class="seg-o" x="768" y="230" width="284" height="30" rx="8"/>
<text class="small" x="910" y="250" text-anchor="middle">UDP 4789</text>
<rect class="seg-v" x="768" y="263" width="284" height="30" rx="8"/>
<text class="small" x="910" y="283" text-anchor="middle">VXLAN + VNI</text>
<rect class="seg-i" x="768" y="296" width="284" height="46" rx="8"/>
<text class="small" x="910" y="324" text-anchor="middle">frame ของ VM</text>
<text class="small" x="910" y="367" text-anchor="middle">ผู้เช่า A กับ B ใช้ที่อยู่ซ้ำกันได้</text>
<text class="small" x="910" y="385" text-anchor="middle">เพราะ VNI ในหัวชั้นนอกแยกให้</text>
<rect class="boxy" x="766" y="440" width="288" height="112" rx="8"/>
<text class="small" x="780" y="466" text-anchor="start">VLAN: 4,094 เครือข่าย</text>
<text class="small" x="780" y="482" text-anchor="start">VXLAN: 16,777,216 เครือข่าย</text>
<text class="small" x="780" y="498" text-anchor="start">ราคาที่จ่าย: หัว 50 ไบต์</text>
<text class="small" x="780" y="514" text-anchor="start">MSS หายไป 50 ไบต์</text>
<rect class="boxb" x="30" y="592" width="1040" height="48" rx="8"/>
<text class="txt" x="550" y="622" text-anchor="middle">ทั้งสามอย่างตอบคำถามเดียวกัน: ใครเป็นเจ้าของการตัดสินใจ — และคำตอบคือซอฟต์แวร์ ไม่ใช่กล่อง</text>
</svg>
