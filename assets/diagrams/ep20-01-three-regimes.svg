<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600" role="img">
<defs>
<style>
  .t  { font-family: sans-serif; font-size: 14px; fill: #12263a; }
  .s  { font-family: sans-serif; font-size: 12px; fill: #3b4a5a; }
  .sm { font-family: sans-serif; font-size: 11px; fill: #4a5b6c; }
  .h  { font-family: sans-serif; font-size: 21px; font-weight: 700; fill: #0b2545; }
  .hd { font-family: sans-serif; font-size: 15px; font-weight: 700; fill: #0b2545; }
  .n  { font-family: sans-serif; font-size: 19px; font-weight: 700; fill: #0b2545; }
  .m  { font-family: monospace; font-size: 12px; fill: #0b2545; }
  .mm { font-family: monospace; font-size: 11px; fill: #3b4a5a; }
  .bad { font-family: sans-serif; font-size: 12px; fill: #7a1f1f; }
  .good{ font-family: sans-serif; font-size: 12px; fill: #14532d; }
</style>
</defs>
<text x="40" y="46" class="h">สามระบอบที่ครอบข้อมูลชุดเดียวกัน — แต่บังคับคนละกลไก</text>
<text x="40" y="74" class="s">กฎหมาย (statutory) ใช้ได้กับทุกองค์กร · มาตรฐานอุตสาหกรรม (contractual) ใช้เพราะคุณเซ็นสัญญาไว้</text>
<rect x="40" y="100" width="280" height="268" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<text x="50" y="130" class="hd">GDPR</text>
<text x="50" y="150" class="sm">Regulation (EU) 2016/679</text>
<line x1="50" y1="160" x2="310" y2="160" stroke="#4a7bb5" stroke-width="1"/>
<text x="50" y="186" class="s">บังคับด้วย: กฎหมาย EU</text>
<text x="50" y="204" class="s">มีผล 25 พ.ค. 2018</text>
<text x="50" y="230" class="s">ครอบ: ข้อมูลส่วนบุคคล</text>
<text x="50" y="248" class="s">ของคนที่อยู่ใน EU</text>
<text x="50" y="274" class="s">โทษ: €20M หรือ 4%</text>
<text x="50" y="292" class="s">ของรายได้ทั้งโลก</text>
<text x="50" y="318" class="s">ผู้ตรวจ: DPA ของแต่ละรัฐ</text>
<rect x="340" y="100" width="280" height="268" rx="10" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="350" y="130" class="hd">PDPA (ไทย)</text>
<text x="350" y="150" class="sm">พ.ร.บ. คุ้มครองข้อมูลฯ 2562</text>
<line x1="350" y1="160" x2="610" y2="160" stroke="#3f9c63" stroke-width="1"/>
<text x="350" y="186" class="s">บังคับด้วย: กฎหมายไทย</text>
<text x="350" y="204" class="s">มีผล 1 มิ.ย. 2022</text>
<text x="350" y="230" class="s">ครอบ: ข้อมูลส่วนบุคคล</text>
<text x="350" y="248" class="s">ในไทยและที่มีผลในไทย</text>
<text x="350" y="274" class="s">โทษ: ปรับทางปกครอง</text>
<text x="350" y="292" class="s">≤ 5 ล้านบาท</text>
<text x="350" y="318" class="s">ผู้ตรวจ: คณะกรรมการ PDPC</text>
<rect x="640" y="100" width="280" height="268" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="1.5"/>
<text x="650" y="130" class="hd">PCI DSS v4.0.1</text>
<text x="650" y="150" class="sm">Payment Card Industry DSS</text>
<line x1="650" y1="160" x2="910" y2="160" stroke="#c9a227" stroke-width="1"/>
<text x="650" y="186" class="s">บังคับด้วย: สัญญากับ</text>
<text x="650" y="204" class="s">acquirer และ card brand</text>
<text x="650" y="230" class="s">ครอบ: ข้อมูลบัตร</text>
<text x="650" y="248" class="s">(PAN และ SAD)</text>
<text x="650" y="274" class="s">โทษ: ค่าปรับ/เสียสิทธิ์</text>
<text x="650" y="292" class="s">รับบัตร</text>
<text x="650" y="318" class="s">ผู้ตรวจ: QSA (ผู้ประเมิน)</text>
<rect x="40" y="390" width="840" height="74" rx="10" fill="#fdeeee" stroke="#c05050" stroke-width="1.5"/>
<text x="58" y="416" class="hd">ข้อมูลบัตรของลูกค้าใน EU = เข้าเงื่อนไขทั้ง GDPR/PDPA และ PCI DSS พร้อมกัน</text>
<text x="58" y="438" class="s">British Airways 2018: ระบบ log เก็บเลขบัตร + CVV ไว้ 95 วันโดยไม่ได้ตั้งใจ</text>
<text x="58" y="456" class="s">→ ผิด PCI DSS 3.3.1.2 และ GDPR Art 5(1)(f)/32 ในเหตุการณ์เดียว</text>
<rect x="40" y="480" width="840" height="68" rx="10" fill="#f5f7f9" stroke="#9aa9b8" stroke-width="1.5"/>
<text x="58" y="506" class="hd">compliance ≠ security</text>
<text x="58" y="528" class="s">ใบรับรองบอกว่า "คุณผ่านเกณฑ์ที่คนอื่นตั้ง" — ไม่ได้บอกว่า "ระบบคุณไม่มีช่องโหว่"</text>
<rect x="40" y="560" width="840" height="30" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="40" y="580" class="sm">เดโมของตอนนี้: 16 ระเบียน → ลบ 6 · ไม่ระบุตัว 3 · เก็บแต่พอ 2 · เก็บต่อ 5</text>
</svg>
