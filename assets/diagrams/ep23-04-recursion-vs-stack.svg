  <defs>
    <marker id="a-n" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="a-b" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0550ae"/></marker>
    <marker id="a-g" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="a-y" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf8700"/></marker>
    <marker id="a-r" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  </defs>
  <rect x="0" y="0" width="1060" height="700" fill="#ffffff"/>
<text class="hdr" x="40" y="38">หลักฐาน: call stack ของฟังก์ชัน = stack ของ PDA (และกับดักที่ตามมา)</text>
<text class="sub" x="40" y="60">ทุกตัวเลขมาจากผลรันจริงของโปรแกรม 03 — parser สองไวยากรณ์ 'ภาษาเดียวกัน' แต่ความลึกของ stack ต่างกันคนละเรื่อง</text>
<rect class="bandw" x="40" y="84" width="620" height="232" rx="8"/>
<text class="btitle" x="58" y="108">1) ความลึก call stack เมื่อสตริงยาวขึ้น (ความซ้อนจริงยังเป็น 1)</text>
<text class="lbl" x="60" y="136">input</text>
<text class="lbl" x="200" y="136">A: S → (S)S | ε</text>
<text class="lbl" x="360" y="136">C: S → (S)*</text>
<text class="lbl" x="500" y="136">ความซ้อนจริง</text>
<path class="grid" d="M58,146 L640,146"/>
<text class="monos" x="60" y="168">"()"×1</text>
<rect class="cellr" x="200" y="156" width="9" height="14" rx="3"/>
<text class="monos" x="214" y="168">2</text>
<rect class="cellg" x="360" y="156" width="9" height="14" rx="3"/>
<text class="monos" x="374" y="168">2</text>
<text class="monos" x="500" y="168">1</text>
<text class="monos" x="60" y="196">"()"×10</text>
<rect class="cellr" x="200" y="184" width="32" height="14" rx="3"/>
<text class="monos" x="237" y="196">11</text>
<rect class="cellg" x="360" y="184" width="9" height="14" rx="3"/>
<text class="monos" x="374" y="196">2</text>
<text class="monos" x="500" y="196">1</text>
<text class="monos" x="60" y="224">"()"×100</text>
<rect class="cellr" x="200" y="212" width="61" height="14" rx="3"/>
<text class="monos" x="266" y="224">101</text>
<rect class="cellg" x="360" y="212" width="9" height="14" rx="3"/>
<text class="monos" x="374" y="224">2</text>
<text class="monos" x="500" y="224">1</text>
<text class="monos" x="60" y="252">"()"×1000</text>
<rect class="cellr" x="200" y="240" width="92" height="14" rx="3"/>
<text class="monos" x="297" y="252">1001</text>
<rect class="cellg" x="360" y="240" width="9" height="14" rx="3"/>
<text class="monos" x="374" y="252">2</text>
<text class="monos" x="500" y="252">1</text>
<text class="monos" x="60" y="280">"()"×4000</text>
<rect class="cellr" x="200" y="268" width="110" height="14" rx="3"/>
<text class="monos" x="315" y="280">4001</text>
<rect class="cellg" x="360" y="268" width="9" height="14" rx="3"/>
<text class="monos" x="374" y="280">2</text>
<text class="monos" x="500" y="280">1</text>
<text class="lbl" x="58" y="306">แท่งยาวตามสเกล log (ลอการิทึม) ของความลึก (ตัวเลขจริงกำกับ) — A ลึกขึ้นเรื่อย ๆ, C ไม่ขยับ</text>
<rect class="bandg" x="680" y="84" width="340" height="232" rx="8"/>
<text class="btitle" x="698" y="108">2) parserC (S → (S)*) อ่าน "(()())" ทีละตำแหน่ง</text>
<text class="lbl" x="698" y="130">frame ลึก (ของ parserC) = 1 + ชั้นการซ้อนของวงเล็บ</text>
<text class="lbl" x="698" y="156">pos</text>
<text class="lbl" x="754" y="156">sym</text>
<text class="lbl" x="810" y="156">frame</text>
<text class="lbl" x="900" y="156">ชั้น</text>
<path class="grid" d="M696,166 L1010,166"/>
<text class="monos" x="698" y="186">0</text>
<text class="monos" x="754" y="186">(</text>
<text class="monos" x="810" y="186">1</text>
<text class="monos" x="900" y="186">0</text>
<text class="monos" x="698" y="208">1</text>
<text class="monos" x="754" y="208">(</text>
<text class="monos" x="810" y="208">2</text>
<text class="monos" x="900" y="208">1</text>
<text class="monos" x="698" y="230">2</text>
<text class="monos" x="754" y="230">)</text>
<text class="monos" x="810" y="230">2</text>
<text class="monos" x="900" y="230">1</text>
<text class="monos" x="698" y="252">3</text>
<text class="monos" x="754" y="252">(</text>
<text class="monos" x="810" y="252">2</text>
<text class="monos" x="900" y="252">1</text>
<text class="monos" x="698" y="274">4</text>
<text class="monos" x="754" y="274">)</text>
<text class="monos" x="810" y="274">2</text>
<text class="monos" x="900" y="274">1</text>
<text class="monos" x="698" y="296">5</text>
<text class="monos" x="754" y="296">)</text>
<text class="monos" x="810" y="296">1</text>
<text class="monos" x="900" y="296">0</text>
<rect class="bandc" x="40" y="332" width="620" height="150" rx="8"/>
<text class="btitle" x="58" y="356">3) สรุปการเทียบ (จากผลรัน)</text>
<text class="lblg" x="58" y="380">ตรวจ 2047 สตริง × 3 parser เทียบกับ oracle → ไม่ตรงกัน 0 จุด</text>
<text class="lblg" x="58" y="400">วงเล็บเปิดค้างสูงสุด = (frame ลึกสุด − 1)</text>
<text class="lblg" x="58" y="420">= ความลึก stack ของ PDA (โปรแกรม 01) — ตรงทุกเส้น: true</text>
<text class="lblg" x="58" y="444">parserA กับ parserB ใช้กฎลำดับเดียวกันทุกเส้น: true (7 input)</text>
<text class="lblr" x="58" y="466">กับดักของ parserA: ไวยากรณ์ S → (S)S ทำให้ call stack โตตามจำนวนกลุ่ม ไม่ใช่ความซ้อน</text>
<rect class="bandr" x="680" y="332" width="340" height="168" rx="8"/>
<text class="btitle" x="698" y="356">4) กับดักเพดานของ stack จริง</text>
<text class="lbl" x="698" y="378">call stack มีเพดาน — ชนเพดาน = ตายทันที</text>
<text class="monor" x="698" y="400">runtime: goroutine stack exceeds</text>
<text class="monor" x="698" y="418">67108864-byte limit</text>
<text class="monor" x="698" y="436">fatal error: stack overflow</text>
<text class="lblr" x="698" y="462">exit code = 2 · recover() จับไม่ได้</text>
<text class="lbl" x="698" y="482">go/parser เองก็กันไว้: maxNestLev = 1e5</text>
<rect class="bandy" x="40" y="512" width="980" height="176" rx="8"/>
<text class="btitle" x="58" y="536">เชื่อมกับของจริง: ทำไม compiler จริงถึงเขียน parser ด้วยมือ + ใส่ประตูกั้นความลึก</text>
<text class="lbl" x="58" y="562">· Go compiler ใช้ parser เขียนมือ (recursive descent) ไม่ใช่ yacc (เครื่องมือสร้าง parser) — ถอด 'go tool yacc' ออกตั้งแต่ 1.8</text>
<text class="lbl" x="58" y="584">· GCC 4.1 (2006) เปลี่ยนจาก parser ที่ Bison (เครื่องมือสร้าง parser) สร้าง เป็น hand-written recursive descent เพื่อความเร็วและ error ที่ดีขึ้น</text>
<text class="lbl" x="58" y="606">· Bison/goyacc สร้าง DPDA ชนิด LALR ให้ — เร็วและแน่นอน แต่ภาษาที่ต้องเดาจุดกลาง (palindrome = อ่านกลับข้างก็เหมือนเดิม) ทำไม่ได้</text>
<text class="lbl" x="58" y="628">· parser ทุกตัวต้องกัน input ซ้อนลึกผิดปกติ: ใส่ตัวนับความลึกแบบ go/parser ไม่ปล่อยให้ runtime ฆ่าโปรแกรม</text>
<text class="lbl" x="58" y="650">· กติกาเลือกใช้: ไวยากรณ์เล็ก/ต้อง error สวย → เขียนมือ · ไวยากรณ์ใหญ่และเปลี่ยนบ่อย → ใช้ generator แล้ววัดผลจริง</text>
</svg>
