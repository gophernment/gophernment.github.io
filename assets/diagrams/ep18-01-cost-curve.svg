<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img">
<defs>
<style>
  .t  { font-family: sans-serif; font-size: 14px; fill: #12263a; }
  .s  { font-family: sans-serif; font-size: 12px; fill: #3b4a5a; }
  .sm { font-family: sans-serif; font-size: 11px; fill: #4a5b6c; }
  .h  { font-family: sans-serif; font-size: 21px; font-weight: 700; fill: #0b2545; }
  .hd { font-family: sans-serif; font-size: 15px; font-weight: 700; fill: #0b2545; }
  .n  { font-family: sans-serif; font-size: 24px; font-weight: 700; fill: #0b2545; }
  .m  { font-family: monospace; font-size: 12px; fill: #0b2545; }
  .mm { font-family: monospace; font-size: 11px; fill: #3b4a5a; }
  .bad { font-family: sans-serif; font-size: 12px; fill: #7a1f1f; }
  .good{ font-family: sans-serif; font-size: 12px; fill: #14532d; }
</style>
</defs>
<text x="40" y="46" class="h">ต้นทุนการแก้ข้อบกพร่องเพิ่มขึ้นตามขั้นที่เจอ</text>
<text x="40" y="74" class="s">ตั้งต้นที่ 1 = ตอนเจอในขั้น design · ตัวเลขคือตัวคูณ (Relative Cost of Fixing Defects, IBM System Sciences Institute)</text>
<rect x="80" y="317.0" width="130" height="23.0" rx="6" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="145.0" y="305.0" class="hd" text-anchor="middle">×1</text>
<text x="145.0" y="362" class="t" text-anchor="middle">design</text>
<rect x="254" y="281.361275593683" width="130" height="58.63872440631703" rx="6" fill="#fdf7e3" stroke="#c9a227" stroke-width="1.5"/>
<text x="319.0" y="269.361275593683" class="hd" text-anchor="middle">×6.5</text>
<text x="319.0" y="362" class="t" text-anchor="middle">code</text>
<rect x="428" y="250.92138303722942" width="130" height="89.0786169627706" rx="6" fill="#fdeeee" stroke="#c05050" stroke-width="1.5"/>
<text x="493.0" y="238.92138303722942" class="hd" text-anchor="middle">×15</text>
<text x="493.0" y="362" class="t" text-anchor="middle">test</text>
<rect x="602" y="110.0" width="130" height="230.0" rx="6" fill="#fdeeee" stroke="#c05050" stroke-width="1.5"/>
<text x="667.0" y="98.0" class="n" text-anchor="middle">×100</text>
<text x="667.0" y="362" class="t" text-anchor="middle">prod</text>
<line x1="64" y1="340" x2="748" y2="340" stroke="#8aa0b8" stroke-width="1.6"/>
<text x="64" y="386" class="sm">ขั้นที่เจอข้อบกพร่อง (ซ้าย = เจอเร็ว)</text>
<rect x="40" y="398" width="800" height="52" rx="8" fill="#f5f7f9" stroke="#9aa9b8" stroke-width="1.5"/>
<text x="440.0" y="419.0" class="s" text-anchor="middle">ช่วง design → prod = 100 เท่า · ทุก ๆ ขั้นที่เลื่อนไปทางขวา ต้นทุนกระโดด ไม่ใช่ค่อย ๆ เพิ่ม</text>
<text x="440.0" y="439.0" class="sm" text-anchor="middle">แท่งสูงตามรากที่สองของตัวคูณ (√) — ×100 จึงสูงกว่า ×1 ราว 10 เท่า ไม่ใช่ 100 เท่า · ตัวเลขบนหัวแท่งคือค่าจริง</text>
</svg>
