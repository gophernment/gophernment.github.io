<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 486" width="980" height="486" role="img" aria-label="ต้นไม้ AST ของ 3 + 4 * 5 เทียบกับ (3 + 4) * 5">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12.5px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 19px; }
    .sub { fill: #57606a; font-size: 12.5px; }
    .btitle { font-weight: 700; font-size: 12.5px; }
    .lbl { fill: #57606a; font-size: 11.5px; }
    .lbl10 { fill: #8c959f; font-size: 10px; }
    .lblb { fill: #0550ae; font-size: 11.5px; font-weight: 700; }
    .lblg { fill: #1a7f37; font-size: 11.5px; font-weight: 700; }
    .lblr { fill: #cf222e; font-size: 11.5px; font-weight: 700; }
    .mono { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 11.5px; }
    .mono10 { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 10px; fill: #57606a; }
    .monos { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 10px; }
    .monob { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 11.5px; font-weight: 700; fill: #0550ae; }
    .monog { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 11.5px; font-weight: 700; fill: #1a7f37; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .bandw { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .bandc { fill: #eef4ff; stroke: #0969da; stroke-width: 1.4; }
    .bandg { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
    .bandy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
    .arrow { stroke: #57606a; stroke-width: 1.8; fill: none; }
    .arrowb { stroke: #0550ae; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0550ae"/>
    </marker>
  </defs>
  <text x="24.0" y="32.0" class="hdr">ทำไม 3 + 4 * 5 จึงเป็น 3 + (4 × 5): ความลึกของชั้นไวยากรณ์คือ precedence</text>
  <text x="24.0" y="54.0" class="sub">ต้นไม้ทั้งสองนี้เป็นผลรันจริง (out/01) · เลขชุดเดียวกัน ต่างกันแค่วงเล็บ</text>
  <rect x="24.0" y="74.0" width="450.0" height="306.0" rx="8.0" class="bandc"/>
  <text x="40.0" y="102.0" class="monob">3 + 4 * 5</text>
  <text x="40.0" y="130.0" class="mono">S-expression: (+ 3 (* 4 5))</text>
  <text x="58.0" y="164.0" class="mono">BinaryExpr +</text>
  <text x="58.0" y="183.0" class="mono">├─ NumberLit 3</text>
  <text x="58.0" y="202.0" class="mono">└─ BinaryExpr *</text>
  <text x="58.0" y="221.0" class="mono">   ├─ NumberLit 4</text>
  <text x="58.0" y="240.0" class="mono">   └─ NumberLit 5</text>
  <text x="40.0" y="280.0" class="lblb">ค่าเมื่อคำนวณ = 23</text>
  <text x="40.0" y="312.0" class="lblr">ชั้น + อยู่บน (ทำงานทีหลัง) · ชั้น * อยู่ลึก (จับคู่ก่อน)</text>
  <rect x="506.0" y="74.0" width="450.0" height="306.0" rx="8.0" class="bandg"/>
  <text x="522.0" y="102.0" class="monob">(3 + 4) * 5</text>
  <text x="522.0" y="130.0" class="mono">S-expression: (* (+ 3 4) 5)</text>
  <text x="540.0" y="164.0" class="mono">BinaryExpr *</text>
  <text x="540.0" y="183.0" class="mono">├─ BinaryExpr +</text>
  <text x="540.0" y="202.0" class="mono">│  ├─ NumberLit 3</text>
  <text x="540.0" y="221.0" class="mono">│  └─ NumberLit 4</text>
  <text x="540.0" y="240.0" class="mono">└─ NumberLit 5</text>
  <text x="522.0" y="280.0" class="lblb">ค่าเมื่อคำนวณ = 35</text>
  <text x="522.0" y="312.0" class="lblr">วงเล็บ “รีเซ็ต” กลับไปเริ่มที่ expression ชั้นบนสุด</text>
  <rect x="24.0" y="398.0" width="932.0" height="56.0" rx="8.0" class="bandy"/>
  <text x="40.0" y="422.0" class="lbl">กับดัก (out/05): parser ที่สลับชั้นให้ * อยู่บนและ + อยู่ลึก จะอ่าน 3 + 4 * 5 ได้ (* (+ 3 4) 5) = 35 — ต้นไม้ผิด ค่าก็ผิด (parser</text>
  <text x="40.0" y="442.0" class="lbl">ที่ถูกได้ (+ 3 (* 4 5)) = 23)</text>
  <text x="24.0" y="480.0" class="lbl">วาดเองด้วย SVG · ตัวเลขทุกตัวดึงจาก out/ ของ course/code/ep27</text>
</svg>
