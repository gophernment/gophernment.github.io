  <text x="32.0" y="408.0" class="lbl">ภาพที่ 2 — token = (ชนิด, ข้อความจริง, ตำแหน่ง) · โปรแกรม 03 ตรวจตำแหน่งอิสระ 60 token → ไม่ตรง 0 จุด (บันทึก 2026-09-29)</text>
