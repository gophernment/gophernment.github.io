  <text x="412.0" y="232.0" class="lbl">ชนิด → ให้ parser ใช้ตัดสินใจ (switch) · ข้อความจริง → แปลงเป็นค่าจริง</text>
  <text x="412.0" y="250.0" class="lbl">ตำแหน่ง → เอาไว้บอกมนุษย์ว่า “ผิดตรงไหน” — lexer ขาดไม่ได้เลย</text>
