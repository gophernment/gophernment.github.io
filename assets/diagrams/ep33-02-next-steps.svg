  <rect x="711.0" y="534.0" width="205.0" height="32.0" rx="8.0" class="bandw"/>
  <text x="813.5" y="554.0" class="txt" text-anchor="middle">M3</text>
  <rect x="932.0" y="534.0" width="205.0" height="32.0" rx="8.0" class="bandw"/>
