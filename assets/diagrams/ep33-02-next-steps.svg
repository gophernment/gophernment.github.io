<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 636" width="1400" height="636" role="img" aria-label="ทางไปต่อ: 4 เส้นทางสายงาน และทรัพยากรที่อ้างอิงได้จริง">
