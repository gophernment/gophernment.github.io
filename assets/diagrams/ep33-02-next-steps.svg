  <text x="30.0" y="40.0" class="hdr">ทางไปต่อ — 4 เส้นทาง เลือกตามคำถามว่า "ฉันอยากแก้ปัญหาชนิดไหน"</text>
  <text x="30.0" y="64.0" class="sub">ทุกเส้นทางใช้พื้นฐานชุดเดียวกันที่เรียนมา ต่างกันแค่ปลายทาง · Go 1.24.4 · gcc 14.2.0 · Raspberry Pi 5 (aarch64) · รัน 2026-10-08</text>
  <rect x="30.0" y="84.0" width="320.0" height="214.0" rx="10.0" class="bandw"/>
  <text x="44.0" y="112.0" class="ctitle">สาย Backend / Platform</text>
  <text x="44.0" y="138.0" class="txtb">อ่านต่อ:</text>
  <text x="44.0" y="159.0" class="txt">• OSTEP (บท virtualization</text>
  <text x="44.0" y="180.0" class="txt">  + persistence)</text>
  <text x="44.0" y="201.0" class="txt">• CS:APP บท 8–12</text>
  <text x="44.0" y="222.0" class="txt">ฝึก: HTTP server, ฐานข้อมูล</text>
  <text x="44.0" y="243.0" class="txt">      cache, คิวงาน, Docker</text>
  <rect x="40.0" y="264.0" width="300.0" height="26.0" rx="6.0" class="band"/>
  <text x="50.0" y="282.0" class="lb">ภาษา: Go (ต่อยอดได้ทันที)</text>
  <rect x="370.0" y="84.0" width="320.0" height="214.0" rx="10.0" class="bandw"/>
  <text x="384.0" y="112.0" class="ctitle">สาย Systems / OS</text>
  <text x="384.0" y="138.0" class="txtb">อ่านต่อ:</text>
  <text x="384.0" y="159.0" class="txt">• OSTEP ทั้งเล่ม</text>
  <text x="384.0" y="180.0" class="txt">• OSDev wiki (ลงมือจริง)</text>
  <text x="384.0" y="201.0" class="txt">• ศึกษา kernel จริง (Linux)</text>
  <text x="384.0" y="222.0" class="txt">ฝึก: ต่อ kernel M1–M4</text>
  <text x="384.0" y="243.0" class="txt">      driver, scheduler</text>
  <rect x="380.0" y="264.0" width="300.0" height="26.0" rx="6.0" class="band"/>
  <text x="390.0" y="282.0" class="lr">ภาษา: C + assembly</text>
  <rect x="710.0" y="84.0" width="320.0" height="214.0" rx="10.0" class="bandw"/>
  <text x="724.0" y="112.0" class="ctitle">สาย Embedded / IoT</text>
  <text x="724.0" y="138.0" class="txtb">อ่านต่อ:</text>
  <text x="724.0" y="159.0" class="txt">• CS:APP (หน่วยความจำ I/O)</text>
  <text x="724.0" y="180.0" class="txt">• คู่มือชิป ARM/RISC-V</text>
  <text x="724.0" y="201.0" class="txt">• reference manual ของบอร์ด</text>
  <text x="724.0" y="222.0" class="txt">ฝึก: sensor, timer, UART,</text>
  <text x="724.0" y="243.0" class="txt">      interrupt, bare metal</text>
  <rect x="720.0" y="264.0" width="300.0" height="26.0" rx="6.0" class="band"/>
  <text x="730.0" y="282.0" class="lg">ภาษา: C + asm (ARM/RISC-V)</text>
  <rect x="1050.0" y="84.0" width="320.0" height="214.0" rx="10.0" class="bandw"/>
  <text x="1064.0" y="112.0" class="ctitle">สาย Compiler / Language</text>
  <text x="1064.0" y="138.0" class="txtb">อ่านต่อ:</text>
  <text x="1064.0" y="159.0" class="txt">• Crafting Interpreters (ฟรี)</text>
  <text x="1064.0" y="180.0" class="txt">• Writing an Interpreter in Go</text>
  <text x="1064.0" y="201.0" class="txt">• Dragon Book (เชิงทฤษฎี)</text>
  <text x="1064.0" y="222.0" class="txt">ฝึก: type system, GC,</text>
  <text x="1064.0" y="243.0" class="txt">      optimize, JIT (จับคู่ตอน 31)</text>
  <rect x="1060.0" y="264.0" width="300.0" height="26.0" rx="6.0" class="band"/>
  <text x="1070.0" y="282.0" class="lp">ภาษา: Go หรือ C</text>
  <rect x="30.0" y="322.0" width="1340.0" height="152.0" rx="10.0" class="band"/>
