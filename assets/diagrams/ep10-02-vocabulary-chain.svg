<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="#3b4a5a"/>
</marker>
<style>
  .t  { font-family: sans-serif; font-size: 15px; fill: #12263a; }
  .s  { font-family: sans-serif; font-size: 13px; fill: #3b4a5a; }
  .n  { font-family: sans-serif; font-size: 26px; font-weight: 700; fill: #0b2545; }
  .h  { font-family: sans-serif; font-size: 22px; font-weight: 700; fill: #0b2545; }
  .hd { font-family: sans-serif; font-size: 17px; font-weight: 700; fill: #0b2545; }
  .m  { font-family: monospace; font-size: 13px; fill: #0b2545; }
  .bad { font-family: sans-serif; font-size: 13px; fill: #7a1f1f; }
  .good{ font-family: sans-serif; font-size: 13px; fill: #14532d; }
</style>
</defs>
<text x="600" y="44" class="h" text-anchor="middle">ภาษากลางของความปลอดภัย: จาก 'ของที่มีค่า' ถึง 'ตัวเลขที่ใช้ตัดสินใจ'</text>
<text x="600" y="72" class="s" text-anchor="middle">ห้าคำนี้เรียงกันเป็นลูกโซ่ — ถ้าขาดคำใดคำหนึ่ง ความเสี่ยงจะคำนวณไม่ได้</text>
<text x="140.0" y="106" class="s" text-anchor="middle">1</text>
<rect x="40" y="114" width="200" height="150" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<text x="140.0" y="172.0" class="hd" text-anchor="middle">asset</text>
<text x="140.0" y="194.0" class="t" text-anchor="middle">สิ่งที่ต้องปกป้อง</text>
<text x="140.0" y="216.0" class="s" text-anchor="middle">ข้อมูล ระบบ ชื่อเสียง</text>
<line x1="242" y1="189" x2="262" y2="189" stroke="#3b4a5a" stroke-width="2" marker-end="url(#ah)"/>
<text x="365.0" y="106" class="s" text-anchor="middle">2</text>
<rect x="265" y="114" width="200" height="150" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<text x="365.0" y="172.0" class="hd" text-anchor="middle">threat</text>
<text x="365.0" y="194.0" class="t" text-anchor="middle">ใครหรืออะไร</text>
<text x="365.0" y="216.0" class="s" text-anchor="middle">ที่ก่อความเสียหาย</text>
<line x1="467" y1="189" x2="487" y2="189" stroke="#3b4a5a" stroke-width="2" marker-end="url(#ah)"/>
<text x="590.0" y="106" class="s" text-anchor="middle">3</text>
<rect x="490" y="114" width="200" height="150" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<text x="590.0" y="172.0" class="hd" text-anchor="middle">vulnerability</text>
<text x="590.0" y="194.0" class="t" text-anchor="middle">จุดอ่อน</text>
<text x="590.0" y="216.0" class="s" text-anchor="middle">ที่เปิดทางให้ threat</text>
<line x1="692" y1="189" x2="712" y2="189" stroke="#3b4a5a" stroke-width="2" marker-end="url(#ah)"/>
<text x="815.0" y="106" class="s" text-anchor="middle">4</text>
<rect x="715" y="114" width="200" height="150" rx="10" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="815.0" y="172.0" class="hd" text-anchor="middle">impact</text>
<text x="815.0" y="194.0" class="t" text-anchor="middle">ผลกระทบ</text>
<text x="815.0" y="216.0" class="s" text-anchor="middle">ต่อ C / I / A</text>
<line x1="917" y1="189" x2="937" y2="189" stroke="#3b4a5a" stroke-width="2" marker-end="url(#ah)"/>
<text x="1040.0" y="106" class="s" text-anchor="middle">5</text>
<rect x="940" y="114" width="200" height="150" rx="10" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="1040.0" y="172.0" class="hd" text-anchor="middle">risk</text>
<text x="1040.0" y="194.0" class="t" text-anchor="middle">โอกาส x ผลกระทบ</text>
<text x="1040.0" y="216.0" class="s" text-anchor="middle">ตัวเลขที่ใช้ตัดสินใจ</text>
<rect x="40" y="296" width="1120" height="78" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="1.5"/>
<text x="600.0" y="329.0" class="hd" text-anchor="middle">risk = likelihood x impact</text>
<text x="600.0" y="351.0" class="s" text-anchor="middle">NIST SP 800-30 Rev.1 นิยาม risk ว่าเป็น 'function of' ผลกระทบกับโอกาส — การคูณเป็นธรรมเนียมกึ่งปริมาณ ไม่ใช่สูตรตายตัว</text>
<text x="40" y="412" class="hd">ตัวอย่างเดินครบวงจร (ทะเบียนความเสี่ยง R-01 ในเดโม 1)</text>
<rect x="40" y="428" width="200" height="130" rx="10" fill="#ffffff" stroke="#c8d3dd" stroke-width="1.5"/>
<text x="140.0" y="487.0" class="m" text-anchor="middle">customer-data</text>
<text x="140.0" y="509.0" class="s" text-anchor="middle">ข้อมูลลูกค้า 250 แถว</text>
<line x1="242" y1="493" x2="262" y2="493" stroke="#3b4a5a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="265" y="428" width="200" height="130" rx="10" fill="#ffffff" stroke="#c8d3dd" stroke-width="1.5"/>
<text x="365.0" y="487.0" class="m" text-anchor="middle">external-attacker</text>
<text x="365.0" y="509.0" class="s" text-anchor="middle">คนนอกที่ได้ credential</text>
<line x1="467" y1="493" x2="487" y2="493" stroke="#3b4a5a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="490" y="428" width="200" height="130" rx="10" fill="#ffffff" stroke="#c8d3dd" stroke-width="1.5"/>
<text x="590.0" y="487.0" class="m" text-anchor="middle">shared-db-account</text>
<text x="590.0" y="509.0" class="s" text-anchor="middle">DB user เดียวใช้ร่วมกัน</text>
<line x1="692" y1="493" x2="712" y2="493" stroke="#3b4a5a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="715" y="428" width="200" height="130" rx="10" fill="#ffffff" stroke="#c8d3dd" stroke-width="1.5"/>
<text x="815.0" y="487.0" class="m" text-anchor="middle">Confidentiality (C)</text>
<text x="815.0" y="509.0" class="s" text-anchor="middle">ข้อมูล 249 แถวหลุด</text>
<line x1="917" y1="493" x2="937" y2="493" stroke="#3b4a5a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="940" y="428" width="200" height="130" rx="10" fill="#fdeeee" stroke="#c05050" stroke-width="1.5"/>
<text x="1040.0" y="487.0" class="m" text-anchor="middle">L4 x I5 = 20</text>
<text x="1040.0" y="509.0" class="s" text-anchor="middle">ระดับ critical</text>
<rect x="40" y="590" width="540" height="96" rx="10" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="310.0" y="632.0" class="good" text-anchor="middle">ถ้าไม่มีช่องโหว่ → threat ทำอะไรไม่ได้</text>
<text x="310.0" y="654.0" class="s" text-anchor="middle">ช่องโหว่คือสภาพที่เราคุมได้ · threat เราคุมได้เพียงบางส่วน</text>
<rect x="620" y="590" width="540" height="96" rx="10" fill="#fdeeee" stroke="#c05050" stroke-width="1.5"/>
<text x="890.0" y="632.0" class="bad" text-anchor="middle">ถ้าไม่มี asset ที่มีค่า → impact = 0 → risk = 0</text>
<text x="890.0" y="654.0" class="s" text-anchor="middle">ถาม 'อะไรมีค่าที่สุด' ก่อน 'อะไรน่ากลัวที่สุด'</text>
<text x="600" y="736" class="s" text-anchor="middle">ศัพท์เดียวกันใช้ทั้งตอนประเมินความเสี่ยง ตอนเขียน threat model และตอนคุยกับผู้บริหาร</text>
</svg>
