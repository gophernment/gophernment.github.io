<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 660" width="1070" height="660" role="img" aria-label="encapsulation: ข้อมูล 75 ไบต์ถูกห่อด้วยหัว TCP, IPv4, Ethernet และ FCS จนเป็น frame 133 ไบต์">
<style>
text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12.5px; fill: #1a1a1a; }
.hdr { font-weight: 700; font-size: 17.5px; }
.sub { fill: #57606a; font-size: 12.5px; }
.ptitle { font-weight: 700; font-size: 14px; }
.txt { font-size: 12.5px; }
.lbl { fill: #57606a; font-size: 11px; }
.small { fill: #57606a; font-size: 10.5px; }
.big { font-weight: 700; font-size: 20px; fill: #0550ae; }
.mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 11.5px; fill: #0a3069; }
.monos { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 10.5px; fill: #57606a; }
.boxg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
.boxb { fill: #eef4ff; stroke: #0969da; stroke-width: 1.5; }
.boxy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
.boxi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
.boxr { fill: #fdeff0; stroke: #b62324; stroke-width: 1.4; }
.bgw { fill: #ffffff; stroke: none; }
.wire { stroke: #8c959f; stroke-width: 1.8; fill: none; }
.wire2 { stroke: #b6bfc8; stroke-width: 1.2; fill: none; stroke-dasharray: 5 5; }
.head { fill: #8c959f; }
.rule { stroke: #d0d7de; stroke-width: 1.2; }
.c1 { stroke: #0969da; stroke-width: 2.6; fill: none; }
.ctl { stroke: #8250df; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
.onbar { fill: #ffffff; font-size: 10.5px; }
.onbar2 { fill: #1a1a1a; font-size: 10.5px; }
.bar1 { fill: #0969da; }
.bar2 { fill: #bf8700; }
.bar3 { fill: #b62324; }
.bar4 { fill: #1a7f37; }
.bar0 { fill: #d0d7de; }
.seg-o { fill: #fdeff0; stroke: #b62324; stroke-width: 1.2; }
.seg-v { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.2; }
.seg-i { fill: #eef4ff; stroke: #0969da; stroke-width: 1.2; }
.seg-g { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.2; }
</style>
<rect x="0" y="0" width="1070" height="660" fill="#ffffff"/>
<text class="hdr" x="40" y="40" text-anchor="start">Encapsulation: ห่อลงทีละชั้น แล้วแกะขึ้นทีละชั้น</text>
<text class="sub" x="40" y="66" text-anchor="start">ตัวเลขในวงเล็บคือขนาดหัวของชั้นนั้น (ไบต์) — ภาพนี้วาดตามสัดส่วนจริงจากผลรัน</text>
<text class="ptitle" x="40" y="126" text-anchor="start">application</text>
<text class="small" x="40" y="146" text-anchor="start">data · 75 B</text>
<rect class="seg-g" x="200" y="104" width="450.0" height="52" rx="4"/>
<text class="onbar2" x="425" y="135" text-anchor="middle">data 75</text>
<text class="mono" x="660" y="135" text-anchor="start">= 75</text>
<text class="ptitle" x="40" y="234" text-anchor="start">transport</text>
<text class="small" x="40" y="254" text-anchor="start">segment · 95 B</text>
<line class="wire" x1="186" y1="178" x2="186" y2="206"/>
<polygon class="head" points="186.0,206.0 182.5,197.7 189.5,197.7"/>
<rect class="seg-i" x="200" y="212" width="120.0" height="52" rx="4"/>
<text class="onbar2" x="260" y="243" text-anchor="middle">TCP 20</text>
<rect class="seg-g" x="320.0" y="212" width="450.0" height="52" rx="4"/>
<text class="onbar2" x="545" y="243" text-anchor="middle">data 75</text>
<text class="mono" x="780" y="243" text-anchor="start">= 95</text>
<text class="ptitle" x="40" y="342" text-anchor="start">internet</text>
<text class="small" x="40" y="362" text-anchor="start">packet · 115 B</text>
<line class="wire" x1="186" y1="286" x2="186" y2="314"/>
<polygon class="head" points="186.0,314.0 182.5,305.7 189.5,305.7"/>
<rect class="seg-i" x="200" y="320" width="120.0" height="52" rx="4"/>
<text class="onbar2" x="260" y="351" text-anchor="middle">IP 20</text>
<rect class="seg-i" x="320.0" y="320" width="120.0" height="52" rx="4"/>
<text class="onbar2" x="380" y="351" text-anchor="middle">TCP 20</text>
<rect class="seg-g" x="440.0" y="320" width="450.0" height="52" rx="4"/>
<text class="onbar2" x="665" y="351" text-anchor="middle">data 75</text>
<text class="mono" x="900" y="351" text-anchor="start">= 115</text>
<text class="ptitle" x="40" y="450" text-anchor="start">link</text>
<text class="small" x="40" y="470" text-anchor="start">frame · 133 B</text>
<line class="wire" x1="186" y1="394" x2="186" y2="422"/>
<polygon class="head" points="186.0,422.0 182.5,413.7 189.5,413.7"/>
<rect class="seg-v" x="200" y="428" width="84.0" height="52" rx="4"/>
<text class="onbar2" x="242" y="459" text-anchor="middle">Eth 14</text>
<rect class="seg-i" x="284.0" y="428" width="120.0" height="52" rx="4"/>
<text class="onbar2" x="344" y="459" text-anchor="middle">IP 20</text>
<rect class="seg-i" x="404.0" y="428" width="120.0" height="52" rx="4"/>
<text class="onbar2" x="464" y="459" text-anchor="middle">TCP 20</text>
<rect class="seg-g" x="524.0" y="428" width="450.0" height="52" rx="4"/>
<text class="onbar2" x="749" y="459" text-anchor="middle">data 75</text>
<rect class="seg-o" x="974.0" y="428" width="24.0" height="52" rx="4"/>
<text class="small" x="986" y="420" text-anchor="middle">FCS 4</text>
<text class="mono" x="1008" y="459" text-anchor="start">= 133</text>
<rect class="boxb" x="40" y="520" width="990" height="116" rx="8"/>
<text class="ptitle" x="60" y="550" text-anchor="start">ยอดรวม: ข้อมูล 75 ไบต์ → frame 133 ไบต์ · overhead 58 ไบต์ (รวม FCS 4 ไบต์ที่เป็น trailer)</text>
<text class="txt" x="60" y="576" text-anchor="start">สัดส่วนที่หัวกินไป = 58 ÷ 133 = 436 ส่วนในพัน · ชั้น link เป็นชั้นเดียวที่มี trailer (FCS 4 ไบต์)</text>
<text class="small" x="60" y="600" text-anchor="start">ฝั่งรับทำย้อนกลับ: แต่ละชั้นตรวจหัวของตัวเอง (FCS → IP checksum → TCP checksum) แล้วส่งเฉพาะส่วนที่เหลือขึ้นไป</text>
<text class="small" x="60" y="620" text-anchor="start">ขนาดที่ส่งขึ้นไปหดลงทีละ 20 ไบต์: 115 → 95 → 75 (ดู 03_decap.txt) — ข้อมูลไม่เคยถูกแก้ มีแต่หัวที่ถูกถอด</text>
</svg>
