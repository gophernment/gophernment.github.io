<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" width="1080" height="700" role="img" aria-label="TTL เดินทางผ่านสาม hop: probe ที่ TTL 1 และ 2 ตายที่ router แต่ละตัวจนได้ ICMP time exceeded ส่วน probe ที่ TTL 3 ถึงปลายทางและได้ echo reply">
<style>
text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12px; fill: #1a1a1a; }
.hdr { font-weight: 700; font-size: 17.5px; }
.sub { fill: #57606a; font-size: 12.5px; }
.ptitle { font-weight: 700; font-size: 14px; }
.txt { font-size: 12px; }
.lbl { fill: #57606a; font-size: 11px; }
.small { fill: #57606a; font-size: 10.5px; }
.big { font-weight: 700; font-size: 20px; fill: #0550ae; }
.mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 11px; fill: #0a3069; }
.monos { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 10px; fill: #57606a; }
.boxg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
.boxb { fill: #eef4ff; stroke: #0969da; stroke-width: 1.5; }
.boxy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
.boxi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
.boxr { fill: #fdeff0; stroke: #b62324; stroke-width: 1.4; }
.shade { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.0; stroke-dasharray: 5 4; }
.cell { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.1; }
.win { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
.wire { stroke: #8c959f; stroke-width: 1.8; fill: none; }
.wire2 { stroke: #b6bfc8; stroke-width: 1.2; fill: none; stroke-dasharray: 5 5; }
.s1 { stroke: #0969da; stroke-width: 2.2; fill: none; }
.s2 { stroke: #1a7f37; stroke-width: 2.2; fill: none; }
.s3 { stroke: #bf8700; stroke-width: 2.2; fill: none; }
.s4 { stroke: #8250df; stroke-width: 2.2; fill: none; }
.lifeline { stroke: #b6bfc8; stroke-width: 1.4; stroke-dasharray: 6 6; }
.head { fill: #8c959f; }
.head1 { fill: #0969da; }
.head2 { fill: #1a7f37; }
.head3 { fill: #bf8700; }
.head4 { fill: #8250df; }
.rule { stroke: #d0d7de; stroke-width: 1.2; }
</style>
<rect x="0" y="0" width="1080" height="700" fill="#ffffff"/>
<text class="hdr" x="40" y="40" text-anchor="start">TTL คือไม้บรรทัด: ยิงซ้ำโดยเพิ่มทีละหนึ่ง จนได้ echo reply</text>
<text class="sub" x="40" y="64" text-anchor="start">ทุก router ลด TTL ลงหนึ่ง · ถึง 0 = ทิ้ง packet แล้วส่ง ICMP type 11 กลับมา</text>
<rect class="boxg" x="30.0" y="92.0" width="190.0" height="88.0" rx="10"/>
<text class="ptitle" x="125" y="122" text-anchor="middle">client</text>
<text class="monos" x="125" y="146" text-anchor="middle">10.17.1.2/24</text>
<rect class="boxb" x="300.0" y="92.0" width="170.0" height="88.0" rx="10"/>
<text class="ptitle" x="385" y="122" text-anchor="middle">r1</text>
<text class="monos" x="385" y="146" text-anchor="middle">10.17.1.1 · 10.17.2.1</text>
<rect class="boxb" x="560.0" y="92.0" width="170.0" height="88.0" rx="10"/>
<text class="ptitle" x="645" y="122" text-anchor="middle">r2</text>
<text class="monos" x="645" y="146" text-anchor="middle">10.17.2.2 · 10.17.3.1</text>
<rect class="boxi" x="820.0" y="92.0" width="190.0" height="88.0" rx="10"/>
<text class="ptitle" x="915" y="122" text-anchor="middle">server</text>
<text class="monos" x="915" y="146" text-anchor="middle">10.17.3.2/24</text>
<line class="wire" x1="220.0" y1="136.0" x2="300.0" y2="136.0"/>
<text class="monos" x="260" y="128" text-anchor="middle">10.17.1.0/24</text>
<line class="wire" x1="470.0" y1="136.0" x2="560.0" y2="136.0"/>
<text class="monos" x="515" y="128" text-anchor="middle">10.17.2.0/24</text>
<line class="wire" x1="730.0" y1="136.0" x2="820.0" y2="136.0"/>
<text class="monos" x="775" y="128" text-anchor="middle">10.17.3.0/24</text>
<text class="ptitle" x="30" y="230" text-anchor="start">probe 1</text>
<text class="mono" x="100" y="230" text-anchor="start">TTL = 1</text>
<line class="s1" x1="151.0" y1="256.0" x2="359.0" y2="256.0"/>
<polygon class="head1" points="359.0,256.0 351.6,259.1 351.6,252.9"/>
<text class="small" x="157" y="250" text-anchor="start">echo request</text>
<line class="wire2" x1="359.0" y1="280.0" x2="151.0" y2="280.0"/>
<polygon class="head" points="151.0,280.0 159.0,275.0 159.0,285.0"/>
<text class="small" x="157" y="274" text-anchor="start">คำตอบกลับ</text>
<text class="txt" x="30" y="308" text-anchor="start">ได้ type 11 (time exceeded) จาก 10.17.1.1 — ตายที่ router ตัวนี้</text>
<line class="rule" x1="30.0" y1="320.0" x2="1050.0" y2="320.0"/>
<text class="ptitle" x="30" y="356" text-anchor="start">probe 2</text>
<text class="mono" x="100" y="356" text-anchor="start">TTL = 2</text>
<line class="s1" x1="151.0" y1="382.0" x2="619.0" y2="382.0"/>
<polygon class="head1" points="619.0,382.0 611.6,385.1 611.6,378.9"/>
<text class="small" x="157" y="376" text-anchor="start">echo request</text>
<line class="wire2" x1="619.0" y1="406.0" x2="151.0" y2="406.0"/>
<polygon class="head" points="151.0,406.0 159.0,401.0 159.0,411.0"/>
<text class="small" x="157" y="400" text-anchor="start">คำตอบกลับ</text>
<text class="txt" x="30" y="434" text-anchor="start">ได้ type 11 (time exceeded) จาก 10.17.2.2 — ตายที่ router ตัวนี้</text>
<line class="rule" x1="30.0" y1="446.0" x2="1050.0" y2="446.0"/>
<text class="ptitle" x="30" y="482" text-anchor="start">probe 3</text>
<text class="mono" x="100" y="482" text-anchor="start">TTL = 3</text>
<line class="s1" x1="151.0" y1="508.0" x2="889.0" y2="508.0"/>
<polygon class="head1" points="889.0,508.0 881.6,511.1 881.6,504.9"/>
<text class="small" x="157" y="502" text-anchor="start">echo request</text>
<line class="s2" x1="889.0" y1="532.0" x2="151.0" y2="532.0"/>
<polygon class="head2" points="151.0,532.0 158.4,528.9 158.4,535.1"/>
<text class="small" x="157" y="526" text-anchor="start">คำตอบกลับ</text>
<text class="txt" x="30" y="560" text-anchor="start">ได้ type 0 (echo reply) จาก 10.17.3.2 — ถึงปลายทาง</text>
<rect class="boxg" x="30.0" y="590.0" width="1020.0" height="92.0" rx="8"/>
<text class="ptitle" x="46" y="616" text-anchor="start">traceroute = ลูปเดียวที่เพิ่ม TTL ทีละหนึ่ง</text>
<text class="txt" x="46" y="640" text-anchor="start">ยิงซ้ำจนกว่าคำตอบจะเปลี่ยนจาก type 11 เป็น type 0 · บทนี้ได้ 3 hop และหยุดที่ 10.17.3.2</text>
<text class="small" x="46" y="664" text-anchor="start">hop ที่ไม่ตอบจะเห็นเป็น * — ไม่ได้แปลว่าเครื่องนั้นปิด แต่แปลว่าไม่มีคำตอบภายในเวลาที่รอ</text>
</svg>
