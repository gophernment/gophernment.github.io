<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 616" width="1010" height="616" role="img" aria-label="ตารางสเปกของ token">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12.5px; fill: #1a1a1a; }
