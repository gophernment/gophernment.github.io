<text class="ptitle" x="40" y="468" text-anchor="start">สี่วิธีรับมือ กับเส้นทางเดียวกัน</text>
<rect class="boxy" x="40" y="484" width="243" height="108" rx="8"/>
<text class="mono" x="52" y="508" text-anchor="start">hard-0db</text>
<text class="small" x="52" y="532" text-anchor="start">handover 10 ครั้ง</text>
<text class="small" x="52" y="552" text-anchor="start">packet หาย 60</text>
<text class="small" x="52" y="572" text-anchor="start">ค้างใน buffer 0 tick</text>
<rect class="boxy" x="298" y="484" width="243" height="108" rx="8"/>
<text class="mono" x="310" y="508" text-anchor="start">hard-3db</text>
<text class="small" x="310" y="532" text-anchor="start">handover 2 ครั้ง</text>
<text class="small" x="310" y="552" text-anchor="start">packet หาย 20</text>
<text class="small" x="310" y="572" text-anchor="start">ค้างใน buffer 0 tick</text>
<rect class="boxb" x="556" y="484" width="243" height="108" rx="8"/>
<text class="mono" x="568" y="508" text-anchor="start">soft-3db</text>
<text class="small" x="568" y="532" text-anchor="start">handover 2 ครั้ง</text>
<text class="small" x="568" y="552" text-anchor="start">packet หาย 0</text>
<text class="small" x="568" y="572" text-anchor="start">ค้างใน buffer 0 tick</text>
<rect class="boxi" x="814" y="484" width="243" height="108" rx="8"/>
<text class="mono" x="826" y="508" text-anchor="start">lte-3db</text>
<text class="small" x="826" y="532" text-anchor="start">handover 2 ครั้ง</text>
<text class="small" x="826" y="552" text-anchor="start">packet หาย 0</text>
<text class="small" x="826" y="572" text-anchor="start">ค้างใน buffer 2 tick</text>
<rect class="boxg" x="40" y="610" width="1020" height="176" rx="8"/>
<text class="ptitle" x="60" y="636" text-anchor="start">ระยะกันสั่น (hysteresis) คือหัวใจ: 3 dB = กำลังสองเท่า = ระยะ² ต่างกันสองเท่า</text>
<text class="txt" x="60" y="662" text-anchor="start">ไม่มีระยะกันสั่น: สัญญาณสั่นนิดเดียวก็สลับเซลล์ไปกลับ เซลล์เดิมกลายเป็นเพื่อนบ้านทันที</text>
<text class="txt" x="60" y="681" text-anchor="start">hard handoff ของ GSM: ตัดของเดิมก่อนแล้วต่อของใหม่ — มีช่วงที่ไม่มีใครให้บริการ</text>
<text class="txt" x="60" y="701" text-anchor="start">soft handoff ของ CDMA: ต่อของใหม่ก่อนแล้วตัดของเดิม — ไม่ขาด แต่กินสองช่องสัญญาณพร้อมกัน</text>
<text class="txt" x="60" y="720" text-anchor="start">packet handoff ของ LTE: ขาดทางวิทยุเท่าเดิม แต่ packet ถูกเก็บไว้ที่ปลายทางเดิมแล้วส่งต่อ</text>
<text class="txt" x="60" y="740" text-anchor="start">สัญญาณที่วัดได้สั่นขึ้นลงเพราะ fading — สิ่งที่ลาดลงสม่ำเสมอคือระยะทาง ไม่ใช่กำลังสัญญาณ</text>
</svg>
