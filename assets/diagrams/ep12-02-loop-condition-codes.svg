<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-label="การวนลูปด้วย condition code และ BR">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12.5px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 17px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .sub { fill: #57606a; font-size: 12px; }
    .tiny { font-size: 11px; fill: #57606a; }
    .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; fill: #0969da; }
    .monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #1a1a1a; }
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .panelb { fill: #f6f8fa; stroke: #0969da; stroke-width: 1.4; }
    .block { fill: #eef4ff; stroke: #0969da; stroke-width: 1.6; }
    .ctrl { fill: #fff4e5; stroke: #bc4c00; stroke-width: 1.6; }
    .ff { fill: #f3f0ff; stroke: #6639ba; stroke-width: 1.6; }
    .done { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.6; }
    .flag { fill: #ffffff; stroke: #6639ba; stroke-width: 1.4; }
    .wire { stroke: #57606a; stroke-width: 1.6; fill: none; }
    .back { stroke: #bc4c00; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    .lbl { font-size: 12px; fill: #57606a; }
    .bold { font-weight: 700; fill: #1a1a1a; }
  </style>
  <defs>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="a-ctrl" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
  </defs>
  <text class="hdr" x="480" y="32" text-anchor="middle">ลูป = วนทำซ้ำ + ตัดสินใจวนต่อหรือหยุด (ผ่าน condition code)</text>

  <rect class="block" x="60" y="56" width="620" height="76" rx="10"/>
  <text class="bold" x="76" y="84" text-anchor="start">0. เตรียมตัวก่อนวน</text>
  <text class="tiny" x="76" y="104" text-anchor="start">R2 = 0 (ผลรวม) · R1 = 1 (ตัวเลขปัจจุบัน) · R3 = 5 (ขีดจำกัด)</text>
  <text class="tiny" x="76" y="120" text-anchor="start">ขั้นนี้ทำแค่ครั้งเดียว ตอนเริ่มโปรแกรม</text>

  <line class="wire" x1="370" y1="132" x2="370" y2="160" marker-end="url(#a-grey)"/>

  <rect class="ctrl" x="60" y="160" width="620" height="76" rx="10"/>
  <text class="bold" x="76" y="188" text-anchor="start">1. ตัวลูป (loop body) — งานที่ต้องทำซ้ำ</text>
  <text class="tiny" x="76" y="208" text-anchor="start">R2 = R2 + R1 (บวกตัวเลขปัจจุบันเข้ากองผลรวม) · R1 = R1 + 1 (ขยับไปตัวถัดไป)</text>
  <text class="tiny" x="76" y="224" text-anchor="start">ทำกี่รอบก็ได้ ขึ้นกับเงื่อนไขด้านล่าง</text>

  <line class="wire" x1="370" y1="236" x2="370" y2="264" marker-end="url(#a-grey)"/>

  <rect class="ff" x="60" y="264" width="620" height="76" rx="10"/>
  <text class="bold" x="76" y="292" text-anchor="start">2. เปรียบเทียบ — แล้วตั้ง flag N / Z / P</text>
  <text class="tiny" x="76" y="312" text-anchor="start">คำนวณ R1 − R3 (LC-3 ไม่มีคำสั่งลบ จึงใช้ NOT + ADD สร้างค่า -R3 ก่อน)</text>
  <text class="tiny" x="76" y="328" text-anchor="start">ผลลัพธ์เป็นลบ → ตั้ง N · เป็นศูนย์ → ตั้ง Z · เป็นบวก → ตั้ง P (ตั้งทีละตัวตามผล)</text>

  <line class="wire" x1="370" y1="340" x2="370" y2="368" marker-end="url(#a-grey)"/>

  <rect class="ctrl" x="60" y="368" width="620" height="90" rx="10"/>
  <text class="bold" x="76" y="396" text-anchor="start">3. ตัดสินใจด้วยคำสั่ง BR (branch = กระโดดแบบมีเงื่อนไข)</text>
  <text class="tiny" x="76" y="416" text-anchor="start">BRnz LOOP แปลว่า: ถ้า flag N หรือ Z ถูกตั้ง → กระโดดกลับไปทำตัวลูปอีก</text>
  <text class="tiny" x="76" y="432" text-anchor="start">ถ้า flag P ถูกตั้ง (ตัวเลขเลยขีดจำกัดแล้ว) → ไม่กระโดด ไหลลงไปบรรทัดถัดไปแทน</text>

  <polyline class="back" points="60,420 40,420 40,198 60,198" marker-end="url(#a-ctrl)"/>
  <text class="tiny" x="30" y="300" text-anchor="start" transform="rotate(-90 30 300)">วนกลับไปทำตัวลูป (ถ้า N หรือ Z)</text>

  <line class="wire" x1="370" y1="458" x2="370" y2="486" marker-end="url(#a-grey)"/>

  <rect class="done" x="60" y="486" width="620" height="64" rx="10"/>
  <text class="bold" x="76" y="514" text-anchor="start">4. หลุดออกจากลูป → HALT (จบโปรแกรม)</text>
  <text class="tiny" x="76" y="534" text-anchor="start">ตอนนี้ R2 = 15 (= 1 + 2 + 3 + 4 + 5) นี่คือผลลัพธ์ของโปรแกรม</text>

  <rect class="panelb" x="700" y="56" width="240" height="494" rx="10"/>
  <text class="ptitle" x="716" y="84" text-anchor="start">condition code (N/Z/P)</text>
  <text class="sub" x="716" y="104" text-anchor="start">คือ flag 3 ตัว 1 บิต ใน CPU</text>
  <rect class="flag" x="716" y="120" width="208" height="42" rx="6"/>
  <text class="monob" x="724" y="146" text-anchor="start">N = negative (ลบ)</text>
  <rect class="flag" x="716" y="170" width="208" height="42" rx="6"/>
  <text class="monob" x="724" y="196" text-anchor="start">Z = zero (ศูนย์)</text>
  <rect class="flag" x="716" y="220" width="208" height="42" rx="6"/>
  <text class="monob" x="724" y="246" text-anchor="start">P = positive (บวก)</text>
  <text class="sub" x="716" y="288" text-anchor="start">ทุกครั้งที่เขียนค่าลง register</text>
  <text class="sub" x="716" y="306" text-anchor="start">(เช่น ADD / AND / NOT / LD)</text>
  <text class="sub" x="716" y="324" text-anchor="start">CPU จะตั้ง flag ตามผลที่ได้</text>
  <text class="sub" x="716" y="348" text-anchor="start">คำสั่ง BR อ่าน flag เหล่านี้</text>
  <text class="sub" x="716" y="366" text-anchor="start">เพื่อตัดสินใจว่า</text>
  <text class="sub" x="716" y="384" text-anchor="start">จะกระโดดหรือไม่</text>
  <text class="sub" x="716" y="408" text-anchor="start">BRn = กระโดดถ้า N</text>
  <text class="sub" x="716" y="426" text-anchor="start">BRz = กระโดดถ้า Z</text>
  <text class="sub" x="716" y="444" text-anchor="start">BRp = กระโดดถ้า P</text>
  <text class="sub" x="716" y="462" text-anchor="start">BRnz = กระโดดถ้า N หรือ Z</text>
  <text class="sub" x="716" y="480" text-anchor="start">BRnzp = กระโดดเสมอ</text>
  <text class="sub" x="716" y="504" text-anchor="start">(= jump แบบไม่มีเงื่อนไข)</text>
  <text class="sub" x="716" y="520" text-anchor="start">แนวคิดนี้คือตัวเดียวกับ</text>
  <text class="sub" x="716" y="538" text-anchor="start">if / for ใน Go (ตอน 04)</text>
</svg>
