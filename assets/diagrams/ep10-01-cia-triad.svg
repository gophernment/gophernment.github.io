<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="#3b4a5a"/>
</marker>
<style>
  .t  { font-family: sans-serif; font-size: 15px; fill: #12263a; }
  .s  { font-family: sans-serif; font-size: 13px; fill: #3b4a5a; }
  .n  { font-family: sans-serif; font-size: 26px; font-weight: 700; fill: #0b2545; }
  .h  { font-family: sans-serif; font-size: 22px; font-weight: 700; fill: #0b2545; }
  .hd { font-family: sans-serif; font-size: 17px; font-weight: 700; fill: #0b2545; }
  .m  { font-family: monospace; font-size: 13px; fill: #0b2545; }
  .bad { font-family: sans-serif; font-size: 13px; fill: #7a1f1f; }
  .good{ font-family: sans-serif; font-size: 13px; fill: #14532d; }
</style>
</defs>
<text x="600" y="44" class="h" text-anchor="middle">CIA triad: สามเสาที่ทุกคำถามความปลอดภัยต้องตอบให้ครบ</text>
<text x="600" y="72" class="s" text-anchor="middle">เสาหนึ่งล้มไม่ได้แปลว่าอีกสองเสายังดี — เหตุการณ์เดียวกระทบได้ทั้งสามเสา</text>
<rect x="40" y="100" width="360" height="430" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<text x="220.0" y="146" class="hd" text-anchor="middle">Confidentiality</text>
<text x="220.0" y="174" class="t" text-anchor="middle">ความลับ</text>
<line x1="64" y1="192" x2="376" y2="192" stroke="#4a7bb5" stroke-width="1.0"/>
<text x="220.0" y="226" class="s" text-anchor="middle">ข้อมูลถูกเปิดเผยเฉพาะคนที่ได้สิทธิ์</text>
<text x="220.0" y="282" class="s" text-anchor="middle">ถ้าล้มเหลว: ข้อมูลหลุดออกนอกระบบ</text>
<text x="220.0" y="338" class="s" text-anchor="middle">ตัวอย่าง: export ไม่ตรวจสิทธิ์</text>
<text x="220.0" y="394" class="s" text-anchor="middle">มาตรการ: least privilege, encryption</text>
<text x="220.0" y="450" class="s" text-anchor="middle">วัด: จำนวน record ที่หลุดต่อเหตุ</text>
<rect x="420" y="100" width="360" height="430" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="1.5"/>
<text x="600.0" y="146" class="hd" text-anchor="middle">Integrity</text>
<text x="600.0" y="174" class="t" text-anchor="middle">ความถูกต้อง (ไม่ใช่ความจริง)</text>
<line x1="444" y1="192" x2="756" y2="192" stroke="#c9a227" stroke-width="1.0"/>
<text x="600.0" y="226" class="s" text-anchor="middle">ข้อมูลไม่ถูกแก้โดยไม่มีสิทธิ์</text>
<text x="600.0" y="282" class="s" text-anchor="middle">ถ้าล้มเหลว: ถูกแก้โดยไม่มีสิทธิ์</text>
<text x="600.0" y="338" class="s" text-anchor="middle">ตัวอย่าง: โอนเงินที่ไม่ตรวจ invariant</text>
<text x="600.0" y="394" class="s" text-anchor="middle">มาตรการ: hash, signature, approval step</text>
<text x="600.0" y="450" class="s" text-anchor="middle">วัด: ผลต่างของยอดรวมก่อน/หลัง</text>
<rect x="800" y="100" width="360" height="430" rx="10" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="980.0" y="146" class="hd" text-anchor="middle">Availability</text>
<text x="980.0" y="174" class="t" text-anchor="middle">ความพร้อมใช้</text>
<line x1="824" y1="192" x2="1136" y2="192" stroke="#3f9c63" stroke-width="1.0"/>
<text x="980.0" y="226" class="s" text-anchor="middle">ผู้มีสิทธิ์เข้าถึงได้เมื่อต้องการ</text>
<text x="980.0" y="282" class="s" text-anchor="middle">ถ้าล้มเหลว: ผู้ใช้ทำงานไม่ได้</text>
<text x="980.0" y="338" class="s" text-anchor="middle">ตัวอย่าง: flood แย่งช่องให้บริการ</text>
<text x="980.0" y="394" class="s" text-anchor="middle">มาตรการ: redundancy, rate limit, backup</text>
<text x="980.0" y="450" class="s" text-anchor="middle">วัด: สัดส่วนคำขอที่สำเร็จ</text>
<rect x="40" y="556" width="1120" height="96" rx="10" fill="#f5f7f9" stroke="#9aa9b8" stroke-width="1.5"/>
<text x="600.0" y="587.0" class="hd" text-anchor="middle">สามเสาขัดกันเอง — นี่คือเหตุที่ 'เพิ่มความปลอดภัย' ไม่ใช่การบวกทีละด้าน</text>
<text x="600.0" y="609.0" class="s" text-anchor="middle">เข้ารหัสเข้มขึ้น = กุญแจหายแล้วกู้ยากขึ้น (C ดีขึ้น แต่ A เสี่ยงขึ้น) · backup มากขึ้น = สำเนาข้อมูลลับมากขึ้น</text>
<text x="600.0" y="631.0" class="s" text-anchor="middle">log ละเอียดขึ้น = ตรวจสอบได้ดีขึ้น แต่เก็บข้อมูลส่วนบุคคลมากขึ้น · จึงต้องเลือกด้วยตัวเลข ไม่ใช่ด้วยความรู้สึก</text>
<rect x="40" y="672" width="1120" height="74" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<text x="600.0" y="714.0" class="t" text-anchor="middle">คำถามตรวจสามเสา: ข้อมูลนี้ใครเห็นได้บ้าง · ใครแก้ได้บ้าง · ถ้าระบบล่ม ระบบกลับมาเมื่อไรและกู้ข้อมูลได้ถึงจุดไหน</text>
<text x="600" y="782" class="s" text-anchor="middle">ทุกคำถามในงานความปลอดภัย จะลงเอยที่หนึ่งในสามเสานี้ — หรือทั้งสามพร้อมกัน</text>
</svg>
