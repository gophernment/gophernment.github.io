<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" width="940" height="640" role="img" aria-label="ลำดับ DORA: DHCPDISCOVER, DHCPOFFER, DHCPREQUEST, DHCPACK ระหว่าง client กับ server บน loopback ทุกฉบับใช้ xid เดียวกัน">
<style>
text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12.5px; fill: #1a1a1a; }
.hdr { font-weight: 700; font-size: 17.5px; }
.sub { fill: #57606a; font-size: 12.5px; }
.ptitle { font-weight: 700; font-size: 14px; }
.txt { font-size: 12.5px; }
.lbl { fill: #57606a; font-size: 11px; }
.small { fill: #57606a; font-size: 10.5px; }
.big { font-weight: 700; font-size: 19px; fill: #0550ae; }
.mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 11.5px; fill: #0a3069; }
.monom { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; fill: #0a3069; }
.monos { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 10.5px; fill: #57606a; }
.onbar { font-size: 12px; font-weight: 600; }
.onbar2 { font-size: 10.5px; fill: #57606a; }
.boxg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
.boxb { fill: #eef4ff; stroke: #0969da; stroke-width: 1.5; }
.boxy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
.boxi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
.boxr { fill: #fdeff0; stroke: #b62324; stroke-width: 1.4; }
.cell { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.1; }
.cellA { fill: #dbeafe; stroke: #0969da; stroke-width: 1.2; }
.cellG { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.2; }
.cellR { fill: #fdeff0; stroke: #b62324; stroke-width: 1.6; }
.cellY { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.2; }
.wire { stroke: #8c959f; stroke-width: 1.8; fill: none; }
.wire2 { stroke: #b6bfc8; stroke-width: 1.2; fill: none; stroke-dasharray: 5 5; }
.head { fill: #8c959f; }
.rule { stroke: #d0d7de; stroke-width: 1.2; }
</style>
<rect x="0" y="0" width="940" height="640" fill="#ffffff"/>
<text class="hdr" x="40" y="34" text-anchor="start">DORA: สี่ข้อความ ได้ address หนึ่งใบ — ทุกฉบับใช้ xid 0xa76b3368</text>
<text class="sub" x="40" y="58" text-anchor="start">จาก out/04_dora.txt · client 127.0.0.1:6768 · server 127.0.0.1:6767 (พอร์ตจริงคือ 68/67)</text>
<rect class="boxb" x="120.0" y="82.0" width="280.0" height="46.0" rx="8"/>
<text class="mono" x="260" y="102" text-anchor="middle">client 127.0.0.1:6768</text>
<text class="small" x="260" y="120" text-anchor="middle">ยังไม่มี IP · ciaddr 0.0.0.0</text>
<rect class="boxi" x="540.0" y="82.0" width="280.0" height="46.0" rx="8"/>
<text class="mono" x="680" y="102" text-anchor="middle">server 127.0.0.1:6767</text>
<text class="small" x="680" y="120" text-anchor="middle">pool 192.0.2.96/28</text>
<line class="wire2" x1="260.0" y1="132.0" x2="260.0" y2="508.0"/>
<line class="wire2" x1="680.0" y1="132.0" x2="680.0" y2="508.0"/>
<rect class="cell" x="40.0" y="160.0" width="100.0" height="30.0" rx="5"/>
<text class="monos" x="90" y="180" text-anchor="middle">INIT</text>
<rect class="cell" x="40.0" y="230.0" width="100.0" height="30.0" rx="5"/>
<text class="monos" x="90" y="250" text-anchor="middle">SELECTING</text>
<rect class="cell" x="40.0" y="300.0" width="100.0" height="30.0" rx="5"/>
<text class="monos" x="90" y="320" text-anchor="middle">REQUESTING</text>
<rect class="cellG" x="40.0" y="384.0" width="100.0" height="30.0" rx="5"/>
<text class="monos" x="90" y="404" text-anchor="middle">BOUND</text>
<line class="wire" x1="266.0" y1="176.0" x2="672.0" y2="176.0"/>
<polygon class="head" points="672.0,176.0 663.7,179.5 663.7,172.5"/>
<text class="onbar" x="470" y="166" text-anchor="middle">DHCPDISCOVER</text>
<text class="small" x="470" y="192" text-anchor="middle">broadcast · ยาว 274 ไบต์ · option 55 ขอ mask/gw/dns</text>
<line class="wire" x1="674.0" y1="246.0" x2="268.0" y2="246.0"/>
<polygon class="head" points="268.0,246.0 276.3,242.5 276.3,249.5"/>
<text class="onbar" x="470" y="236" text-anchor="middle">DHCPOFFER</text>
<text class="small" x="470" y="262" text-anchor="middle">yiaddr 192.0.2.97 · option 54 = server id</text>
<line class="wire" x1="266.0" y1="316.0" x2="672.0" y2="316.0"/>
<polygon class="head" points="672.0,316.0 663.7,319.5 663.7,312.5"/>
<text class="onbar" x="470" y="306" text-anchor="middle">DHCPREQUEST</text>
<text class="small" x="470" y="332" text-anchor="middle">option 50 = 192.0.2.97 · option 54 = เลือกเจ้านี้</text>
<line class="wire" x1="674.0" y1="400.0" x2="268.0" y2="400.0"/>
<polygon class="head" points="268.0,400.0 276.3,396.5 276.3,403.5"/>
<text class="onbar" x="470" y="390" text-anchor="middle">DHCPACK</text>
<text class="small" x="470" y="416" text-anchor="middle">lease 3600 · t1 1800 · t2 3150</text>
<rect class="boxy" x="40.0" y="430.0" width="860.0" height="48.0" rx="8"/>
<text class="txt" x="58" y="452" text-anchor="start">ทำไม broadcast ทั้ง DISCOVER และ REQUEST: client ยังไม่มี IP จึงส่งหาใครก็ได้ในวง</text>
<text class="small" x="58" y="470" text-anchor="start">REQUEST ที่ broadcast ทำให้ server อีกตัวรู้ว่าไม่ต้องเก็บที่อยู่ที่มันเสนอไว้ให้เราแล้ว</text>
<rect class="boxi" x="40.0" y="490.0" width="420.0" height="132.0" rx="8"/>
<text class="ptitle" x="58" y="514" text-anchor="start">ก่อนใช้ address: ACD probe</text>
<text class="txt" x="58" y="538" text-anchor="start">probe 192.0.2.97 ด้วย ARP 3 ครั้ง</text>
<text class="small" x="58" y="560" text-anchor="start">ห่างกัน 1–2 วินาที แล้วรออีก 2 วินาที</text>
<text class="small" x="58" y="582" text-anchor="start">ในเดโมตารางว่าง → acd_in_use 0</text>
<text class="small" x="58" y="604" text-anchor="start">loopback ไม่มี ARP จึงใช้ตารางแทน</text>
<rect class="boxg" x="480.0" y="490.0" width="420.0" height="132.0" rx="8"/>
<text class="ptitle" x="498" y="514" text-anchor="start">ตัวเลขที่ตรวจได้ในบทนี้</text>
<text class="mono" x="498" y="538" text-anchor="start">wire §2 270 ไบต์ · DORA 274 ไบต์</text>
<text class="mono" x="498" y="560" text-anchor="start">lease 3600 → t1 1800 · t2 3150</text>
<text class="mono" x="498" y="582" text-anchor="start">pool_size 14 · pool_free 13</text>
<text class="small" x="498" y="604" text-anchor="start">ต่างกันเพราะ DORA ใส่ option 57 (+4 ไบต์)</text>
</svg>
