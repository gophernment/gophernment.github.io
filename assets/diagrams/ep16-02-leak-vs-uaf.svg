    .wirer { stroke: #cf222e; stroke-width: 2.2; fill: none; }
    .wire2 { stroke: #57606a; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
    <marker id="arr-n" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

<text class="hdr" x="500" y="34" text-anchor="middle">2 ความผิดพลาดเรื่อง "คืนหน่วยความจำ" ที่อันตรายคนละแบบ</text>
<text class="sub" x="500" y="58" text-anchor="middle">ตัวเลขทั้งหมดมาจากผลรันจริง leak_demo.c / use_after_free.c · ไม่มีข้อความ error ให้เห็นทั้งสองกรณี</text>
<rect class="warnbox" x="40" y="80" width="450" height="470" rx="10"/>
<text class="ptitle" x="58" y="108">1) memory leak — จองแล้วลืมคืน</text>
<text class="mono" x="58" y="134">leak_demo.c: จอง 8 ก้อน ก้อนละ 1 เมกะไบต์</text>
<text class="lbl" x="58" y="162">VmRSS เริ่มต้น</text>
<text class="mono" x="472" y="162" text-anchor="end">1,200 kB</text>
<text class="lbl" x="58" y="189">ก้อนที่ 1 (ไม่คืน)</text>
<text class="mono" x="472" y="189" text-anchor="end">2,432 kB  (+1232)</text>
<text class="lbl" x="58" y="216">ก้อนที่ 2 (ไม่คืน)</text>
<text class="mono" x="472" y="216" text-anchor="end">3,472 kB  (+1040)</text>
<text class="lbl" x="58" y="243">ก้อนที่ 3 (ไม่คืน)</text>
<text class="mono" x="472" y="243" text-anchor="end">4,512 kB  (+1040)</text>
<text class="lbl" x="58" y="270">ก้อนที่ 4 (ไม่คืน)</text>
<text class="mono" x="472" y="270" text-anchor="end">5,552 kB  (+1040)</text>
<text class="lbl" x="58" y="297">ก้อนที่ 5 (ไม่คืน)</text>
<text class="mono" x="472" y="297" text-anchor="end">6,592 kB  (+1040)</text>
<text class="lbl" x="58" y="324">ก้อนที่ 6 (ไม่คืน)</text>
<text class="mono" x="472" y="324" text-anchor="end">7,632 kB  (+1040)</text>
<text class="lbl" x="58" y="351">ก้อนที่ 7 (ไม่คืน)</text>
<text class="mono" x="472" y="351" text-anchor="end">8,672 kB  (+1040)</text>
<text class="lbl" x="58" y="378">ก้อนที่ 8 (ไม่คืน)</text>
<text class="mono" x="472" y="378" text-anchor="end">9,712 kB  (+1040)</text>
<text class="lbl" x="58" y="405">รวมโตขึ้น</text>
<text class="monob" x="472" y="405" text-anchor="end">8,512 kB</text>
<text class="lbl" x="58" y="436">เทียบกับรอบ 2 ที่ free ทุกก้อน: VmRSS ทรงตัวที่ 10,736 kB</text>
<text class="lbl" x="58" y="462">แต่โปรแกรมยังทำงานปกติ — ไม่มี error ให้เห็นเลย</text>
<rect class="warnbox" x="510" y="80" width="450" height="470" rx="10"/>
<text class="ptitle" x="528" y="108">2) use-after-free — คืนแล้วใช้ต่อ</text>
<text class="mono" x="528" y="134">use_after_free.c: 32 ไบต์ ก้อนเดียว</text>
<text class="lbl" x="528" y="162">malloc(32) ใส 'A' ทั้งก้อน</text>
<text class="mono" x="942" y="162" text-anchor="end">41 41 41 41 41 41 41 41</text>
<text class="lbl" x="528" y="189">free(p) แล้ว</text>
<text class="mono" x="942" y="189" text-anchor="end">— p ยังชี้ที่เดิม —</text>
<text class="lbl" x="528" y="216">อ่าน *p (ผิดกฎ!)</text>
<text class="mono" x="942" y="216" text-anchor="end">b1 b6 5c 55 05 00 00 00</text>
<text class="lbl" x="528" y="243">malloc(32) อีกครั้ง</text>
<text class="mono" x="942" y="243" text-anchor="end">ได้ที่เดิมเป๊ะ</text>
<text class="lbl" x="528" y="270">เขียนของใหม่ผ่านตัวชี้ใหม่</text>
<text class="mono" x="942" y="270" text-anchor="end">42 42 42 42 42 42 42 42</text>
<text class="lbl" x="528" y="297">อ่านผ่าน p (ตัวชี้เก่า)</text>
<text class="mono" x="942" y="297" text-anchor="end">42 42 42 42 42 42 42 42</text>
<text class="lbl" x="528" y="330">ไบต์แรก ๆ ถูกเขียนทับด้วยข้อมูลของตัวจัดหน่วยความจำ</text>
<text class="lbl" x="528" y="354">ทันทีที่เราคืน — ข้อมูลของเราไม่เหลือแล้วโดยไม่รู้ตัว</text>
<text class="lbl" x="528" y="378">และตัวชี้เก่าเห็นข้อมูลของ "เจ้าของใหม่" แทน</text>
<rect class="cbox" x="40" y="566" width="920" height="132" rx="10"/>
<text class="ptitle" x="56" y="590">ตาเปล่าจับไม่ได้ — ต้องใช้เครื่องมือตรวจ:</text>
<text class="mono" x="56" y="614">Valgrind 3.24.0: "8,388,608 bytes in 8 blocks are definitely lost" (leak)</text>
<text class="mono" x="56" y="638">         และ "Invalid read of size 1 ... block of size 32 free'd" (use-after-free)</text>
<text class="mono" x="56" y="662">AddressSanitizer: "heap-use-after-free" · "Direct leak of 8388608 byte(s) in 8 object(s)"</text>
<text class="mono" x="56" y="686">ทั้งสองตัวชี้บรรทัดที่ผิดได้ตรง ๆ (ดู run_all.sh ใน course/code/ep16/)</text>
</svg>
