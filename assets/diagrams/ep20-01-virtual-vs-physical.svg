<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 800" width="1040" height="800" role="img" aria-label="โปรเซสเห็นที่อยู่ปลอมของตัวเอง แล้ว MMU แปลเป็น frame จริงบน RAM ก้อนเดียว">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 18px; }
    .sub { fill: #57606a; font-size: 12.5px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .btitle { font-weight: 700; font-size: 12.5px; }
    .lbl { fill: #57606a; font-size: 11.5px; }
    .lbl2 { fill: #1a1a1a; font-size: 11.5px; }
    .mono { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 12px; }
    .monob { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #0550ae; }
    .monor { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #cf222e; }
    .monog { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #1a7f37; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .bandc { fill: #eef4ff; stroke: #0969da; stroke-width: 1.4; }
    .bandg { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
    .bandr { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.4; }
    .bandy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
    .cell { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.1; }
    .cellc { fill: #ffffff; stroke: #0969da; stroke-width: 1.3; }
    .arrow { stroke: #57606a; stroke-width: 2; fill: none; }
    .arrowb { stroke: #0550ae; stroke-width: 2.4; fill: none; }
    .arrowr { stroke: #cf222e; stroke-width: 2.2; fill: none; }
    .arrowg { stroke: #1a7f37; stroke-width: 2.2; fill: none; }
    .dash { stroke: #8c959f; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="a-n" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="a-b" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0550ae"/></marker>
    <marker id="a-r" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
    <marker id="a-g" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
  </defs>
  <rect x="0" y="0" width="1040" height="800" fill="#ffffff"/>

<text class="hdr" x="520" y="36" text-anchor="middle">ภาพลวงตา: โปรเซสเห็นที่อยู่ครบทั้งก้อน แต่ RAM มีก้อนเดียว</text>
<text class="sub" x="520" y="60" text-anchor="middle">ตัวเลขจากการรัน 01_addr_layout.c / 04_fork_illusion.c บน Raspberry Pi 5 (Linux 6.18.39 aarch64 · page = 16384 ไบต์)</text>
<rect class="bandg" x="40" y="84" width="320" height="330" rx="10"/>
<text class="ptitle" x="60" y="112">1) โปรเซสเห็น (virtual address)</text>
<text class="lbl" x="60" y="144">code   main()</text>
<text class="monob" x="216" y="144">0x55559fff0a54</text>
<text class="lbl" x="60" y="172">.rodata</text>
<text class="monob" x="216" y="172">0x5555a000fdd0</text>
<text class="lbl" x="60" y="200">heap    (malloc)</text>
<text class="monob" x="216" y="200">0x5555a39f42a0</text>
<text class="lbl" x="60" y="228">stack</text>
<text class="monob" x="216" y="228">0x7ffffcf5824c</text>
<text class="lbl" x="60" y="248">สองช่วงห่างกันคนละโลก:</text>
<text class="lbl" x="60" y="268">0x5555... code/heap · 0x7fff... stack</text>
<text class="lbl" x="60" y="288">ที่อยู่เหล่านี้ไม่ใช่ตำแหน่งบน RAM จริง</text>
<text class="lbl" x="60" y="308">เปลี่ยนทุกครั้งที่รัน (ASLR)</text>
<text class="lbl" x="60" y="392">47 บิต = พื้นที่ให้เห็น 128 TiB</text>
<rect class="bandc" x="380" y="84" width="300" height="330" rx="10"/>
<text class="ptitle" x="400" y="112">2) MMU เป็นคนแปล</text>
<rect class="cell" x="400" y="130" width="260" height="96" rx="8"/>
<text class="btitle" x="412" y="152">page table ของโปรเซสนี้</text>
<text class="mono" x="412" y="172">VPN 0x55559... -&gt; frame 12</text>
<text class="mono" x="412" y="190">VPN 0x5555a... -&gt; frame 137</text>
<text class="mono" x="412" y="208">VPN 0x7ffff... -&gt; frame 9081</text>
<text class="lbl" x="400" y="252">ตารางเก็บ VPN (ย่อ) -> เลข frame</text>
<text class="lbl" x="400" y="272">ไม่ใช่ก้อนข้อมูลจริงบน RAM</text>
<text class="mono" x="400" y="300">VA = VPN x 16384 + offset</text>
<text class="lbl" x="400" y="320">offset 13:0 ผ่านตรง ๆ ไม่ต้องแปล</text>
<text class="lbl" x="400" y="352">ทุกโปรเซสมีตารางของตัวเอง</text>
<text class="lbl" x="400" y="372">จึงเห็นที่อยู่ "ของตัวเอง" ทั้งก้อน</text>
<text class="lbl" x="400" y="400">flags ใน entry: present·RW·USER·dirty</text>
<rect class="bandy" x="700" y="84" width="300" height="330" rx="10"/>
<text class="ptitle" x="720" y="112">3) RAM จริง (physical)</text>
<text class="lbl" x="720" y="134">frame = ช่องจริงขนาด 16384 ไบต์</text>
<rect class="cell" x="720" y="156" width="260" height="34" rx="6"/>
<text class="monob" x="732" y="178">frame 12</text>
<text class="lbl2" x="852" y="178">โปรเซส A · code</text>
<rect class="cell" x="720" y="202" width="260" height="34" rx="6"/>
<text class="monob" x="732" y="224">frame 137</text>
<text class="lbl2" x="852" y="224">โปรเซส A · heap</text>
<rect class="cell" x="720" y="248" width="260" height="34" rx="6"/>
<text class="monob" x="732" y="270">frame 9081</text>
<text class="lbl2" x="852" y="270">โปรเซส B · stack</text>
<rect class="cell" x="720" y="294" width="260" height="34" rx="6"/>
<text class="monob" x="732" y="316">frame 9082</text>
<text class="lbl2" x="852" y="316">โปรเซส B · heap</text>
<text class="lbl" x="720" y="360">RAM 8 GiB → ใช้ได้จริง 515,992 frames</text>
<text class="lbl" x="720" y="380">ทุกโปรเซสแย่งกันใช้ช่องเหล่านี้</text>
<text class="lbl" x="720" y="400">คนละช่องกัน = เขียนไม่ทับกัน</text>
<line class="arrowb" x1="362" y1="240" x2="378" y2="240" marker-end="url(#a-b)"/>
<line class="arrowg" x1="682" y1="240" x2="698" y2="240" marker-end="url(#a-g)"/>
<rect class="bandr" x="40" y="436" width="960" height="180" rx="10"/>
<text class="ptitle" x="60" y="466">พิสูจน์ว่ามันเป็นภาพลวงตาจริง — 04_fork_illusion.c (ต่อยอดตอนที่ 18)</text>
<text class="lbl2" x="60" y="494">พ่อ (pid 392246)</text>
<text class="mono" x="290" y="494">&amp;g_shared = 0x5555ee2c0090</text>
<text class="lbl2" x="620" y="494">ค่า = 100</text>
<text class="lbl2" x="60" y="524">ลูก (pid 392248)</text>
<text class="mono" x="290" y="524">&amp;g_shared = 0x5555ee2c0090</text>
<text class="lbl2" x="620" y="524">ค่า = -1</text>
<text class="lbl2" x="60" y="554">ลูกเขียนข้อมูล</text>
<text class="mono" x="290" y="554">minflt 13 -&gt; 22</text>
<text class="lbl2" x="620" y="554">copy-on-write เกิดจริง</text>
<text class="lbl" x="60" y="598">ที่อยู่เดียวกันจริง ๆ แต่พอลูกเขียน ระบบต้องให้คนละ frame — ไม่มีทางเป็นแบบนี้ได้ถ้าไม่มีชั้นแปลที่อยู่</text>
<rect class="band" x="40" y="634" width="960" height="130" rx="10"/>
<text class="ptitle" x="60" y="662">ชั้นนี้ให้ 4 อย่างที่ขาดไม่ได้</text>
<rect class="cell" x="60" y="678" width="232" height="70" rx="8"/>
<text class="btitle" x="70" y="698">แยกจากกัน (isolation)</text>
<text class="lbl" x="70" y="718">แต่ละโปรเซสมีตารางของตัวเอง</text>
<text class="lbl" x="70" y="736">แตะ VA ของคนอื่นไม่ได้</text>
<rect class="cell" x="302" y="678" width="232" height="70" rx="8"/>
<text class="btitle" x="312" y="698">ป้องกัน (protection)</text>
<text class="lbl" x="312" y="718">สิทธิ์ต่อหน้าอยู่ใน entry</text>
<text class="lbl" x="312" y="736">mprotect แก้ได้ทีละหน้า</text>
<rect class="cell" x="544" y="678" width="232" height="70" rx="8"/>
<text class="btitle" x="554" y="698">จองเกินจริงได้ (overcommit)</text>
<text class="lbl" x="554" y="718">vm.overcommit_memory = 0</text>
<text class="lbl" x="554" y="736">จอง VA 1 GiB แต่ RSS 1.4 MiB</text>
<rect class="cell" x="786" y="678" width="232" height="70" rx="8"/>
<text class="btitle" x="796" y="698">แชร์ของได้ (shared lib)</text>
<text class="lbl" x="796" y="718">libc ตัวเดียวหลายโปรเซสใช้</text>
<text class="lbl" x="796" y="736">ไฟล์ที่ mmap อ่านชุดเดียว</text>
</svg>