<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 452" width="1080" height="452" role="img" aria-label="ไทม์ไลน์สี่รุ่นของ HTTP: 1.0 (1996), 1.1 (1999/2022), 2 (2015/2022), 3 (2022) พร้อม RFC และสิ่งที่แต่ละรุ่นแก้">
<style>
text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12px; fill: #1a1a1a; }
.hdr { font-weight: 700; font-size: 17.5px; }
.sub { fill: #57606a; font-size: 12.5px; }
.ptitle { font-weight: 700; font-size: 14px; }
.txt { font-size: 12px; }
.lbl { fill: #57606a; font-size: 11px; }
.small { fill: #57606a; font-size: 10.5px; }
.big { font-weight: 700; font-size: 20px; fill: #0550ae; }
.mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 11px; fill: #0a3069; }
.monos { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 10px; fill: #57606a; }
.boxg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
.boxb { fill: #eef4ff; stroke: #0969da; stroke-width: 1.5; }
.boxy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
.boxi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
.boxr { fill: #fdeff0; stroke: #b62324; stroke-width: 1.4; }
.cell { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.1; }
.wire { stroke: #8c959f; stroke-width: 1.8; fill: none; }
.wire2 { stroke: #b6bfc8; stroke-width: 1.2; fill: none; stroke-dasharray: 5 5; }
.s1 { stroke: #0969da; stroke-width: 2.2; fill: none; }
.s2 { stroke: #1a7f37; stroke-width: 2.2; fill: none; }
.s3 { stroke: #bf8700; stroke-width: 2.2; fill: none; }
.s4 { stroke: #8250df; stroke-width: 2.2; fill: none; }
.head { fill: #8c959f; }
.head1 { fill: #0969da; }
.head2 { fill: #1a7f37; }
.head3 { fill: #bf8700; }
.head4 { fill: #8250df; }
.rule { stroke: #d0d7de; stroke-width: 1.2; }
</style>
<rect x="0" y="0" width="1080" height="452" fill="#ffffff"/>
<text class="hdr" x="40" y="42" text-anchor="start">สี่รุ่น สามสิบปี: แต่ละรุ่นแก้คอขวดที่รุ่นก่อนทิ้งไว้</text>
<text class="sub" x="40" y="66" text-anchor="start">รูปแบบ: RFC ที่ใช้อยู่ · ปี (เดิม ฉบับเก่า · ปี) — เลขในวงเล็บคือประวัติ ไม่ใช่ค่าที่วัด</text>
<rect class="boxy" x="40.0" y="96.0" width="240.0" height="210.0" rx="10"/>
<text class="ptitle" x="160" y="128" text-anchor="middle">HTTP/1.0</text>
<text class="monos" x="160" y="150" text-anchor="middle">RFC 1945 · 1996</text>
<line class="rule" x1="56.0" y1="162.0" x2="264.0" y2="162.0"/>
<text class="txt" x="56" y="188" text-anchor="start">หนึ่งคำขอ = หนึ่ง connection</text>
<text class="txt" x="56" y="214" text-anchor="start">ไม่มี Host ในสเปก</text>
<text class="txt" x="56" y="240" text-anchor="start">หนึ่ง IP จึงรองรับหนึ่งเว็บ</text>
<text class="small" x="56" y="290" text-anchor="start">คอขวด: TCP handshake ทุกคำขอ</text>
<rect class="boxb" x="293.0" y="96.0" width="240.0" height="210.0" rx="10"/>
<text class="ptitle" x="413" y="128" text-anchor="middle">HTTP/1.1</text>
<text class="monos" x="413" y="150" text-anchor="middle">RFC 9112 · 2022 (เดิม 2616 · 1999)</text>
<line class="rule" x1="309.0" y1="162.0" x2="517.0" y2="162.0"/>
<text class="txt" x="309" y="188" text-anchor="start">keep-alive: ใช้สายเดิมซ้ำ</text>
<text class="txt" x="309" y="214" text-anchor="start">Host บังคับ → virtual host</text>
<text class="txt" x="309" y="240" text-anchor="start">chunked + pipelining</text>
<text class="small" x="309" y="290" text-anchor="start">คอขวด: ทำได้ทีละคำขอ (HOL)</text>
<line class="wire" x1="281.0" y1="201.0" x2="292.0" y2="201.0"/>
<polygon class="head" points="292.0,201.0 284.6,204.1 284.6,197.9"/>
<rect class="boxi" x="546.0" y="96.0" width="240.0" height="210.0" rx="10"/>
<text class="ptitle" x="666" y="128" text-anchor="middle">HTTP/2</text>
<text class="monos" x="666" y="150" text-anchor="middle">RFC 9113 · 2022 (เดิม 7540 · 2015)</text>
<line class="rule" x1="562.0" y1="162.0" x2="770.0" y2="162.0"/>
<text class="txt" x="562" y="188" text-anchor="start">binary frame + stream id</text>
<text class="txt" x="562" y="214" text-anchor="start">multiplexing บนสายเดียว</text>
<text class="txt" x="562" y="240" text-anchor="start">HPACK บีบ header</text>
<text class="small" x="562" y="290" text-anchor="start">คอขวด: TCP ยังกั้นทุก stream</text>
<line class="wire" x1="534.0" y1="201.0" x2="545.0" y2="201.0"/>
<polygon class="head" points="545.0,201.0 537.6,204.1 537.6,197.9"/>
<rect class="boxr" x="799.0" y="96.0" width="240.0" height="210.0" rx="10"/>
<text class="ptitle" x="919" y="128" text-anchor="middle">HTTP/3</text>
<text class="monos" x="919" y="150" text-anchor="middle">RFC 9114 · 2022</text>
<line class="rule" x1="815.0" y1="162.0" x2="1023.0" y2="162.0"/>
<text class="txt" x="815" y="188" text-anchor="start">บน QUIC (RFC 9000 · 2021)</text>
<text class="txt" x="815" y="214" text-anchor="start">UDP + TLS 1.3 ในตัว</text>
<text class="txt" x="815" y="240" text-anchor="start">stream อิสระต่อกัน</text>
<text class="small" x="815" y="290" text-anchor="start">คอขวดที่เหลือ: UDP ถูกบล็อกบ้าง</text>
<line class="wire" x1="787.0" y1="201.0" x2="798.0" y2="201.0"/>
<polygon class="head" points="798.0,201.0 790.6,204.1 790.6,197.9"/>
<text class="lbl" x="40" y="348" text-anchor="start">อ่านจากบนลงล่างของแต่ละใบ: ชื่อรุ่น → เอกสารอ้างอิง → สามสิ่งที่รุ่นนั้นเพิ่ม → สิ่งที่ยังค้างอยู่</text>
<text class="lbl" x="40" y="374" text-anchor="start">ภาพนี้ไม่มีตัวเลขจากการวัด — จำนวน connection และ stream ที่วัดได้อยู่ในภาพถัดไปและในผลรันของบท</text>
</svg>
