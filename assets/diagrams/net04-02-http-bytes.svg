<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-label="การแลกเปลี่ยน HTTP/1.1 จริงบน loopback: request หนึ่งก้อนและ response ที่มี Content-Length กำหนดจุดจบ">
<style>
text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12.5px; fill: #1a1a1a; }
.hdr { font-weight: 700; font-size: 17.5px; }
.sub { fill: #57606a; font-size: 12.5px; }
.ptitle { font-weight: 700; font-size: 14px; }
.txt { font-size: 12.5px; }
.lbl { fill: #57606a; font-size: 11px; }
.small { fill: #57606a; font-size: 10.5px; }
.big { font-weight: 700; font-size: 22px; fill: #0550ae; }
.mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 11.5px; fill: #0a3069; }
.monos { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 10.5px; fill: #57606a; }
.boxg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
.boxb { fill: #eef4ff; stroke: #0969da; stroke-width: 1.6; }
.boxy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
.boxi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
.wire { stroke: #8c959f; stroke-width: 1.8; fill: none; }
.head { fill: #8c959f; }
.rule { stroke: #d0d7de; stroke-width: 1.2; }
.bar1 { fill: #a8c4e8; }
.bar2 { fill: #0969da; }
.bar3 { fill: #bf8700; }
</style>
<rect x="0" y="0" width="1100" height="600" fill="#ffffff"/>
<text class="hdr" x="550" y="42" text-anchor="middle">HTTP คือข้อความล้วนบน TCP — สิ่งที่เราส่งจริงในเดโม</text>
<text class="sub" x="550" y="70" text-anchor="middle">ไม่มี field แบบ binary: บรรทัดคำสั่ง บรรทัดหัวข้อ บรรทัดว่าง แล้วจึงเป็น body</text>
<rect class="boxb" x="40" y="92" width="470" height="236" rx="8"/>
<text class="ptitle" x="56" y="118" text-anchor="start">request — client เขียนเองทีละบรรทัด</text>
<text class="mono" x="56" y="148" text-anchor="start">GET /hello HTTP/1.1</text>
<text class="mono" x="56" y="166" text-anchor="start">Host: loopback</text>
<text class="mono" x="56" y="184" text-anchor="start">Connection: keep-alive</text>
<text class="small" x="56" y="222" text-anchor="start">บรรทัดว่าง</text>
<text class="txt" x="56" y="250" text-anchor="start">= จบหัวข้อ ไม่มี body ใน GET</text>
<text class="small" x="56" y="282" text-anchor="start">ทั้งก้อน 63 ไบต์ (นับ CRLF ด้วย)</text>
<text class="small" x="56" y="306" text-anchor="start">ไม่มีเลข version ของแอป ไม่มี cookie</text>
<rect class="boxi" x="590" y="92" width="470" height="236" rx="8"/>
<text class="ptitle" x="606" y="118" text-anchor="start">response — server เขียนกลับมาแบบเดียวกัน</text>
<text class="mono" x="606" y="148" text-anchor="start">HTTP/1.1 200 OK</text>
<text class="mono" x="606" y="166" text-anchor="start">Content-Type: text/html; charset=utf-8</text>
<text class="mono" x="606" y="184" text-anchor="start">Content-Length: 764</text>
<text class="mono" x="606" y="201" text-anchor="start">Connection: keep-alive</text>
<text class="small" x="606" y="250" text-anchor="start">บรรทัดว่าง → ต่อด้วย body</text>
<text class="small" x="606" y="282" text-anchor="start">หัวข้อ 104 ไบต์ + body 764 ไบต์</text>
<text class="small" x="606" y="306" text-anchor="start">รวม 868 ไบต์ — ปลายทางอ่าน body ตาม Content-Length</text>
<line class="wire" x1="516" y1="190" x2="584" y2="190"/>
<polygon class="head" points="584.0,190.0 575.7,193.5 575.7,186.5"/>
<line class="wire" x1="584" y1="240" x2="516" y2="240"/>
<polygon class="head" points="516.0,240.0 524.3,236.5 524.3,243.5"/>
<text class="lbl" x="550" y="178" text-anchor="middle">ส่ง</text>
<text class="lbl" x="550" y="266" text-anchor="middle">ตอบ</text>
<rect class="boxy" x="40" y="348" width="1020" height="84" rx="8"/>
<text class="ptitle" x="60" y="374" text-anchor="start">ทำไมต้องมี Content-Length: TCP เป็น byte stream ไม่มีขอบเขตของข้อความ</text>
<text class="txt" x="60" y="400" text-anchor="start">ถ้าไม่บอกความยาว ปลายทางไม่รู้ว่า response จบตรงไหน — ต้องรอจน connection ปิด (นั่นคือสิ่งที่ HTTP/1.0 ทำ)</text>
<text class="small" x="60" y="422" text-anchor="start">ตัวเลขบนภาพนี้ทั้งหมดอ่านจาก out/01_http.txt · body sha256 คงที่ทุกครั้งที่รัน</text>
<text class="ptitle" x="550" y="470" text-anchor="middle">สอง request บน connection เดียว — ไม่ต้อง handshake ใหม่</text>
<rect class="boxg" x="300" y="488" width="500" height="50" rx="8"/>
<text class="mono" x="550" y="519" text-anchor="middle">GET /hello → 200 · แล้ว GET /bye → 200 · ปิดด้วย Connection: close</text>
<text class="small" x="550" y="566" text-anchor="middle">keep-alive ของ HTTP/1.1 ทำงานได้ก็เพราะทุก response บอกความยาวของตัวเอง</text>
</svg>
