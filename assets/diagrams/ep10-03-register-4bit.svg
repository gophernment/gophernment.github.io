<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" role="img" aria-label="register 4 บิตที่สร้างจาก D flip-flop 4 ตัวใช้ clock ตัวเดียวกัน พร้อมตารางแสดงการโหลดค่า">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12.5px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 17px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .sub { fill: #57606a; font-size: 12px; }
    .tiny { font-size: 11px; fill: #57606a; }
    .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; fill: #0969da; }
    .monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #1a1a1a; }
    .val { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
    .th { font-weight: 700; font-size: 12px; fill: #57606a; }
    .lbl { font-size: 12px; fill: #57606a; }
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .panelb { fill: #f6f8fa; stroke: #0969da; stroke-width: 1.4; }
    .block { fill: #eef4ff; stroke: #0969da; stroke-width: 1.6; }
    .ff { fill: #f3f0ff; stroke: #6639ba; stroke-width: 1.6; }
    .wire { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .clkw { stroke: #1a7f37; stroke-width: 2; fill: none; }
    .row { fill: #ffffff; stroke: #eaeef2; stroke-width: 1; }
    .rowg { fill: #f6f8fa; stroke: #eaeef2; stroke-width: 1; }
    .hrow { fill: #eaeef2; }
    .thline { stroke: #d0d7de; stroke-width: 1.2; }
    .dot { fill: #57606a; }
  </style>

  <text class="hdr" x="480" y="32" text-anchor="middle">register: เอา D flip-flop มาเรียงกัน แล้วแชร์นาฬิกาตัวเดียว</text>

  <!-- ================= Panel A : 4-bit register ================= -->
  <rect class="panel" x="20" y="52" width="920" height="418" rx="10"/>
  <text class="ptitle" x="40" y="80">A. register 4 บิต = D flip-flop 4 ตัวที่ใช้ clock ตัวเดียวกัน</text>
  <text class="sub" x="40" y="102">register = "ที่พักข้อมูลชั่วคราว" ในซีพียู — ค่าที่อยู่ในนี้จะค้างจนกว่าจะมีขอบ clock ใหม่</text>

  <text class="tiny" x="480" y="126" text-anchor="middle">ข้อมูลเข้า 4 บิต: D3 D2 D1 D0 (มาจากส่วนอื่นของซีพียู)</text>

  <text class="monob" x="245" y="146" text-anchor="middle">D3</text>
  <text class="monob" x="405" y="146" text-anchor="middle">D2</text>
  <text class="monob" x="565" y="146" text-anchor="middle">D1</text>
  <text class="monob" x="725" y="146" text-anchor="middle">D0</text>
  <line class="wire" x1="245" y1="158" x2="245" y2="180"/>
  <line class="wire" x1="405" y1="158" x2="405" y2="180"/>
  <line class="wire" x1="565" y1="158" x2="565" y2="180"/>
  <line class="wire" x1="725" y1="158" x2="725" y2="180"/>
  <circle class="dot" cx="245" cy="158" r="3"/>
  <circle class="dot" cx="405" cy="158" r="3"/>
  <circle class="dot" cx="565" cy="158" r="3"/>
  <circle class="dot" cx="725" cy="158" r="3"/>

  <rect class="ff" x="180" y="180" width="130" height="110" rx="8"/>
  <text class="monob" x="245" y="228" text-anchor="middle">D flip-flop</text>
  <text class="tiny" x="245" y="250" text-anchor="middle">บิต 3</text>
  <rect class="ff" x="340" y="180" width="130" height="110" rx="8"/>
  <text class="monob" x="405" y="228" text-anchor="middle">D flip-flop</text>
  <text class="tiny" x="405" y="250" text-anchor="middle">บิต 2</text>
  <rect class="ff" x="500" y="180" width="130" height="110" rx="8"/>
  <text class="monob" x="565" y="228" text-anchor="middle">D flip-flop</text>
  <text class="tiny" x="565" y="250" text-anchor="middle">บิต 1</text>
  <rect class="ff" x="660" y="180" width="130" height="110" rx="8"/>
  <text class="monob" x="725" y="228" text-anchor="middle">D flip-flop</text>
  <text class="tiny" x="725" y="250" text-anchor="middle">บิต 0</text>

  <line class="wire" x1="245" y1="290" x2="245" y2="320"/>
  <line class="wire" x1="405" y1="290" x2="405" y2="320"/>
  <line class="wire" x1="565" y1="290" x2="565" y2="320"/>
  <line class="wire" x1="725" y1="290" x2="725" y2="320"/>
  <text class="monob" x="245" y="338" text-anchor="middle">Q3</text>
  <text class="monob" x="405" y="338" text-anchor="middle">Q2</text>
  <text class="monob" x="565" y="338" text-anchor="middle">Q1</text>
  <text class="monob" x="725" y="338" text-anchor="middle">Q0</text>

  <rect class="block" x="30" y="380" width="80" height="56" rx="7"/>
  <text class="monob" x="70" y="414" text-anchor="middle">Clock</text>
  <line class="clkw" x1="110" y1="408" x2="645" y2="408"/>
  <circle class="dot" cx="165" cy="408" r="3.4"/>
  <circle class="dot" cx="325" cy="408" r="3.4"/>
  <circle class="dot" cx="485" cy="408" r="3.4"/>
  <line class="clkw" x1="165" y1="408" x2="165" y2="233"/>
  <line class="clkw" x1="165" y1="233" x2="180" y2="233"/>
  <line class="clkw" x1="325" y1="408" x2="325" y2="233"/>
  <line class="clkw" x1="325" y1="233" x2="340" y2="233"/>
  <line class="clkw" x1="485" y1="408" x2="485" y2="233"/>
  <line class="clkw" x1="485" y1="233" x2="500" y2="233"/>
  <line class="clkw" x1="645" y1="408" x2="645" y2="233"/>
  <line class="clkw" x1="645" y1="233" x2="660" y2="233"/>

  <text class="lbl" x="40" y="452">clock เส้นเดียวนี้คือหัวใจ: ทุกบิตจะรับค่าใหม่ "พร้อมกัน" ในจังหวะเดียวกัน — นี่คือความหมายของคำว่า register</text>

  <!-- ================= Panel B : behaviour ================= -->
  <rect class="panelb" x="20" y="490" width="920" height="230" rx="10"/>
  <text class="ptitle" x="40" y="518">B. register เก็บค่าได้จริง: รับค่าใหม่เฉพาะตอนขอบ clock</text>
  <text class="sub" x="40" y="538">โหลดได้ครั้งละ 1 ชุด ต่อ 1 ขอบขาขึ้น — ระหว่างนั้นค่าค้างอยู่ ไม่สนใจว่า D เปลี่ยนไปแค่ไหน</text>

  <rect class="hrow" x="60" y="555" width="840" height="26" rx="4"/>
  <text class="th" x="130" y="572" text-anchor="middle">ขอบ clock</text>
  <text class="th" x="360" y="572" text-anchor="middle">ข้อมูลเข้า D3..D0</text>
  <text class="th" x="710" y="572" text-anchor="middle">ค่าใน register Q3..Q0</text>
  <rect class="row" x="60" y="581" width="840" height="26"/>
  <text class="val" x="130" y="598" text-anchor="middle">ที่ 1</text>
  <text class="val" x="360" y="598" text-anchor="middle">0110</text>
  <text class="val" x="710" y="598" text-anchor="middle">0110</text>
  <rect class="rowg" x="60" y="607" width="840" height="26"/>
  <text class="val" x="130" y="624" text-anchor="middle">ที่ 2</text>
  <text class="val" x="360" y="624" text-anchor="middle">1011</text>
  <text class="val" x="710" y="624" text-anchor="middle">1011</text>
  <rect class="row" x="60" y="633" width="840" height="26"/>
  <text class="val" x="130" y="650" text-anchor="middle">ไม่มีขอบ</text>
  <text class="val" x="360" y="650" text-anchor="middle">0011 (เปลี่ยน)</text>
  <text class="val" x="710" y="650" text-anchor="middle">1011 (ค่าเดิมค้างอยู่)</text>
  <line class="thline" x1="200" y1="555" x2="200" y2="659"/>
  <line class="thline" x1="520" y1="555" x2="520" y2="659"/>

  <text class="lbl" x="40" y="682">จำไว้: ทุก int, string, slice ในโค้ด Go ของเรา (ตอน 03–07) สุดท้ายกลายเป็นบิตที่ค้างอยู่ใน flip-flop แบบนี้</text>
  <text class="lbl" x="40" y="704">เหลือคำถามเดียว: บิตพวกนี้อยู่ "ตรงไหน" ใน RAM — ตอบด้วย "เลข address" ในหัวข้อถัดไป</text>
</svg>
