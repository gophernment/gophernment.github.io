<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" role="img" aria-label="TCP/IP แบบ hourglass: แอปพลิเคชันหลายตัวและ link หลายเทคโนโลยีบรรจบที่ IP ชั้นเดียว">
<style>
text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12.5px; fill: #1a1a1a; }
.hdr { font-weight: 700; font-size: 17.5px; }
.sub { fill: #57606a; font-size: 12.5px; }
.ptitle { font-weight: 700; font-size: 14px; }
.txt { font-size: 12.5px; }
.lbl { fill: #57606a; font-size: 11px; }
.small { fill: #57606a; font-size: 10.5px; }
.big { font-weight: 700; font-size: 22px; fill: #0550ae; }
.mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 11.5px; fill: #0a3069; }
.monos { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 10.5px; fill: #57606a; }
.boxg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
.boxb { fill: #eef4ff; stroke: #0969da; stroke-width: 1.6; }
.boxy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
.boxi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
.wire { stroke: #8c959f; stroke-width: 1.8; fill: none; }
.head { fill: #8c959f; }
.rule { stroke: #d0d7de; stroke-width: 1.2; }
.bar1 { fill: #a8c4e8; }
.bar2 { fill: #0969da; }
.bar3 { fill: #bf8700; }
</style>
<rect x="0" y="0" width="1100" height="650" fill="#ffffff"/>
<text class="hdr" x="550" y="42" text-anchor="middle">TCP/IP: ชั้นกลางชั้นเดียวที่ทุกเครือข่ายต้องพูดด้วย</text>
<text class="sub" x="550" y="70" text-anchor="middle">อินเทอร์เน็ตไม่ใช่เครือข่ายเดียว แต่เป็นข้อตกลงชุดเดียวที่เครือข่ายต่างชนิดใช้ร่วมกัน</text>
<text class="lbl" x="48" y="104" text-anchor="start">ชั้นแอปพลิเคชัน — แต่ละงานมีโปรโตคอลของตัวเอง</text>
<rect class="boxg" x="48" y="116" width="230" height="56" rx="8"/>
<text class="ptitle" x="163" y="150" text-anchor="middle">HTTP (เว็บ)</text>
<line class="wire" x1="163" y1="172" x2="430" y2="194"/>
<polygon class="head" points="430.0,194.0 421.5,196.8 422.0,189.8"/>
<rect class="boxg" x="302" y="116" width="230" height="56" rx="8"/>
<text class="ptitle" x="417" y="150" text-anchor="middle">SMTP (อีเมล)</text>
<line class="wire" x1="417" y1="172" x2="470" y2="194"/>
<polygon class="head" points="470.0,194.0 461.0,194.1 463.7,187.6"/>
<rect class="boxg" x="556" y="116" width="230" height="56" rx="8"/>
<text class="ptitle" x="671" y="150" text-anchor="middle">DNS (ชื่อ)</text>
<line class="wire" x1="671" y1="172" x2="630" y2="194"/>
<polygon class="head" points="630.0,194.0 635.6,187.0 639.0,193.2"/>
<rect class="boxg" x="810" y="116" width="230" height="56" rx="8"/>
<text class="ptitle" x="925" y="150" text-anchor="middle">SSH (remote)</text>
<line class="wire" x1="925" y1="172" x2="670" y2="194"/>
<polygon class="head" points="670.0,194.0 678.0,189.8 678.6,196.8"/>
<rect class="boxg" x="300" y="196" width="500" height="54" rx="8"/>
<text class="txt" x="550" y="229" text-anchor="middle">TCP / UDP — transport: port และระดับความน่าเชื่อถือที่เลือกได้</text>
<text class="lbl" x="48" y="228" text-anchor="start">transport</text>
<line class="wire" x1="550" y1="250" x2="550" y2="282"/>
<polygon class="head" points="550.0,282.0 546.5,273.7 553.5,273.7"/>
<rect class="boxb" x="380" y="284" width="340" height="68" rx="8"/>
<text class="ptitle" x="550" y="310" text-anchor="middle">IP — ที่อยู่ปลายทาง + TTL</text>
<text class="small" x="550" y="332" text-anchor="middle">best-effort: ส่งต่อให้ ไม่สัญญาว่าจะถึง</text>
<text class="lbl" x="48" y="312" text-anchor="start">internet</text>
<text class="lbl" x="48" y="328" text-anchor="start">ชั้นเดียวที่ทุกเครือข่ายมีร่วมกัน</text>
<rect class="boxi" x="40" y="382" width="196" height="52" rx="8"/>
<text class="txt" x="138" y="413" text-anchor="middle">Ethernet</text>
<line class="wire" x1="520" y1="352" x2="138" y2="380"/>
<polygon class="head" points="138.0,380.0 146.0,375.9 146.5,382.9"/>
<rect class="boxi" x="246" y="382" width="196" height="52" rx="8"/>
<text class="txt" x="344" y="413" text-anchor="middle">PPP (dial-up)</text>
<line class="wire" x1="520" y1="352" x2="344" y2="380"/>
<polygon class="head" points="344.0,380.0 351.6,375.2 352.7,382.2"/>
<rect class="boxi" x="452" y="382" width="196" height="52" rx="8"/>
<text class="txt" x="550" y="413" text-anchor="middle">Packet radio</text>
<line class="wire" x1="520" y1="352" x2="550" y2="380"/>
<polygon class="head" points="550.0,380.0 541.5,376.9 546.3,371.8"/>
<rect class="boxi" x="658" y="382" width="196" height="52" rx="8"/>
<text class="txt" x="756" y="413" text-anchor="middle">Satellite</text>
<line class="wire" x1="580" y1="352" x2="756" y2="380"/>
<polygon class="head" points="756.0,380.0 747.3,382.2 748.4,375.2"/>
<rect class="boxi" x="864" y="382" width="196" height="52" rx="8"/>
<text class="txt" x="962" y="413" text-anchor="middle">Fiber</text>
<line class="wire" x1="580" y1="352" x2="962" y2="380"/>
<polygon class="head" points="962.0,380.0 953.5,382.9 954.0,375.9"/>
<text class="lbl" x="550" y="456" text-anchor="middle">ชั้น link — เทคโนโลยีคนละเรื่องกันโดยสิ้นเชิง</text>
<rect class="boxy" x="40" y="478" width="1020" height="146" rx="8"/>
<text class="ptitle" x="60" y="506" text-anchor="start">สิ่งที่ทำให้มันต่อกันได้ ไม่ใช่ตัวกลางชนิดเดียวกัน แต่เป็นข้อตกลงเรื่องรูปแบบ packet</text>
<text class="txt" x="60" y="530" text-anchor="start">IP packet = ที่อยู่ปลายทาง + TTL + ข้อมูล — ไม่สนว่าข้างในเป็นไฟล์ HTML หรืออีเมล</text>
<text class="txt" x="60" y="549" text-anchor="start">link เปลี่ยนได้ทุกเส้นทาง: IP header เดิมวิ่งบน Ethernet, PPP, ดาวเทียม ได้ทั้งหมด</text>
<text class="txt" x="60" y="569" text-anchor="start">1983: ARPANET เปลี่ยนจาก NCP มาเป็น TCP/IP วันเดียวทั้งเครือข่าย · 1+3+3 = 7 fragment จากการคำนวณแยกทีละ link</text>
</svg>
