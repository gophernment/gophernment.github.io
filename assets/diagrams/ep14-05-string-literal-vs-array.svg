<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" role="img" aria-label="เทียบ char array ที่แก้ได้ กับ pointer ไปข้อความคงที่ที่ห้ามแก้">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 17.5px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .sub { fill: #57606a; font-size: 12.5px; }
    .lbl { fill: #57606a; font-size: 11.5px; }
    .tiny { fill: #57606a; font-size: 11px; }
    .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
    .monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #0550ae; }
    .big { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 20px; font-weight: 700; fill: #1a7f37; }
    .addr { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #57606a; }
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .cell { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .cellhi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.9; }
    .cellthin { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .notebox { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.3; }
    .cbox { fill: #eef4ff; stroke: #0969da; stroke-width: 1.3; }
    .gobox { fill: #e6f4ff; stroke: #0a7ea4; stroke-width: 1.3; }
    .warnbox { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.3; }
    .rowband { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .wire { stroke: #1a7f37; stroke-width: 2.2; fill: none; }
    .wire2 { stroke: #57606a; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="arr-n" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="980" height="600" fill="#ffffff"/>

<text class="hdr" x="490" y="34" text-anchor="middle">ข้อความใน C: array ของ char หรือ pointer ไปยังข้อความคงที่</text>
<text class="sub" x="490" y="58" text-anchor="middle">ทั้งคู่พิมพ์ออกมาเหมือนกันเป๊ะ แต่ตัวอักษรอยู่คนละที่ในหน่วยความจำ — ที่หนึ่งแก้ได้ อีกที่หนึ่งห้าม</text>
<rect class="cbox" x="30" y="80" width="450" height="250" rx="10"/>
<text class="ptitle" x="48" y="106">char t[] = "hello"; — อยู่ใน array ของเรา</text>
<rect class="cellhi" x="60" y="130" width="66" height="52" rx="6"/>
<text class="big" x="93" y="164" text-anchor="middle">h</text>
<rect class="cellhi" x="130" y="130" width="66" height="52" rx="6"/>
<text class="big" x="163" y="164" text-anchor="middle">e</text>
<rect class="cellhi" x="200" y="130" width="66" height="52" rx="6"/>
<text class="big" x="233" y="164" text-anchor="middle">l</text>
<rect class="cellhi" x="270" y="130" width="66" height="52" rx="6"/>
<text class="big" x="303" y="164" text-anchor="middle">l</text>
<rect class="cellhi" x="340" y="130" width="66" height="52" rx="6"/>
<text class="big" x="373" y="164" text-anchor="middle">o</text>
<rect class="cell" x="410" y="130" width="52" height="52" rx="6"/>
<text class="lbl" x="436" y="162" text-anchor="middle">\0</text>
<text class="mono" x="48" y="208">sizeof(t) = 6 ไบต์ (5 ตัวอักษร + '\0' 1 ตัว)</text>
<text class="mono" x="48" y="234">t[0] = 'H';  -&gt;  ทำงานได้ (Hello)</text>
<text class="mono" x="48" y="260">หน่วยความจำ: อยู่บน stack</text>
<text class="mono" x="48" y="286">   stack = ที่พักข้อมูลชั่วคราวของฟังก์ชัน</text>
<text class="mono" x="48" y="312">เขียนทับได้ เพราะเป็นที่ของเราเอง</text>
<rect class="warnbox" x="500" y="80" width="450" height="250" rx="10"/>
<text class="ptitle" x="518" y="106">const char *s = "hello";  — ตัวอักษรอยู่ที่อื่น</text>
<text class="mono" x="518" y="208">sizeof(s) = 8 ไบต์ (แค่ตัว pointer)</text>
<text class="mono" x="518" y="234">s[0] = 'H';            -&gt;  คอมไพล์ไม่ผ่าน (read-only)</text>
<text class="mono" x="518" y="260">((char *)s)[0] = 'H'; -&gt; ผ่านคอมไพล์ แต่รัน segfault</text>
<text class="mono" x="518" y="286">หน่วยความจำ: ข้อความอยู่ในส่วนที่ห้ามเขียน</text>
<text class="mono" x="518" y="312">แก้ไม่ได้ และไม่ควรพยายามแก้</text>
<rect class="cell" x="518" y="130" width="200" height="52" rx="6"/>
<text class="addr" x="618" y="162" text-anchor="middle">0x5555594308b0</text>
<text class="lbl" x="734" y="152">ตัว pointer เก็บแค่</text>
<text class="lbl" x="734" y="172">address ของข้อความ</text>
<rect class="notebox" x="30" y="350" width="920" height="220" rx="10"/>
<text class="ptitle" x="50" y="378">สองขั้นของข้อความคงที่: คอมไพเลอร์กันก่อน แล้วถ้าฝืน cast ทิ้ง const ก็ตายตอนรัน</text>
<text class="mono" x="50" y="410">$ gcc literal_const_reject.c   -&gt;  error: assignment of read-only location '*p'</text>
<text class="mono" x="50" y="442">$ ./literal_write              -&gt;  ก่อนแก้: s = hello (ที่ 0x5555594308b0)</text>
<text class="mono" x="50" y="474">Segmentation fault               &lt;- ตายทันทีที่ cast ทิ้ง const แล้วเขียนทับตัวอักษรแรก</text>
<text class="mono" x="50" y="506">บรรทัด Segmentation fault เป็นข้อความที่ shell รายงาน — ตัวโปรแกรมไม่ได้พิมพ์อะไรเพิ่ม</text>
</svg>
