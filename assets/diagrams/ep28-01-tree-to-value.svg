<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 590" width="980" height="590" role="img" aria-label="จากต้นไม้ AST สู่ค่าที่คำนวณได้ ด้วยการเดินต้นไม้">
  <style>
