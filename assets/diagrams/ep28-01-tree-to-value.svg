  <text x="24.0" y="32.0" class="hdr">interpreter: เปลี่ยน “ต้นไม้” ให้เป็น “ค่า” (tree-walking)</text>
  <text x="24.0" y="54.0" class="sub">ครบวงจรของภาษาจิ๋ว: ข้อความ → token (ตอนที่ 26) → AST (ตอนที่ 27) → ค่า (ตอนนี้) · ทุกตัวเลขดึงจาก out/</text>
  <rect x="24.0" y="74.0" width="186.0" height="84.0" rx="8.0" class="bandw"/>
  <text x="117.0" y="100.0" class="btitle" text-anchor="middle">AST (ตอนที่ 27)</text>
  <text x="117.0" y="118.0" class="lbl" text-anchor="middle">โครงสร้างล้วน ๆ</text>
  <text x="117.0" y="140.0" class="mono" text-anchor="middle">(+ 3 (* 4 5))</text>
  <rect x="236.0" y="74.0" width="186.0" height="84.0" rx="8.0" class="bandw"/>
  <text x="329.0" y="100.0" class="btitle" text-anchor="middle">Interpreter (ตอนนี้)</text>
  <text x="329.0" y="118.0" class="lbl" text-anchor="middle">เดินตามต้นไม้ทีละ node</text>
  <text x="329.0" y="140.0" class="mono" text-anchor="middle">eval · execute</text>
  <rect x="448.0" y="74.0" width="186.0" height="84.0" rx="8.0" class="bandw"/>
  <text x="541.0" y="100.0" class="btitle" text-anchor="middle">ค่า (Value)</text>
  <text x="541.0" y="118.0" class="lbl" text-anchor="middle">สิ่งที่คำนวณออกมาได้</text>
  <text x="541.0" y="140.0" class="mono" text-anchor="middle">23 (int)</text>
  <rect x="660.0" y="74.0" width="296.0" height="84.0" rx="8.0" class="bandc"/>
  <text x="808.0" y="100.0" class="btitle" text-anchor="middle">ผลข้างเคียง</text>
  <text x="808.0" y="118.0" class="lbl" text-anchor="middle">สิ่งที่โปรแกรม “ทำ” ออกมา</text>
  <text x="808.0" y="140.0" class="mono" text-anchor="middle">print → เขียนออกจอ</text>
  <path d="M 210.0 116.0 L 234.0 116.0" class="arrow" marker-end="url(#a)"/>
  <path d="M 422.0 116.0 L 446.0 116.0" class="arrow" marker-end="url(#a)"/>
  <path d="M 634.0 116.0 L 658.0 116.0" class="arrow" marker-end="url(#a)"/>
  <rect x="24.0" y="178.0" width="466.0" height="318.0" rx="8.0" class="band"/>
  <text x="40.0" y="202.0" class="btitle">Interpreter มีสองท่า — งานคนละแบบ แต่เดินต้นไม้เหมือนกัน</text>
  <rect x="40.0" y="218.0" width="434.0" height="56.0" rx="8.0" class="bandc"/>
  <text x="54.0" y="240.0" class="monob">Eval(expr) → Value</text>
  <text x="54.0" y="258.0" class="lbl">คำนวณค่าของนิพจน์ · เช่น 3 + 4 * 5 → 23</text>
  <rect x="40.0" y="282.0" width="434.0" height="56.0" rx="8.0" class="bandg"/>
  <text x="54.0" y="304.0" class="monob">Execute(stmt) → ผลข้างเคียง</text>
  <text x="54.0" y="322.0" class="lbl">ประกาศตัวแปร · พิมพ์ออกจอ · เลือกเส้นทาง</text>
  <rect x="40.0" y="346.0" width="434.0" height="56.0" rx="8.0" class="bandw"/>
  <text x="54.0" y="368.0" class="monob">Env: ชื่อ → ค่า</text>
  <text x="54.0" y="386.0" class="lbl">ที่เก็บค่าตัวแปร — เป็นของ interpreter แต่ละตัว</text>
  <text x="40.0" y="432.0" class="lbl">• ทั้งสองท่าเป็นฟังก์ชันที่เรียกตัวเองซ้ำกับลูก →</text>
  <text x="40.0" y="452.0" class="lbl">ต้นไม้ลึกแค่ไหนก็เดินได้</text>
  <text x="40.0" y="472.0" class="lbl">• env สุดท้ายของโปรแกรมตัวอย่าง A (out/02): { x = 23, y = 42 }</text>
  <text x="40.0" y="492.0" class="lbl">• เดินไป 16 node สำหรับโปรแกรม 3 บรรทัด</text>
  <rect x="506.0" y="178.0" width="450.0" height="318.0" rx="8.0" class="band"/>
  <text x="522.0" y="202.0" class="btitle">ตัวอย่างจริง: 3 + 4 * 5 (out/01)</text>
  <text x="522.0" y="220.0" class="lbl">2) ต้นไม้ AST:</text>
  <text x="540.0" y="240.0" class="mono">BinaryExpr +</text>
  <text x="540.0" y="258.0" class="mono">├─ NumberLit 3</text>
  <text x="540.0" y="276.0" class="mono">└─ BinaryExpr *</text>
  <text x="540.0" y="294.0" class="mono">   ├─ NumberLit 4</text>
  <text x="540.0" y="312.0" class="mono">   └─ NumberLit 5</text>
  <text x="522.0" y="350.0" class="lbl">3) ลำดับการเดิน (เยื้องขวา = ลึกกว่า):</text>
  <text x="554.0" y="370.0" class="monos">eval NumberLit 3  = 3</text>
  <text x="568.0" y="388.0" class="monos">eval NumberLit 4  = 4</text>
  <text x="568.0" y="406.0" class="monos">eval NumberLit 5  = 5</text>
  <text x="554.0" y="424.0" class="monos">eval (* 4 5)  = 20</text>
  <text x="540.0" y="442.0" class="monos">eval (+ 3 (* 4 5))  = 23</text>
  <text x="522.0" y="478.0" class="monob">4) ค่า = 23 (int)</text>
  <rect x="24.0" y="504.0" width="932.0" height="40.0" rx="8.0" class="bandy"/>
  <text x="40.0" y="529.0" class="lbl">เส้นทางที่เหลือ: interpreter: tree-walking (ตอนนี้) → type system, scope, symbol table (ตอนที่ 29) → codegen (ตอนที่ 30)</text>
  <text x="24.0" y="562.0" class="lbl">ตัวเลขและข้อความในภาพนี้ดึงจาก out/01_eval_expr.out.txt และ out/02_variables.out.txt</text>
  <text x="24.0" y="578.0" class="lbl">go version go1.24.4 linux/arm64 · Linux 6.18.39+rpt-rpi-2712 aarch64 · 2026-10-01</text>
</svg>
