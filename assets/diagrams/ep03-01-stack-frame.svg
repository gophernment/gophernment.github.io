<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588" width="1040" height="588" role="img" aria-label="ผัง stack frame ของฟังก์ชัน C: buffer, canary, saved frame pointer, return address และทิศที่ strcpy เขียนเกิน">
<style>
text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
.hdr { font-weight: 700; font-size: 17.5px; }
.ptitle { font-weight: 700; font-size: 14.5px; }
.sub { fill: #57606a; font-size: 12.5px; }
.lbl { fill: #57606a; font-size: 11.5px; }
.txt { font-size: 13px; }
.small { fill: #57606a; font-size: 11px; }
.mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
.monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #0550ae; }
.boxn { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.6; }
.boxi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.6; }
.boxg { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.3; }
.boxw { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
.boxy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
.boxb { fill: #eef4ff; stroke: #0969da; stroke-width: 1.4; }
.chipd { fill: #ffffff; stroke: #8250df; stroke-width: 1.2; }
.wire { stroke: #57606a; stroke-width: 1.8; fill: none; }
</style>
<defs>
<marker id="a-n" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="a-r" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
</defs>
<rect x="0" y="0" width="1040" height="588" fill="#ffffff"/>
<text class="hdr" x="520" y="36" text-anchor="middle">stack frame คืออะไร — และไบต์ที่เกินไปมันไปทับอะไร</text>
<text class="sub" x="520" y="60" text-anchor="middle">frame เดโม = buf[64] + canary + saved fp + ret addr = 76 byte · ระยะถึง return address = 72 byte</text>
<rect class="boxn" x="120" y="110" width="400" height="68" rx="9"/>
<text class="ptitle" x="138" y="140">return address</text>
<text class="mono" x="138" y="166">0x00400ABC</text>
<rect class="boxy" x="120" y="182" width="400" height="68" rx="9"/>
<text class="ptitle" x="138" y="212">saved frame pointer</text>
<text class="mono" x="138" y="238">0x7FFFEFF0</text>
<rect class="boxi" x="120" y="254" width="400" height="68" rx="9"/>
<text class="ptitle" x="138" y="284">stack canary (ค่าเฝ้าดู)</text>
<text class="mono" x="138" y="310">0xDEADBEEF</text>
<rect class="boxw" x="120" y="326" width="400" height="176" rx="9"/>
<text class="ptitle" x="138" y="356">buf[64]  (ตัวแปรในเครื่อง)</text>
<text class="mono" x="138" y="382">(ไบต์ข้อมูลของผู้ใช้)</text>
<text class="txt" x="548" y="118">offset +72 — เป้าหมายของผู้โจมตี: ถ้าคุมค่านี้ได้ =</text>
<text class="txt" x="548" y="138">คุมการทำงาน</text>
<text class="txt" x="548" y="190">offset +68 — ที่อยู่ frame ของฟังก์ชันผู้เรียก ต้องมาก่อน</text>
<text class="txt" x="548" y="210">ret addr</text>
<text class="txt" x="548" y="262">offset +64 — ค่าลับที่ compiler ใส่คั่น ค่าตั้งต้น</text>
<text class="txt" x="548" y="282">0xDEADBEEF (StackGuard 1998)</text>
<text class="txt" x="548" y="388">offset +0 — ที่ที่ข้อมูลจากข้างนอกถูกคัดลอกเข้ามา</text>
<line class="wire" x1="60" y1="500" x2="60" y2="120" marker-end="url(#a-r)"/>
<text class="lbl" x="68" y="300">strcpy</text>
<text class="lbl" x="68" y="318">ไล่ขึ้นไป</text>
<rect class="boxb" x="40" y="512" width="960" height="58" rx="9"/>
<text class="txt" x="56" y="534">strcpy() ไม่รู้ว่า buf มีที่เท่าไร จึงคัดลอกไบต์ขึ้นไปเรื่อย ๆ — ยิ่ง input ยาว ยิ่งเขียนลึกขึ้น: canary ก่อน แล้ว</text>
<text class="txt" x="56" y="554">saved fp แล้วจึงถึง return address (ของจริงคือลำดับนี้เป๊ะ ๆ บน stack)</text>
</svg>
