<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" role="img" aria-label="ห้าคำถามที่แยกบทบาท PM ออกจาก Product Manager, Scrum Master, Program Manager และ PMO">
<style>
text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
.hdr { font-weight: 700; font-size: 19px; }
.sub { fill: #57606a; font-size: 13.5px; }
.big { font-weight: 700; font-size: 22px; }
.ptitle { font-weight: 700; font-size: 15.5px; }
.txt { font-size: 13px; }
.lbl { fill: #57606a; font-size: 12px; }
.small { fill: #57606a; font-size: 12px; }
.tiny { fill: #57606a; font-size: 11px; }
.qlab { font-weight: 700; font-size: 14px; fill: #7a4d00; }
.axlab { font-weight: 700; font-size: 13.5px; fill: #57606a; }
.boxg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
.boxq { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
.boxb { fill: #eef4ff; stroke: #0969da; stroke-width: 1.7; }
.boxi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.3; }
.boxv { fill: #f6f2ff; stroke: #8250df; stroke-width: 1.3; }
.boxk { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
.rule { stroke: #d0d7de; stroke-width: 1.2; }
.dash { stroke: #b6bfc9; stroke-width: 1.4; stroke-dasharray: 7 6; }
.axis { stroke: #57606a; stroke-width: 1.8; }
.note { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="760" fill="#ffffff"/>
<text class="hdr" x="560" y="42" text-anchor="middle">บทบาทต่างกันเพราะ “คำถามที่ต้องตอบ” ต่างกัน</text>
<text class="sub" x="560" y="68" text-anchor="middle">ไม่ใช่เพราะชื่องาน — ชื่อเดียวกันในสองบริษัทอาจหมายถึงคนละงาน</text>
<rect class="boxq" x="40" y="112" width="246" height="76" rx="8"/>
<text class="qlab" x="163" y="142" text-anchor="middle">ทำอะไร</text>
<text class="qlab" x="163" y="162" text-anchor="middle">และทำไม</text>
<rect class="boxg" x="306" y="104" width="774" height="92" rx="8"/>
<text class="ptitle" x="322" y="130" text-anchor="start">Product Manager · Product Owner</text>
<text class="txt" x="322" y="154" text-anchor="start">ตัดสินใจ: สินค้าควรมีอะไร ฟีเจอร์ไหนคุ้ม และทำอะไรก่อน</text>
<text class="lbl" x="322" y="174" text-anchor="start">ตัวอย่าง: ตัดสินว่าระบบจองคิวต้องมี “เลื่อนนัดเอง” ไหม เพราะคนไข้ยกเลิกบ่อย</text>
<line class="rule" x1="290" y1="150" x2="302" y2="150" marker-end="url(#ar)"/>
<rect class="boxq" x="40" y="228" width="246" height="76" rx="8"/>
<text class="qlab" x="163" y="258" text-anchor="middle">ทำยังไง</text>
<text class="qlab" x="163" y="278" text-anchor="middle">และเสร็จเมื่อไหร่</text>
<rect class="boxb" x="306" y="220" width="774" height="92" rx="8"/>
<text class="ptitle" x="322" y="246" text-anchor="start">Project Manager</text>
<text class="txt" x="322" y="270" text-anchor="start">ตัดสินใจ: ใครทำอะไร เมื่อไหร่ งบเท่าไร และอะไรอยู่นอกขอบเขต</text>
<text class="lbl" x="322" y="290" text-anchor="start">ตัวอย่าง: ดันงานให้เสร็จก่อนสาขาใหม่เปิด — เจรจาขอลดฟีเจอร์เมื่อคนไม่พอ</text>
<line class="rule" x1="290" y1="266" x2="302" y2="266" marker-end="url(#ar)"/>
<rect class="boxq" x="40" y="344" width="246" height="76" rx="8"/>
<text class="qlab" x="163" y="374" text-anchor="middle">ทีม/งาน</text>
<text class="qlab" x="163" y="394" text-anchor="middle">เดินหน้าไหม</text>
<rect class="boxg" x="306" y="336" width="774" height="92" rx="8"/>
<text class="ptitle" x="322" y="362" text-anchor="start">Scrum Master · Delivery Manager · Project Coordinator</text>
<text class="txt" x="322" y="386" text-anchor="start">ไม่ได้ตัดสินใจแทนทีม: ออกแบบวิธีทำงาน / ไล่ blocker / คุมเอกสารและนัดประชุม</text>
<text class="lbl" x="322" y="406" text-anchor="start">SM = ประสิทธิผลทีม · DM = ระบบส่งมอบ · PC = เอกสาร/นัดหมาย</text>
<line class="rule" x1="290" y1="382" x2="302" y2="382" marker-end="url(#ar)"/>
<rect class="boxq" x="40" y="460" width="246" height="76" rx="8"/>
<text class="qlab" x="163" y="490" text-anchor="middle">หลายโปรเจกต์</text>
<text class="qlab" x="163" y="510" text-anchor="middle">ไปทางเดียวกันไหม</text>
<rect class="boxg" x="306" y="452" width="774" height="92" rx="8"/>
<text class="ptitle" x="322" y="478" text-anchor="start">Program Manager</text>
<text class="txt" x="322" y="502" text-anchor="start">ดูแล: ความเกี่ยวเนื่องระหว่างโปรเจกต์ และผลประโยชน์ที่ต้องได้ร่วมกัน</text>
<text class="lbl" x="322" y="522" text-anchor="start">ตัวอย่าง: 4 โปรเจกต์ย้ายระบบ ERP (ระบบบริหารหลังบ้าน) — ตัวไหนต้องเสร็จก่อน ไม่งั้นตัวอื่นรอ</text>
<line class="rule" x1="290" y1="498" x2="302" y2="498" marker-end="url(#ar)"/>
<rect class="boxq" x="40" y="576" width="246" height="76" rx="8"/>
<text class="qlab" x="163" y="606" text-anchor="middle">ทั้งองค์กรใช้</text>
<text class="qlab" x="163" y="626" text-anchor="middle">มาตรฐานเดียวกันไหม</text>
<rect class="boxg" x="306" y="568" width="774" height="92" rx="8"/>
<text class="ptitle" x="322" y="594" text-anchor="start">PMO (Project Management Office)</text>
<text class="txt" x="322" y="618" text-anchor="start">ดูแล: template, process, การรายงาน, การ audit — ไม่ได้เป็นเจ้าของโปรเจกต์</text>
<text class="lbl" x="322" y="638" text-anchor="start">ตัวอย่าง: กำหนดว่าทุกโปรเจกต์ต้องมี risk register และรายงานสถานะทุก 2 สัปดาห์</text>
<line class="rule" x1="290" y1="614" x2="302" y2="614" marker-end="url(#ar)"/>
<rect class="note" x="40" y="676" width="1040" height="56" rx="8"/>
<text class="txt" x="56" y="700" text-anchor="start">หลักเดียวที่ใช้ได้ทุกที่: ถามว่า “คนนี้ตัดสินใจอะไรได้” ไม่ใช่ “คนนี้ตำแหน่งอะไร”</text>
<text class="small" x="56" y="720" text-anchor="start">บริษัทเล็กคนเดียวถือหลายบทบาทพร้อมกัน — บริษัทใหญ่แยกคนละคนและบางครั้งแยกคนละทีม</text>
</svg>
