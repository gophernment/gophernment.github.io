<text x="66" y="178" class="n" text-anchor="middle">S</text>
<text x="100" y="163" class="hd">Spoofing</text>
<text x="100" y="183" class="sm">STRIDE</text>
<text x="302" y="172" class="t">ใครปลอมเป็นคนอื่นได้</text>
<text x="712" y="163" class="s">Authentication</text>
<text x="712" y="183" class="sm">CIA: C, I</text>
<text x="870" y="172" class="s">ปลอมเป็น payment-provider</text>
<text x="1165" y="176" class="hd" text-anchor="middle">8</text>
<rect x="38" y="210" width="1164" height="70" rx="8" fill="#f5f7f9" stroke="#e3e9f0" stroke-width="1"/>
<text x="66" y="256" class="n" text-anchor="middle">T</text>
<text x="100" y="241" class="hd">Tampering</text>
<text x="100" y="261" class="sm">STRIDE</text>
<text x="302" y="250" class="t">ใครแก้อะไรได้โดยไม่มีสิทธิ์</text>
<text x="712" y="241" class="s">Integrity</text>
<text x="712" y="261" class="sm">CIA: I</text>
<text x="870" y="250" class="s">แก้ invoice-record ระหว่างทาง</text>
<text x="1165" y="254" class="hd" text-anchor="middle">20</text>
<rect x="38" y="288" width="1164" height="70" rx="8" fill="#ffffff" stroke="#e3e9f0" stroke-width="1"/>
<text x="66" y="334" class="n" text-anchor="middle">R</text>
<text x="100" y="319" class="hd">Repudiation</text>
<text x="100" y="339" class="sm">STRIDE</text>
<text x="302" y="328" class="t">ใครทำแล้วปฏิเสธได้</text>
<text x="712" y="319" class="s">Non-repudiation</text>
<text x="712" y="339" class="sm">CIA: I</text>
<text x="870" y="328" class="s">ลบร่องรอยใน audit-log</text>
<text x="1165" y="332" class="hd" text-anchor="middle">11</text>
<rect x="38" y="366" width="1164" height="70" rx="8" fill="#f5f7f9" stroke="#e3e9f0" stroke-width="1"/>
<text x="66" y="412" class="n" text-anchor="middle">I</text>
<text x="100" y="397" class="hd">Information disclosure</text>
<text x="100" y="417" class="sm">STRIDE</text>
<text x="302" y="406" class="t">ใครอ่านอะไรเกินสิทธิ์</text>
<text x="712" y="397" class="s">Confidentiality</text>
<text x="712" y="417" class="sm">CIA: C</text>
<text x="870" y="406" class="s">api-gateway คืนข้อมูลเกิน</text>
<text x="1165" y="410" class="hd" text-anchor="middle">20</text>
<rect x="38" y="444" width="1164" height="70" rx="8" fill="#ffffff" stroke="#e3e9f0" stroke-width="1"/>
<text x="66" y="490" class="n" text-anchor="middle">D</text>
<text x="100" y="475" class="hd">Denial of service</text>
<text x="100" y="495" class="sm">STRIDE</text>
<text x="302" y="484" class="t">ใครทำให้ระบบหยุดได้</text>
<text x="712" y="475" class="s">Availability</text>
<text x="712" y="495" class="sm">CIA: A</text>
<text x="870" y="484" class="s">ท่วม invoice-service</text>
<text x="1165" y="488" class="hd" text-anchor="middle">20</text>
