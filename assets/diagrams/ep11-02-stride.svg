<text x="66" y="568" class="n" text-anchor="middle">E</text>
<text x="100" y="553" class="hd">Elevation of privilege</text>
<text x="100" y="573" class="sm">STRIDE</text>
<text x="302" y="562" class="t">ใครได้สิทธิ์เกินตัว</text>
<text x="712" y="553" class="s">Authorization</text>
<text x="712" y="573" class="sm">CIA: C, I</text>
<text x="870" y="562" class="s">employee สั่งงานระดับ admin</text>
<text x="1165" y="566" class="hd" text-anchor="middle">5</text>
<text x="38" y="626" class="sm">คอลัมน์สุดท้าย = จำนวนภัยที่ STRIDE ผลิตออกมาจากแบบจำลอง 11 องค์ประกอบในเดโม 1 (รวม 84 ภัย)</text>
<rect x="38" y="646" width="588" height="106" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<text x="58" y="674" class="hd">STRIDE ไม่ได้แทน CIA</text>
<text x="58" y="698" class="s">STRIDE เป็น 'คำถาม' ที่พาไปถึงผลกระทบ ·</text>
<text x="58" y="718" class="s">CIA เป็น 'ปลายทาง' ของผลกระทบนั้น</text>
<text x="58" y="738" class="sm">ถามครบหกข้อ = มองเห็นทั้งสามเสา</text>
<rect x="646" y="646" width="556" height="106" rx="10" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
