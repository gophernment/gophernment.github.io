<rect x="666" y="690" width="153.84615384615384" height="16" rx="6" fill="#3f9c63" stroke="#3f9c63" stroke-width="1"/>
<text x="666" y="730" class="s">เหลือ 18 ช่องที่ยังไม่มีใครถาม — และนั่นคือผลลัพธ์ปกติของรอบแรก</text>
<text x="620" y="782" class="sm" text-anchor="middle">ตัวเลขทั้งหมดอ่านจาก out/01_dfd.txt และ out/03_workshop.txt</text>
