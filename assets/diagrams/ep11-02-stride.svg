<text x="620" y="40" class="h" text-anchor="middle">STRIDE: หกคำถามที่ต้องถามให้ครบ ก่อนจะเริ่มเขียนโค้ด</text>
<text x="620" y="66" class="s" text-anchor="middle">แต่ละตัวอักษรคือคำถามหนึ่งข้อ และชี้ไปที่คุณสมบัติหนึ่งอย่างที่อาจถูกทำลาย</text>
<text x="100" y="112" class="sm">ชื่อ</text>
<text x="302" y="112" class="sm">คำถามที่ต้องถาม</text>
<text x="712" y="112" class="sm">คุณสมบัติที่ถูกทำลาย</text>
<text x="870" y="112" class="sm">ตัวอย่างในระบบของเรา</text>
<text x="1128" y="112" class="sm">ในเดโม</text>
<line x1="40" y1="120" x2="1200" y2="120" stroke="#c8d3dd" stroke-width="1.2"/>
