<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-label="map คือชุดคู่ key กับ value: เปิดด้วย key (เช่น ชื่อคน) แล้วได้ value (เช่น อายุ) กลับมาทันที เหมือนสมุดค้นหา">
  <defs>
    <marker id="arrblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans Thai", -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #0969da; }
    .mono2 { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #1a1a1a; }
    .lbl { fill: #57606a; font-size: 12px; }
    .lblred { fill: #cf222e; font-size: 12px; font-weight: 700; }
    .hdr { font-weight: 700; font-size: 16px; }
    .kchip { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.4; }
    .vchip { fill: #f6f8fa; stroke: #0969da; stroke-width: 1.4; }
    .note { font-size: 12px; fill: #1a1a1a; }
  </style>

  <text class="hdr" x="400" y="26" text-anchor="middle">map: เปิดด้วย key → ได้ value กลับมาทันที (เหมือนสมุดค้นหา)</text>
  <text class="mono" x="40" y="58">ages := map[string]int{ "สมชาย": 30, "สมหญิง": 28, "สมปอง": 35 }</text>

  <!-- row 0 -->
  <rect class="kchip" x="70" y="84" width="200" height="48" rx="24"/>
  <text x="170" y="114" text-anchor="middle">สมชาย</text>
  <line x1="276" y1="108" x2="366" y2="108" stroke="#0969da" stroke-width="1.6" marker-end="url(#arrblue)"/>
  <rect class="vchip" x="380" y="84" width="90" height="48" rx="8"/>
  <text class="mono2" x="425" y="114" text-anchor="middle">30</text>

  <!-- row 1 -->
  <rect class="kchip" x="70" y="154" width="200" height="48" rx="24"/>
  <text x="170" y="184" text-anchor="middle">สมหญิง</text>
  <line x1="276" y1="178" x2="366" y2="178" stroke="#0969da" stroke-width="1.6" marker-end="url(#arrblue)"/>
  <rect class="vchip" x="380" y="154" width="90" height="48" rx="8"/>
  <text class="mono2" x="425" y="184" text-anchor="middle">28</text>

  <!-- row 2 -->
  <rect class="kchip" x="70" y="224" width="200" height="48" rx="24"/>
  <text x="170" y="254" text-anchor="middle">สมปอง</text>
  <line x1="276" y1="248" x2="366" y2="248" stroke="#0969da" stroke-width="1.6" marker-end="url(#arrblue)"/>
  <rect class="vchip" x="380" y="224" width="90" height="48" rx="8"/>
  <text class="mono2" x="425" y="254" text-anchor="middle">35</text>

  <text class="lbl" x="70" y="146">key</text>
  <text class="lbl" x="380" y="146">value</text>

  <!-- right notes -->
  <rect x="516" y="72" width="276" height="212" rx="10" fill="#f6f8fa"/>
  <circle cx="532" cy="92" r="3.5" fill="#0969da"/>
  <text class="note" x="544" y="96">อ่าน key ที่ไม่มีอยู่</text>
  <text class="note" x="556" y="112">→ ได้ 0 (zero value)</text>
  <text class="note" x="556" y="128">โปรแกรมไม่พัง แต่แยกไม่ออก</text>
  <text class="note" x="556" y="144">ว่า "ไม่มี" หรือ "เป็น 0" กันแน่</text>
  <circle cx="532" cy="176" r="3.5" fill="#0969da"/>
  <text class="note" x="544" y="180">อยากรู้ว่า "มีจริงไหม" → ใช้</text>
  <text class="mono2" x="556" y="196">v, ok := m[key]   (comma-ok)</text>
  <circle cx="532" cy="240" r="3.5" fill="#0969da"/>
  <text class="note" x="544" y="244">วนด้วย for k, v := range m</text>
  <text class="note" x="556" y="260">ได้ทุกคู่ ลำดับไม่การันตี</text>

  <!-- bottom band -->
  <line x1="40" y1="296" x2="760" y2="296" stroke="#d0d7de" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text class="lblred" x="60" y="330">เขียนค่า (m[k] = v) ต้อง make ก่อน — เขียนลง nil map → panic!</text>
  <text class="lbl" x="60" y="356">ลบออกด้วย delete(m, key) — ลบ key ที่ไม่มีอยู่แล้วก็ไม่ error</text>
  <text class="lbl" x="60" y="382">map เหมาะกับ "ค้นหาด้วยชื่อ" · slice เหมาะกับ "เรียงตามลำดับ" — ใช้คู่กันบ่อย</text>
</svg>
