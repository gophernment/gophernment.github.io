    .lbl { fill: #57606a; font-size: 11.5px; }
    .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; }
    .monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #0550ae; }
    .monor { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #cf222e; }
    .monog { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #1a7f37; }
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .bandc { fill: #eef4ff; stroke: #0969da; stroke-width: 1.4; }
    .bandg { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
    .bandr { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.4; }
    .bandy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
    .cell { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.1; }
    .arrow { stroke: #57606a; stroke-width: 2; fill: none; }
    .arrowg { stroke: #1a7f37; stroke-width: 2.4; fill: none; }
    .arrowb { stroke: #0550ae; stroke-width: 2.4; fill: none; }
    .arrowr { stroke: #cf222e; stroke-width: 2.2; fill: none; }
