<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 790" width="1040" height="790" role="img" aria-label="สี่ขั้นจากไฟล์ .c ไปเป็น executable: preprocess compile assemble link แล้วโหลดเข้า memory">
  <style>
