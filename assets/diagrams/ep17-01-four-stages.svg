  <defs>
    <marker id="a-n" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="a-g" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="a-b" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0550ae"/></marker>
    <marker id="a-r" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  </defs>
  <rect x="0" y="0" width="1040" height="790" fill="#ffffff"/>

<text class="hdr" x="520" y="36" text-anchor="middle">gcc -o main main.c จริง ๆ แล้วคือ 4 ขั้น (บวกอีก 1 ขั้นตอนรัน)</text>
<text class="sub" x="520" y="60" text-anchor="middle">ตัวเลขทุกตัวคือของจริงบนเครื่องนี้: Linux aarch64 (Raspberry Pi 5) · GCC 14.2.0 · binutils 2.44</text>
<rect class="band" x="40" y="96" width="960" height="126" rx="10"/>
<circle cx="84" cy="126" r="15" fill="#0969da"/>
<text class="monob" x="84" y="131" text-anchor="middle" fill="#ffffff">1</text>
<text class="ptitle" x="118" y="124">preprocess — ขยายข้อความก่อนใครหมด</text>
<text class="mono" x="118" y="148">เครื่องมือ: cpp (C preprocessor) · คำสั่งที่แยกขั้น: gcc -E main.c -o main.i</text>
<text class="mono" x="118" y="172">เข้า: main.c (38 บรรทัด, 2,576 ไบต์)  →  ออก: main.i (806 บรรทัด, 22,795 ไบต์)</text>
<text class="lbl" x="118" y="196">#include 37 จุดถูก "ยัด" ไฟล์ (stdio.h/stdlib.h/mathx.h) · #define ถูกแทนข้อความ</text>
<line class="arrow" x1="84" y1="223" x2="84" y2="231" marker-end="url(#a-n)"/>
<rect class="band" x="40" y="230" width="960" height="126" rx="10"/>
<circle cx="84" cy="260" r="15" fill="#0969da"/>
<text class="monob" x="84" y="265" text-anchor="middle" fill="#ffffff">2</text>
<text class="ptitle" x="118" y="258">compile — แปลภาษา C เป็นภาษา assembly</text>
<text class="mono" x="118" y="282">เครื่องมือ: cc1 (ตัวคอมไพเลอร์จริง) · คำสั่งที่แยกขั้น: gcc -S -O0 main.c -o main.s</text>
<text class="mono" x="118" y="306">เข้า: main.i  →  ออก: main.s (แอสเซมบลีของ ARM aarch64, 2,401 ไบต์, 127 บรรทัด)</text>
<text class="lbl" x="118" y="330">นี่คือขั้นเดียวที่ "เข้าใจความหมาย" ของภาษา C — ขั้นอื่นเป็นการจัดการข้อความ/ไฟล์</text>
<line class="arrow" x1="84" y1="357" x2="84" y2="365" marker-end="url(#a-n)"/>
<rect class="band" x="40" y="364" width="960" height="126" rx="10"/>
<circle cx="84" cy="394" r="15" fill="#0969da"/>
<text class="monob" x="84" y="399" text-anchor="middle" fill="#ffffff">3</text>
<text class="ptitle" x="118" y="392">assemble — แปล assembly เป็นรหัสเครื่อง</text>
<text class="mono" x="118" y="416">เครื่องมือ: as (assembler) · คำสั่งที่แยกขั้น: gcc -c main.c -o main.o</text>
<text class="mono" x="118" y="440">เข้า: main.s  →  ออก: main.o (ELF 64-bit LSB relocatable, 3,000 ไบต์)</text>
<text class="lbl" x="118" y="464">ได้ไฟล์ที่ CPU เข้าใจแล้ว แต่ยัง "อยู่คนเดียวไม่ได้" — ที่อยู่ยังไม่ถูกเติม</text>
<line class="arrow" x1="84" y1="491" x2="84" y2="499" marker-end="url(#a-n)"/>
<rect class="band" x="40" y="498" width="960" height="126" rx="10"/>
<circle cx="84" cy="528" r="15" fill="#0969da"/>
<text class="monob" x="84" y="533" text-anchor="middle" fill="#ffffff">4</text>
<text class="ptitle" x="118" y="526">link — รวมทุกไฟล์ + ไลบรารีเป็นโปรแกรมเดียว</text>
<text class="mono" x="118" y="550">เครื่องมือ: collect2 → ld (linker) · คำสั่งที่แยกขั้น: gcc -o main main.o mathx.o</text>
<text class="mono" x="118" y="574">เข้า: main.o + mathx.o + Scrt1.o + libc.so.6  →  ออก: main (executable, 70,776 ไบต์)</text>
<text class="lbl" x="118" y="598">linker หา symbol ที่ "หาย" แล้วต่อให้ครบ · ค่าที่ไม่เจอ = undefined reference</text>
<line class="arrow" x1="84" y1="625" x2="84" y2="633" marker-end="url(#a-n)"/>
<rect class="band" x="40" y="632" width="960" height="126" rx="10"/>
<circle cx="84" cy="662" r="15" fill="#0969da"/>
<text class="monob" x="84" y="667" text-anchor="middle" fill="#ffffff">5</text>
<text class="ptitle" x="118" y="660">ตอนรัน — ตัวโหลด (loader) ยกโปรแกรมเข้า RAM</text>
<text class="mono" x="118" y="684">เครื่องมือ: kernel + ld-linux-aarch64.so.1 (dynamic loader) · คำสั่ง: ./main 250</text>
<text class="mono" x="118" y="708">อ่าน header ของ ELF → จองหน่วยความจำ → โหลด libc.so.6 → กระโดดไปที่ _start</text>
<text class="lbl" x="118" y="732">ขั้นนี้อยู่นอก gcc: symbol ของ libc ที่ยัง U 6 ตัว (printf/strtol/stderr เป็นต้น) ถูกเติมตอนนี้</text>
<text class="lbl" x="40" y="784">หมายเหตุ: ทุกขั้นทำงานกับ "ข้อความ/ไฟล์" ไม่ใช่ "ความหมาย" ยกเว้นขั้นที่ 2 · gcc -save-temps เก็บไฟล์กลางทั้งหมดไว้ให้ดู</text>
</svg>