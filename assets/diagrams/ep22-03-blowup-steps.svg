<text class="hdr" x="40" y="36">จำนวนก้าวจริง: งานเดียวกันเป๊ะ แต่ต่างกันแค่ใส่วงเล็บเกินมาคู่นึง</text>
<text class="sub" x="40" y="60">pattern (a+)+b กับ pattern a+b รู้จักภาษาเดียวกันเป๊ะ · input = a×n ที่ไม่มี b ปิดท้าย (ไม่มีทางสำเร็จ)</text>
<text class="sub" x="40" y="80">แกนตั้งเป็นสเกลลอการิทึม (แต่ละขีด = คูณ 100) เพราะผลต่างสูงถึงหลักสิบล้านเท่า</text>
