<text class="txt" x="40" y="500" text-anchor="start">HTTP/2 ส่ง 4 คำขอพร้อมกันบน 1 connection — HTTP/1.1 ต้องเปิด 4 connection เพื่อทำแบบเดียวกัน</text>
<text class="txt" x="40" y="528" text-anchor="start">HPACK: header ชุดเดิม 119 ไบต์ → 90 ไบต์ (บล็อกแรก) → 34 ไบต์ (บล็อกถัดไป) ประหยัด 56% ในการส่ง 3 ครั้ง</text>
<text class="lbl" x="40" y="556" text-anchor="start">แบบจำลอง HOL (out/08_quic.txt): TCP ถูกบล็อก 6 slot, QUIC ถูกบล็อก 2 slot — ช่อง HTTP/3 วาดตามแบบจำลองนี้ ไม่ได้วัดจาก packet จริง</text>
