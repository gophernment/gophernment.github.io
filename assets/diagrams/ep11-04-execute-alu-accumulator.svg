<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-label="ขั้น execute: ALU บวกค่าใน ACC กับค่าจาก RAM แล้วเก็บผลที่ ACC">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12.5px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 17px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .sub { fill: #57606a; font-size: 12px; }
    .tiny { font-size: 11px; fill: #57606a; }
    .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; fill: #0969da; }
    .monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #1a1a1a; }
    .val { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
    .th { font-weight: 700; font-size: 12px; fill: #57606a; }
    .lbl { font-size: 12px; fill: #57606a; }
    .bold { font-weight: 700; fill: #1a1a1a; }
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .panelb { fill: #f6f8fa; stroke: #0969da; stroke-width: 1.4; }
    .block { fill: #eef4ff; stroke: #0969da; stroke-width: 1.6; }
    .ctrl { fill: #fff4e5; stroke: #bc4c00; stroke-width: 1.6; }
    .ff { fill: #f3f0ff; stroke: #6639ba; stroke-width: 1.6; }
    .mem { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.6; }
    .dashed { fill: #fbfcfd; stroke: #8250df; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .wire { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .ctrlw { stroke: #bc4c00; stroke-width: 1.6; fill: none; }
    .clkw { stroke: #1a7f37; stroke-width: 2; fill: none; }
    .row { fill: #ffffff; stroke: #eaeef2; stroke-width: 1; }
    .rowg { fill: #f6f8fa; stroke: #eaeef2; stroke-width: 1; }
    .hrow { fill: #eaeef2; }
    .thline { stroke: #d0d7de; stroke-width: 1.2; }
    .dot { fill: #57606a; }
    .badge { fill: #0969da; }
    .badget { fill: #ffffff; font-weight: 700; font-size: 11px; }
  </style>
  <defs>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="a-ctrl" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
    <marker id="a-clk" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
  </defs>
  <text class="hdr" x="480" y="32" text-anchor="middle">ขั้นที่ 3 — EXECUTE: ALU ลงมือคำนวณ แล้วผลลัพธ์ถูกเก็บที่ ACC</text>
  <rect class="panel" x="20" y="52" width="920" height="330" rx="10"/>
  <text class="ptitle" x="40" y="80" text-anchor="start">A. ตัวอย่างจริง: คำสั่ง ADD 11 = ดึงค่าจาก RAM[11] มาบวกกับค่าใน ACC</text>
  <text class="sub" x="40" y="102" text-anchor="start">ACC (accumulator) = ที่พักผลสะสม — คำว่า 'บวกต่อ' ในทุกโปรแกรมของเราอาศัยตัวนี้</text>
  <rect class="ff" x="60" y="130" width="190" height="54" rx="10"/>
  <text class="monob" x="155.0" y="152.24" text-anchor="middle">IR = 0111</text>
  <text class="tiny" x="155.0" y="169.24" text-anchor="middle">ADD address 11</text>
  <rect class="ctrl" x="330" y="140" width="200" height="60" rx="10"/>
  <text class="monob" x="430.0" y="165.24" text-anchor="middle">ADD_EN = 1</text>
  <text class="tiny" x="430.0" y="182.24" text-anchor="middle">สัญญาณจาก Control Unit</text>
  <line class="ctrlw" x1="430" y1="200" x2="430" y2="240" marker-end="url(#a-ctrl)"/>
  <rect class="ff" x="60" y="220" width="160" height="60" rx="10"/>
  <text class="monob" x="140.0" y="245.24" text-anchor="middle">ACC เดิม</text>
  <text class="val" x="140.0" y="262.24" text-anchor="middle">0011 = 3</text>
  <rect class="ff" x="60" y="290" width="160" height="60" rx="10"/>
  <text class="monob" x="140.0" y="315.24" text-anchor="middle">RAM[11]</text>
  <text class="val" x="140.0" y="332.24" text-anchor="middle">0100 = 4</text>
  <rect class="block" x="330" y="240" width="200" height="90" rx="10"/>
  <text class="monob" x="430.0" y="271.74" text-anchor="middle">ALU</text>
  <text class="val" x="430.0" y="288.74" text-anchor="middle">A + B</text>
  <text class="tiny" x="430.0" y="305.74" text-anchor="middle">(วงจรบวกจากตอน 09)</text>
  <rect class="ff" x="650" y="240" width="170" height="64" rx="10"/>
  <text class="monob" x="735.0" y="267.24" text-anchor="middle">ACC ใหม่</text>
  <text class="val" x="735.0" y="284.24" text-anchor="middle">0111 = 7</text>
  <line class="wire" x1="220" y1="250" x2="330" y2="250" marker-end="url(#a-grey)"/>
  <polyline class="wire" points="220,340 285,340 285,310 330,310" marker-end="url(#a-grey)"/>
  <line class="wire" x1="530" y1="280" x2="650" y2="280" marker-end="url(#a-grey)"/>
  <text class="tiny" x="540" y="272" text-anchor="start">ผลลัพธ์</text>
  <circle class="badge" cx="270" cy="238" r="10"/>
  <text class="badget" x="270" y="242" text-anchor="middle">1</text>
  <circle class="badge" cx="252" cy="328" r="10"/>
  <text class="badget" x="252" y="332" text-anchor="middle">2</text>
  <circle class="badge" cx="568" cy="240" r="10"/>
  <text class="badget" x="568" y="244" text-anchor="middle">3</text>
  <text class="lbl" x="60" y="366" text-anchor="start">ตัวเลขที่ไหลในภาพนี้เป็นเลข 4 บิต (ตอน 08): 0011 = 3 · 0100 = 4 · 0111 = 7</text>
  <rect class="panelb" x="20" y="400" width="920" height="280" rx="10"/>
  <text class="ptitle" x="40" y="428" text-anchor="start">B. สามคำสั่งที่เหลือทำอะไรกับ ACC และ RAM</text>
  <rect class="block" x="40" y="450" width="270" height="150" rx="10"/>
  <text class="monob" x="175.0" y="486.24" text-anchor="middle">LOAD addr</text>
  <text class="val" x="175.0" y="503.24" text-anchor="middle">ACC ← RAM[addr]</text>
  <text class="tiny" x="175.0" y="520.24" text-anchor="middle">ค่าถูก 'ก๊อป' จาก RAM</text>
  <text class="tiny" x="175.0" y="537.24" text-anchor="middle">เข้ามาพักที่ ACC</text>
  <text class="tiny" x="175.0" y="554.24" text-anchor="middle"></text>
  <text class="tiny" x="175.0" y="571.24" text-anchor="middle">ตัวอย่าง: LOAD 10 → ACC = 3</text>
  <rect class="ctrl" x="340" y="450" width="270" height="150" rx="10"/>
  <text class="monob" x="475.0" y="486.24" text-anchor="middle">ADD addr</text>
  <text class="val" x="475.0" y="503.24" text-anchor="middle">ACC ← ACC + RAM[addr]</text>
  <text class="tiny" x="475.0" y="520.24" text-anchor="middle">ผลบวกของค่าเดิมกับค่าใหม่</text>
  <text class="tiny" x="475.0" y="537.24" text-anchor="middle">ค้างอยู่ใน ACC ต่อ</text>
  <text class="tiny" x="475.0" y="554.24" text-anchor="middle"></text>
  <text class="tiny" x="475.0" y="571.24" text-anchor="middle">ตัวอย่าง: ADD 11 → ACC = 3 + 4 = 7</text>
  <rect class="mem" x="640" y="450" width="270" height="150" rx="10"/>
  <text class="monob" x="775.0" y="486.24" text-anchor="middle">STORE addr</text>
  <text class="val" x="775.0" y="503.24" text-anchor="middle">RAM[addr] ← ACC</text>
  <text class="tiny" x="775.0" y="520.24" text-anchor="middle">เขียนค่าที่พักใน ACC</text>
  <text class="tiny" x="775.0" y="537.24" text-anchor="middle">กลับลง RAM</text>
  <text class="tiny" x="775.0" y="554.24" text-anchor="middle"></text>
  <text class="tiny" x="775.0" y="571.24" text-anchor="middle">OUT: ACC → LED (แสดงผล)</text>
  <text class="lbl" x="40" y="620" text-anchor="start">ทำไมต้องมี ACC: ALU ของเราบวกได้ทีละสองค่า (จากตอน 09) คำสั่ง ADD จึงต้องเก็บ 'ผลสะสม' ไว้ที่ ACC แล้วรอบถัดไปก็บวกต่อจากตรงนั้น</text>
  <text class="lbl" x="40" y="644" text-anchor="start">ส่วน STORE คือทางเดียวที่ค่าจะ 'กลับลงไปนอน' ใน RAM — ถ้าไม่ STORE ค่านั้นจะอยู่แค่ใน ACC และหายไปเมื่อโปรแกรมโหลดค่าอื่นทับ</text>
</svg>
