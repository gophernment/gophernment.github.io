<rect x="35" y="632" width="590" height="96" rx="10" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="55" y="662" class="hd">C ตัดออก 5 จาก 8 การกระทำ</text>
<text x="55" y="686" class="s">และเหลือ high-impact 0 จาก 7 — ไม่มีทางแตะเงิน กุญแจ หรือ PII</text>
<text x="55" y="708" class="sm">granted ทั้งระบบ 15 คู่ (บัญชี, สิทธิ์) เทียบกับ 56 ของแบบ B</text>
<rect x="645" y="632" width="600" height="96" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<text x="665" y="662" class="hd">A กับ B ต่างกันแค่จำนวนบัญชี</text>
<text x="665" y="686" class="s">ผลการทดสอบเหมือนกันทุกช่อง — แยกบัญชีแต่ให้ * = ไม่ได้ลดอะไร</text>
<text x="665" y="708" class="sm">least privilege วัดที่ขอบเขตของสิทธิ์ ไม่ใช่วัดที่จำนวนบัญชี</text>
<text x="640" y="762" class="sm" text-anchor="middle">ตัวเลขทั้งหมดอ่านจาก out/01_rbac.txt (perms_total=14, allowed=3/8, high_impact=0/7)</text>
<text x="640" y="786" class="sm" text-anchor="middle">A = บัญชีเดียว · B = แยกบัญชี + wildcard · C = แยกบัญชี + เฉพาะที่ใช้</text>
