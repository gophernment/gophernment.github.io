<text x="640" y="40" class="h" text-anchor="middle">least privilege: สิทธิ์ที่ "ให้" กับสิทธิ์ที่ "งานต้องใช้" เป็นคนละจำนวน</text>
<text x="640" y="66" class="s" text-anchor="middle">ระบบวางบิล 4 service · 14 permission · สมมติ report-worker ถูกยึด</text>
<rect x="35" y="96" width="385" height="186" rx="10" fill="#fdeeee" stroke="#c05050" stroke-width="1.5"/>
<text x="57" y="132" class="n">A</text>
<text x="95" y="124" class="hd">บัญชีเดียว ใช้ร่วมทุก service</text>
<text x="95" y="144" class="sm">บัญชี: db_superuser</text>
<text x="57" y="176" class="m">accounts=1   granted=14</text>
<text x="57" y="198" class="m">mean reach=14.0/14   max=14/14</text>
<text x="57" y="226" class="sm">ถ้า report-worker ถูกยึด:</text>
<text x="57" y="248" class="bad">allowed=8/8  high-impact=7/7</text>
<text x="57" y="270" class="sm">permission ที่ attacker ได้ทันที</text>
<rect x="440" y="96" width="385" height="186" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="1.5"/>
<text x="462" y="132" class="n">B</text>
<text x="500" y="124" class="hd">แยกบัญชี แต่ให้สิทธิ์เหมา (*)</text>
<text x="500" y="144" class="sm">บัญชี: svc_*</text>
<text x="462" y="176" class="m">accounts=4   granted=56</text>
<text x="462" y="198" class="m">mean reach=14.0/14   max=14/14</text>
<text x="462" y="226" class="sm">ถ้า report-worker ถูกยึด:</text>
<text x="462" y="248" class="bad">allowed=8/8  high-impact=7/7</text>
<text x="462" y="270" class="sm">permission ที่ attacker ได้ทันที</text>
<rect x="845" y="96" width="385" height="186" rx="10" fill="#eefaf1" stroke="#3f9c63" stroke-width="2.2"/>
<text x="867" y="132" class="n">C</text>
<text x="905" y="124" class="hd">แยกบัญชี + เฉพาะที่ใช้จริง</text>
<text x="905" y="144" class="sm">บัญชี: svc_* (แคบ)</text>
<text x="867" y="176" class="m">accounts=4   granted=15</text>
<text x="867" y="198" class="m">mean reach=3.8/14   max=5/14</text>
<text x="867" y="226" class="sm">ถ้า report-worker ถูกยึด:</text>
<text x="867" y="248" class="good">allowed=3/8  high-impact=0/7</text>
<text x="867" y="270" class="sm">permission ที่ attacker ได้ทันที</text>
<text x="35" y="318" class="sm"># แปดการกระทำที่ลองในนามของ report-worker ที่ถูกยึด</text>
