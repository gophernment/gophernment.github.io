<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-label="เทียบโครงสร้างโปรแกรมและ syntax ระหว่าง C กับ Go">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 17.5px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .sub { fill: #57606a; font-size: 12.5px; }
    .lbl { fill: #57606a; font-size: 11.5px; }
    .tiny { fill: #57606a; font-size: 11px; }
    .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
    .monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #0550ae; }
    .big { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 20px; font-weight: 700; fill: #1a7f37; }
    .addr { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #57606a; }
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .cell { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .cellhi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.9; }
    .notebox { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.3; }
    .cbox { fill: #eef4ff; stroke: #0969da; stroke-width: 1.3; }
    .gobox { fill: #e6f4ff; stroke: #0a7ea4; stroke-width: 1.3; }
    .rowband { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .wire { stroke: #1a7f37; stroke-width: 2.2; fill: none; }
    .wire2 { stroke: #57606a; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="arr-n" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="660" fill="#ffffff"/>

<text class="hdr" x="480" y="34" text-anchor="middle">C กับ Go หน้าตาใกล้กันมาก — ต่างกันที่ "ใครดูแลหน่วยความจำ"</text>
<text class="sub" x="480" y="58" text-anchor="middle">อ่านทีละแถว: ซ้ายคือ C ขวาคือ Go — งานเดียวกัน เขียนคนละแบบ</text>
<text class="ptitle" x="46" y="88" fill="#0969da">ภาษา C</text>
<text class="ptitle" x="496" y="88" fill="#0a7ea4">ภาษา Go</text>
<rect class="rowband" x="40" y="104" width="880" height="130" rx="10"/>
<text class="ptitle" x="56" y="128">โครงสร้างโปรแกรมที่รันได้</text>
<text class="mono" x="56" y="152">#include &lt;stdio.h&gt;</text>
<text class="mono" x="56" y="174">int main(void) {</text>
<text class="mono" x="56" y="196">    return 0;</text>
<text class="mono" x="56" y="218">}</text>
<text class="mono" x="506" y="152">package main</text>
<text class="mono" x="506" y="196">func main() {</text>
<text class="mono" x="506" y="218">}</text>
<rect class="rowband" x="40" y="244" width="880" height="108" rx="10"/>
<text class="ptitle" x="56" y="268">ประกาศตัวแปร + ชนิดข้อมูล</text>
<text class="mono" x="56" y="292">int x = 5;</text>
<text class="mono" x="56" y="314">double d = 3.14;</text>
<text class="mono" x="56" y="336">char c = 'A';</text>
<text class="mono" x="506" y="292">x := 5</text>
<text class="mono" x="506" y="314">var d float64 = 3.14</text>
<text class="mono" x="506" y="336">c := byte(65)</text>
<rect class="rowband" x="40" y="362" width="880" height="64" rx="10"/>
<text class="ptitle" x="56" y="386">พิมพ์ออกจอ</text>
<text class="mono" x="56" y="410">printf("%d\n", x);</text>
<text class="mono" x="506" y="410">fmt.Println(x)</text>
<rect class="rowband" x="40" y="436" width="880" height="64" rx="10"/>
<text class="ptitle" x="56" y="460">ข้อความ (string) — C ต้องพึ่ง array ของ char</text>
<text class="mono" x="56" y="484">char s[] = "hi";  /* ปิดท้าย '\0' */</text>
<text class="mono" x="506" y="484">s := "hi"  /* string มีในตัว */</text>
<rect class="notebox" x="40" y="510" width="880" height="142" rx="10"/>
<text class="ptitle" x="60" y="536">จุดต่างที่ต้องจำ:</text>
<text class="mono" x="60" y="560">• C: ชนิดเป็นเรื่องบังคับ และมี sizeof บอกขนาดจริงเป็นไบต์ — ไม่มี string, ไม่มี bool (ก่อน C99) ใช้ int แทน</text>
<text class="mono" x="60" y="584">• Go: มี string/bool ในตัว มี GC ล้างหน่วยความจำให้ — C ให้เราเป็นคนจัดการเอง (ตอน 16 จะเรียน malloc/free)</text>
<text class="mono" x="60" y="608">• ทั้งคู่มี if/else/for เหมือนกัน — แต่ C ไม่มี for range ต้องนับ index เอง</text>
<text class="mono" x="60" y="632">• switch มีทั้งคู่ แต่ C "ไหลตก" (fallthrough) เป็นค่าเริ่มต้น ไม่หยุดให้เองแบบ Go และ C ไม่มี type switch</text>
</svg>
