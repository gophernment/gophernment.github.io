<text x="58" y="438" class="hd">coverage current 45.5%  →  target 77.3%</text>
<text x="58" y="462" class="s">ตัวเลขนี้คือ "ทำได้กี่คะแนน" — ไม่ใช่ Tier และไม่ใช่คำตอบว่าปลอดภัยแค่ไหน</text>
<rect x="40" y="488" width="840" height="56" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="1.5"/>
<text x="58" y="512" class="hd">Tier วันนี้ = 2 (Risk Informed)</text>
<text x="58" y="534" class="s">Tier วัดความเข้มของ governance (มีนโยบาย/เจ้าของ/ทบทวนตามรอบ) ไม่ได้วัดจำนวน category</text>
