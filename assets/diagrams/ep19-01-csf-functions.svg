<text x="40" y="46" class="h">NIST CSF 2.0: หกฟังก์ชัน และช่องว่างขององค์กรตัวอย่าง</text>
<text x="40" y="74" class="s">แท่งทึบ = current profile (ทำได้วันนี้) · เส้นกรอบ = target profile (เป้าที่ตั้งไว้) · สเกล 0-4</text>
