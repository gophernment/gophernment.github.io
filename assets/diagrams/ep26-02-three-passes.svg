<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700" role="img">
<defs>
<style>
  .t  { font-family: sans-serif; font-size: 14px; fill: #12263a; }
  .s  { font-family: sans-serif; font-size: 12px; fill: #3b4a5a; }
  .sm { font-family: sans-serif; font-size: 11px; fill: #4a5b6c; }
  .h  { font-family: sans-serif; font-size: 21px; font-weight: 700; fill: #0b2545; }
  .hd { font-family: sans-serif; font-size: 14px; font-weight: 700; fill: #0b2545; }
  .n  { font-family: sans-serif; font-size: 19px; font-weight: 700; fill: #0b2545; }
  .m  { font-family: monospace; font-size: 12px; fill: #0b2545; }
  .mm { font-family: monospace; font-size: 11px; fill: #3b4a5a; }
  .bad { font-family: sans-serif; font-size: 12px; fill: #7a1f1f; }
  .good{ font-family: sans-serif; font-size: 12px; fill: #14532d; }
</style>
</defs>
<text x="24" y="36" class="h">สามท่าที่คนทำได้ด้วยตา — และช่องที่ทั้งสามท่าไม่เห็น</text>
<text x="24" y="58" class="s">5 ไฟล์ · 15 ฟังก์ชัน · 6 handler (out/02_audit.txt)</text>
<rect x="24" y="84" width="308" height="196" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<text x="36" y="112" class="hd">ท่า 1 · authz coverage</text>
<text x="36" y="140" class="s">handler ทั้งหมด 6 ตัว</text>
<text x="36" y="166" class="s">มีด่านตรวจ 5 ตัว</text>
<text x="36" y="192" class="s">ไม่มีด่าน 1 ตัว</text>
<text x="36" y="218" class="s">จับได้เพราะเรานิยามก่อนว่า</text>
<text x="36" y="244" class="s">"handler ทุกตัวต้องมีด่าน"</text>
<rect x="348" y="84" width="308" height="196" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="1.5"/>
<text x="360" y="112" class="hd">ท่า 2 · error path</text>
<text x="360" y="140" class="s">เจอ 2 จุด</text>
<text x="360" y="166" class="s">ผลของ CheckLength(...) ถูกทิ้ง</text>
<text x="360" y="192" class="s">log แล้วไปต่อถึง os.Create</text>
<text x="360" y="218" class="s">จับได้เพราะถามว่า</text>
<text x="360" y="244" class="s">"error แล้วใครหยุด?"</text>
<rect x="672" y="84" width="308" height="196" rx="10" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="684" y="112" class="hd">ท่า 3 · taint (local)</text>
<text x="684" y="140" class="s">เจอ 2 จุด</text>
<text x="684" y="166" class="s">จริง 1 · เตือนเกิน 1</text>
<text x="684" y="192" class="s">ไม่เห็นค่าที่ผ่าน field ของ struct</text>
<text x="684" y="218" class="s">จับได้เพราะตามค่า</text>
<text x="684" y="244" class="s">จาก FormValue ถึง sink</text>
<rect x="24" y="300" width="932" height="74" rx="10" fill="#f5f7f9" stroke="#9aa9b8" stroke-width="1.5"/>
<text x="36" y="328" class="s">ผลรวม 5 finding · เตือนเกิน 1 (ใช้ placeholder แล้ว) · พลาด 1 (ค่าผ่าน field ของ struct)</text>
<text x="36" y="352" class="sm">ทั้งสองอย่างถูกบันทึกไว้เป็น marker ใน fixture — ถ้าพฤติกรรมเปลี่ยน สคริปต์จะหยุดทันที</text>
<rect x="24" y="396" width="932" height="172" rx="10" fill="#fdeeee" stroke="#c05050" stroke-width="1.5"/>
<text x="40" y="424" class="hd">ไฟล์ที่ทั้งสามท่าบอกว่า "สะอาด" — และมันคือไฟล์ที่รันจริงในเดโม 3</text>
<text x="36" y="450" class="s">internal/ledger/refund.go · 0 finding จาก 2 ไฟล์</text>
<text x="36" y="478" class="bad">คืนเงิน 6,000 สองครั้ง จาก order 10,000 → คืนจริง 12,000 (เกิน 20%)</text>
<text x="36" y="506" class="s">มีด่านตรวจสิทธิ์ ใช้ placeholder จัดการ error ครบ — แต่ไม่มีใครถามว่า "คืนซ้ำได้ไหม"</text>
<text x="36" y="534" class="good">เวอร์ชันที่ตรวจยอดคงเหลือ: รับ 1 ครั้ง ปฏิเสธ 1 ครั้ง — ส่วนต่างอยู่ที่เงื่อนไขเดียว</text>
</svg>
