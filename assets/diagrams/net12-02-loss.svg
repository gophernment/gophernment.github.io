<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" role="img" aria-label="ของหายสองใบจากแปดใบ: ผู้รับได้หกคำตอบ ขาด seq 3 กับ 6 และส่งซ้ำสองใบแล้วได้ครบแปด">
<style>
text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12.5px; fill: #1a1a1a; }
.hdr { font-weight: 700; font-size: 17.5px; }
.sub { fill: #57606a; font-size: 12.5px; }
.ptitle { font-weight: 700; font-size: 14px; }
.txt { font-size: 12.5px; }
.lbl { fill: #57606a; font-size: 11px; }
.small { fill: #57606a; font-size: 10.5px; }
.big { font-weight: 700; font-size: 19px; fill: #0550ae; }
.mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 11.5px; fill: #0a3069; }
.monom { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; fill: #0a3069; }
.monos { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 10.5px; fill: #57606a; }
.onbar { font-size: 12px; font-weight: 600; }
.onbar2 { font-size: 10.5px; fill: #57606a; }
.boxg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
.boxb { fill: #eef4ff; stroke: #0969da; stroke-width: 1.5; }
.boxy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
.boxi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
.boxr { fill: #fdeff0; stroke: #b62324; stroke-width: 1.4; }
.cell { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.1; }
.cellA { fill: #dbeafe; stroke: #0969da; stroke-width: 1.2; }
.cellR { fill: #fdeff0; stroke: #b62324; stroke-width: 1.6; }
.wire { stroke: #8c959f; stroke-width: 1.8; fill: none; }
.wire2 { stroke: #b6bfc8; stroke-width: 1.2; fill: none; stroke-dasharray: 5 5; }
.head { fill: #8c959f; }
.rule { stroke: #d0d7de; stroke-width: 1.2; }
</style>
<rect x="0" y="0" width="920" height="560" fill="#ffffff"/>
<text class="hdr" x="40" y="34" text-anchor="start">ของหาย: ไม่มีใครส่งซ้ำให้ จนกว่าแอปจะเขียนเอง</text>
<text class="sub" x="40" y="58" text-anchor="start">ส่ง 8 datagram · server ทิ้ง 3,6 · client ได้ 6 คำตอบ</text>
<text class="lbl" x="50" y="90" text-anchor="start">client → server</text>
<rect class="cell" x="50.0" y="100.0" width="98.0" height="58.0" rx="5"/>
<text class="monos" x="99" y="122" text-anchor="middle">seq 1</text>
<text class="small" x="99" y="144" text-anchor="middle">ส่ง</text>
<line class="wire" x1="99.0" y1="158.0" x2="99.0" y2="190.0"/>
<polygon class="head" points="99.0,190.0 95.5,181.7 102.5,181.7"/>
<rect class="cell" x="157.0" y="100.0" width="98.0" height="58.0" rx="5"/>
<text class="monos" x="206" y="122" text-anchor="middle">seq 2</text>
<text class="small" x="206" y="144" text-anchor="middle">ส่ง</text>
<line class="wire" x1="206.0" y1="158.0" x2="206.0" y2="190.0"/>
<polygon class="head" points="206.0,190.0 202.5,181.7 209.5,181.7"/>
<rect class="cellR" x="264.0" y="100.0" width="98.0" height="58.0" rx="5"/>
<text class="monos" x="313" y="122" text-anchor="middle">seq 3</text>
<text class="small" x="313" y="144" text-anchor="middle">ทิ้ง</text>
<rect class="cell" x="371.0" y="100.0" width="98.0" height="58.0" rx="5"/>
<text class="monos" x="420" y="122" text-anchor="middle">seq 4</text>
<text class="small" x="420" y="144" text-anchor="middle">ส่ง</text>
<line class="wire" x1="420.0" y1="158.0" x2="420.0" y2="190.0"/>
<polygon class="head" points="420.0,190.0 416.5,181.7 423.5,181.7"/>
<rect class="cell" x="478.0" y="100.0" width="98.0" height="58.0" rx="5"/>
<text class="monos" x="527" y="122" text-anchor="middle">seq 5</text>
<text class="small" x="527" y="144" text-anchor="middle">ส่ง</text>
<line class="wire" x1="527.0" y1="158.0" x2="527.0" y2="190.0"/>
<polygon class="head" points="527.0,190.0 523.5,181.7 530.5,181.7"/>
<rect class="cellR" x="585.0" y="100.0" width="98.0" height="58.0" rx="5"/>
<text class="monos" x="634" y="122" text-anchor="middle">seq 6</text>
<text class="small" x="634" y="144" text-anchor="middle">ทิ้ง</text>
<rect class="cell" x="692.0" y="100.0" width="98.0" height="58.0" rx="5"/>
<text class="monos" x="741" y="122" text-anchor="middle">seq 7</text>
<text class="small" x="741" y="144" text-anchor="middle">ส่ง</text>
<line class="wire" x1="741.0" y1="158.0" x2="741.0" y2="190.0"/>
<polygon class="head" points="741.0,190.0 737.5,181.7 744.5,181.7"/>
<rect class="cell" x="799.0" y="100.0" width="98.0" height="58.0" rx="5"/>
<text class="monos" x="848" y="122" text-anchor="middle">seq 8</text>
<text class="small" x="848" y="144" text-anchor="middle">ส่ง</text>
<line class="wire" x1="848.0" y1="158.0" x2="848.0" y2="190.0"/>
<polygon class="head" points="848.0,190.0 844.5,181.7 851.5,181.7"/>
<text class="lbl" x="50" y="214" text-anchor="start">server → client</text>
<rect class="boxi" x="50.0" y="222.0" width="98.0" height="40.0" rx="5"/>
<text class="small" x="99" y="247" text-anchor="middle">ตอบ 1</text>
<rect class="boxi" x="157.0" y="222.0" width="98.0" height="40.0" rx="5"/>
<text class="small" x="206" y="247" text-anchor="middle">ตอบ 2</text>
<rect class="boxg" x="264.0" y="222.0" width="98.0" height="40.0" rx="5"/>
<text class="small" x="313" y="247" text-anchor="middle">ไม่ตอบ</text>
<rect class="boxi" x="371.0" y="222.0" width="98.0" height="40.0" rx="5"/>
<text class="small" x="420" y="247" text-anchor="middle">ตอบ 4</text>
<rect class="boxi" x="478.0" y="222.0" width="98.0" height="40.0" rx="5"/>
<text class="small" x="527" y="247" text-anchor="middle">ตอบ 5</text>
<rect class="boxg" x="585.0" y="222.0" width="98.0" height="40.0" rx="5"/>
<text class="small" x="634" y="247" text-anchor="middle">ไม่ตอบ</text>
<rect class="boxi" x="692.0" y="222.0" width="98.0" height="40.0" rx="5"/>
<text class="small" x="741" y="247" text-anchor="middle">ตอบ 7</text>
<rect class="boxi" x="799.0" y="222.0" width="98.0" height="40.0" rx="5"/>
<text class="small" x="848" y="247" text-anchor="middle">ตอบ 8</text>
<text class="txt" x="50" y="282" text-anchor="start">ฝั่ง client เห็น 6 ใบ · ขาด seq 3,6 · retransmits_sent 0</text>
<text class="small" x="50" y="304" text-anchor="start">datagrams_at_server 8 = datagrams_sent 8 — เท่ากันพอดี จึงไม่มี retransmission ใน transport</text>
<line class="rule" x1="40.0" y1="322.0" x2="880.0" y2="322.0"/>
<text class="lbl" x="40" y="346" text-anchor="start">ชั้นที่แอปต้องเขียนเอง: ส่งซ้ำเฉพาะใบที่ขาด</text>
<rect class="boxr" x="60.0" y="358.0" width="240.0" height="62.0" rx="7"/>
<text class="onbar" x="180" y="384" text-anchor="middle">ส่งซ้ำ seq 3</text>
<text class="monos" x="180" y="402" text-anchor="middle">หลังครบ deadline</text>
<rect class="boxr" x="330.0" y="358.0" width="240.0" height="62.0" rx="7"/>
<text class="onbar" x="450" y="384" text-anchor="middle">ส่งซ้ำ seq 6</text>
<text class="monos" x="450" y="402" text-anchor="middle">หลังครบ deadline</text>
<line class="wire" x1="584.0" y1="389.0" x2="636.0" y2="389.0"/>
<polygon class="head" points="636.0,389.0 627.7,392.5 627.7,385.5"/>
<rect class="boxi" x="648.0" y="358.0" width="232.0" height="62.0" rx="7"/>
<text class="onbar" x="764" y="384" text-anchor="middle">ได้ครบ 8 ใบ</text>
<text class="monos" x="764" y="402" text-anchor="middle">retransmits_sent 2</text>
<rect class="boxg" x="40.0" y="440.0" width="840.0" height="100.0" rx="8"/>
<text class="txt" x="58" y="464" text-anchor="start">ส่งสำเร็จ ≠ ถึงปลายทาง: Write บน UDP คืน nil แม้ datagram จะถูกทิ้งกลางทาง</text>
<text class="txt" x="58" y="488" text-anchor="start">แปดใบที่ส่ง ไม่มีใบไหนคืน error — สองใบแค่หายไปเงียบ ๆ</text>
<text class="small" x="58" y="512" text-anchor="start">seq ทำให้รู้ว่าอะไรหาย · deadline ทำให้รู้ว่าเมื่อไรควรเลิกรอ · retry ทำให้ได้ของครบ</text>
</svg>
