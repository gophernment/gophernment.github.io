<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-label="อธิบายการเก็บจำนวนเต็มลบด้วยวิธี two's complement หรือสองส่วนเติมเต็ม พร้อมตัวอย่าง int8 และการบวก 5 กับ -5 ที่ได้ศูนย์พอดี">
  <style>
    text { font-family: "Noto Sans Thai", -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 17px; }
    .hdrsm { font-weight: 700; font-size: 14.5px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #0969da; }
    .mono2 { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #1a1a1a; }
    .monob { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 700; }
    .lbl { fill: #57606a; font-size: 12px; }
    .lblred { fill: #cf222e; font-size: 12px; font-weight: 700; }
    .lblgreen { fill: #1a7f37; font-size: 12.5px; font-weight: 700; }
    .lblblue { fill: #0969da; font-size: 12.5px; font-weight: 700; }
    .th { font-weight: 700; font-size: 12.5px; fill: #57606a; }
    .panel { fill: #f6f8fa; stroke: #0969da; stroke-width: 1.5; }
    .panelg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .row { fill: #ffffff; stroke: #eaeef2; stroke-width: 1; }
    .rowhl { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.2; }
    .thline { stroke: #d0d7de; stroke-width: 1.2; }
  </style>

  <text class="hdr" x="450" y="30" text-anchor="middle">เก็บเลขลบยังไง: two's complement (สองส่วนเติมเต็ม)</text>

  <!-- ===== Panel A: ตาราง int8 ===== -->
  <rect class="panel" x="30" y="52" width="840" height="308" rx="10"/>
  <text class="hdrsm" x="50" y="78">int8 = จำนวนเต็ม 8 บิต · เก็บได้ −128 ถึง 127 (ไม่ใช่ 0 ถึง 255)</text>
  <text class="lbl" x="50" y="98">บิตซ้ายสุด (บิตที่ 7) ทำหน้าที่เป็นตัวบอกเครื่องหมาย — 0 = บวก, 1 = ลบ</text>

  <text class="th" x="60" y="126">ค่า (int8)</text>
  <text class="th" x="240" y="126">บิตทั้ง 8</text>
  <text class="th" x="560" y="126">ถ้าเผลออ่านเป็น uint8</text>
  <line class="thline" x1="50" y1="134" x2="850" y2="134"/>

  <rect class="row" x="50" y="142" width="800" height="30" rx="3"/>
  <text class="mono2" x="60" y="162">0</text>
  <text class="mono" x="240" y="162">0000 0000</text>
  <text class="mono" x="560" y="162">0</text>

  <rect class="row" x="50" y="174" width="800" height="30" rx="3"/>
  <text class="mono2" x="60" y="194">1</text>
  <text class="mono" x="240" y="194">0000 0001</text>
  <text class="mono" x="560" y="194">1</text>

  <rect class="row" x="50" y="206" width="800" height="30" rx="3"/>
  <text class="mono2" x="60" y="226">127</text>
  <text class="mono" x="240" y="226">0111 1111</text>
  <text class="mono" x="560" y="226">127</text>

  <rect class="rowhl" x="50" y="238" width="800" height="30" rx="3"/>
  <text class="monob" x="60" y="258" fill="#cf222e">-1</text>
  <text class="monob" x="240" y="258" fill="#cf222e">1111 1111</text>
  <text class="monob" x="560" y="258" fill="#cf222e">255</text>

  <rect class="rowhl" x="50" y="270" width="800" height="30" rx="3"/>
  <text class="monob" x="60" y="290" fill="#cf222e">-2</text>
  <text class="monob" x="240" y="290" fill="#cf222e">1111 1110</text>
  <text class="monob" x="560" y="290" fill="#cf222e">254</text>

  <rect class="rowhl" x="50" y="302" width="800" height="30" rx="3"/>
  <text class="monob" x="60" y="322" fill="#cf222e">-128</text>
  <text class="monob" x="240" y="322" fill="#cf222e">1000 0000</text>
  <text class="monob" x="560" y="322" fill="#cf222e">128</text>

  <text class="lblred" x="50" y="350">บิตชุดเดิมเป๊ะ! ต่างกันแค่ "วิธีตีความ" — int8 กับ uint8 มองบิตแบบ 1111 1111 แล้วได้คนละค่า</text>

  <!-- ===== Panel B: สูตร + การบวก ===== -->
  <rect class="panelg" x="30" y="376" width="840" height="258" rx="10"/>
  <text class="hdrsm" x="50" y="402">สูตร: จำนวนลบ −x เก็บเป็น (กลับบิตของ x ทั้งหมด) แล้วบวก 1 — เขียนว่า ^x + 1</text>

  <text class="mono2" x="60" y="432">  x =   5  → 0000 0101</text>
  <text class="mono2" x="60" y="456"> ^x       → 1111 1010   (กลับทุกบิต: 0→1, 1→0)</text>
  <text class="mono2" x="60" y="480"> ^x + 1   → 1111 1011   = ค่าของ -5</text>

  <line class="thline" x1="50" y1="498" x2="850" y2="498"/>
  <text class="lblblue" x="50" y="522">ทำไมต้องทำแบบนี้? เพื่อให้ "5 + (-5) = 0" ด้วยการบวกธรรมดา ไม่ต้องมีวงจรลบแยกในซีพียู</text>

  <text class="mono2" x="60" y="552">  0000 0101   (5)</text>
  <text class="mono2" x="60" y="576">+ 1111 1011   (-5)</text>
  <text class="mono2" x="60" y="600">= 1 0000 0000</text>
  <text class="lblgreen" x="300" y="600">← บิตเกิน 8 ตัวหลุดหายไป เหลือ 0000 0000 = 0 พอดี</text>
  <text class="lbl" x="60" y="622">ผลลัพธ์นี้คือเหตุผลที่จำนวนเต็มลบ 1 ตัว ยังกินพื้นที่เท่าเดิม และการ "ลบ" ในซีพียูคือ "บวกด้วยค่าลบ"</text>
</svg>
