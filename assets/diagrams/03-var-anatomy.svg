<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="กายวิภาคของตัวแปร: ชื่อป้าย, ชนิด, ค่า">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans Thai", -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }
    .box { fill: #ffffff; stroke: #0969da; stroke-width: 1.5; }
    .muted { fill: #6b7280; font-size: 12px; }
    .lbl { font-weight: 700; font-size: 14px; }
  </style>

  <text class="mono" x="380" y="40" text-anchor="middle">var age int = 30</text>

  <line x1="356" y1="48" x2="150" y2="144" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="394" y1="48" x2="380" y2="144" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="442" y1="48" x2="610" y2="144" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect class="box" x="30" y="150" width="230" height="72" rx="8"/>
  <text class="lbl" x="145" y="178" text-anchor="middle">ชื่อป้าย (identifier)</text>
  <text class="muted" x="145" y="199" text-anchor="middle"><tspan class="mono" font-size="12.5">= age</tspan></text>

  <rect class="box" x="265" y="150" width="230" height="72" rx="8"/>
  <text class="lbl" x="380" y="178" text-anchor="middle">ชนิด (type)</text>
  <text class="muted" x="380" y="199" text-anchor="middle">ของที่ใส่ได้ = <tspan class="mono" font-size="12.5">int</tspan> (เลขจำนวนเต็ม)</text>

  <rect class="box" x="500" y="150" width="230" height="72" rx="8"/>
  <text class="lbl" x="615" y="178" text-anchor="middle">ค่า (value)</text>
  <text class="muted" x="615" y="199" text-anchor="middle">ที่ใส่ในกล่องตอนแรก = <tspan class="mono" font-size="12.5">30</tspan></text>
</svg>
