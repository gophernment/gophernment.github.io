<text class="txt" x="60" y="538" text-anchor="start">switch อ่านแค่ 14 ไบต์ (105 ส่วนในพันของ frame) จึงตัดสินใจได้เร็ว — proxy ต้องอ่านครบทั้ง 133 ไบต์ก่อนจะรู้ว่าควรทำอะไร</text>
<text class="small" x="60" y="560" text-anchor="start">นี่คือเหตุผลเชิงกลไกที่ L4 load balancer เร็วกว่า L7 proxy และเป็นเหตุผลที่ proxy พังง่ายกว่าเมื่อโปรโตคอลเปลี่ยน</text>
