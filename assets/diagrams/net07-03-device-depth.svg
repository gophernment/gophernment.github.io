<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 600" width="1030" height="600" role="img" aria-label="อุปกรณ์ห้าชนิดอ่าน frame 133 ไบต์ได้ลึกไม่เท่ากัน: hub 0, switch 14, router 34, firewall 54, proxy 133">
