<text class="small" x="560" y="300" text-anchor="start">ฟ้าอ่อนที่ต่อเนื่อง = ความจุที่ถูกกันไว้ทั้งที่ไม่มีข้อมูลวิ่ง</text>
<text class="small" x="560" y="318" text-anchor="start">ช่วงนั้น flow อื่นเอาไปใช้ไม่ได้เลย</text>
<text class="small" x="560" y="348" text-anchor="start">circuit: ปฏิเสธคอลรวม 88 tick | packet: คิวสูงสุด 18 packet</text>
<text class="small" x="560" y="384" text-anchor="start">เส้นตั้ง: เขียว = packet จบ tick 94 · ทอง = circuit จบ tick 122</text>
<text class="small" x="560" y="366" text-anchor="start">ทั้งคู่ส่งครบ 96 packet — ต่างกันที่ใครได้ใช้ link ระหว่างทาง</text>
<rect class="boxy" x="24" y="430" width="316" height="200" rx="10"/>
<text class="ptitle" x="42" y="460" text-anchor="start">circuit switching</text>
<line class="rule" x1="42" y1="472" x2="322" y2="472"/>
<text class="big" x="42" y="506" text-anchor="start">เสร็จที่ tick 122</text>
<text class="txt" x="42" y="538" text-anchor="start">ทุก link รวม: จองเปล่า 236 slot</text>
<text class="txt" x="42" y="564" text-anchor="start">คอลที่ถูกบล็อก 88 tick</text>
<text class="txt" x="42" y="590" text-anchor="start">ใช้ link คอขวด 39.3%</text>
<rect class="boxi" x="362" y="430" width="316" height="200" rx="10"/>
<text class="ptitle" x="380" y="460" text-anchor="start">packet switching</text>
<line class="rule" x1="380" y1="472" x2="660" y2="472"/>
<text class="big" x="380" y="506" text-anchor="start">เสร็จที่ tick 94</text>
<text class="txt" x="380" y="538" text-anchor="start">ไม่มี slot ที่จองทิ้งไว้</text>
<text class="txt" x="380" y="564" text-anchor="start">คิวสูงสุด 18 · ต้องรอในคิว</text>
<text class="txt" x="380" y="590" text-anchor="start">ใช้ link คอขวด 51.1%</text>
<rect class="boxb" x="700" y="430" width="316" height="200" rx="10"/>
<text class="ptitle" x="718" y="460" text-anchor="start">ส่วนต่าง</text>
<line class="rule" x1="718" y1="472" x2="998" y2="472"/>
<text class="big" x="718" y="506" text-anchor="start">ใช้เวลาน้อยลง 23.0%</text>
<text class="txt" x="718" y="538" text-anchor="start">ทุกคอลได้ใช้ ไม่มีใครถูกปฏิเสธ</text>
<text class="txt" x="718" y="564" text-anchor="start">แลกมาด้วยคิวและ delay ที่ไม่คงที่</text>
<text class="txt" x="718" y="590" text-anchor="start">นี่คือรากของ internet วันนี้</text>
<text class="small" x="530" y="654" text-anchor="middle">ที่มาของตัวเลข: out/05_compare.txt และ out/06_timeline.txt (seed 20261112, ทุกอย่างเป็น tick ไม่ใช้เวลาจริง — รันซ้ำได้ผลเดิม)</text>
<text class="small" x="530" y="676" text-anchor="middle">แบบจำลอง: circuit จอง 1 channel/tick ตลอดช่วงถือสาย · packet ใช้ความจุที่ว่างแบบแย่งกันใช้ ไม่มีการจอง</text>
</svg>
