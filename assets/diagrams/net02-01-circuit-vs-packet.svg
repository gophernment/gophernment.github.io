<text class="small" x="44" y="130" text-anchor="start">ชื่อ node ตาม ARPANET 4 node แรก + BBN (ผู้สร้าง IMP)</text>
<text class="monos" x="44" y="150" text-anchor="start">F1 UCLA->UTAH · F2 UCSB->UTAH · F3 BBN->UTAH</text>
