<rect x="0" y="0" width="1060" height="726" fill="#ffffff"/>
<text class="hdr" x="530" y="38" text-anchor="middle">circuit จองช่องทั้ง session — packet แชร์ link เป็นก้อน</text>
<text class="sub" x="530" y="62" text-anchor="middle">กราฟเดียวกัน งานเดียวกัน 96 packet บน link คอขวด 2 slot/tick — ตัวเลขทุกตัวอ่านจาก out/ ของเดโม</text>
<rect class="boxg" x="24" y="84" width="496" height="336" rx="10"/>
