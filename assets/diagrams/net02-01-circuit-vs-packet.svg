<text class="small" x="44" y="396" text-anchor="start">เส้นหนา = คอขวด 2 slot/tick (SRI--UTAH)</text>
<text class="small" x="44" y="414" text-anchor="start">เส้นประ = ทางอ้อมที่ routing ไม่เลือกในเดโมนี้</text>
