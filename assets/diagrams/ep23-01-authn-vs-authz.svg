<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 566" width="980" height="566" role="img">
<defs>
<style>
  .t  { font-family: sans-serif; font-size: 14px; fill: #12263a; }
  .s  { font-family: sans-serif; font-size: 12px; fill: #3b4a5a; }
  .sm { font-family: sans-serif; font-size: 11px; fill: #4a5b6c; }
  .h  { font-family: sans-serif; font-size: 21px; font-weight: 700; fill: #0b2545; }
  .hd { font-family: sans-serif; font-size: 15px; font-weight: 700; fill: #0b2545; }
  .n  { font-family: sans-serif; font-size: 19px; font-weight: 700; fill: #0b2545; }
  .m  { font-family: monospace; font-size: 12px; fill: #0b2545; }
  .mm { font-family: monospace; font-size: 11px; fill: #3b4a5a; }
  .bad { font-family: sans-serif; font-size: 12px; fill: #7a1f1f; }
  .good{ font-family: sans-serif; font-size: 12px; fill: #14532d; }
</style>
</defs>
<text x="24" y="38" class="h">Authentication กับ Authorization — คนละคำถาม คนละด่าน</text>
<text x="24" y="62" class="s">request เดียวกันต้องผ่านสามชั้นตรวจก่อนถึง handler · ตัวเลขจาก out/01_broken.txt</text>
<rect x="24" y="92" width="222" height="146" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<text x="34" y="120" class="hd">1 authentication</text>
<text x="34" y="148" class="s">token นี้เป็นของใคร</text>
<text x="34" y="172" class="s">ผ่าน = รู้ว่าเป็น alice</text>
<text x="34" y="196" class="s">ไม่ผ่าน = 401</text>
<line x1="247" y1="164" x2="259" y2="164" stroke="#4a7bb5" stroke-width="1.6"/>
<polygon points="259,164 251,159 251,169" fill="#4a7bb5"/>
<rect x="260" y="92" width="222" height="146" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="1.5"/>
<text x="270" y="120" class="hd">2 function level</text>
<text x="270" y="148" class="s">เรียก endpoint นี้ได้ไหม</text>
<text x="270" y="172" class="s">member ห้าม GET /admin/users</text>
<text x="270" y="196" class="s">ไม่ผ่าน = 403</text>
<line x1="483" y1="164" x2="495" y2="164" stroke="#4a7bb5" stroke-width="1.6"/>
<polygon points="495,164 487,159 487,169" fill="#4a7bb5"/>
<rect x="496" y="92" width="222" height="146" rx="10" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="506" y="120" class="hd">3 object level</text>
<text x="506" y="148" class="s">object นี้ของเขาไหม</text>
<text x="506" y="172" class="s">เจ้าของอ่านจากฐานข้อมูล</text>
<text x="506" y="196" class="s">ไม่ผ่าน = 403</text>
<line x1="719" y1="164" x2="731" y2="164" stroke="#4a7bb5" stroke-width="1.6"/>
<polygon points="731,164 723,159 723,169" fill="#4a7bb5"/>
<rect x="732" y="92" width="222" height="146" rx="10" fill="#f5f7f9" stroke="#9aa9b8" stroke-width="1.5"/>
<text x="742" y="120" class="hd">4 handler</text>
<text x="742" y="148" class="s">ทำงานจริงกับข้อมูล</text>
<text x="742" y="172" class="s">ชั้นเดียวที่แตะข้อมูล</text>
<rect x="24" y="262" width="932" height="132" rx="10" fill="#fdeeee" stroke="#c05050" stroke-width="1.5"/>
<text x="40" y="290" class="hd">ตรวจแค่ชั้น 1 (แบบที่เจอบ่อย): ล็อกอินผ่าน = ผ่านทุกอย่าง</text>
<text x="34" y="314" class="s">ผู้ใช้ที่ล็อกอินแล้วแต่ไม่มีสิทธิ์ทำได้สำเร็จ 4/4 กรณี</text>
<text x="34" y="338" class="s">อ่านและลบเอกสารคนอื่นได้ · เห็นรายชื่อผู้ใช้ทั้งระบบได้ · แต่งตั้งตัวเองเป็น admin ได้</text>
<text x="34" y="362" class="bad">เซิร์ฟเวอร์นี้กันคน "ไม่ล็อกอิน" ได้จริง (401) — แต่ไม่ได้ตอบคำถามข้อที่สองเลย</text>
<rect x="24" y="410" width="932" height="132" rx="10" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="40" y="438" class="hd">ตรวจครบทุกชั้น: ปฏิเสธที่ server และปฏิเสธเป็นค่าเริ่มต้น</text>
<text x="34" y="462" class="s">ผู้ใช้ที่ไม่มีสิทธิ์ผ่านได้ 0/4 กรณี · ถูกปฏิเสธ 4/4 กรณี</text>
<text x="34" y="486" class="s">เจ้าของยังเข้าถึงเอกสารของตัวเองได้ (200) — สิทธิ์ที่ควรมีไม่หายไปไหน</text>
<text x="34" y="510" class="sm">ตัวเลขบนภาพทุกตัวอ่านจาก out/01_broken.txt — ไม่มีตัวไหนพิมพ์ด้วยมือ</text>
</svg>
