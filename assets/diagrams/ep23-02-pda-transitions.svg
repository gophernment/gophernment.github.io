<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" width="1060" height="700" role="img" aria-label="transition diagram ของ PDA วงเล็บสมดุล และ PDA ของภาษา a^n b^n">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 19px; }
    .sub { fill: #57606a; font-size: 12.5px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .btitle { font-weight: 700; font-size: 12.5px; }
    .lbl { fill: #57606a; font-size: 11.5px; }
    .lblb { fill: #0550ae; font-size: 11.5px; font-weight: 700; }
    .lblr { fill: #cf222e; font-size: 11.5px; font-weight: 700; }
    .lblg { fill: #1a7f37; font-size: 11.5px; font-weight: 700; }
    .mono { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 12px; }
    .monos { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 11.5px; }
    .monob { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #0550ae; }
    .monor { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #cf222e; }
    .monog { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #1a7f37; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .bandw { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .bandc { fill: #eef4ff; stroke: #0969da; stroke-width: 1.4; }
    .bandg { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
    .bandr { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.4; }
    .bandy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
    .cell { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.1; }
    .cellb { fill: #f0f7ff; stroke: #0969da; stroke-width: 1.3; }
    .cellg { fill: #f0fbf3; stroke: #1a7f37; stroke-width: 1.3; }
    .cellr { fill: #fdf4f4; stroke: #cf222e; stroke-width: 1.3; }
    .cellt { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.1; }
    .st { fill: #ffffff; stroke: #0969da; stroke-width: 1.6; }
    .stacc { fill: #f0fbf3; stroke: #1a7f37; stroke-width: 1.8; }
    .stk { fill: #ffffff; stroke: #57606a; stroke-width: 1.2; }
    .stktop { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
    .arrow { stroke: #57606a; stroke-width: 2; fill: none; }
    .arrowb { stroke: #0550ae; stroke-width: 2.2; fill: none; }
    .arrowg { stroke: #1a7f37; stroke-width: 2.2; fill: none; }
    .arrowy { stroke: #bf8700; stroke-width: 2; fill: none; }
    .grid { stroke: #e4e8ed; stroke-width: 1; fill: none; }
    .axis { stroke: #57606a; stroke-width: 1.4; fill: none; }
  </style>
  <defs>
    <marker id="a-n" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="a-b" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0550ae"/></marker>
    <marker id="a-g" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="a-y" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf8700"/></marker>
    <marker id="a-r" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  </defs>
  <rect x="0" y="0" width="1060" height="700" fill="#ffffff"/>
<text class="hdr" x="40" y="38">แผนภาพ transition ของ PDA สองเครื่อง (ตัวเลขจากตารางในผลรัน)</text>
<text class="sub" x="40" y="60">ซ้าย = วงเล็บสมดุล (โปรแกรม 01) · ขวา = aⁿbⁿ (โปรแกรม 02) · ทั้งคู่มีสถานะจำกัด แต่มี stack คนละหนึ่งกอง</text>
<rect class="band" x="40" y="84" width="480" height="260" rx="8"/>
<text class="btitle" x="58" y="108">PDA วงเล็บสมดุล — 4 กฎ · สถานะ 2 ตัว</text>
<circle class="st" cx="140" cy="200" r="38"/>
<text class="monob" x="140" y="197" text-anchor="middle">q0</text>
<text class="lbl" x="140" y="215" text-anchor="middle">อ่านอยู่</text>
<circle class="stacc" cx="350" cy="200" r="38"/>
<circle class="stacc" cx="350" cy="200" r="33"/>
<text class="monob" x="350" y="202" text-anchor="middle">qAccept</text>
<path class="arrowg" d="M180,200 L310,200" marker-end="url(#a-g)"/>
<text class="monog" x="245" y="190" text-anchor="middle">ε, top = Z0</text>
<path class="arrowb" d="M140,162 C110,126 170,126 140,162" marker-end="url(#a-b)"/>
<text class="monos" x="146" y="122">อ่าน '(' · top = Z0 หรือ '(' → push '('</text>
<path class="arrowr" d="M140,238 C170,274 110,274 140,238" marker-end="url(#a-r)"/>
<text class="monos" x="58" y="288">) , top = ( → pop</text>
<text class="lbl" x="58" y="320">ไม่ตรงกฎไหนเลย = ปฏิเสธทันที (ไม่มีกับดักตายแยก)</text>
<rect class="band" x="540" y="84" width="480" height="260" rx="8"/>
<text class="btitle" x="558" y="108">PDA ของ aⁿbⁿ — 6 กฎ · สถานะ 2 ตัว + สถานะรับ</text>
<circle class="st" cx="620" cy="200" r="36"/>
<text class="monob" x="620" y="197" text-anchor="middle">q0</text>
<text class="lbl" x="620" y="215" text-anchor="middle">ยังอ่าน a</text>
<circle class="st" cx="800" cy="200" r="36"/>
<text class="monob" x="800" y="197" text-anchor="middle">q1</text>
<text class="lbl" x="800" y="215" text-anchor="middle">อ่าน b</text>
<path class="arrowg" d="M658,200 L762,200" marker-end="url(#a-g)"/>
<text class="monog" x="710" y="190" text-anchor="middle">b : pop</text>
<path class="arrowb" d="M620,164 C592,128 648,128 620,164" marker-end="url(#a-b)"/>
<text class="monos" x="628" y="122">a : push A</text>
<path class="arrowb" d="M800,236 C828,272 772,272 800,236" marker-end="url(#a-b)"/>
<text class="monos" x="806" y="288">b : pop A</text>
<circle class="stacc" cx="710" cy="318" r="30"/>
<circle class="stacc" cx="710" cy="318" r="25"/>
<text class="monob" x="710" y="320" text-anchor="middle">qAccept</text>
<path class="arrow" d="M638,230 L692,302" marker-end="url(#a-n)"/>
<path class="arrow" d="M786,230 L730,302" marker-end="url(#a-n)"/>
<rect class="bandc" x="40" y="358" width="480" height="184" rx="8"/>
<text class="btitle" x="58" y="382">ทฤษฎีบทที่ทำให้ parser ทำงานได้</text>
<text class="lblb" x="58" y="406">ภาษาที่ CFG บรรยายได้ = ภาษาที่ PDA ยอมรับได้</text>
<text class="lbl" x="58" y="430">(ทิศกลับก็จริง: ทุก PDA แปลงกลับเป็น CFG ได้ — เรียนในวิชาทฤษฎี)</text>
<text class="lbl" x="58" y="456">เรียงชั้น: ภาษาปกติ ⊊ context-free ⊊ ภาษาที่ Turing machine รับ</text>
<text class="lbl" x="58" y="480">ทุกภาษาปกติเป็น context-free (เครื่องสถานะจำกัด = PDA ที่ไม่แตะ stack)</text>
<rect class="bandr" x="540" y="358" width="480" height="184" rx="8"/>
<text class="btitle" x="558" y="382">หลักฐานจากผลรัน: DFA k สถานะนับไม่พอ (8 เคส)</text>
<text class="monos" x="558" y="406">k=2   นับเศษ mod k ยอมรับ abbb</text>
<text class="monos" x="558" y="422">k=4   นับเศษ mod k ยอมรับ abbbbb</text>
<text class="monos" x="558" y="438">k=8   นับเศษ mod k ยอมรับ abbbbbbbbb</text>
<text class="monos" x="558" y="454">k=16  นับเศษ mod k ยอมรับ abbbbbbbbbbbbbbbbb</text>
<text class="monos" x="558" y="470">k=2   ตัวนับอิ่มตัว ปฏิเสธ aabb</text>
<text class="monos" x="558" y="486">k=4   ตัวนับอิ่มตัว ปฏิเสธ aaaabbbb</text>
<text class="monos" x="558" y="502">k=8   ตัวนับอิ่มตัว ปฏิเสธ aaaaaaaabbbbbbbb</text>
<text class="monos" x="558" y="518">k=16  ตัวนับอิ่มตัว ปฏิเสธ aaaaaaaaaaaaaaaabbbbbbbbbbbbbbbb</text>
<text class="lblr" x="558" y="534">ทุกแบบต้องผิดที่ n ≈ k เสมอ (เพิ่ม k ก็แค่เลื่อนจุดพัง)</text>
<rect class="bandy" x="40" y="560" width="980" height="124" rx="8"/>
<text class="btitle" x="58" y="584">จะเขียน parser เอง หรือใช้ goyacc/Bison (เครื่องมือสร้าง parser อัตโนมัติ) ก็ได้เครื่องแบบเดียวกัน</text>
<text class="lbl" x="58" y="608">PDA วงเล็บสมดุล 4 กฎ · PDA ของ aⁿbⁿ 6 กฎ — ทดสอบผ่านครบทุกเส้นที่ลอง</text>
<text class="lbl" x="58" y="630">goyacc/Bison สร้าง DPDA (PDA แบบกำหนดได้) — 'แคบกว่า' PDA เต็มรูปแบบ ทำ palindrome (คำอ่านกลับข้างเหมือนเดิม) ไม่ได้</text>
<text class="lbl" x="58" y="652">recursive descent ที่เขียนมือ = PDA แบบไม่กำหนดที่เลือกทางเองด้วย lookahead 1 ตัว (LL(1)) — ครอบจักรวาลกว่า DPDA</text>
</svg>
