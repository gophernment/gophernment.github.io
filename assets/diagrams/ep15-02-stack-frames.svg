<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" width="980" height="680" role="img" aria-label="stack frame ของ main foo bar ซ้อนกัน แต่ละเฟรมมี return address, argument, ตัวแปรท้องถิ่น">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 17.5px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .sub { fill: #57606a; font-size: 12.5px; }
    .lbl { fill: #57606a; font-size: 11.5px; }
    .tiny { fill: #57606a; font-size: 11px; }
    .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
    .monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #0550ae; }
    .big { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 20px; font-weight: 700; fill: #1a7f37; }
    .addr { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #57606a; }
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .cell { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .cellhi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.9; }
    .cellthin { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .notebox { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.3; }
    .cbox { fill: #eef4ff; stroke: #0969da; stroke-width: 1.3; }
    .gobox { fill: #e6f4ff; stroke: #0a7ea4; stroke-width: 1.3; }
    .warnbox { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.3; }
    .rowband { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .wire { stroke: #1a7f37; stroke-width: 2.2; fill: none; }
    .wire2 { stroke: #57606a; stroke-width: 1.6; fill: none; }
    .textseg { fill: #eef4ff; stroke: #0969da; stroke-width: 1.3; }
    .dataseg { fill: #e6f4ff; stroke: #0a7ea4; stroke-width: 1.3; }
    .heapseg { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.3; }
    .stackseg { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.3; }
  </style>
  <defs>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
    <marker id="arr-n" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="980" height="680" fill="#ffffff"/>

<text class="hdr" x="490" y="34" text-anchor="middle">stack: เฟรมของแต่ละฟังก์ชันซ้อนกันเป็นชั้น (main → foo → bar)</text>
<text class="sub" x="490" y="58" text-anchor="middle">ตัวเลข offset มาจากผลรันจริงของ stack_frame.c — เฟรมใหม่ถูกวางที่ address ต่ำลง (stack โตลง)</text>
<text class="lbl" x="24" y="74">address สูง</text>
<line class="wire2" x1="48" y1="84" x2="48" y2="580"/>
<text class="lbl" x="24" y="592">address ต่ำ</text>
<text class="lbl" x="86" y="88">base = &amp;main_local (จุดอ้างอิง 0)</text>
<rect class="cbox" x="70" y="96" width="540" height="96" rx="10"/>
<text class="ptitle" x="86" y="122">เฟรม main</text>
<text class="mono" x="86" y="146">return address (กลับไปที่ใคร)</text>
<text class="addr" x="594" y="146" text-anchor="end">…</text>
<text class="mono" x="86" y="172">main_local = 7</text>
<text class="monob" x="594" y="172" text-anchor="end">offset +0</text>
<text class="lbl" x="86" y="204">foo ถูกเรียก → ได้เฟรมใหม่ ต่ำลงมา</text>
<rect class="gobox" x="70" y="224" width="540" height="122" rx="10"/>
<text class="ptitle" x="86" y="250">เฟรม foo</text>
<text class="mono" x="86" y="274">return address (กลับไปที่ main)</text>
<text class="addr" x="594" y="274" text-anchor="end">…</text>
<text class="mono" x="86" y="300">foo_local = 8</text>
<text class="monob" x="594" y="300" text-anchor="end">offset -32</text>
<text class="mono" x="86" y="326">a (ตัวรับ argument) = 7</text>
<text class="monob" x="594" y="326" text-anchor="end">offset -48</text>
<text class="lbl" x="86" y="358">bar ถูกเรียก → ต่ำลงไปอีก</text>
<rect class="warnbox" x="70" y="378" width="540" height="122" rx="10"/>
<text class="ptitle" x="86" y="404">เฟรม bar</text>
<text class="mono" x="86" y="428">return address (กลับไปที่ foo)</text>
<text class="addr" x="594" y="428" text-anchor="end">…</text>
<text class="mono" x="86" y="454">bar_local = 34</text>
<text class="monob" x="594" y="454" text-anchor="end">offset -80</text>
<text class="mono" x="86" y="480">b (ตัวรับ argument) = 17</text>
<text class="monob" x="594" y="480" text-anchor="end">offset -96</text>
<line class="wire" x1="120" y1="502" x2="120" y2="528" marker-end="url(#arr-r)"/>
<text class="lbl" x="104" y="520" text-anchor="end">sp</text>
<text class="lbl" x="136" y="520">โตลง ↓</text>
<rect class="notebox" x="660" y="96" width="290" height="440" rx="10"/>
<text class="ptitle" x="676" y="122">สามสิ่งที่ต้องเห็น</text>
<text class="lbl" x="676" y="152">1) เฟรมใหม่ถูกวางที่ address ต่ำลง</text>
<text class="lbl" x="676" y="182">   เสมอ (stack โตลง)</text>
<text class="lbl" x="676" y="212">2) แต่ละเฟรมเก็บ: return address</text>
<text class="lbl" x="676" y="242">   + argument + ตัวแปรท้องถิ่น</text>
<text class="lbl" x="676" y="272">3) bar ใช้เสร็จ → คืนเฟรมให้ foo</text>
<text class="lbl" x="676" y="302">   → foo ใช้ต่อ → คืนให้ main</text>
<text class="lbl" x="676" y="332">   (LIFO: หลังสุดออกก่อน)</text>
<text class="lbl" x="676" y="362"></text>
<text class="lbl" x="676" y="392">return address = ที่อยู่ของโค้ดที่</text>
<text class="lbl" x="676" y="422">ต้องกลับไปหลัง return — พิสูจน์ด้วย</text>
<text class="lbl" x="676" y="452">ret_addr.c ในบทความ</text>
</svg>
