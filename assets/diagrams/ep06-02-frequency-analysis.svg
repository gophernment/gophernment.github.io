<text class="ptitle" x="46" y="654" text-anchor="start">อ่านภาพนี้ให้เป็น</text>
<text class="small" x="46" y="678" text-anchor="start">Caesar "เลื่อน" กราฟทั้งก้อนไปข้าง ๆ — รูปร่างเดิมเป๊ะ ยอดแหลมยังชี้ทางไปที่ E เพราะการสลับชื่อตัวอักษรไม่ได้เปลี่ยน "ความถี่" เลย แต่</text>
<text class="small" x="46" y="695" text-anchor="start">Vigenère "เกลี่ย" กราฟให้แบน เพราะตัวอักษรเดียวกันถูกเลื่อนด้วยค่าที่ต่างกันในแต่ละตำแหน่ง การหัก Vigenère จึงต้อง "หาความยาว key ก่อน"</text>
<text class="small" x="46" y="712" text-anchor="start">(เราใช้ index of coincidence: คาบที่ผ่านเกณฑ์คือ 5) แล้วแยกโจมตีทีละคอลัมน์ ซึ่งเมื่อแยกแล้วแต่ละคอลัมน์ก็กลับเป็น Caesar</text>
<text class="small" x="46" y="729" text-anchor="start">ที่กราฟรูปร่างเดิมโผล่ขึ้นมาอีกครั้ง — และเรากู้ key ได้ตรงเป๊ะ</text>
