<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-label="slice คือมุมมองที่ชี้ไปยัง array ข้างหลัง: ตัดช่วงด้วย s[2:5] ได้ slice ใหม่ที่ยังแชร์ array ก้อนเดิม ไม่ได้คัดลอกข้อมูล">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans Thai", -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #0969da; }
    .mono2 { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #1a1a1a; }
    .lbl { fill: #57606a; font-size: 12px; }
    .lblred { fill: #cf222e; font-size: 12px; font-weight: 700; }
    .hdr { font-weight: 700; font-size: 16px; }
    .sbox { fill: #ffffff; stroke: #0969da; stroke-width: 1.5; }
    .cell { fill: #f6f8fa; stroke: #0969da; stroke-width: 1.5; }
    .cellfade { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .cellhl { fill: #fff8c5; stroke: #cf222e; stroke-width: 2; }
    .idx { font-size: 10px; fill: #8c959f; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <text class="hdr" x="400" y="28" text-anchor="middle">slice คือ "มุมมอง" ที่ชี้ไปยัง array ข้างหลัง — ไม่ได้ถือข้อมูลเอง</text>

  <!-- PANEL 1: s -->
  <text class="mono" x="40" y="58">s := []int{10, 20, 30, 40, 50, 60}   // slice ยาว 6 ช่อง</text>

  <rect class="sbox" x="40" y="76" width="180" height="92" rx="8"/>
  <text class="mono" x="60" y="100">pointer</text>
  <text class="mono" x="60" y="124">len = 6</text>
  <text class="mono" x="60" y="146">cap = 6</text>

  <g>
    <rect class="cell" x="250" y="76" width="76" height="50"/>
    <text class="mono2" x="288" y="105" text-anchor="middle">10</text>
    <rect class="cell" x="332" y="76" width="76" height="50"/>
    <text class="mono2" x="370" y="105" text-anchor="middle">20</text>
    <rect class="cell" x="414" y="76" width="76" height="50"/>
    <text class="mono2" x="452" y="105" text-anchor="middle">30</text>
    <rect class="cell" x="496" y="76" width="76" height="50"/>
    <text class="mono2" x="534" y="105" text-anchor="middle">40</text>
    <rect class="cell" x="578" y="76" width="76" height="50"/>
    <text class="mono2" x="616" y="105" text-anchor="middle">50</text>
    <rect class="cell" x="660" y="76" width="76" height="50"/>
    <text class="mono2" x="698" y="105" text-anchor="middle">60</text>
  </g>
  <text class="idx" x="288" y="146" text-anchor="middle">0</text>
  <text class="idx" x="370" y="146" text-anchor="middle">1</text>
  <text class="idx" x="452" y="146" text-anchor="middle">2</text>
  <text class="idx" x="534" y="146" text-anchor="middle">3</text>
  <text class="idx" x="616" y="146" text-anchor="middle">4</text>
  <text class="idx" x="698" y="146" text-anchor="middle">5</text>

  <line x1="222" y1="104" x2="245" y2="104" stroke="#0969da" stroke-width="1.6" marker-end="url(#arrblue)"/>
  <text class="lbl" x="40" y="180">slice s จดแค่ 3 อย่าง: ชี้ array ไหน (pointer) · ใช้ได้กี่ช่อง (len) · จุได้กี่ช่อง (cap)</text>

  <line x1="40" y1="202" x2="760" y2="202" stroke="#d0d7de" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- PANEL 2: part := s[2:5] -->
  <text class="mono" x="40" y="234">part := s[2:5]      // ตัดช่อง 2..4 มา — ยังไม่คัดลอกข้อมูล</text>

  <rect class="sbox" x="40" y="252" width="180" height="96" rx="8"/>
  <text class="mono" x="60" y="276">pointer</text>
  <text class="mono" x="60" y="300">len = 3</text>
  <text class="mono" x="60" y="324">cap = 4</text>

  <g>
    <rect class="cellfade" x="250" y="252" width="76" height="50"/>
    <text class="mono2" x="288" y="281" text-anchor="middle" opacity="0.45">10</text>
    <rect class="cellfade" x="332" y="252" width="76" height="50"/>
    <text class="mono2" x="370" y="281" text-anchor="middle" opacity="0.45">20</text>
    <rect class="cellhl" x="414" y="252" width="76" height="50"/>
    <text class="mono2" x="452" y="281" text-anchor="middle">30</text>
    <rect class="cellhl" x="496" y="252" width="76" height="50"/>
    <text class="mono2" x="534" y="281" text-anchor="middle">40</text>
    <rect class="cellhl" x="578" y="252" width="76" height="50"/>
    <text class="mono2" x="616" y="281" text-anchor="middle">50</text>
    <rect class="cellfade" x="660" y="252" width="76" height="50"/>
    <text class="mono2" x="698" y="281" text-anchor="middle" opacity="0.45">60</text>
  </g>
  <text class="idx" x="288" y="322" text-anchor="middle">0</text>
  <text class="idx" x="370" y="322" text-anchor="middle">1</text>
  <text class="idx" x="452" y="322" text-anchor="middle" fill="#cf222e">2</text>
  <text class="idx" x="534" y="322" text-anchor="middle" fill="#cf222e">3</text>
  <text class="idx" x="616" y="322" text-anchor="middle" fill="#cf222e">4</text>
  <text class="idx" x="698" y="322" text-anchor="middle">5</text>

  <line x1="222" y1="300" x2="408" y2="300" stroke="#0969da" stroke-width="1.6" marker-end="url(#arrblue)"/>

  <text class="lbl" x="534" y="350" text-anchor="middle">มุมมองของ part = ช่อง 2..4 (len = 3)</text>
  <line x1="414" y1="360" x2="654" y2="360" stroke="#cf222e" stroke-width="1.4"/>
  <line x1="414" y1="360" x2="414" y2="366" stroke="#cf222e" stroke-width="1.4"/>
  <line x1="654" y1="360" x2="654" y2="366" stroke="#cf222e" stroke-width="1.4"/>

  <text class="lbl" x="40" y="396">part กับ s แชร์ array ก้อนเดียวกัน — แก้ค่าผ่าน part → เห็นผลใน s ด้วย (ไม่ใช่สำเนา)</text>
  <text class="lbl" x="40" y="416">cap ของ part = 4 = จำนวนช่องที่เหลือจาก index 2 ถึงท้าย array</text>
  <text class="lblred" x="40" y="442">ช่องที่ part มองไม่เห็น (0, 1, 5) ยังอยู่ใน array — มันแค่ถูก "ตัดออกจากมุมมอง" เท่านั้น</text>
</svg>
