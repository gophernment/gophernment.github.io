<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 508" width="940" height="508" role="img" aria-label="เส้นเวลา lease: BOUND จนถึง T1, RENEWING ถึง T2, REBINDING ถึงวันหมดอายุ พร้อมจุดที่ client ลองคุยใหม่ในสามฉาก">
<style>
text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12.5px; fill: #1a1a1a; }
.hdr { font-weight: 700; font-size: 17.5px; }
.sub { fill: #57606a; font-size: 12.5px; }
.ptitle { font-weight: 700; font-size: 14px; }
.txt { font-size: 12.5px; }
.lbl { fill: #57606a; font-size: 11px; }
.small { fill: #57606a; font-size: 10.5px; }
.big { font-weight: 700; font-size: 19px; fill: #0550ae; }
.mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 11.5px; fill: #0a3069; }
.monom { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; fill: #0a3069; }
.monos { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 10.5px; fill: #57606a; }
.onbar { font-size: 12px; font-weight: 600; }
.onbar2 { font-size: 10.5px; fill: #57606a; }
.boxg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
.boxb { fill: #eef4ff; stroke: #0969da; stroke-width: 1.5; }
.boxy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
.boxi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
.boxr { fill: #fdeff0; stroke: #b62324; stroke-width: 1.4; }
.cell { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.1; }
.cellA { fill: #dbeafe; stroke: #0969da; stroke-width: 1.2; }
.cellG { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.2; }
.cellR { fill: #fdeff0; stroke: #b62324; stroke-width: 1.6; }
.cellY { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.2; }
.wire { stroke: #8c959f; stroke-width: 1.8; fill: none; }
.wire2 { stroke: #b6bfc8; stroke-width: 1.2; fill: none; stroke-dasharray: 5 5; }
.head { fill: #8c959f; }
.rule { stroke: #d0d7de; stroke-width: 1.2; }
</style>
<rect x="0" y="0" width="940" height="508" fill="#ffffff"/>
<text class="hdr" x="40" y="34" text-anchor="start">lease 3600 วินาที: T1 1800 · T2 3150 · หมดอายุ 3600</text>
<text class="sub" x="40" y="58" text-anchor="start">T1 = 0.5 × lease · T2 = 0.875 × lease (RFC 2131 §4.4.5) · สามแถบคือสามสถานะของ client</text>
<rect class="cellA" x="210.0" y="108.0" width="329.0" height="42.0" rx="5"/>
<text class="onbar" x="376" y="135" text-anchor="middle">BOUND</text>
<rect class="cellY" x="541.0" y="108.0" width="246.2" height="42.0" rx="5"/>
<text class="onbar" x="665" y="135" text-anchor="middle">RENEWING</text>
<rect class="cellR" x="789.2" y="108.0" width="80.8" height="42.0" rx="5"/>
<text class="onbar" x="831" y="135" text-anchor="middle">REBINDING</text>
<line class="rule" x1="210.0" y1="150.0" x2="210.0" y2="158.0"/>
<text class="mono" x="216" y="174" text-anchor="start">0</text>
<line class="rule" x1="541.0" y1="150.0" x2="541.0" y2="158.0"/>
<text class="mono" x="547" y="174" text-anchor="start">T1 1800</text>
<line class="rule" x1="789.2" y1="150.0" x2="789.2" y2="158.0"/>
<text class="mono" x="789" y="174" text-anchor="end">T2 3150</text>
<line class="rule" x1="872.0" y1="150.0" x2="872.0" y2="158.0"/>
<text class="mono" x="872" y="174" text-anchor="end">expiry 3600</text>
<rect class="boxi" x="40.0" y="196.0" width="166.0" height="52.0" rx="8"/>
<text class="onbar" x="52" y="218" text-anchor="start">A. renew ที่ T1</text>
<text class="small" x="52" y="237" text-anchor="start">ต่ออายุกับ server เดิม</text>
<line class="wire2" x1="202.0" y1="222.0" x2="876.0" y2="222.0"/>
<line class="wire2" x1="541.0" y1="158.0" x2="541.0" y2="222.0"/>
<rect class="cellA" x="537.0" y="217.0" width="9.0" height="9.0" rx="3"/>
<rect class="boxy" x="40.0" y="262.0" width="166.0" height="52.0" rx="8"/>
<text class="onbar" x="52" y="284" text-anchor="start">B. T1 เงียบ</text>
<text class="small" x="52" y="303" text-anchor="start">แล้ว rebind ที่ T2</text>
<line class="wire2" x1="202.0" y1="288.0" x2="876.0" y2="288.0"/>
<line class="wire2" x1="541.0" y1="158.0" x2="541.0" y2="288.0"/>
<rect class="cellA" x="537.0" y="283.0" width="9.0" height="9.0" rx="3"/>
<line class="wire2" x1="665.1" y1="158.0" x2="665.1" y2="288.0"/>
<rect class="cellA" x="661.1" y="283.0" width="9.0" height="9.0" rx="3"/>
<line class="wire2" x1="789.2" y1="158.0" x2="789.2" y2="288.0"/>
<rect class="cellA" x="785.2" y="283.0" width="9.0" height="9.0" rx="3"/>
<rect class="boxr" x="40.0" y="328.0" width="166.0" height="52.0" rx="8"/>
<text class="onbar" x="52" y="350" text-anchor="start">C. ไม่มีใครตอบ</text>
<text class="small" x="52" y="369" text-anchor="start">จนเลยวันหมดอายุ</text>
<line class="wire2" x1="202.0" y1="354.0" x2="876.0" y2="354.0"/>
<line class="wire2" x1="541.0" y1="158.0" x2="541.0" y2="354.0"/>
<rect class="cellA" x="537.0" y="349.0" width="9.0" height="9.0" rx="3"/>
<line class="wire2" x1="665.1" y1="158.0" x2="665.1" y2="354.0"/>
<rect class="cellA" x="661.1" y="349.0" width="9.0" height="9.0" rx="3"/>
<line class="wire2" x1="789.2" y1="158.0" x2="789.2" y2="354.0"/>
<rect class="cellA" x="785.2" y="349.0" width="9.0" height="9.0" rx="3"/>
<line class="wire2" x1="872.0" y1="158.0" x2="872.0" y2="354.0"/>
<rect class="cellR" x="868.0" y="349.0" width="9.0" height="9.0" rx="3"/>
<text class="monos" x="549" y="212" text-anchor="start">unicast</text>
<text class="monos" x="673" y="278" text-anchor="start">retry</text>
<text class="monos" x="797" y="278" text-anchor="start">broadcast</text>
<text class="monos" x="797" y="344" text-anchor="start">rebind</text>
<rect class="boxg" x="40.0" y="400.0" width="860.0" height="92.0" rx="8"/>
<text class="txt" x="58" y="424" text-anchor="start">ระหว่าง RENEWING: ส่งซ้ำครั้งแรกที่ 675 วินาที (ครึ่งของเวลาที่เหลือถึง T2)</text>
<text class="txt" x="58" y="446" text-anchor="start">ระหว่าง REBINDING: ส่งซ้ำครั้งแรกที่ 225 วินาที (ครึ่งของเวลาที่เหลือถึง expiry)</text>
<text class="small" x="58" y="470" text-anchor="start">ทั้งสองช่วง client ยังใช้ address เดิมได้ — การ renew ไม่ทำให้เน็ตหลุด ถ้าไม่มีใครตอบจนถึง expiry จึงเลิกใช้</text>
<rect x="663.1" y="232.0" width="213.9" height="13.1" fill="#ffffff" stroke="none"/>
<text class="small" x="874" y="242" text-anchor="end">REQUEST unicast → ACK · expires 5400</text>
<rect x="739.3" y="298.0" width="137.7" height="13.1" fill="#ffffff" stroke="none"/>
<text class="small" x="874" y="308" text-anchor="end">ACK จาก server อีกตัว</text>
<rect x="670.0" y="364.0" width="207.0" height="13.1" fill="#ffffff" stroke="none"/>
<text class="small" x="874" y="374" text-anchor="end">หมดอายุ → เลิกใช้ address ทันที</text>
</svg>
