<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="1060" height="560" role="img" aria-label="ตารางผลรันจริงเปรียบเทียบ vulnerable (concat) กับ safe (parameterized) ทั้งห้ากรณี">
<style>
text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
.hdr { font-weight: 700; font-size: 17.5px; }
.ptitle { font-weight: 700; font-size: 14.5px; }
.sub { fill: #57606a; font-size: 12.5px; }
.lbl { fill: #57606a; font-size: 11.5px; }
.txt { font-size: 13px; }
.small { fill: #57606a; font-size: 11px; }
.mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
.monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #0550ae; }
.boxn { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.6; }
.boxi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.6; }
.boxg { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.3; }
.boxw { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
.boxy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
.boxb { fill: #eef4ff; stroke: #0969da; stroke-width: 1.4; }
.wire { stroke: #57606a; stroke-width: 1.8; fill: none; }
</style>
<defs>
<marker id="a-n" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<marker id="a-r" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
</defs>
<rect x="0" y="0" width="1060" height="560" fill="#ffffff"/>
<text class="hdr" x="530" y="36" text-anchor="middle">ล็อกอิน 5 กรณี — vulnerable (concat) เทียบ safe (?) ผลรันจริง</text>
<text class="sub" x="530" y="60" text-anchor="middle">ตัวเลขทุกตัวดึงจาก out/01_demo.txt ของตอนนี้ (sqli_demo.go, SQLite 3.53.4) — ไม่ได้พิมพ์จากความจำ</text>
<rect class="boxb" x="40" y="84" width="52" height="34" rx="9"/>
<text class="ptitle" x="66.0" y="106" text-anchor="middle">ID</text>
<rect class="boxb" x="100" y="84" width="336" height="34" rx="9"/>
<text class="ptitle" x="268.0" y="106" text-anchor="middle">username (input)</text>
<rect class="boxb" x="444" y="84" width="156" height="34" rx="9"/>
<text class="ptitle" x="522.0" y="106" text-anchor="middle">vulnerable</text>
<rect class="boxb" x="608" y="84" width="140" height="34" rx="9"/>
<text class="ptitle" x="678.0" y="106" text-anchor="middle">safe (?)</text>
<rect class="boxg" x="756" y="84" width="264" height="34" rx="9"/>
<text class="ptitle" x="888.0" y="106" text-anchor="middle">เกิดอะไรขึ้น</text>
<rect class="boxw" x="40" y="122" width="52" height="62" rx="9"/>
<text class="monob" x="56" y="160" text-anchor="start">A1</text>
<rect class="boxw" x="100" y="122" width="336" height="62" rx="9"/>
<text class="mono" x="114" y="148" text-anchor="start">alice</text>
<text class="small" x="114" y="170" text-anchor="start">password: hash-alice</text>
<rect class="boxn" x="444" y="122" width="156" height="62" rx="9"/>
<text class="monob" x="458" y="160" text-anchor="start">1 แถว (ผ่าน)</text>
<rect class="boxi" x="608" y="122" width="140" height="62" rx="9"/>
<text class="monob" x="622" y="160" text-anchor="start">1 แถว (ผ่าน)</text>
<rect class="boxw" x="756" y="122" width="264" height="62" rx="9"/>
<text class="small" x="768" y="146" text-anchor="start">รหัสผ่านถูกต้อง — กรณีปกติ</text>
<text class="small" x="768" y="162" text-anchor="start">ต้องผ่านทั้งคู่</text>
<rect class="boxw" x="40" y="188" width="52" height="62" rx="9"/>
<text class="monob" x="56" y="226" text-anchor="start">A2</text>
<rect class="boxw" x="100" y="188" width="336" height="62" rx="9"/>
<text class="mono" x="114" y="214" text-anchor="start">alice</text>
<text class="small" x="114" y="236" text-anchor="start">password: รหัสผิด</text>
<rect class="boxw" x="444" y="188" width="156" height="62" rx="9"/>
<text class="mono" x="458" y="226" text-anchor="start">0 แถว (ปฏิเสธ)</text>
<rect class="boxw" x="608" y="188" width="140" height="62" rx="9"/>
<text class="mono" x="622" y="226" text-anchor="start">0 แถว (ปฏิเสธ)</text>
<rect class="boxw" x="756" y="188" width="264" height="62" rx="9"/>
<text class="small" x="768" y="212" text-anchor="start">รหัสผ่านผิด — ต้องปฏิเสธทั้งคู่ (?</text>
<text class="small" x="768" y="228" text-anchor="start">ไม่ได้ทำให้ทุกอย่างผ่าน)</text>
<rect class="boxw" x="40" y="254" width="52" height="62" rx="9"/>
<text class="monob" x="56" y="292" text-anchor="start">A3</text>
<rect class="boxw" x="100" y="254" width="336" height="62" rx="9"/>
<text class="mono" x="114" y="280" text-anchor="start">admin'--</text>
<text class="small" x="114" y="302" text-anchor="start">password: x</text>
<rect class="boxn" x="444" y="254" width="156" height="62" rx="9"/>
<text class="monob" x="458" y="292" text-anchor="start">1 แถว (ผ่าน)</text>
<rect class="boxw" x="608" y="254" width="140" height="62" rx="9"/>
<text class="mono" x="622" y="292" text-anchor="start">0 แถว (ปฏิเสธ)</text>
<rect class="boxw" x="756" y="254" width="264" height="62" rx="9"/>
<text class="small" x="768" y="278" text-anchor="start">' ปิดสตริง + --</text>
<text class="small" x="768" y="294" text-anchor="start">กลืนเงื่อนไขรหัสผ่าน -&gt; เข้า admin</text>
<text class="small" x="768" y="310" text-anchor="start">ได้</text>
<rect class="boxw" x="40" y="320" width="52" height="62" rx="9"/>
<text class="monob" x="56" y="358" text-anchor="start">A4</text>
<rect class="boxw" x="100" y="320" width="336" height="62" rx="9"/>
<text class="mono" x="114" y="346" text-anchor="start">' OR '1'='1</text>
<text class="small" x="114" y="368" text-anchor="start">password: เหมือนกัน</text>
<rect class="boxn" x="444" y="320" width="156" height="62" rx="9"/>
<text class="monob" x="458" y="358" text-anchor="start">3 แถว (ผ่าน)</text>
<rect class="boxw" x="608" y="320" width="140" height="62" rx="9"/>
<text class="mono" x="622" y="358" text-anchor="start">0 แถว (ปฏิเสธ)</text>
<rect class="boxw" x="756" y="320" width="264" height="62" rx="9"/>
<text class="small" x="768" y="344" text-anchor="start">tautology -&gt; คืนทุกแถว เพราะ OR</text>
<text class="small" x="768" y="360" text-anchor="start">เป็นจริง</text>
<rect class="boxw" x="40" y="386" width="52" height="62" rx="9"/>
<text class="monob" x="56" y="424" text-anchor="start">A5</text>
<rect class="boxw" x="100" y="386" width="336" height="62" rx="9"/>
<text class="mono" x="114" y="412" text-anchor="start">' UNION ...--</text>
<text class="small" x="114" y="434" text-anchor="start">password: x</text>
<rect class="boxn" x="444" y="386" width="156" height="62" rx="9"/>
<text class="monob" x="458" y="424" text-anchor="start">1 แถว (ผ่าน)</text>
<rect class="boxw" x="608" y="386" width="140" height="62" rx="9"/>
<text class="mono" x="622" y="424" text-anchor="start">0 แถว (ปฏิเสธ)</text>
<rect class="boxw" x="756" y="386" width="264" height="62" rx="9"/>
<text class="small" x="768" y="410" text-anchor="start">ดึง api_key ของ admin</text>
<text class="small" x="768" y="426" text-anchor="start">ออกมาทางคอลัมน์ username</text>
<rect class="boxb" x="40" y="458" width="980" height="92" rx="9"/>
<text class="ptitle" x="56" y="484" text-anchor="start">บทพิสูจน์ที่สำคัญที่สุด — สตริงเดียวกัน ต่างกันที่ช่องทาง</text>
<text class="small" x="56" y="508" text-anchor="start">ผู้ใช้ที่ชื่อจริง ๆ ว่า admin'-- (สมัครด้วย parameterized INSERT): ล็อกอินด้วย concat ได้ 1 แถว = #3 admin/admin · ล็อกอินด้วย ? ได้ 1 แถว = #20</text>
<text class="small" x="56" y="525" text-anchor="start">admin'--/user</text>
</svg>
