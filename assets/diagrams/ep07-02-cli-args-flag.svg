<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="840" height="500" role="img" aria-label="หนึ่งบรรทัดที่พิมพ์ใน terminal ถูกแยกเป็น argument หลายชิ้นใน os.Args แล้ว flag.Parse จับคู่แต่ละ flag ให้ตัวแปรของเรา">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans Thai", -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 16px; }
    .hdrsm { font-weight: 700; font-size: 13.5px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #0969da; }
    .mono2 { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #1a1a1a; }
    .idx { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; fill: #8c959f; }
    .lbl { fill: #57606a; font-size: 12px; }
    .lblred { fill: #cf222e; font-size: 12px; font-weight: 700; }
    .cell { fill: #f6f8fa; stroke: #0969da; stroke-width: 1.5; }
    .cellhl { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .cmd { fill: #1a1a1a; stroke: #57606a; stroke-width: 1.3; }
    .flagbox { fill: #ffffff; stroke: #1a7f37; stroke-width: 1.5; }
    .warn { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.3; }
  </style>

  <text class="hdr" x="420" y="26" text-anchor="middle">หนึ่งบรรทัดใน terminal → แยกเป็น argument → flag.Parse() จับคู่ให้ตัวแปร</text>

  <!-- command line -->
  <rect class="cmd" x="40" y="42" width="760" height="38" rx="6"/>
  <text class="mono2" x="56" y="67" style="fill:#ffffff">./notecli -cmd add -text "ซื้อนม" -file notes.txt</text>

  <!-- os.Args cells -->
  <text class="lbl" x="40" y="106">os.Args คือ slice ของ string ที่โปรแกรมได้รับมา (ช่อง 0 = ชื่อโปรแกรม)</text>

  <text class="idx" x="93" y="128" text-anchor="middle">[0]</text>
  <text class="idx" x="203" y="128" text-anchor="middle">[1]</text>
  <text class="idx" x="313" y="128" text-anchor="middle">[2]</text>
  <text class="idx" x="423" y="128" text-anchor="middle">[3]</text>
  <text class="idx" x="533" y="128" text-anchor="middle">[4]</text>
  <text class="idx" x="643" y="128" text-anchor="middle">[5]</text>
  <text class="idx" x="753" y="128" text-anchor="middle">[6]</text>

  <rect class="cellhl" x="40" y="136" width="106" height="46" rx="6"/>
  <text class="mono2" x="93" y="164" text-anchor="middle">./notecli</text>
  <rect class="cell" x="150" y="136" width="106" height="46" rx="6"/>
  <text class="mono2" x="203" y="164" text-anchor="middle">-cmd</text>
  <rect class="cell" x="260" y="136" width="106" height="46" rx="6"/>
  <text class="mono2" x="313" y="164" text-anchor="middle">add</text>
  <rect class="cell" x="370" y="136" width="106" height="46" rx="6"/>
  <text class="mono2" x="423" y="164" text-anchor="middle">-text</text>
  <rect class="cell" x="480" y="136" width="106" height="46" rx="6"/>
  <text class="mono2" x="533" y="164" text-anchor="middle">ซื้อนม</text>
  <rect class="cell" x="590" y="136" width="106" height="46" rx="6"/>
  <text class="mono2" x="643" y="164" text-anchor="middle">-file</text>
  <rect class="cell" x="700" y="136" width="106" height="46" rx="6"/>
  <text class="mono2" x="753" y="164" text-anchor="middle">notes.txt</text>

  <!-- arrows to flag boxes -->
  <line x1="203" y1="184" x2="150" y2="222" stroke="#0969da" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="313" y1="184" x2="170" y2="222" stroke="#0969da" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="423" y1="184" x2="410" y2="222" stroke="#0969da" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="533" y1="184" x2="430" y2="222" stroke="#0969da" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="643" y1="184" x2="670" y2="222" stroke="#0969da" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="753" y1="184" x2="690" y2="222" stroke="#0969da" stroke-width="1.6" marker-end="url(#arr2)"/>

  <!-- flag boxes -->
  <rect class="flagbox" x="40" y="228" width="240" height="86" rx="8"/>
  <text class="hdrsm" x="56" y="250">flag.String("cmd", "list", ...)</text>
  <text class="mono2" x="56" y="274">*cmd = "add"</text>
  <text class="lbl" x="56" y="298">เครื่องหมาย * = อ่านค่าผ่าน pointer</text>

  <rect class="flagbox" x="300" y="228" width="240" height="86" rx="8"/>
  <text class="hdrsm" x="316" y="250">flag.String("text", ...)</text>
  <text class="mono2" x="316" y="274">*text = "ซื้อนม"</text>
  <text class="lbl" x="316" y="298">ค่าที่ผู้ใช้พิมพ์หลัง -text</text>

  <rect class="flagbox" x="560" y="228" width="240" height="86" rx="8"/>
  <text class="hdrsm" x="576" y="250">flag.String("file", ...)</text>
  <text class="mono2" x="576" y="274">*file = "notes.txt"</text>
  <text class="lbl" x="576" y="298">ไม่พิมพ์ก็ได้ค่าเริ่มต้น</text>

  <!-- result row -->
  <rect class="cellhl" x="40" y="336" width="760" height="42" rx="6"/>
  <text class="mono2" x="56" y="362">flag.Args() = []   ← ว่าง เพราะทุกชิ้นในบรรทัดนี้เป็น flag หมดแล้ว</text>

  <!-- warning -->
  <rect class="warn" x="40" y="396" width="760" height="88" rx="8"/>
  <text class="hdrsm" x="56" y="420">กับดัก 2 ข้อที่มือใหม่เจอบ่อย</text>
  <text class="lblred" x="56" y="444">1. ช่องว่างคือตัวแบ่ง — -text ซื้อนม (ไม่ใส่ " ") จะกลายเป็น 2 arguments</text>
  <text class="lblred" x="56" y="466">2. flag.Parse() หยุดอ่านทันทีที่เจอชิ้นแรกที่ไม่ใช่ flag — flag ที่พิมพ์ทีหลังจะไม่ถูกอ่าน</text>
</svg>
