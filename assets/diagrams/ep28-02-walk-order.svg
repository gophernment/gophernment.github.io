  <text x="526.0" y="350.0" class="monos">eval (* (+ 3 4) 5)  = 35</text>
  <text x="522.0" y="380.0" class="lblb">ค่า = 35 (int) · เดิน 5 node</text>
  <rect x="24.0" y="440.0" width="932.0" height="56.0" rx="8.0" class="bandy"/>
