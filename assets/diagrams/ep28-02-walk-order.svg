  <text x="24.0" y="32.0" class="hdr">เดินต้นไม้จริง: post-order — ลูกก่อน พ่อทีหลัง</text>
  <text x="24.0" y="54.0" class="sub">ต้นไม้ 5 node สองแบบที่ต่างกันแค่วงเล็บ แต่ค่าต่างกัน · ตัวเลขทุกตัวจาก out/01_eval_expr.out.txt</text>
