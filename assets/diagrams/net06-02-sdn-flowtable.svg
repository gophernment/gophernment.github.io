<text class="small" x="400" y="400" text-anchor="start">cost_gap=2: ตัวเลขที่ผู้ดูแลตั้ง</text>
<text class="small" x="400" y="420" text-anchor="start">เส้นประ = ทางที่ SDN เลือกเอง ไม่ใช่ทางสั้นสุด</text>
<rect class="bgw" x="202.775" y="196.48" width="64.45" height="15.66" rx="2"/>
