<text class="lbl" x="465" y="302" text-anchor="middle">L4 cost 4</text>
<rect class="boxg" x="748" y="88" width="322" height="380" rx="8"/>
<text class="ptitle" x="766" y="116" text-anchor="start">flow table หลัง phase 1</text>
<text class="small" x="766" y="136" text-anchor="start">หนึ่งแถว = match แล้ว action</text>
<text class="monos" x="766" y="162" text-anchor="start">switch  match          out  pkts</text>
<text class="monos" x="766" y="184" text-anchor="start">s1      dst=….20/32  2    100</text>
<text class="monos" x="766" y="206" text-anchor="start">s2      dst=….20/32  2    100</text>
<text class="monos" x="766" y="228" text-anchor="start">s4      dst=….20/32  1    100</text>
<line class="rule" x1="766" y1="246" x2="1054" y2="246"/>
<text class="small" x="766" y="268" text-anchor="start">packet_in = 1 ครั้ง</text>
<text class="small" x="766" y="288" text-anchor="start">flow_mod  = 3 แถว</text>
<text class="small" x="766" y="308" text-anchor="start">forward   = 300 ครั้ง</text>
<line class="rule" x1="766" y1="326" x2="1054" y2="326"/>
<text class="small" x="766" y="348" text-anchor="start">ที่เหลือเกิดที่ data plane</text>
<text class="small" x="766" y="366" text-anchor="start">— controller ไม่ได้อยู่ใน</text>
<text class="small" x="766" y="384" text-anchor="start">เส้นทางของ packet เลย</text>
<rect class="boxb" x="766" y="396" width="288" height="58" rx="8"/>
<text class="small" x="910" y="418" text-anchor="middle">rule + counter อยู่ที่ switch</text>
<text class="small" x="910" y="438" text-anchor="middle">controller คือคนที่ต้องคอยลบ rule ที่ค้าง</text>
<text class="ptitle" x="30" y="502" text-anchor="start">กำไรจากการเห็นภาพรวม: peak load บน link (หน่วย: packet)</text>
<text class="txt" x="40" y="537" text-anchor="start">shortest-path ทุก flow</text>
<rect class="bar1" x="300" y="522" width="560.0" height="22" rx="3"/>
<text class="monos" x="872" y="538" text-anchor="start">200</text>
<text class="txt" x="40" y="577" text-anchor="start">SDN traffic engineering</text>
<rect class="bar2" x="300" y="562" width="280.0" height="22" rx="3"/>
<text class="monos" x="592" y="578" text-anchor="start">100</text>
<text class="small" x="300" y="604" text-anchor="start">ลดได้ครึ่งหนึ่ง = link เดิมรับ traffic ได้สองเท่าก่อนอิ่มตัว (link ที่เหลือ: 100 / 100 / 100 / 100)</text>
<rect class="boxy" x="30" y="626" width="1040" height="48" rx="8"/>
<text class="txt" x="550" y="656" text-anchor="middle">แต่ถ้าวันหนึ่ง link L3 ล่ม ทั้งสอง stream กลับมาทางเดียวกัน: peak กลับไป 200</text>
</svg>
