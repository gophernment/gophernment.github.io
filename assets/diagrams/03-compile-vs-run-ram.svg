<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" role="img" aria-label="ตัวแปรตอน compile กับตอน run ใน RAM">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans Thai", -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .box { fill: #ffffff; stroke: #0969da; stroke-width: 1.5; }
    .muted { fill: #6b7280; font-size: 12px; }
    .hdr { font-weight: 700; font-size: 14px; }
    .cell { fill: #ffffff; stroke: #57606a; stroke-width: 1; }
    .cell.hl { fill: #f0f7ff; stroke: #0969da; }
  </style>

  <!-- LEFT: compile -->
  <text class="hdr" x="195" y="22" text-anchor="middle">ขั้น compile</text>
  <rect class="box" x="65" y="34" width="260" height="40" rx="8"/>
  <text class="mono" x="195" y="59" text-anchor="middle">var age int = 30</text>
  <line x1="195" y1="74" x2="195" y2="100" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect class="box" x="35" y="104" width="320" height="104" rx="8"/>
  <text x="195" y="128" text-anchor="middle">compiler อ่านโค้ด แล้ว <tspan class="mono">&quot;จองที่&quot;</tspan></text>
  <text x="195" y="148" text-anchor="middle">ในคำสั่งภาษาเครื่องว่า:</text>
  <text x="195" y="168" text-anchor="middle"><tspan class="mono">&quot;จองช่องขนาดพอดีกับ int</tspan></text>
  <text x="195" y="188" text-anchor="middle">แล้วใส่ 30 ลงไป<tspan class="mono">&quot;</tspan></text>

  <line x1="195" y1="208" x2="195" y2="234" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect class="box" x="55" y="238" width="280" height="56" rx="8"/>
  <text x="195" y="262" text-anchor="middle">โค้ด Go → ภาษาเครื่อง</text>
  <text x="195" y="282" text-anchor="middle" class="muted">(มีคำสั่งจองที่ + ใส่ค่า)</text>

  <!-- RIGHT: run -->
  <text class="hdr" x="600" y="22" text-anchor="middle">ขั้น run (โปรแกรมทำงานจริง)</text>
  <text x="600" y="46" text-anchor="middle">หน่วยความจำ RAM ของเครื่อง</text>

  <rect class="cell" x="480" y="60" width="240" height="40"/>
  <text x="600" y="84" text-anchor="middle" class="muted">…ข้อมูลอื่น…</text>
  <rect class="cell hl" x="480" y="100" width="240" height="40"/>
  <text x="600" y="124" text-anchor="middle"><tspan class="mono" font-weight="700">age: 30</tspan>  <tspan class="muted">(int)</tspan></text>
  <rect class="cell" x="480" y="140" width="240" height="40"/>
  <text x="600" y="164" text-anchor="middle"><tspan class="mono">city: &quot;กรุงเทพฯ&quot;</tspan></text>

  <text x="600" y="200" text-anchor="middle" class="muted">ช่อง <tspan class="mono">age: 30</tspan> = ตัวแปร age คือชื่อของช่องนี้</text>
  <text x="600" y="220" text-anchor="middle" class="muted">ช่อง <tspan class="mono">city: &quot;กรุงเทพฯ&quot;</tspan> = อีกช่องหนึ่ง</text>

  <text x="600" y="256" text-anchor="middle">ตอน CPU ทำงาน เจอคำว่า <tspan class="mono">age</tspan></text>
  <text x="600" y="276" text-anchor="middle">ก็ไปเอาค่าที่ช่องเลขที่นั้น</text>
</svg>
