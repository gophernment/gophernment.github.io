<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" width="960" height="900" role="img" aria-label="จาก gated D latch ที่อ่อนไหวต่อระดับสัญญาณ ไปสู่ D flip-flop ที่รับค่าที่ขอบขาขึ้นของนาฬิกา พร้อมตารางความจริง">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12.5px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 17px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .sub { fill: #57606a; font-size: 12px; }
    .tiny { font-size: 11px; fill: #57606a; }
    .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; fill: #0969da; }
    .monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #1a1a1a; }
    .val { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
    .th { font-weight: 700; font-size: 12px; fill: #57606a; }
    .lbl { font-size: 12px; fill: #57606a; }
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .panelb { fill: #f6f8fa; stroke: #0969da; stroke-width: 1.4; }
    .block { fill: #eef4ff; stroke: #0969da; stroke-width: 1.6; }
    .blocko { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.6; }
    .wire { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .clk { stroke: #1a7f37; stroke-width: 2; fill: none; }
    .clkedge { stroke: #cf222e; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    .row { fill: #ffffff; stroke: #eaeef2; stroke-width: 1; }
    .rowg { fill: #f6f8fa; stroke: #eaeef2; stroke-width: 1; }
    .hrow { fill: #eaeef2; }
    .thline { stroke: #d0d7de; stroke-width: 1.2; }
    .dot { fill: #57606a; }
  </style>

  <text class="hdr" x="480" y="32" text-anchor="middle">จาก SR latch สู่ D flip-flop: เติม gate แล้วเติมนาฬิกา</text>

  <!-- ================= Panel A : gated D latch ================= -->
  <rect class="panel" x="20" y="52" width="920" height="400" rx="10"/>
  <text class="ptitle" x="40" y="80">A. gated D latch — เอา SR latch มาเติม gate (enable) เพื่อไม่ให้ S กับ R เป็น 1 พร้อมกันได้</text>
  <text class="sub" x="40" y="102">D latch = D + enable: ตราบใดที่ E = 1 เอาต์พุตวิ่งตาม D ทันที (ยังไม่ใช่ "ที่เก็บ" แบบที่เราต้องการ)</text>

  <text class="monob" x="60" y="152">D</text>
  <line class="wire" x1="85" y1="158" x2="200" y2="158"/>
  <circle class="dot" cx="110" cy="158" r="3.2"/>
  <line class="wire" x1="110" y1="158" x2="110" y2="252"/>
  <path class="wire" d="M110,252 L170,252 A10,10 0 0 1 190,252 L330,252"/>

  <rect class="block" x="200" y="145" width="90" height="52" rx="6"/>
  <text class="monob" x="245" y="175" text-anchor="middle">AND</text>
  <rect class="blocko" x="330" y="228" width="90" height="48" rx="6"/>
  <text class="monob" x="375" y="258" text-anchor="middle">NOT</text>
  <rect class="block" x="460" y="238" width="90" height="52" rx="6"/>
  <text class="monob" x="505" y="268" text-anchor="middle">AND</text>

  <line class="wire" x1="420" y1="252" x2="460" y2="252"/>

  <text class="monob" x="60" y="326">E</text>
  <line class="wire" x1="85" y1="320" x2="445" y2="320"/>
  <circle class="dot" cx="180" cy="320" r="3.2"/>
  <circle class="dot" cx="445" cy="320" r="3.2"/>
  <line class="wire" x1="180" y1="320" x2="180" y2="182"/>
  <line class="wire" x1="180" y1="182" x2="200" y2="182"/>
  <line class="wire" x1="445" y1="320" x2="445" y2="276"/>
  <line class="wire" x1="445" y1="276" x2="460" y2="276"/>

  <line class="wire" x1="290" y1="170" x2="650" y2="170"/>
  <line class="wire" x1="550" y1="270" x2="650" y2="270"/>

  <rect class="block" x="650" y="140" width="180" height="190" rx="8"/>
  <text class="monob" x="740" y="230" text-anchor="middle">SR latch</text>
  <text class="tiny" x="740" y="252" text-anchor="middle">(NOR 2 ตัวไขว้กัน จากภาพที่ 1)</text>
  <line class="wire" x1="830" y1="180" x2="880" y2="180"/>
  <circle class="dot" cx="880" cy="180" r="3.2"/>
  <text class="monob" x="888" y="184">Q</text>
  <line class="wire" x1="830" y1="290" x2="880" y2="290"/>
  <circle class="dot" cx="880" cy="290" r="3.2"/>
  <text class="monob" x="888" y="294">Q'</text>

  <text class="th" x="60" y="344">ความจริงของ D latch</text>
  <rect class="hrow" x="60" y="350" width="300" height="24" rx="4"/>
  <text class="th" x="105" y="367" text-anchor="middle">D</text>
  <text class="th" x="195" y="367" text-anchor="middle">E</text>
  <text class="th" x="300" y="367" text-anchor="middle">Q(t+1)</text>
  <rect class="row" x="60" y="374" width="300" height="24"/>
  <text class="val" x="105" y="391" text-anchor="middle">0</text>
  <text class="val" x="195" y="391" text-anchor="middle">1</text>
  <text class="val" x="300" y="391" text-anchor="middle">0</text>
  <rect class="rowg" x="60" y="398" width="300" height="24"/>
  <text class="val" x="105" y="415" text-anchor="middle">1</text>
  <text class="val" x="195" y="415" text-anchor="middle">1</text>
  <text class="val" x="300" y="415" text-anchor="middle">1</text>
  <rect class="row" x="60" y="422" width="300" height="24"/>
  <text class="val" x="105" y="439" text-anchor="middle">0/1</text>
  <text class="val" x="195" y="439" text-anchor="middle">0</text>
  <text class="val" x="300" y="439" text-anchor="middle">ค้าง</text>
  <line class="thline" x1="150" y1="350" x2="150" y2="446"/>
  <line class="thline" x1="240" y1="350" x2="240" y2="446"/>

  <text class="lbl" x="380" y="368">E = 1 → gate เปิด: Q วิ่งตาม D ทันที</text>
  <text class="lbl" x="380" y="392">E = 0 → gate ปิด: ตรึงค่าเดิมไว้</text>
  <text class="lbl" x="380" y="416">ถ้า D กระพริบตอน E เปิด เอาต์พุตก็กระพริบตาม — ปัญหานี้คือเหตุผลที่ต้องมี flip-flop</text>

  <!-- ================= Panel B : D flip-flop + clock ================= -->
  <rect class="panelb" x="20" y="472" width="920" height="400" rx="10"/>
  <text class="ptitle" x="40" y="500">B. D flip-flop — ใส่ "นาฬิกา" (clock) และรับค่า D เฉพาะตอนขอบขาขึ้น (rising edge)</text>
  <text class="sub" x="40" y="522">clock = สัญญาณสี่เหลี่ยมที่เต้นเป็นจังหวะ · ขอบขาขึ้น (0 → 1) คือจังหวะเดียวที่ flip-flop ยอมรับค่า D</text>

  <text class="tiny" x="60" y="556">สัญญาณ clock</text>
  <text class="monob" x="48" y="574" text-anchor="end">1</text>
  <text class="monob" x="48" y="624" text-anchor="end">0</text>
  <path class="clk" d="M60,620 L120,620 L120,570 L200,570 L200,620 L260,620 L260,570 L340,570 L340,620 L400,620 L400,570 L470,570"/>
  <path class="clkedge" d="M260,570 L260,536"/>
  <circle class="dot" cx="260" cy="570" r="3.4"/>
  <text class="tiny" x="272" y="548">ขอบขาขึ้น = รับค่า D ตรงนี้</text>
  <path class="wire" d="M470,570 L500,570 L500,635 L620,635"/>
  <text class="mono" x="510" y="605">Clock</text>
  <text class="monob" x="560" y="559">D</text>
  <line class="wire" x1="575" y1="555" x2="620" y2="555"/>

  <rect class="block" x="620" y="530" width="200" height="130" rx="8"/>
  <text class="monob" x="720" y="588" text-anchor="middle">D flip-flop</text>
  <text class="tiny" x="720" y="610" text-anchor="middle">เก็บได้ 1 บิต</text>
  <line class="wire" x1="820" y1="570" x2="900" y2="570"/>
  <circle class="dot" cx="900" cy="570" r="3.2"/>
  <text class="monob" x="908" y="574">Q</text>
  <line class="wire" x1="820" y1="620" x2="900" y2="620"/>
  <circle class="dot" cx="900" cy="620" r="3.2"/>
  <text class="monob" x="908" y="624">Q'</text>

  <text class="tiny" x="60" y="690">ค่า D ที่ flip-flop "จำ" ไว้ จะเปลี่ยนก็ต่อเมื่อมีขอบขาขึ้นเท่านั้น</text>
  <rect class="hrow" x="60" y="700" width="300" height="24" rx="4"/>
  <text class="th" x="130" y="717" text-anchor="middle">D ตอนขอบขาขึ้น</text>
  <text class="th" x="280" y="717" text-anchor="middle">Q หลังขอบนั้น</text>
  <rect class="row" x="60" y="724" width="300" height="24"/>
  <text class="val" x="130" y="741" text-anchor="middle">0</text>
  <text class="val" x="280" y="741" text-anchor="middle">0</text>
  <rect class="rowg" x="60" y="748" width="300" height="24"/>
  <text class="val" x="130" y="765" text-anchor="middle">1</text>
  <text class="val" x="280" y="765" text-anchor="middle">1</text>
  <line class="thline" x1="200" y1="700" x2="200" y2="772"/>

  <text class="tiny" x="620" y="700">สร้างจาก D latch 2 ตัวซ้อนกัน</text>
  <text class="tiny" x="620" y="724">(master + slave) จะได้ flip-flop</text>
  <text class="tiny" x="620" y="748">ที่รับค่าเฉพาะขอบขาขึ้น</text>

  <text class="lbl" x="60" y="800">Q ค้างค่าไว้ได้เองแบบนี้ = หน่วยความจำ 1 บิต · D เปลี่ยนระหว่างนั้นกี่ครั้งก็ไม่มีผล (เพราะไม่ใช่ขอบ clock)</text>
  <text class="lbl" x="60" y="824">CircuitVerse มี D flip-flop สำเร็จรูป และมันเป็น edge-triggered (ดู learn.circuitverse.org หมวด Flip-flops)</text>
  <text class="lbl" x="60" y="848">ส่วน SR latch เราต่อเองจาก NOR 2 ตัว — จะได้เห็นกับตาว่า "วงจรจำ" เกิดจากเส้นป้อนกลับจริง ๆ</text>
</svg>
