<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="ขอบเขตของตัวแปร">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12.5px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 19px; }
    .sub { fill: #57606a; font-size: 12.5px; }
    .btitle { font-weight: 700; font-size: 12.5px; }
    .lbl { fill: #57606a; font-size: 11.5px; }
    .lblb { fill: #0550ae; font-size: 11.5px; font-weight: 700; }
    .lblg { fill: #1a7f37; font-size: 11.5px; font-weight: 700; }
    .lblr { fill: #cf222e; font-size: 11.5px; font-weight: 700; }
    .mono { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 11.5px; }
    .mono10 { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 10px; fill: #57606a; }
    .monob { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 11.5px; font-weight: 700; fill: #0550ae; }
    .monor { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 10px; fill: #cf222e; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .bandw { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .bandc { fill: #eef4ff; stroke: #0969da; stroke-width: 1.6; }
    .bandg { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
    .bandy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
    .bandr { fill: #fff0f0; stroke: #cf222e; stroke-width: 1.4; }
    .arrow { stroke: #57606a; stroke-width: 1.8; fill: none; }
    .arrowb { stroke: #0550ae; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0550ae"/>
    </marker>
  </defs>
  <text x="24.0" y="32.0" class="hdr">scope: บล็อก { } = เขตที่มองเห็น ซ้อนกันได้</text>
  <text x="24.0" y="54.0" class="sub">ตอน 28 env เป็น map แบน · ตอนนี้เป็นห่วงโซ่ของ scope (ซ้อนกันได้)</text>
  <rect x="40.0" y="84.0" width="640.0" height="200.0" rx="8.0" class="band"/>
  <text x="56.0" y="108.0" class="btitle">scope 0 (ขอบเขตโปรแกรม)</text>
  <text x="56.0" y="130.0" class="mono">x = 10</text>
  <rect x="90.0" y="156.0" width="360.0" height="96.0" rx="8.0" class="bandc"/>
  <text x="106.0" y="180.0" class="lblb">scope 1 (บล็อก if)</text>
  <text x="106.0" y="204.0" class="mono">x = 99   ← บัง x ตัวนอกชั่วคราว</text>
  <text x="106.0" y="228.0" class="mono">print x;   → 99</text>
  <path d="M 470.0 228.0 L 470.0 124.0" class="arrowb" marker-end="url(#ab)"/>
  <text x="486.0" y="152.0" class="lblb">หา x:</text>
  <text x="486.0" y="172.0" class="lblb">เดินจากชั้นในสุดออกไป</text>
  <text x="486.0" y="192.0" class="lblb">เจอ x=99 ก่อน</text>
  <text x="56.0" y="274.0" class="mono10">print x;  (ข้างนอก) → 10   เพราะ scope 1 ถูกปิดทิ้งไปแล้ว x ตัวนอกกลับมาเหมือนเดิม</text>
  <text x="56.0" y="310.0" class="lbl">shadowing = ชื่อซ้ำคนละ scope ไม่ทำลายค่าชั้นนอก · ตัวแปรในบล็อกมองไม่เห็นจากข้างนอก</text>
  <text x="24.0" y="326.0" class="lbl">go version go1.24.4 linux/arm64 · Linux 6.18.39+rpt-rpi-2712 aarch64 · 2026-10-02</text>
</svg>
