<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-label="sequence และ ACK: stream 8000 ไบต์แบ่งเป็นแปด segment ท่อนที่ขึ้นต้นที่ 4001 หาย ผู้รับตอบ dupACK สามครั้งแล้วผู้ส่งส่งซ้ำ">
<style>
text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12.5px; fill: #1a1a1a; }
.hdr { font-weight: 700; font-size: 17.5px; }
.sub { fill: #57606a; font-size: 12.5px; }
.ptitle { font-weight: 700; font-size: 14px; }
.txt { font-size: 12.5px; }
.lbl { fill: #57606a; font-size: 11px; }
.small { fill: #57606a; font-size: 10.5px; }
.big { font-weight: 700; font-size: 19px; fill: #0550ae; }
.mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 11.5px; fill: #0a3069; }
.monom { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; fill: #0a3069; }
.monos { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 10.5px; fill: #57606a; }
.onbar { font-size: 12px; font-weight: 600; }
.onbar2 { font-size: 10.5px; fill: #57606a; }
.boxg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
.boxb { fill: #eef4ff; stroke: #0969da; stroke-width: 1.5; }
.boxy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
.boxi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
.boxr { fill: #fdeff0; stroke: #b62324; stroke-width: 1.4; }
.cell { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.1; }
.cellA { fill: #dbeafe; stroke: #0969da; stroke-width: 1.2; }
.cellR { fill: #fdeff0; stroke: #b62324; stroke-width: 1.6; }
.slot { fill: #e6f4ea; stroke: #1a7f37; stroke-width: 1.2; }
.slot0 { fill: #fdeff0; stroke: #b62324; stroke-width: 1.3; }
.wire { stroke: #8c959f; stroke-width: 1.8; fill: none; }
.wire2 { stroke: #b6bfc8; stroke-width: 1.2; fill: none; stroke-dasharray: 5 5; }
.head { fill: #8c959f; }
.headr { fill: #b62324; }
.rule { stroke: #d0d7de; stroke-width: 1.2; }
.life { stroke: #8c959f; stroke-width: 1.4; stroke-dasharray: 6 5; fill: none; }
</style>
<rect x="0" y="0" width="920" height="520" fill="#ffffff"/>
<text class="hdr" x="40" y="34" text-anchor="start">sequence นับเป็นไบต์ — ACK บอกไบต์ถัดไปที่ต้องการ</text>
<text class="sub" x="40" y="58" text-anchor="start">stream 8000 ไบต์ · MSS 1000 · ท่อนที่ 5 (seq 4001) หายระหว่างทาง</text>
<rect class="cellA" x="50.0" y="92.0" width="98.5" height="52.0" rx="4"/>
<text class="onbar" x="99" y="112" text-anchor="middle">seg 1</text>
<text class="monos" x="99" y="130" text-anchor="middle">1–1000</text>
<rect class="cellA" x="152.5" y="92.0" width="98.5" height="52.0" rx="4"/>
<text class="onbar" x="202" y="112" text-anchor="middle">seg 2</text>
<text class="monos" x="202" y="130" text-anchor="middle">1001–2000</text>
<rect class="cellA" x="255.0" y="92.0" width="98.5" height="52.0" rx="4"/>
<text class="onbar" x="304" y="112" text-anchor="middle">seg 3</text>
<text class="monos" x="304" y="130" text-anchor="middle">2001–3000</text>
<rect class="cell" x="357.5" y="92.0" width="98.5" height="52.0" rx="4"/>
<text class="onbar" x="407" y="112" text-anchor="middle">seg 4</text>
<text class="monos" x="407" y="130" text-anchor="middle">3001–4000</text>
<rect class="cellR" x="460.0" y="92.0" width="98.5" height="52.0" rx="4"/>
<text class="onbar" x="509" y="112" text-anchor="middle">seg 5</text>
<text class="monos" x="509" y="130" text-anchor="middle">4001–5000</text>
<text class="small" x="509" y="160" text-anchor="middle">หาย</text>
<rect class="cell" x="562.5" y="92.0" width="98.5" height="52.0" rx="4"/>
<text class="onbar" x="612" y="112" text-anchor="middle">seg 6</text>
<text class="monos" x="612" y="130" text-anchor="middle">5001–6000</text>
<rect class="cell" x="665.0" y="92.0" width="98.5" height="52.0" rx="4"/>
<text class="onbar" x="714" y="112" text-anchor="middle">seg 7</text>
<text class="monos" x="714" y="130" text-anchor="middle">6001–7000</text>
<rect class="cell" x="767.5" y="92.0" width="98.5" height="52.0" rx="4"/>
<text class="onbar" x="817" y="112" text-anchor="middle">seg 8</text>
<text class="monos" x="817" y="130" text-anchor="middle">7001–8000</text>
<text class="lbl" x="50" y="176" text-anchor="start">ผู้รับตอบ ACK อะไรเมื่อท่อนนี้ไปถึง</text>
<text class="monos" x="99" y="196" text-anchor="middle">1001</text>
<text class="monos" x="202" y="196" text-anchor="middle">2001</text>
<text class="monos" x="304" y="196" text-anchor="middle">3001</text>
<text class="monos" x="407" y="196" text-anchor="middle">4001</text>
<text class="monos" x="509" y="196" text-anchor="middle">ไม่ถึง</text>
<text class="monos" x="612" y="196" text-anchor="middle">dupACK 4001</text>
<text class="monos" x="714" y="196" text-anchor="middle">dupACK 4001</text>
<text class="monos" x="817" y="196" text-anchor="middle">dupACK 4001</text>
<line class="rule" x1="40.0" y1="214.0" x2="880.0" y2="214.0"/>
<text class="txt" x="40" y="238" text-anchor="start">ผู้รับยังรอไบต์ 4001 → ตอบ dupACK ทุกครั้งที่มีของตามมา</text>
<rect class="boxy" x="60.0" y="252.0" width="210.0" height="48.0" rx="7"/>
<text class="onbar" x="165" y="271" text-anchor="middle">dupACK 4001</text>
<text class="monos" x="165" y="289" text-anchor="middle">tick 8</text>
<rect class="boxy" x="290.0" y="252.0" width="210.0" height="48.0" rx="7"/>
<text class="onbar" x="395" y="271" text-anchor="middle">dupACK 4001</text>
<text class="monos" x="395" y="289" text-anchor="middle">tick 9</text>
<rect class="boxy" x="520.0" y="252.0" width="210.0" height="48.0" rx="7"/>
<text class="onbar" x="625" y="271" text-anchor="middle">dupACK 4001</text>
<text class="monos" x="625" y="289" text-anchor="middle">tick 10</text>
<text class="small" x="60" y="320" text-anchor="start">→ dupACK สามตัว = ท่อนนั้นหายแน่นอน ผู้ส่งจึงส่งซ้ำได้โดยไม่ต้องรอ timer</text>
<rect class="boxr" x="60.0" y="338.0" width="250.0" height="52.0" rx="7"/>
<text class="onbar" x="185" y="359" text-anchor="middle">ส่งซ้ำ seq 4001</text>
<text class="monos" x="185" y="377" text-anchor="middle">tick 11</text>
<line class="wire" x1="320.0" y1="364.0" x2="400.0" y2="364.0"/>
<polygon class="head" points="400.0,364.0 391.7,367.5 391.7,360.5"/>
<rect class="boxi" x="410.0" y="338.0" width="250.0" height="52.0" rx="7"/>
<text class="onbar" x="535" y="359" text-anchor="middle">ACK 8001</text>
<text class="monos" x="535" y="377" text-anchor="middle">tick 13 — ครบทุกไบต์</text>
<rect class="boxg" x="40.0" y="406.0" width="840.0" height="84.0" rx="8"/>
<text class="txt" x="58" y="432" text-anchor="start">delivered_bytes 8000 = acked_bytes 8000 — ของครบแม้หายกลางทาง</text>
<text class="mono" x="58" y="456" text-anchor="start">dup_acks 3 · fast_retransmit_tick 11 · done_tick 13</text>
<text class="small" x="58" y="478" text-anchor="start">ถ้าท่อนสุดท้ายหาย จะไม่มี dupACK เลย → ต้องรอ RTO (done_tick 17)</text>
</svg>
