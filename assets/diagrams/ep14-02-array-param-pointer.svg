<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-label="ส่ง array เข้าฟังก์ชันคือส่ง pointer ขนาด array จึงหายไป">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 17.5px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .sub { fill: #57606a; font-size: 12.5px; }
    .lbl { fill: #57606a; font-size: 11.5px; }
    .tiny { fill: #57606a; font-size: 11px; }
    .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
    .monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #0550ae; }
    .big { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 20px; font-weight: 700; fill: #1a7f37; }
    .addr { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #57606a; }
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .cell { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .cellhi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.9; }
    .cellthin { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .notebox { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.3; }
    .cbox { fill: #eef4ff; stroke: #0969da; stroke-width: 1.3; }
    .gobox { fill: #e6f4ff; stroke: #0a7ea4; stroke-width: 1.3; }
    .warnbox { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.3; }
    .rowband { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .wire { stroke: #1a7f37; stroke-width: 2.2; fill: none; }
    .wire2 { stroke: #57606a; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="arr-n" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="980" height="620" fill="#ffffff"/>

<text class="hdr" x="490" y="34" text-anchor="middle">ส่ง array เข้าฟังก์ชัน = ส่ง pointer — ขนาด array ไม่เดินทางไปด้วย</text>
<text class="sub" x="490" y="58" text-anchor="middle">int sum(int arr[], int n)   กับ   int sum(int *arr, int n)   คือฟังก์ชันชนิดเดียวกันเป๊ะ</text>
<rect class="cbox" x="30" y="80" width="430" height="300" rx="10"/>
<text class="ptitle" x="46" y="106">ฝั่งผู้เรียก: main()</text>
<text class="mono" x="46" y="132">int a[3] = {10, 20, 30};</text>
<text class="mono" x="46" y="158">printf("%d", sum(a, 3));</text>
<text class="lbl" x="46" y="184">sizeof(a) = 12 ไบต์ — main ยังรู้ขนาด array</text>
<text class="lbl" x="46" y="208">ข้อมูลตัวจริงอยู่ในหน่วยความจำก้อนเดียว</text>
<rect class="cell" x="46" y="240" width="120" height="56" rx="6"/>
<text class="lbl" x="106" y="262" text-anchor="middle">a[0]</text>
<text class="big" x="106" y="286" text-anchor="middle">10</text>
<rect class="cell" x="176" y="240" width="120" height="56" rx="6"/>
<text class="lbl" x="236" y="262" text-anchor="middle">a[1]</text>
<text class="big" x="236" y="286" text-anchor="middle">20</text>
<rect class="cell" x="306" y="240" width="120" height="56" rx="6"/>
<text class="lbl" x="366" y="262" text-anchor="middle">a[2]</text>
<text class="big" x="366" y="286" text-anchor="middle">30</text>
<text class="lbl" x="46" y="318">array จริง 3 ช่อง = 12 ไบต์ (อยู่ในหน่วยความจำของ main)</text>
<text class="lbl" x="46" y="344">สิ่งที่ส่งออกไป: แค่ address ช่องแรก (8 ไบต์)</text>
<text class="lbl" x="46" y="368">ไม่ใช่ตัว array ทั้ง 3 ช่อง</text>
<line class="wire" x1="462" y1="300" x2="516" y2="300" marker-end="url(#arr-g)"/>
<text class="lbl" x="489" y="292" text-anchor="middle">ส่ง</text>
<rect class="gobox" x="520" y="80" width="430" height="300" rx="10"/>
<text class="ptitle" x="536" y="106">ฝั่งผู้ถูกเรียก: sum()</text>
<text class="mono" x="536" y="132">int sum(int arr[], int n) {</text>
<text class="mono" x="536" y="158">    /* arr จริง ๆ คือ int *arr */</text>
<text class="mono" x="536" y="184">    for (int i = 0; i &lt; n; i++)</text>
<text class="mono" x="536" y="210">        total += arr[i];</text>
<text class="mono" x="536" y="236">}</text>
<rect class="cell" x="536" y="272" width="200" height="56" rx="6"/>
<text class="lbl" x="636" y="294" text-anchor="middle">arr (คือ pointer)</text>
<text class="big" x="636" y="318" text-anchor="middle">8 ไบต์</text>
<text class="lbl" x="760" y="294">sizeof(arr) = 8</text>
<text class="lbl" x="760" y="318">ไม่รู้เลยว่ามี 3 ช่อง</text>
<text class="lbl" x="536" y="350">ต้องส่งความยาว n แยกต่างหาก — C ไม่มี len() แถมมาให้</text>
<rect class="warnbox" x="30" y="398" width="920" height="200" rx="10"/>
<text class="ptitle" x="50" y="426">คำเตือนจริงจาก GCC 14.2.0 เมื่อเผลอเอา sizeof ไปใช้กับตัวรับที่เป็น array</text>
<text class="mono" x="50" y="454">sizeof_param_warn.c:14:19: warning: 'sizeof' on array function parameter 'arr'</text>
<text class="mono" x="50" y="480">    will return size of 'int *' [-Wsizeof-array-argument]</text>
<text class="mono" x="50" y="506">sizeof_param_warn.c:11:27: note: declared here</text>
<text class="mono" x="50" y="532">   11 | static void show_size(int arr[], int n) {</text>
<text class="lbl" x="50" y="574">แปลว่า: แม้ผู้เรียกมี array 400 ไบต์ แต่ในฟังก์ชัน sizeof(arr) ได้แค่ 8 ไบต์ — ขนาดหายไปตรงรอยต่อนี้เอง</text>
</svg>
