<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-label="pointer ใน C ทำอะไรได้ที่ Go ไม่ให้ทำ">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 17.5px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .sub { fill: #57606a; font-size: 12.5px; }
    .lbl { fill: #57606a; font-size: 11.5px; }
    .tiny { fill: #57606a; font-size: 11px; }
    .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
    .monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #0550ae; }
    .big { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 20px; font-weight: 700; fill: #1a7f37; }
    .addr { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #57606a; }
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .cell { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .cellhi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.9; }
    .notebox { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.3; }
    .cbox { fill: #eef4ff; stroke: #0969da; stroke-width: 1.3; }
    .gobox { fill: #e6f4ff; stroke: #0a7ea4; stroke-width: 1.3; }
    .rowband { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .wire { stroke: #1a7f37; stroke-width: 2.2; fill: none; }
    .wire2 { stroke: #57606a; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="arr-n" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="640" fill="#ffffff"/>

<text class="hdr" x="480" y="34" text-anchor="middle">pointer: ข้อ 1 เหมือนกัน · ข้อ 2 Go ห้าม · ข้อ 3 Go อัตโนมัติ</text>
<text class="sub" x="480" y="58" text-anchor="middle">Go มี &amp; (ขอ address) และ * (dereference) เหมือน C แต่ "ห้ามบวกลบ address" เพื่อความปลอดภัย</text>
<rect class="cbox" x="40" y="78" width="430" height="34" rx="8"/>
<text class="ptitle" x="255.0" y="101" text-anchor="middle" fill="#0969da">C: เข้าถึง address ได้ตรง ๆ</text>
<rect class="gobox" x="490" y="78" width="430" height="34" rx="8"/>
<text class="ptitle" x="705.0" y="101" text-anchor="middle" fill="#0a7ea4">Go: จำกัดด้วยตัว compiler + GC</text>
<rect class="rowband" x="40" y="126" width="880" height="88" rx="10"/>
<text class="ptitle" x="56" y="150">1. เอา address ของตัวแปร</text>
<text class="mono" x="56" y="174">int x = 5;</text>
<text class="mono" x="56" y="196">int *p = &amp;x;   /* ได้ address */</text>
<text class="mono" x="506" y="174">x := 5</text>
<text class="mono" x="506" y="196">p := &amp;x        // ได้ address เหมือนกัน</text>
<rect class="rowband" x="40" y="224" width="880" height="132" rx="10"/>
<text class="ptitle" x="56" y="248">2. บวก/ลบ address (pointer arithmetic)</text>
<text class="mono" x="56" y="272">int a[3] = {10, 20, 30};</text>
<text class="mono" x="56" y="294">int *p = a;     /* ชี้ที่ a[0] */</text>
<text class="mono" x="56" y="316">p = p + 1;      /* +4 ไบต์ → a[1] */</text>
<text class="mono" x="56" y="338">printf("%d", *p);  /* 20 */</text>
<text class="mono" x="506" y="272">a := [3]int{10, 20, 30}</text>
<text class="mono" x="506" y="294">p := &amp;a[0]</text>
<text class="mono" x="506" y="316">// p = p + 1  ← compile ไม่ผ่าน</text>
<text class="mono" x="506" y="338">// ต้องใช้ index: a[1]</text>
<rect class="rowband" x="40" y="366" width="880" height="110" rx="10"/>
<text class="ptitle" x="56" y="390">3. จัดการหน่วยความจำเอง</text>
<text class="mono" x="56" y="414">int *b = malloc(100 * sizeof(int));</text>
<text class="mono" x="56" y="436">/* ...ใช้แล้วต้อง... */</text>
<text class="mono" x="56" y="458">free(b);</text>
<text class="mono" x="506" y="414">b := make([]int, 100)</text>
<text class="mono" x="506" y="436">// ไม่ต้อง free — GC เก็บให้</text>
<rect class="notebox" x="40" y="486" width="880" height="140" rx="10"/>
<text class="ptitle" x="60" y="512">ทำไม Go ห้ามข้อ 2? — เหตุผลทางการจาก Go FAQ 3 ข้อ</text>
<text class="mono" x="60" y="536">1) Safety: ไม่มี pointer arithmetic → ภาษาไม่มีทางสร้าง address ที่ผิดกฎได้เลย</text>
<text class="mono" x="60" y="560">   จึงไม่มีทาง "เดินผิดช่อง" ไปเขียนทับข้อมูลของตัวแปรอื่นได้ตั้งแต่แรก</text>
<text class="mono" x="60" y="584">2) เร็วเท่ากัน: สมัยนี้ loop ที่ใช้ index เร็วเท่ากับ loop ที่ใช้ pointer arithmetic แล้ว</text>
<text class="mono" x="60" y="608">3) GC: ไม่มี pointer arithmetic ทำให้ตัวเก็บขยะ (garbage collector) ทำงานง่ายขึ้น</text>
</svg>
