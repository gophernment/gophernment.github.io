<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" role="img" aria-label="p+1 เลื่อนกี่ไบต์ขึ้นกับชนิดข้อมูลที่ pointer ชี้อยู่">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 17.5px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .sub { fill: #57606a; font-size: 12.5px; }
    .lbl { fill: #57606a; font-size: 11.5px; }
    .tiny { fill: #57606a; font-size: 11px; }
    .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
    .monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #0550ae; }
    .big { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 20px; font-weight: 700; fill: #1a7f37; }
    .addr { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #57606a; }
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .cell { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .cellhi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.9; }
    .cellthin { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .notebox { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.3; }
    .cbox { fill: #eef4ff; stroke: #0969da; stroke-width: 1.3; }
    .gobox { fill: #e6f4ff; stroke: #0a7ea4; stroke-width: 1.3; }
    .warnbox { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.3; }
    .rowband { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .wire { stroke: #1a7f37; stroke-width: 2.2; fill: none; }
    .wire2 { stroke: #57606a; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="arr-n" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="980" height="600" fill="#ffffff"/>

<text class="hdr" x="490" y="34" text-anchor="middle">p + 1 เลื่อนกี่ไบต์ ขึ้นกับชนิดที่ p ชี้อยู่</text>
<text class="sub" x="490" y="58" text-anchor="middle">C ไม่ได้บวก 1 ไบต์ให้ — มันบวก 1 ช่อง โดยขนาดช่องมาจากชนิดที่ pointer ชี้ออกไป</text>
<rect class="rowband" x="30" y="84" width="920" height="116" rx="10"/>
<text class="ptitle" x="50" y="112">int *    → 1 ช่อง = 4 ไบต์</text>
<text class="mono" x="50" y="138">int *p = arr;   p = p + 1;   /* +4 ไบต์ */</text>
<rect class="cell" x="60" y="150" width="170" height="40" rx="6"/>
<text class="mono" x="145" y="175" text-anchor="middle">a[0] = 10</text>
<rect class="cell" x="320" y="150" width="170" height="40" rx="6"/>
<text class="mono" x="405" y="175" text-anchor="middle">a[1] = 20</text>
<line class="wire" x1="248" y1="170" x2="300" y2="170" marker-end="url(#arr-g)"/>
<text class="lbl" x="274" y="162" text-anchor="middle">+4 ไบต์</text>
<text class="mono" x="590" y="175" fill="#1a7f37">sizeof(int) = 4 ไบต์ → p+1 = +4 ไบต์</text>
<rect class="rowband" x="30" y="210" width="920" height="116" rx="10"/>
<text class="ptitle" x="50" y="238">double * → 1 ช่อง = 8 ไบต์</text>
<text class="mono" x="50" y="264">double *p = arr;   p = p + 1;   /* +8 ไบต์ */</text>
<rect class="cell" x="60" y="276" width="170" height="40" rx="6"/>
<text class="mono" x="145" y="301" text-anchor="middle">d[0] = 1.5</text>
<rect class="cell" x="320" y="276" width="170" height="40" rx="6"/>
<text class="mono" x="405" y="301" text-anchor="middle">d[1] = 2.5</text>
<line class="wire" x1="248" y1="296" x2="300" y2="296" marker-end="url(#arr-g)"/>
<text class="lbl" x="274" y="288" text-anchor="middle">+8 ไบต์</text>
<text class="mono" x="590" y="301" fill="#0969da">sizeof(double) = 8 ไบต์ → p+1 = +8 ไบต์</text>
<rect class="rowband" x="30" y="336" width="920" height="116" rx="10"/>
<text class="ptitle" x="50" y="364">char *   → 1 ช่อง = 1 ไบต์</text>
<text class="mono" x="50" y="390">char *p = arr;   p = p + 1;   /* +1 ไบต์ */</text>
<rect class="cell" x="60" y="402" width="170" height="40" rx="6"/>
<text class="mono" x="145" y="427" text-anchor="middle">c[0] = 'A'</text>
<rect class="cell" x="320" y="402" width="170" height="40" rx="6"/>
<text class="mono" x="405" y="427" text-anchor="middle">c[1] = 'B'</text>
<line class="wire" x1="248" y1="422" x2="300" y2="422" marker-end="url(#arr-g)"/>
<text class="lbl" x="274" y="414" text-anchor="middle">+1 ไบต์</text>
<text class="mono" x="590" y="427" fill="#0a7ea4">sizeof(char) = 1 ไบต์ → p+1 = +1 ไบต์</text>
<rect class="notebox" x="30" y="462" width="920" height="130" rx="10"/>
<text class="ptitle" x="50" y="490">อีกเรื่องที่ต้องแยกให้ออก: ผลลบของ pointer</text>
<text class="mono" x="50" y="516">• &amp;a[1] - &amp;a[0] ได้ 1 — เป็น "จำนวนช่อง" ไม่ใช่ไบต์ (ผลลบแบบนี้มีชนิดเป็น ptrdiff_t พิมพ์ด้วย %td)</text>
<text class="mono" x="50" y="542">• (char *)&amp;a[1] - (char *)&amp;a[0] ได้ 4 — แปลงเป็น char * (ช่องละ 1 ไบต์) ก่อน จึงได้เป็นไบต์</text>
<text class="mono" x="50" y="568">• pointer ที่ชี้ข้อมูลคนละชนิดกันลบกันไม่ได้ — ผลลบมีความหมายแค่เมื่ออยู่ใน array เดียวกัน</text>
</svg>
