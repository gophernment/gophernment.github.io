  <text x="832.0" y="378.0" class="lbl">คณิตศาสตร์ (gcd)</text>
  <text x="832.0" y="398.0" class="monog">ตรง 512/512 เคส</text>
  <rect x="30.0" y="564.0" width="1000.0" height="112.0" class="bandc"/>
  <text x="46.0" y="590.0" class="ptitle">ทำไมการทแยงสำคัญ: ไม่มีแถวไหนเท่ากับ D ได้เลย</text>
  <text x="46.0" y="614.0" class="lbl">ถ้าตารางนี้เป็นรายชื่อโปรแกรม "ทั้งหมด" (ไม่จำกัด) และ D เป็นฟังก์ชันที่คำนวณได้ → จะมีโปรแกรมหนึ่งในรายชื่อที่ต้องคำนวณ D</text>
  <text x="46.0" y="634.0" class="lbl">แต่แถวของโปรแกรมนั้นต้องต่างจาก D ที่ช่องของตัวเอง → ขัดแย้งทันที → ไม่มีโปรแกรมไหนคำนวณ D ได้</text>
  <text x="46.0" y="656.0" class="lblb">นี่คือสะพานไปสู่ halting problem: โปรแกรมที่ถามว่า "ตัวฉันเองหยุดไหม" แล้วทำตรงกันข้าม (โปรแกรม 04)</text>
</svg>
