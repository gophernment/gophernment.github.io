  <text x="24.0" y="32.0" class="hdr">parser: เปลี่ยนสตรีมแบน ๆ ให้เป็นต้นไม้ (AST)</text>
  <text x="24.0" y="54.0" class="sub">ตัวอย่างที่ใช้ทั้งภาพ: 3 + 4 * 5  ·  ตัวเลขและข้อความทุกตัวดึงจากผลรันจริงใน out/</text>
  <rect x="24.0" y="74.0" width="186.0" height="84.0" rx="8.0" class="bandw"/>
  <text x="117.0" y="100.0" class="btitle" text-anchor="middle">ซอร์สโค้ด</text>
  <text x="117.0" y="118.0" class="lbl" text-anchor="middle">มนุษย์เขียนแบบนี้</text>
  <text x="117.0" y="140.0" class="mono" text-anchor="middle">3 + 4 * 5</text>
  <rect x="236.0" y="74.0" width="186.0" height="84.0" rx="8.0" class="bandw"/>
  <text x="329.0" y="100.0" class="btitle" text-anchor="middle">Lexer (ตอน 26)</text>
  <text x="329.0" y="118.0" class="lbl" text-anchor="middle">ตัดเป็นคำ ๆ</text>
  <text x="329.0" y="140.0" class="mono" text-anchor="middle">token = 1 คำ</text>
  <rect x="448.0" y="74.0" width="186.0" height="84.0" rx="8.0" class="bandw"/>
  <text x="541.0" y="100.0" class="btitle" text-anchor="middle">Parser (ตอนนี้)</text>
  <text x="541.0" y="118.0" class="lbl" text-anchor="middle">เรียงเป็นต้นไม้</text>
  <text x="541.0" y="140.0" class="mono" text-anchor="middle">1 กฎ = 1 ฟังก์ชัน</text>
  <rect x="660.0" y="74.0" width="296.0" height="84.0" rx="8.0" class="bandc"/>
  <text x="808.0" y="100.0" class="btitle" text-anchor="middle">AST</text>
  <text x="808.0" y="118.0" class="lbl" text-anchor="middle">ต้นไม้โครงสร้างโปรแกรม</text>
  <text x="808.0" y="140.0" class="mono" text-anchor="middle">S-expression + ต้นไม้</text>
  <path d="M 210.0 116.0 L 234.0 116.0" class="arrow" marker-end="url(#a)"/>
  <path d="M 422.0 116.0 L 446.0 116.0" class="arrow" marker-end="url(#a)"/>
  <path d="M 634.0 116.0 L 658.0 116.0" class="arrow" marker-end="url(#a)"/>
  <rect x="24.0" y="178.0" width="466.0" height="314.0" rx="8.0" class="band"/>
  <text x="40.0" y="202.0" class="btitle">ผลของ lexer: สตรีมแบน 6 token — เรียงเป็นเส้นเดียว</text>
  <text x="40.0" y="234.0" class="mono">NUMBER(3) PLUS(+) NUMBER(4) STAR(*) NUMBER(5) EOF()</text>
  <text x="40.0" y="274.0" class="lblr">ข้อเสีย: ไม่บอกว่า “อะไรจับกับอะไร”</text>
  <text x="40.0" y="296.0" class="lbl">— คูณก่อนบวกไหม? วงเล็บครอบตรงไหน? ถามไม่ได้เลย</text>
  <text x="40.0" y="338.0" class="lbl">เทียบกับทั้งโปรแกรม (โปรแกรม A — 3 บรรทัด):</text>
  <text x="40.0" y="360.0" class="monob">lexer ได้ 30 token · parser ได้ 3 คำสั่ง</text>
  <text x="40.0" y="382.0" class="lbl">แถม: ตัวอย่างทั้ง 3 โปรแกรมใช้ชนิด token ครบ 23/23 ชนิด</text>
  <rect x="506.0" y="178.0" width="450.0" height="314.0" rx="8.0" class="band"/>
  <text x="522.0" y="202.0" class="btitle">ผลของ parser: ต้นไม้ AST</text>
  <text x="540.0" y="236.0" class="mono">BinaryExpr +</text>
  <text x="540.0" y="255.0" class="mono">├─ NumberLit 3</text>
  <text x="540.0" y="274.0" class="mono">└─ BinaryExpr *</text>
  <text x="540.0" y="293.0" class="mono">   ├─ NumberLit 4</text>
  <text x="540.0" y="312.0" class="mono">   └─ NumberLit 5</text>
  <text x="522.0" y="374.0" class="monob">S-expression: (+ 3 (* 4 5))</text>
  <text x="522.0" y="408.0" class="lblr">“abstract” = ตัดสิ่งที่ใช้แค่จัดกลุ่มออกแล้ว</text>
  <text x="522.0" y="430.0" class="lbl">— เหลือแต่ก้อนความหมาย: บวก(3, คูณ(4, 5))</text>
  <text x="522.0" y="464.0" class="lbl">ทั้งโปรแกรมก็ได้ต้นไม้แบบเดียวกัน — ดู out/03</text>
  <rect x="24.0" y="508.0" width="932.0" height="40.0" rx="8.0" class="bandy"/>
  <text x="40.0" y="533.0" class="lbl">เส้นทางที่เหลือ: parser → AST (ตอนนี้) → interpreter: tree-walking (ตอนที่ 28) → type/scope (ตอนที่ 29) → codegen (ตอนที่ 30)</text>
  <text x="24.0" y="572.0" class="lbl">go version go1.24.4 linux/arm64 · Linux 6.18.39+rpt-rpi-2712 aarch64 · 2026-10-01 · ภาพวาดเองด้วย SVG (ไม่มีลิขสิทธิ์)</text>
