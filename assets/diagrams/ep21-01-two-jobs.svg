<text x="40" y="46" class="h">งานสองอย่างที่ต้องแยกจากกัน — และทำที่เดียวกันไม่ได้</text>
<text x="40" y="74" class="s">ตรวจที่ boundary ตัดสินว่า "ค่าอยู่ในรูปที่ยอมรับไหม" · encode ที่ sink ตัดสินว่า "เขียนออกอย่างไร"</text>
<rect x="40" y="96" width="150" height="100" rx="10" fill="#f5f7f9" stroke="#9aa9b8" stroke-width="1.5"/>
<text x="50" y="122" class="hd">ข้างนอก</text>
<text x="50" y="144" class="sm">ผู้ใช้ · API · ไฟล์</text>
<text x="50" y="160" class="sm">อะไรก็ได้ที่</text>
<text x="50" y="176" class="sm">เราไม่ได้เขียนเอง</text>
<rect x="230" y="96" width="210" height="100" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<text x="240" y="122" class="hd">boundary: ตรวจ</text>
<text x="240" y="144" class="sm">canonicalize หนึ่งรอบ</text>
<text x="240" y="160" class="sm">allowlist ไม่ใช่ blacklist</text>
<text x="240" y="176" class="sm">ไม่ผ่าน = ปฏิเสธ</text>
<rect x="480" y="96" width="150" height="100" rx="10" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="490" y="122" class="hd">ที่เก็บ</text>
<text x="490" y="144" class="sm">ค่าดิบทุกไบต์</text>
<text x="490" y="160" class="sm">ไม่แปลงค่า</text>
<text x="490" y="176" class="sm">ไม่ encode</text>
<rect x="670" y="96" width="210" height="100" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="1.5"/>
<text x="680" y="122" class="hd">sink: encode</text>
<text x="680" y="144" class="sm">เลือก escaper ตาม context</text>
<text x="680" y="160" class="sm">5 บริบท 5 วิธี</text>
<text x="680" y="176" class="sm">ไม่รู้จัก context = เดา</text>
<line x1="192" y1="146" x2="226" y2="146" stroke="#7d93a8" stroke-width="1.6"/>
