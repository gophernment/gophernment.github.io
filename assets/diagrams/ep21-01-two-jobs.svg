<rect x="40" y="220" width="420" height="92" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<text x="58" y="244" class="hd">ผลของตัวตรวจ: 7 ผ่าน → 2 ผ่าน</text>
<text x="58" y="266" class="s">ตัวตรวจเดียวกันเป๊ะ ต่างกันแค่ลำดับการทำงาน</text>
<text x="58" y="286" class="sm">/%2f%2fevil.example ดูสะอาด แต่กลายเป็น ///evil.example</text>
<rect x="480" y="220" width="400" height="92" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="1.5"/>
<text x="498" y="244" class="hd">encode ผิดบริบท = ยังพัง</text>
<text x="498" y="266" class="s">concat ทะลุ 5 · escape_string ทะลุ 1 จาก 5</text>
<text x="498" y="286" class="sm">text/template ทะลุ 5 · html/template ทะลุ 0</text>
<rect x="40" y="330" width="840" height="96" rx="10" fill="#fdeeee" stroke="#c05050" stroke-width="1.5"/>
<text x="58" y="356" class="hd">ถ้าสลับที่กันจะเกิดอะไรขึ้น</text>
<text x="58" y="378" class="s">encode ตอนรับ → เก็บ &amp;lt; ไว้ แล้ว template encode อีกชั้น</text>
<text x="58" y="396" class="s">→ ผู้ใช้เห็น &amp;lt; (ข้อมูลเพี้ยน ไม่ใช่ช่องโหว่ แต่พังจริง)</text>
<text x="58" y="414" class="s">validate ที่ sink → สายเกินไป: ค่าถูกใช้ไปหลายที่ก่อนถึงตัวตรวจ</text>
<rect x="40" y="436" width="840" height="78" rx="10" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="58" y="462" class="hd">ผลลัพธ์ที่ต้องการ: ทะลุ 0 จาก 36 ช่อง และข้อมูลผู้ใช้ยังครบ</text>
<text x="58" y="484" class="s">ฝั่งที่พังทะลุ 10 ช่อง · ฝั่งที่แก้ทะลุ 0 · bio "I &lt;3 Go &amp; coffee" ออกมาครบ 16 ไบต์</text>
<text x="40" y="540" class="sm">ด่านที่เดโม 4 ตรวจ: html_text · attr_quoted · url_query · url_href · js_string · sql_lookup</text>
<text x="40" y="562" class="sm">ตัวเลขทั้งหมด: code/ep21/out/01_boundary.txt · 02_encode.txt · 04_pipeline.txt</text>
