<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" role="img" aria-label="สัดส่วน address space ของ classful A ถึง E พร้อมจำนวน network">
<style>
text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12.5px; fill: #1a1a1a; }
.hdr { font-weight: 700; font-size: 17.5px; }
.sub { fill: #57606a; font-size: 12.5px; }
.ptitle { font-weight: 700; font-size: 14px; }
.txt { font-size: 12.5px; }
.lbl { fill: #57606a; font-size: 11px; }
.small { fill: #57606a; font-size: 10.5px; }
.big { font-weight: 700; font-size: 20px; fill: #0550ae; }
.mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 11.5px; fill: #0a3069; }
.monom { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; fill: #0a3069; }
.monos { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 10.5px; fill: #57606a; }
.bit { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #0550ae; }
.boxg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
.boxb { fill: #eef4ff; stroke: #0969da; stroke-width: 1.5; }
.boxy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
.boxi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
.boxr { fill: #fdeff0; stroke: #b62324; stroke-width: 1.4; }
.bit0 { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
.bit1 { fill: #dbeafe; stroke: #0969da; stroke-width: 1; }
.segA { fill: #dbeafe; stroke: #0969da; stroke-width: 1.4; }
.segB { fill: #e6f4ea; stroke: #1a7f37; stroke-width: 1.4; }
.segC { fill: #fff4d6; stroke: #bf8700; stroke-width: 1.4; }
.segD { fill: #f3e8fd; stroke: #8250df; stroke-width: 1.4; }
.segE { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.4; }
.wire { stroke: #8c959f; stroke-width: 1.8; fill: none; }
.wire2 { stroke: #b6bfc8; stroke-width: 1.2; fill: none; stroke-dasharray: 5 5; }
.head { fill: #8c959f; }
.rule { stroke: #d0d7de; stroke-width: 1.2; }
</style>
<rect x="0" y="0" width="920" height="430" fill="#ffffff"/>
<text class="hdr" x="40" y="36" text-anchor="start">classful: ห้าชั้นที่แบ่งด้วยบิตนำ</text>
<text class="sub" x="40" y="60" text-anchor="start">แถบยาว 32 บิตแบ่งตามสัดส่วนจริง — ครึ่งหนึ่งของ space ถูกจองให้ 128 หมายเลข</text>
<rect class="segA" x="40" y="88" width="420.0" height="52" rx="4"/>
<text class="onbar" x="250" y="120" text-anchor="middle">A · 50.00%</text>
<rect class="segB" x="460.0" y="88" width="210.0" height="52" rx="4"/>
<text class="onbar" x="565" y="120" text-anchor="middle">B · 25.00%</text>
<rect class="segC" x="670.0" y="88" width="105.0" height="52" rx="4"/>
<text class="onbar" x="722" y="120" text-anchor="middle">C · 12.50%</text>
<rect class="segD" x="775.0" y="88" width="52.5" height="52" rx="4"/>
<text class="onbar" x="801" y="120" text-anchor="middle">D</text>
<rect class="segE" x="827.5" y="88" width="52.5" height="52" rx="4"/>
<text class="onbar" x="854" y="120" text-anchor="middle">E</text>
<text class="small" x="40" y="160" text-anchor="start">0.0.0.0</text>
<text class="small" x="880" y="160" text-anchor="end">255.255.255.255</text>
<text class="lbl" x="48" y="200" text-anchor="start">class</text>
<text class="lbl" x="120" y="200" text-anchor="start">first_bits</text>
<text class="lbl" x="210" y="200" text-anchor="start">prefix</text>
<text class="lbl" x="290" y="200" text-anchor="start">networks</text>
<text class="lbl" x="420" y="200" text-anchor="start">share</text>
<text class="lbl" x="520" y="200" text-anchor="start">ใช้ทำอะไร</text>
<line class="rule" x1="40" y1="208" x2="880" y2="208"/>
<text class="txt" x="48" y="230" text-anchor="start">A</text>
<text class="mono" x="120" y="230" text-anchor="start">0</text>
<text class="mono" x="210" y="230" text-anchor="start">/8</text>
<text class="mono" x="290" y="230" text-anchor="start">128</text>
<text class="mono" x="420" y="230" text-anchor="start">50.00%</text>
<text class="small" x="520" y="230" text-anchor="start">องค์กรใหญ่ระดับประเทศ</text>
<text class="txt" x="48" y="254" text-anchor="start">B</text>
<text class="mono" x="120" y="254" text-anchor="start">10</text>
<text class="mono" x="210" y="254" text-anchor="start">/16</text>
<text class="mono" x="290" y="254" text-anchor="start">16,384</text>
<text class="mono" x="420" y="254" text-anchor="start">25.00%</text>
<text class="small" x="520" y="254" text-anchor="start">องค์กรขนาดกลาง</text>
<text class="txt" x="48" y="278" text-anchor="start">C</text>
<text class="mono" x="120" y="278" text-anchor="start">110</text>
<text class="mono" x="210" y="278" text-anchor="start">/24</text>
<text class="mono" x="290" y="278" text-anchor="start">2,097,152</text>
<text class="mono" x="420" y="278" text-anchor="start">12.50%</text>
<text class="small" x="520" y="278" text-anchor="start">องค์กรเล็ก</text>
<text class="txt" x="48" y="302" text-anchor="start">D</text>
<text class="mono" x="120" y="302" text-anchor="start">1110</text>
<text class="mono" x="210" y="302" text-anchor="start">-</text>
<text class="mono" x="290" y="302" text-anchor="start">-</text>
<text class="mono" x="420" y="302" text-anchor="start">6.25%</text>
<text class="small" x="520" y="302" text-anchor="start">multicast</text>
<text class="txt" x="48" y="326" text-anchor="start">E</text>
<text class="mono" x="120" y="326" text-anchor="start">1111</text>
<text class="mono" x="210" y="326" text-anchor="start">-</text>
<text class="mono" x="290" y="326" text-anchor="start">-</text>
<text class="mono" x="420" y="326" text-anchor="start">6.25%</text>
<text class="small" x="520" y="326" text-anchor="start">สงวนไว้ทดลอง</text>
<rect class="boxy" x="40" y="350" width="840" height="56" rx="8"/>
<text class="txt" x="58" y="373" text-anchor="start">class A: 128 network กินพื้นที่ครึ่งหนึ่งของ 4,294,967,296 ใบ</text>
<text class="txt" x="58" y="394" text-anchor="start">class C: 2,097,152 network แต่ได้พื้นที่เพียง 12.50% — ที่อยู่ต่อ network มีแค่ 256 ใบ</text>
</svg>
