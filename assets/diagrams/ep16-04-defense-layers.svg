<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 780" width="1040" height="780" role="img" aria-label="เกราะป้องกัน 6 ชั้นสำหรับปัญหาหน่วยความจำ พร้อมสิ่งที่แต่ละชั้นทำไม่ได้">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 17.5px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .sub { fill: #57606a; font-size: 12.5px; }
    .lbl { fill: #57606a; font-size: 11.5px; }
    .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
    .monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #0550ae; }
    .monor { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #cf222e; }
    .monog { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #1a7f37; }
    .big { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 19px; font-weight: 700; fill: #1a7f37; }
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .cell { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .cellw { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .cellhi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.9; }
    .cellbad { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.9; }
    .cellcanary { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.9; }
    .notebox { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.3; }
    .cbox { fill: #eef4ff; stroke: #0969da; stroke-width: 1.3; }
    .gobox { fill: #e6f4ff; stroke: #0a7ea4; stroke-width: 1.3; }
    .warnbox { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.3; }
    .rowband { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .wire { stroke: #1a7f37; stroke-width: 2.2; fill: none; }
    .wirer { stroke: #cf222e; stroke-width: 2.2; fill: none; }
    .wire2 { stroke: #57606a; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
    <marker id="arr-n" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect x="0" y="0" width="1040" height="780" fill="#ffffff"/>

<text class="hdr" x="520" y="34" text-anchor="middle">เกราะ 6 ชั้น: แต่ละชั้นกันอะไรได้ และกันอะไรไม่ได้</text>
<text class="sub" x="520" y="58" text-anchor="middle">ไม่มีชั้นไหนแทนกันได้ — ชั้นที่ 1 สำคัญที่สุด เพราะแก้ที่ต้นเหตุ (คำสั่งในโค้ดที่เราฝึก)</text>
<rect class="gobox" x="40" y="82" width="960" height="92" rx="10"/>
<text class="big" x="62" y="126">1</text>
<text class="ptitle" x="104" y="110">เขียนโค้ดที่รู้ขนาดเสมอ</text>
<text class="mono" x="104" y="134">fgets(buf, sizeof buf, in) · snprintf แล้วเช็คค่าที่คืน · ตรวจว่าถูกตัดไหม</text>
<text class="lbl" x="104" y="158">กันได้: เขียน/อ่านล้น ตั้งแต่ต้นเหตุ</text>
<rect class="gobox" x="40" y="180" width="960" height="92" rx="10"/>
<text class="big" x="62" y="224">2</text>
<text class="ptitle" x="104" y="208">เช็คการคูณล้นก่อนจอง</text>
<text class="mono" x="104" y="232">if (n &gt; SIZE_MAX / size) return NULL; แล้วค่อย malloc(n * size)</text>
<text class="lbl" x="104" y="256">กันได้: จองก้อนเล็กกว่าที่คิด -&gt; เขียนล้น heap</text>
<rect class="cellcanary" x="40" y="278" width="960" height="92" rx="10"/>
<text class="big" x="62" y="322">3</text>
<text class="ptitle" x="104" y="306">Stack canary</text>
<text class="mono" x="104" y="330">-fstack-protector-strong · ค่าลับวางติดกับบัฟเฟอร์ ตรวจตอนจบฟังก์ชัน</text>
<text class="lbl" x="104" y="354">กันได้: ยึดการควบคุม (หยุดโปรแกรมก่อน) · กันไม่ได้: โปรแกรมยังตาย</text>
<rect class="cellcanary" x="40" y="376" width="960" height="92" rx="10"/>
<text class="big" x="62" y="420">4</text>
<text class="ptitle" x="104" y="404">ASLR + PIE</text>
<text class="mono" x="104" y="428">randomize_va_space = 2 · เป็นค่า default ของเครื่องนี้ · ปิดด้วย setarch -R เพื่อดูให้ชัด</text>
<text class="lbl" x="104" y="452">กันได้: ทำให้เดาที่อยู่เป้าหมายยาก · กันไม่ได้: บั๊กยังอยู่</text>
<rect class="cbox" x="40" y="474" width="960" height="92" rx="10"/>
<text class="big" x="62" y="518">5</text>
<text class="ptitle" x="104" y="502">เครื่องมือตรวจตอนพัฒนา</text>
<text class="mono" x="104" y="526">Valgrind 3.24.0 · AddressSanitizer (gcc -fsanitize=address) — เจอ use-after-free และ leak</text>
<text class="lbl" x="104" y="550">กันได้: จับบั๊กตอนทดสอบ ซึ่งเป็นตอนที่ถูกที่สุด</text>
<rect class="cellhi" x="40" y="572" width="960" height="92" rx="10"/>
<text class="big" x="62" y="616">6</text>
<text class="ptitle" x="104" y="600">ภาษาแบบ memory-safe</text>
<text class="mono" x="104" y="624">Go: index out of range panic · GC ไม่มี free ให้ลืม · ตรวจขอบเขตทุกครั้ง</text>
<text class="lbl" x="104" y="648">กันได้: เกือบทั้งหมด · แลกด้วย: ควบคุมละเอียดน้อยกว่า C</text>
<rect class="warnbox" x="40" y="676" width="960" height="112" rx="10"/>
<text class="ptitle" x="56" y="706">สิ่งที่ต้องจำ: เกราะ 3–4 ทำงาน "หลัง" เกิดการล้นแล้ว — จำกัดความเสียหาย ไม่ได้แก้ต้นเหตุ</text>
<text class="lbl" x="56" y="735">เกราะ 5 ไม่ได้อยู่ในโปรแกรมที่ส่งให้ผู้ใช้ — มันอยู่ตอนเราเขียนโค้ด จึงต้องรันให้เป็นนิสัย</text>
<text class="lbl" x="56" y="764">ส่วนเกราะ 1–2 คือสิ่งที่เราควบคุมได้ 100% และเป็นสิ่งที่ตอนนี้ฝึกอยู่ (safe_copy.c / drill_check.c)</text>
</svg>
