</style>
</defs>
<text x="28" y="40" class="h">ห่วงโซ่จาก commit ถึงเครื่องที่รัน: ทุกข้อต่อมีของที่ต้องตรวจ</text>
<text x="28" y="64" class="s">SBOM 10 component · artifact 3 ไฟล์ · ตรวจ digest ตรงกันไหม · out/03 + out/04</text>
<rect x="28" y="100" width="206" height="210" rx="10" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<circle cx="54" cy="126" r="13" fill="#3f9c63" stroke="#ffffff" stroke-width="2"/>
<text x="54" y="131" class="s" text-anchor="middle">1</text>
<text x="76" y="132" class="hd">source</text>
<text x="40" y="162" class="sm">commit ที่เซ็นแล้ว</text>
<text x="40" y="188" class="sm">ed25519 64 ไบต์</text>
<text x="40" y="214" class="sm">ตรวจผ่าน 1</text>
<text x="40" y="240" class="sm">สลับ commit เซ็นเต็ม → ปฏิเสธ</text>
<text x="40" y="266" class="sm">1</text>
<line x1="238" y1="205" x2="258" y2="205" stroke="#7d93a8" stroke-width="1.6"/>
<polygon points="258,205 250,200 250,210" fill="#7d93a8"/>
<rect x="262" y="100" width="206" height="210" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<circle cx="288" cy="126" r="13" fill="#4a7bb5" stroke="#ffffff" stroke-width="2"/>
<text x="288" y="131" class="s" text-anchor="middle">2</text>
<text x="310" y="132" class="hd">build</text>
<text x="274" y="162" class="sm">SBOM ที่ build</text>
<text x="274" y="188" class="sm">10 component</text>
<text x="274" y="214" class="sm">direct 4 + transitive 6</text>
<text x="274" y="240" class="sm">ขาด hash 0</text>
<text x="274" y="266" class="sm">typosquat 1</text>
<line x1="472" y1="205" x2="492" y2="205" stroke="#7d93a8" stroke-width="1.6"/>
<polygon points="492,205 484,200 484,210" fill="#7d93a8"/>
<rect x="496" y="100" width="206" height="210" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="1.5"/>
<circle cx="522" cy="126" r="13" fill="#c9a227" stroke="#ffffff" stroke-width="2"/>
<text x="522" y="131" class="s" text-anchor="middle">3</text>
<text x="544" y="132" class="hd">artifact</text>
<text x="508" y="162" class="sm">ชุดไฟล์ที่ออกจาก build</text>
<text x="508" y="188" class="sm">3 ไฟล์</text>
<text x="508" y="214" class="sm">digest จากเนื้อไฟล์</text>
<text x="508" y="240" class="sm">build ซ้ำได้ digest เดิม</text>
<text x="508" y="266" class="sm">1</text>
<line x1="706" y1="205" x2="726" y2="205" stroke="#7d93a8" stroke-width="1.6"/>
<polygon points="726,205 718,200 718,210" fill="#7d93a8"/>
<rect x="730" y="100" width="206" height="210" rx="10" fill="#fdeeee" stroke="#c05050" stroke-width="1.5"/>
<circle cx="756" cy="126" r="13" fill="#c05050" stroke="#ffffff" stroke-width="2"/>
<text x="756" y="131" class="s" text-anchor="middle">4</text>
<text x="778" y="132" class="hd">deploy</text>
<text x="742" y="162" class="sm">ของที่อยู่บนเครื่องจริง</text>
<text x="742" y="188" class="sm">4 ไฟล์</text>
<text x="742" y="214" class="sm">component 11</text>
<text x="742" y="240" class="sm">เกินมา 1</text>
<text x="742" y="266" class="sm">digest ตรง build 0</text>
<rect x="28" y="330" width="944" height="118" rx="8" fill="#f5f7f9" stroke="#9aa9b8" stroke-width="1.5"/>
<text x="44" y="356" class="hd">digest ของ artifact — สองค่าที่ต้องเท่ากัน</text>
<text x="44" y="384" class="m">build   727ee84a9fc526da</text>
<text x="44" y="408" class="m">deploy  3731a9a51e1527b8</text>
<text x="520" y="384" class="bad">artifact_match = 0</text>
<text x="520" y="408" class="sm">component ที่เกินมา: github.com/evil-labs/telemetry</text>
<text x="520" y="430" class="sm">SBOM ที่ deploy ≠ SBOM ที่ build = ถูกแก้หลัง build</text>
<rect x="28" y="462" width="460" height="170" rx="8" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="44" y="488" class="hd">SBOM ตอบได้</text>
<text x="40" y="512" class="sm">ใครอยู่ใน build: 10 ชิ้น มี version + hash</text>
<text x="40" y="538" class="sm">ชื่อที่พิมพ์ผิดถูกจับเป็น typosquat (ระยะ 1)</text>
<text x="40" y="564" class="sm">module ที่ไม่มี license: 1 — ตรวจกฎหมายไม่ได้</text>
<text x="40" y="590" class="sm">ตอบได้เพราะ hash ไม่ใช่เพราะชื่อ module</text>
<rect x="512" y="462" width="460" height="170" rx="8" fill="#fdeeee" stroke="#c05050" stroke-width="1.5"/>
<text x="528" y="488" class="hd">SBOM ตอบไม่ได้</text>
<text x="524" y="512" class="sm">ลายเซ็นที่ครอบแค่ชื่อ tag: สลับ commit ผ่าน (1 เคส)</text>
<text x="524" y="538" class="sm">HMAC ที่คีย์อยู่กับผู้ตรวจ: ปลอมเองได้ (1 เคส)</text>
<text x="524" y="564" class="sm">SBOM ไม่ได้บอกว่า build มาจากซอร์สไหน</text>
<text x="524" y="590" class="sm">ต้องมี attestation: subject + builder + source</text>
</svg>
