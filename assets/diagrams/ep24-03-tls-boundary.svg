<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img">
<defs>
<style>
  .t  { font-family: sans-serif; font-size: 14px; fill: #12263a; }
  .s  { font-family: sans-serif; font-size: 12px; fill: #3b4a5a; }
  .sm { font-family: sans-serif; font-size: 11px; fill: #4a5b6c; }
  .h  { font-family: sans-serif; font-size: 21px; font-weight: 700; fill: #0b2545; }
  .hd { font-family: sans-serif; font-size: 15px; font-weight: 700; fill: #0b2545; }
  .n  { font-family: sans-serif; font-size: 19px; font-weight: 700; fill: #0b2545; }
  .m  { font-family: monospace; font-size: 12px; fill: #0b2545; }
  .mm { font-family: monospace; font-size: 11px; fill: #3b4a5a; }
  .bad { font-family: sans-serif; font-size: 12px; fill: #7a1f1f; }
  .good{ font-family: sans-serif; font-size: 12px; fill: #14532d; }
</style>
</defs>
<text x="24" y="38" class="h">TLS 1.3: ป้องกันสาย ไม่ป้องกันปลายทาง</text>
<text x="24" y="62" class="s">ตัวเลขทุกตัวบนภาพนี้อ่านจาก out/05_tls.txt</text>
<rect x="24" y="92" width="250" height="150" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<text x="40" y="120" class="hd">client</text>
<text x="34" y="146" class="s">ส่งรายการ cipher suite ที่รองรับ</text>
<text x="34" y="170" class="s">ส่งข้อความ 26 ไบต์</text>
<text x="34" y="194" class="s">ตรวจใบรับรอง server</text>
<rect x="300" y="92" width="380" height="150" rx="10" fill="#f5f7f9" stroke="#9aa9b8" stroke-width="1.5"/>
<text x="316" y="120" class="hd">สาย (wire)</text>
<text x="316" y="144" class="m">AEAD records</text>
<text x="310" y="168" class="good">ไม่พบข้อความ 26 ไบต์บนสาย (bytes.Contains)</text>
<text x="310" y="192" class="s">ทุก record มี tag ตรวจการแก้</text>
<text x="310" y="216" class="s">nonce/counter จัดการโดย TLS</text>
<line x1="276" y1="168" x2="298" y2="168" stroke="#4a7bb5" stroke-width="1.6"/>
<polygon points="298,168 290,163 290,173" fill="#4a7bb5"/>
<line x1="682" y1="168" x2="704" y2="168" stroke="#4a7bb5" stroke-width="1.6"/>
<polygon points="704,168 696,163 696,173" fill="#4a7bb5"/>
<rect x="706" y="92" width="250" height="150" rx="10" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="722" y="120" class="hd">server</text>
<text x="716" y="146" class="s">ถอดรหัสแล้วอ่านปกติ</text>
<text x="716" y="170" class="s">อ่าน plaintext 26 ไบต์</text>
<text x="716" y="194" class="s">เขียนลง log/ฐานข้อมูลต่อ</text>
<rect x="24" y="266" width="460" height="210" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<text x="40" y="294" class="hd">TLS รับประกัน</text>
<text x="34" y="320" class="s">confidentiality ของข้อมูลบนสาย</text>
<text x="34" y="346" class="s">integrity ของข้อมูลบนสาย</text>
<text x="34" y="372" class="s">server authentication (ถ้าตรวจใบรับรอง)</text>
<text x="34" y="398" class="s">forward secrecy ใน TLS 1.3</text>
<text x="34" y="424" class="s">nonce/tag ที่ถูกต้อง (จัดการให้)</text>
<rect x="496" y="266" width="460" height="210" rx="10" fill="#fdeeee" stroke="#c05050" stroke-width="1.5"/>
<text x="512" y="294" class="hd">TLS ไม่รับประกัน</text>
<text x="506" y="320" class="s">ข้อมูลหลังถอดรหัสที่ปลายทาง</text>
<text x="506" y="346" class="s">ว่า server เองไม่ได้ถูกเจาะ</text>
<text x="506" y="372" class="s">client authentication (0 = ไม่มี)</text>
<text x="506" y="398" class="s">log/backup/ฐานข้อมูล</text>
<text x="506" y="424" class="s">metadata: IP, SNI, ขนาด, เวลา</text>
<rect x="24" y="498" width="932" height="100" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="1.5"/>
<text x="40" y="526" class="hd">ประโยคที่ควรพูดให้ตรง</text>
<text x="34" y="550" class="s">"เรามี TLS" = ข้อมูลถูกปกป้องระหว่างทาง ไม่ได้แปลว่าปลายทางปลอดภัย</text>
<text x="34" y="576" class="s">authentication (ตอนที่ 22) และ authorization (ตอนที่ 23) ที่ชั้นแอปยังจำเป็นเสมอ</text>
</svg>
