<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-label="เปรียบเทียบวงจรคำนวณที่จำค่าไม่ได้ กับวงจรจำที่มีเส้นป้อนกลับ ทำให้ค่าเดิมค้างอยู่ได้">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12.5px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 17px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .sub { fill: #57606a; font-size: 12px; }
    .tiny { font-size: 11px; fill: #57606a; }
    .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; fill: #0969da; }
    .monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #1a1a1a; }
    .sig { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 11.5px; fill: #1a7f37; font-weight: 700; }
    .lbl { font-size: 12px; fill: #57606a; }
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .panelb { fill: #f6f8fa; stroke: #0969da; stroke-width: 1.4; }
    .block { fill: #eef4ff; stroke: #0969da; stroke-width: 1.6; }
    .blocko { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.6; }
    .dash { fill: #ffffff; stroke: #57606a; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .wire { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .fb { stroke: #1a7f37; stroke-width: 1.8; fill: none; }
    .dot { fill: #57606a; }
  </style>

  <text class="hdr" x="480" y="32" text-anchor="middle">วงจรคำนวณกับวงจรจำ: ทำไมต้องมี "ที่เก็บค่า"</text>

  <!-- ================= Panel A : combinational ================= -->
  <rect class="panel" x="20" y="52" width="920" height="230" rx="10"/>
  <text class="ptitle" x="40" y="80">A. วงจรคำนวณ (combinational logic) — ผลลัพธ์ขึ้นกับอินพุต "ตอนนั้น" เท่านั้น</text>
  <text class="sub" x="40" y="102">XOR, adder, ALU จากตอน 09 ทำงานแบบนี้: ไม่มีอะไรถูกเก็บไว้ในวงจรเลย</text>

  <text class="monob" x="60" y="150">A = 1</text>
  <text class="monob" x="60" y="196">B = 0</text>
  <line class="wire" x1="130" y1="145" x2="250" y2="145"/>
  <line class="wire" x1="130" y1="191" x2="250" y2="191"/>
  <circle class="dot" cx="130" cy="145" r="3.2"/>
  <circle class="dot" cx="130" cy="191" r="3.2"/>
  <rect class="block" x="250" y="132" width="110" height="74" rx="7"/>
  <text class="monob" x="305" y="175" text-anchor="middle">XOR</text>
  <line class="wire" x1="360" y1="169" x2="540" y2="169"/>
  <circle class="dot" cx="540" cy="169" r="3.2"/>
  <rect class="dash" x="540" y="139" width="240" height="60" rx="8"/>
  <text class="monob" x="660" y="166" text-anchor="middle">ผลลัพธ์ = 1</text>
  <text class="tiny" x="660" y="188" text-anchor="middle">ไม่มีที่เก็บไว้ในวงจร</text>
  <text class="lbl" x="60" y="232">ปล่อยอินพุต A, B หายไป — ผลลัพธ์หายทันที เพราะวงจรไม่ได้เก็บอะไรไว้เลย</text>
  <text class="tiny" x="60" y="258">วงจรแบบนี้เรียกว่า combinational: ผลลัพธ์ = ฟังก์ชันของอินพุตเฉพาะขณะนั้น (ไม่มี "ความจำ")</text>

  <!-- ================= Panel B : sequential (feedback) ================= -->
  <rect class="panelb" x="20" y="300" width="920" height="372" rx="10"/>
  <text class="ptitle" x="40" y="326">B. วงจรจำ (sequential logic) — เอาต์พุตถูกป้อนกลับเป็นอินพุตของตัวเอง (feedback loop)</text>
  <text class="sub" x="40" y="346">สัญญาณวนกลับมาหาตัวเองเป็นวงปิด ค่าจึงค้างอยู่ได้แม้ไม่มีอินพุตใหม่ — นี่คือ SR latch</text>

  <!-- inputs -->
  <text class="mono" x="130" y="380">R = Reset</text>
  <text class="mono" x="130" y="508">S = Set</text>
  <line class="wire" x1="200" y1="386" x2="320" y2="386"/>
  <line class="wire" x1="200" y1="514" x2="320" y2="514"/>
  <circle class="dot" cx="200" cy="386" r="3.2"/>
  <circle class="dot" cx="200" cy="514" r="3.2"/>

  <!-- NOR gates -->
  <rect class="block" x="320" y="372" width="100" height="52" rx="7"/>
  <text class="monob" x="370" y="404" text-anchor="middle">NOR</text>
  <rect class="block" x="320" y="500" width="100" height="52" rx="7"/>
  <text class="monob" x="370" y="532" text-anchor="middle">NOR</text>

  <!-- Q output + feedback to lower gate -->
  <line class="wire" x1="420" y1="398" x2="760" y2="398"/>
  <circle class="dot" cx="760" cy="398" r="3.2"/>
  <path class="fb" d="M760,398 L760,606 L200,606 L200,538 L320,538"/>
  <text class="mono" x="430" y="390">Q = ค่าที่ค้างอยู่</text>
  <circle class="dot" cx="200" cy="606" r="3.2"/>

  <!-- Q' output + feedback to upper gate -->
  <line class="wire" x1="420" y1="526" x2="760" y2="526"/>
  <circle class="dot" cx="440" cy="526" r="3.2"/>
  <path class="fb" d="M440,526 L440,410 L320,410"/>
  <text class="mono" x="430" y="560">Q' = ค่าตรงข้าม</text>

  <text class="lbl" x="40" y="636">S = 0, R = 0 = ค้างค่าเดิม (hold) · S = 1 = ตั้งเป็น 1 (set) · R = 1 = ล้างเป็น 0 (reset)</text>
  <text class="lbl" x="40" y="660">S = 1 และ R = 1 พร้อมกัน = สถานะกำกวม (invalid) — ทั้ง Q และ Q' เป็น 0 แล้วปล่อยพร้อมกันจะแข่งกันเอง</text>
</svg>
