<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="แผนผังการแยกส่วน (decomposition): โปรแกรม BMI ถูกแบ่งออกเป็นฟังก์ชันย่อย ๆ ที่ main เรียกใช้">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans Thai", -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .box { fill: #ffffff; stroke: #0969da; stroke-width: 1.5; }
    .lbl { fill: #57606a; font-size: 12px; }
    .hdr { font-weight: 700; font-size: 14px; }
    .note { fill: #ffffff; stroke: #0969da; stroke-width: 1; stroke-dasharray: 5 4; }
    .fnbox { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
  </style>

  <!-- ROOT -->
  <text class="hdr" x="400" y="24" text-anchor="middle">โปรแกรม BMI เวอร์ชันตอน 04 — ทั้งก้อนใน func main</text>
  <rect class="box" x="300" y="40" width="200" height="44" rx="8"/>
  <text x="400" y="59" text-anchor="middle">func main</text>
  <text x="400" y="75" text-anchor="middle" class="lbl">(ทุกอย่างรวมกัน 60+ บรรทัด)</text>

  <text class="hdr" x="400" y="150" text-anchor="middle">แบ่งงานออกเป็นฟังก์ชันย่อย — แต่ละตัวรับผิดชอบชิ้นเดียว</text>

  <!-- CHILDREN -->
  <rect class="fnbox" x="40" y="168" width="170" height="52" rx="8"/>
  <text x="125" y="190" text-anchor="middle">อ่านน้ำหนัก/ส่วนสูง</text>
  <text x="125" y="207" text-anchor="middle" class="mono">readPositive()</text>

  <rect class="fnbox" x="230" y="168" width="170" height="52" rx="8"/>
  <text x="315" y="190" text-anchor="middle">คำนวณค่า BMI</text>
  <text x="315" y="207" text-anchor="middle" class="mono">bmi()</text>

  <rect class="fnbox" x="420" y="168" width="170" height="52" rx="8"/>
  <text x="505" y="190" text-anchor="middle">แปลเป็นข้อความสถานะ</text>
  <text x="505" y="207" text-anchor="middle" class="mono">bmiStatus()</text>

  <rect class="fnbox" x="610" y="168" width="170" height="52" rx="8"/>
  <text x="695" y="190" text-anchor="middle">ถามซ้ำ / จบเกม</text>
  <text x="695" y="207" text-anchor="middle" class="mono">for + break</text>

  <!-- ARROWS -->
  <line x1="400" y1="84" x2="400" y2="120" stroke="#57606a" stroke-width="1.5"/>
  <line x1="400" y1="120" x2="125" y2="166" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="400" y1="120" x2="315" y2="166" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="400" y1="120" x2="505" y2="166" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="400" y1="120" x2="695" y2="166" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- NOTE -->
  <rect class="note" x="140" y="250" width="520" height="118" rx="10"/>
  <text x="400" y="276" text-anchor="middle" class="lbl">func main ที่เหลือคือ "เรื่องเล่า" สั้น ๆ: เรียก readPositive → เรียก bmi</text>
  <text x="400" y="296" text-anchor="middle" class="lbl">→ เรียก bmiStatus → พิมพ์ผล — อ่านทีเดียวรู้เรื่องว่าโปรแกรมทำอะไร</text>
  <text x="400" y="322" text-anchor="middle">แก้/ทดสอบทีละฟังก์ชันได้</text>
  <text x="400" y="344" text-anchor="middle" class="lbl">ถ้าอยากเพิ่มฟีเจอร์ (เช่น แปลงหน่วยปอนด์) ก็แค่เพิ่มฟังก์ชันใหม่ — ไม่ต้องไปยุ่งโค้ดเดิม</text>
</svg>
