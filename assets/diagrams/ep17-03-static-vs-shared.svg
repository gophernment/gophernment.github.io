<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" width="1040" height="720" role="img" aria-label="เปรียบเทียบการเชื่อมไลบรารีสามแบบ: object file ตรง ๆ static library และ shared library">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 18px; }
    .sub { fill: #57606a; font-size: 12.5px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .lbl { fill: #57606a; font-size: 11.5px; }
    .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; }
    .monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #0550ae; }
    .monor { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #cf222e; }
    .monog { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #1a7f37; }
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .bandc { fill: #eef4ff; stroke: #0969da; stroke-width: 1.4; }
    .bandg { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
    .bandr { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.4; }
    .bandy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
    .cell { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.1; }
    .arrow { stroke: #57606a; stroke-width: 2; fill: none; }
    .arrowg { stroke: #1a7f37; stroke-width: 2.4; fill: none; }
    .arrowb { stroke: #0550ae; stroke-width: 2.4; fill: none; }
    .arrowr { stroke: #cf222e; stroke-width: 2.2; fill: none; }
    .dash { stroke: #8c959f; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="a-n" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="a-g" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="a-b" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0550ae"/></marker>
    <marker id="a-r" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  </defs>
  <rect x="0" y="0" width="1040" height="720" fill="#ffffff"/>

<text class="hdr" x="520" y="36" text-anchor="middle">ไลบรารีเดียวกัน 3 วิธีเชื่อม — โปรแกรมให้ผลเหมือนกัน แต่ไฟล์ไม่เหมือนกัน</text>
<text class="sub" x="520" y="60" text-anchor="middle">lib_demo/ ในบทนี้: app.o + stats.o (โค้ดจริงของเรา) — ตัวเลขจาก ls -l · ldd · nm บนเครื่องนี้</text>
<rect class="bandc" x="40" y="88" width="460" height="244" rx="10"/>
<text class="ptitle" x="58" y="116">1) โยน .o ให้ linker ตรง ๆ</text>
<text class="mono" x="58" y="142">gcc -o app_objects app.o stats.o</text>
<text class="mono" x="58" y="166">ทุกอย่างอยู่ในไบนารีเดียว</text>
<text class="mono" x="58" y="190">ไฟล์: 70,992 ไบต์</text>
<text class="mono" x="58" y="214">ldd: ไม่มี libstats เลย</text>
<text class="mono" x="58" y="238">ข้อดี: เห็นทุกอย่างตรงไปตรงมา</text>
<text class="mono" x="58" y="262">ข้อเสีย: ต้องส่ง .o ให้ครบเอง</text>
<rect class="bandg" x="540" y="88" width="460" height="244" rx="10"/>
<text class="ptitle" x="558" y="116">2) ห่อเป็น static library (.a)</text>
<text class="mono" x="558" y="142">ar rcs libstats.a stats.o</text>
<text class="mono" x="558" y="166">gcc -o app_static app.o -L. -l:libstats.a</text>
<text class="mono" x="558" y="190">libstats.a = 2,144 ไบต์</text>
<text class="mono" x="558" y="214">ไบนารี: 70,992 ไบต์ (โค้ดถูกคัดลอกเข้าไป)</text>
<text class="mono" x="558" y="238">ldd: ไม่มี libstats (ถูกฝังแล้ว)</text>
<text class="mono" x="558" y="262">ข้อดี: แจกไฟล์เดียว · ข้อเสีย: อัปเดตต้อง build ใหม่</text>
<rect class="bandr" x="40" y="352" width="960" height="220" rx="10"/>
<text class="ptitle" x="58" y="380">3) ทำเป็น shared library (.so)</text>
<text class="mono" x="58" y="406">gcc -fPIC -shared -o libstats.so stats.c</text>
<text class="mono" x="58" y="430">gcc -o app_shared app.o -L. -lstats</text>
<text class="mono" x="58" y="454">libstats.so = 69,464 ไบต์ (มีโค้ดระบบ+ข้อมูล ELF เต็ม)</text>
<text class="mono" x="58" y="478">ldd: libstats.so =&gt; not found (ถ้าไม่ตั้ง LD_LIBRARY_PATH)</text>
<text class="mono" x="58" y="502">ข้อดี: หลายโปรแกรมใช้ร่วมกันได้ · ข้อเสีย: ต้องหาไฟล์ .so ให้เจอตอนรัน</text>
<text class="ptitle" x="40" y="600">กับดักของ .so: ถ้าตอนรันหไฟล์ไม่เจอ โปรแกรมจะไม่เริ่มเลย (คนละความผิดกับตอน link)</text>
<text class="monor" x="40" y="626">$ ./app_shared</text>
<text class="monor" x="40" y="646">./app_shared: error while loading shared libraries: libstats.so: cannot open shared object file: No such file or directory</text>
<text class="lbl" x="40" y="672">วิธีแก้ในบทนี้: LD_LIBRARY_PATH=. ./app_shared · ของจริงใช้ rpath / ldconfig / ติดตั้งลง /usr/lib (ไม่ใช่แค่ตั้งตัวแปรแวดล้อม)</text>
</svg>