<text x="50" y="350" class="sm">ไม่เหลือความจำเป็น</text>
<text x="50" y="369" class="sm">และไม่มีเหตุยกเว้น</text>
<text x="50" y="388" class="sm">ลบจริง = หายจากระบบ</text>
<text x="50" y="407" class="sm">Art 17(1)(a)</text>
