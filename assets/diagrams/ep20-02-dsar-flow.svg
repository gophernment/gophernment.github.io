<text x="50" y="146" class="sm">อีเมล/ฟอร์ม/โทร</text>
<text x="50" y="160" class="sm"> Art 12: ห้ามเรียก</text>
<text x="50" y="174" class="sm">ค่าธรรมเนียมถ้าไม่เกินเหตุ</text>
