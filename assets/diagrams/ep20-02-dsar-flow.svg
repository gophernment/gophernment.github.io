<text x="680" y="369" class="sm">ต้องมีเหตุผลรายข้อ</text>
<text x="680" y="388" class="sm">ห้ามเหมารวมทั้งคน</text>
<text x="680" y="407" class="sm">Art 6(1)(b)/17(3)</text>
<line x1="770" y1="268" x2="770" y2="286" stroke="#7d93a8" stroke-width="1.6"/>
<polygon points="770,286 765,278 775,278" fill="#7d93a8"/>
<rect x="40" y="442" width="840" height="66" rx="10" fill="#f5f7f9" stroke="#9aa9b8" stroke-width="1.5"/>
<text x="58" y="468" class="hd">ทุกคำตัดสินเขียนลง audit trail 16 รายการ</text>
<text x="58" y="490" class="s">หนึ่งแถวต่อหนึ่งระเบียน: ทำอะไร เพราะอะไร ใครอนุมัติ — นี่คือสิ่งที่ทำให้ตอบ auditor ได้</text>
<rect x="40" y="522" width="840" height="74" rx="10" fill="#eefaf1" stroke="#3f9c63" stroke-width="1.5"/>
<text x="58" y="548" class="hd">ตัวตรวจ: unexplained_identifier_leaks = 0</text>
<text x="58" y="568" class="s">ระเบียน 16 → เหลือ 10 · อีเมล/เบอร์ที่ยังโผล่โดยไม่มีเหตุผล = 0</text>
<text x="58" y="586" class="sm">อีก 2 ระเบียนที่ยังมีอีเมลอยู่ ถูกประกาศ legal hold ไว้ชัดเจน (ไม่ใช่ลืม)</text>
