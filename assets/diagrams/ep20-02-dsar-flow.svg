<text x="470" y="350" class="sm">เฉพาะฟิลด์ที่กฎหมาย</text>
<text x="470" y="369" class="sm">ต้องการ (เช่น ภาษี)</text>
<text x="470" y="388" class="sm">ทิ้ง email/phone</text>
<text x="470" y="407" class="sm">Art 17(3)(b)</text>
