<text x="58" y="254" class="s">Art 17(1) บอกว่า "ต้องลบเมื่อ..." · Art 17(3) บอกว่า "ไม่ต้องลบเมื่อ..." — ทั้งสองข้อใช้พร้อมกันได้</text>
<line x1="460" y1="196" x2="460" y2="208" stroke="#7d93a8" stroke-width="1.6"/>
