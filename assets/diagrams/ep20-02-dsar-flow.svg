<text x="330" y="160" class="sm">ใช้เท่าที่จำเป็น</text>
<rect x="600" y="100" width="280" height="92" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<text x="610" y="126" class="hd">นาฬิกาเริ่มเดิน</text>
<text x="610" y="146" class="sm">ครบกำหนด 2026-11-29</text>
<text x="610" y="160" class="sm">หนึ่งเดือนตามปฏิทิน</text>
<text x="610" y="174" class="sm">ต่อได้อีก 2 เดือน (ต้องแจ้ง)</text>
