<text x="40" y="46" class="h">หนึ่งคำขอลบ ไหลผ่านอะไรบ้าง (และทำไมลบไม่หมด)</text>
<text x="40" y="74" class="s">ตัวเลขทั้งหมดมาจากเดโม: 16 ระเบียน ของเจ้าของข้อมูล 3 ราย</text>
<rect x="40" y="100" width="230" height="92" rx="10" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
