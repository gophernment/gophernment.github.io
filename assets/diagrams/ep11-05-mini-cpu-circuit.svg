<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="960" height="790" role="img" aria-label="แผนผังวงจร CPU จิ๋ว 4 บิต และชุดคำสั่ง ISA">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12.5px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 17px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .sub { fill: #57606a; font-size: 12px; }
    .tiny { font-size: 11px; fill: #57606a; }
    .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; fill: #0969da; }
    .monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #1a1a1a; }
    .val { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
    .th { font-weight: 700; font-size: 12px; fill: #57606a; }
    .lbl { font-size: 12px; fill: #57606a; }
    .bold { font-weight: 700; fill: #1a1a1a; }
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .panelb { fill: #f6f8fa; stroke: #0969da; stroke-width: 1.4; }
    .block { fill: #eef4ff; stroke: #0969da; stroke-width: 1.6; }
    .ctrl { fill: #fff4e5; stroke: #bc4c00; stroke-width: 1.6; }
    .ff { fill: #f3f0ff; stroke: #6639ba; stroke-width: 1.6; }
    .mem { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.6; }
    .dashed { fill: #fbfcfd; stroke: #8250df; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .wire { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .ctrlw { stroke: #bc4c00; stroke-width: 1.6; fill: none; }
    .clkw { stroke: #1a7f37; stroke-width: 2; fill: none; }
    .row { fill: #ffffff; stroke: #eaeef2; stroke-width: 1; }
    .rowg { fill: #f6f8fa; stroke: #eaeef2; stroke-width: 1; }
    .hrow { fill: #eaeef2; }
    .thline { stroke: #d0d7de; stroke-width: 1.2; }
    .dot { fill: #57606a; }
    .badge { fill: #0969da; }
    .badget { fill: #ffffff; font-weight: 700; font-size: 11px; }
  </style>
  <defs>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="a-ctrl" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
    <marker id="a-clk" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
  </defs>
  <text class="hdr" x="480" y="32" text-anchor="middle">CPU จิ๋ว 4 บิต ที่เราจะต่อใน CircuitVerse — ครบทั้ง fetch, decode, execute</text>
  <rect class="panel" x="20" y="52" width="920" height="484" rx="10"/>
  <text class="ptitle" x="40" y="80" text-anchor="start">A. แผนผังวงจรทั้งหมด (ต่อตามนี้แล้วเดินเครื่องได้จริง)</text>
  <text class="sub" x="40" y="102" text-anchor="start">วงกลม 1/2/3 คือสามขั้นของ machine cycle — วางไว้ตรงจุดที่ข้อมูลเดินผ่านจริงในวงจร</text>
  <rect class="mem" x="40" y="150" width="190" height="110" rx="10"/>
  <text class="monob" x="135.0" y="191.74" text-anchor="middle">RAM โปรแกรม</text>
  <text class="tiny" x="135.0" y="208.74" text-anchor="middle">4 ช่อง × 4 บิต</text>
  <text class="tiny" x="135.0" y="225.74" text-anchor="middle">เก็บคำสั่งของเรา</text>
  <rect class="mem" x="40" y="300" width="190" height="110" rx="10"/>
  <text class="monob" x="135.0" y="341.74" text-anchor="middle">RAM ข้อมูล</text>
  <text class="tiny" x="135.0" y="358.74" text-anchor="middle">4 ช่อง × 4 บิต</text>
  <text class="tiny" x="135.0" y="375.74" text-anchor="middle">เก็บตัวเลขที่โปรแกรมใช้</text>
  <rect class="dashed" x="282" y="130" width="648" height="320" rx="10"/>
  <text class="bold" x="296" y="150" text-anchor="start">CPU</text>
  <rect class="ff" x="300" y="175" width="210" height="58" rx="10"/>
  <text class="monob" x="405.0" y="199.24" text-anchor="middle">PC (2 บิต)</text>
  <text class="val" x="405.0" y="216.24" text-anchor="middle">ค่าเริ่มต้น = 00</text>
  <rect class="ff" x="300" y="320" width="210" height="50" rx="10"/>
  <text class="monob" x="405.0" y="340.24" text-anchor="middle">IR (4 บิต)</text>
  <text class="tiny" x="405.0" y="357.24" text-anchor="middle">คำสั่งที่เพิ่ง fetch</text>
  <rect class="ctrl" x="560" y="175" width="180" height="80" rx="10"/>
  <text class="monob" x="650.0" y="201.74" text-anchor="middle">Control Unit</text>
  <text class="tiny" x="650.0" y="218.74" text-anchor="middle">decode opcode</text>
  <text class="tiny" x="650.0" y="235.74" text-anchor="middle">→ เปิดสัญญาณ</text>
  <rect class="block" x="560" y="320" width="180" height="70" rx="10"/>
  <text class="monob" x="650.0" y="350.24" text-anchor="middle">ALU (บวก 4 บิต)</text>
  <text class="tiny" x="650.0" y="367.24" text-anchor="middle">ACC + ค่าจาก RAM</text>
  <rect class="ff" x="780" y="320" width="140" height="70" rx="10"/>
  <text class="monob" x="850.0" y="350.24" text-anchor="middle">ACC (4 บิต)</text>
  <text class="tiny" x="850.0" y="367.24" text-anchor="middle">ผลคำนวณ</text>
  <rect class="mem" x="780" y="175" width="140" height="80" rx="10"/>
  <text class="monob" x="850.0" y="201.74" text-anchor="middle">LED × 4</text>
  <text class="tiny" x="850.0" y="218.74" text-anchor="middle">แสดงผลตอน</text>
  <text class="tiny" x="850.0" y="235.74" text-anchor="middle">คำสั่ง OUT</text>
  <rect class="block" x="300" y="400" width="180" height="44" rx="10"/>
  <text class="monob" x="390.0" y="417.24" text-anchor="middle">ปุ่ม Clock (ปุ่มกด)</text>
  <text class="tiny" x="390.0" y="434.24" text-anchor="middle">กดหนึ่งครั้ง = หนึ่งก้าว</text>
  <line class="wire" x1="300" y1="204" x2="230" y2="204" marker-end="url(#a-grey)"/>
  <text class="tiny" x="234" y="196" text-anchor="start">1 fetch</text>
  <polyline class="wire" points="230,250 255,250 255,349 300,349" marker-end="url(#a-grey)"/>
  <polyline class="wire" points="510,190 535,190 535,152 360,152 360,175" marker-end="url(#a-grey)"/>
  <text class="tiny" x="420" y="145" text-anchor="start">PC + 1</text>
  <polyline class="wire" points="510,340 535,340 535,215 560,215" marker-end="url(#a-grey)"/>
  <text class="tiny" x="538" y="290" text-anchor="start">2 decode: opcode</text>
  <line class="ctrlw" x1="650" y1="255" x2="650" y2="320" marker-end="url(#a-ctrl)"/>
  <text class="tiny" x="655" y="300" text-anchor="start">สัญญาณควบคุม</text>
  <line class="wire" x1="740" y1="355" x2="780" y2="355" marker-end="url(#a-grey)"/>
  <polyline class="wire" points="850,320 850,270 850,258" marker-end="url(#a-grey)"/>
  <text class="tiny" x="768" y="292" text-anchor="start">3 execute</text>
  <text class="tiny" x="768" y="310" text-anchor="start">OUT → LED</text>
  <line class="wire" x1="230" y1="380" x2="560" y2="380" marker-end="url(#a-grey)"/>
  <text class="tiny" x="300" y="392" text-anchor="start">ค่าจาก RAM ข้อมูล → ALU</text>
  <polyline class="wire" points="300,345 270,345 270,430 135,430 135,413" marker-end="url(#a-grey)"/>
  <text class="tiny" x="150" y="464" text-anchor="start">operand = address ของ RAM ข้อมูล</text>
  <polyline class="wire" points="820,390 820,490 125,490 125,413" marker-end="url(#a-grey)"/>
  <text class="tiny" x="300" y="482" text-anchor="start">STORE: ACC → RAM ข้อมูล</text>
  <polyline class="clkw" points="480,422 800,422 800,392" marker-end="url(#a-clk)"/>
  <circle class="dot" cx="560" cy="422" r="3.2"/>
  <circle class="dot" cx="700" cy="422" r="3.2"/>
  <text class="tiny" x="520" y="414" text-anchor="start">นาฬิกาเส้นเดียว: เข้า Clock ของ flip-flop ทุกตัว</text>
  <text class="lbl" x="40" y="502" text-anchor="start">เส้นลวดที่ตัดกันโดยไม่มีจุดดำ = สัญญาณคนละเส้น ไม่ได้เชื่อมกัน (ในภาพนี้มีจุดตัดเดียว: ตรงที่ operand ตัดกับค่าจาก RAM ข้อมูล)</text>
  <text class="lbl" x="40" y="520" text-anchor="start">สัญญาณควบคุมที่เหลือ (WRITE ของ RAM ข้อมูล, EN ของ ACC, OUT ของ LED) ก็มาจาก Control Unit เหมือนกัน — ตัดเส้นออกเพื่อไม่ให้ภาพรก</text>
  <rect class="panelb" x="20" y="552" width="920" height="228" rx="10"/>
  <text class="ptitle" x="40" y="580" text-anchor="start">B. ชุดคำสั่ง (ISA) ของ CPU จิ๋วเรา — มีแค่ 4 คำสั่ง แต่เขียนโปรแกรมจริงได้</text>
  <rect class="hrow" x="60" y="594" width="860" height="26" rx="4"/>
  <text class="th" x="130.0" y="611" text-anchor="middle">opcode</text>
  <text class="th" x="290.0" y="611" text-anchor="middle">ชื่อคำสั่ง</text>
  <text class="th" x="470.0" y="611" text-anchor="middle">ทำอะไร</text>
  <text class="th" x="740.0" y="611" text-anchor="middle">ในระดับวงจร</text>
  <rect class="row" x="60" y="620" width="860" height="26" rx="10"/>
  <text class="val" x="130.0" y="637" text-anchor="middle">00</text>
  <text class="mono" x="290.0" y="637" text-anchor="middle">LOAD addr</text>
  <text class="lbl" x="470.0" y="637" text-anchor="middle">ACC = RAM[addr]</text>
  <text class="lbl" x="740.0" y="637" text-anchor="middle">LOAD_EN = 1 รับค่าจาก RAM ข้อมูล</text>
  <rect class="rowg" x="60" y="646" width="860" height="26" rx="10"/>
  <text class="val" x="130.0" y="663" text-anchor="middle">01</text>
  <text class="mono" x="290.0" y="663" text-anchor="middle">ADD addr</text>
  <text class="lbl" x="470.0" y="663" text-anchor="middle">ACC = ACC + RAM[addr]</text>
  <text class="lbl" x="740.0" y="663" text-anchor="middle">ADD_EN = 1 รับผลบวกจาก ALU</text>
  <rect class="row" x="60" y="672" width="860" height="26" rx="10"/>
  <text class="val" x="130.0" y="689" text-anchor="middle">10</text>
  <text class="mono" x="290.0" y="689" text-anchor="middle">STORE addr</text>
  <text class="lbl" x="470.0" y="689" text-anchor="middle">RAM[addr] = ACC</text>
  <text class="lbl" x="740.0" y="689" text-anchor="middle">WRITE = 1 ที่ RAM ข้อมูล</text>
  <rect class="rowg" x="60" y="698" width="860" height="26" rx="10"/>
  <text class="val" x="130.0" y="715" text-anchor="middle">11</text>
  <text class="mono" x="290.0" y="715" text-anchor="middle">OUT</text>
  <text class="lbl" x="470.0" y="715" text-anchor="middle">LED แสดงค่า ACC</text>
  <text class="lbl" x="740.0" y="715" text-anchor="middle">OUT_EN = 1 เปิดไฟ LED 4 ดวง</text>
  <line class="thline" x1="200" y1="594" x2="200" y2="724"/>
  <line class="thline" x1="380" y1="594" x2="380" y2="724"/>
  <line class="thline" x1="560" y1="594" x2="560" y2="724"/>
  <text class="lbl" x="60" y="749" text-anchor="start">ยังไม่มีคำสั่งหยุด (HALT) และคำสั่งกระโดด (JUMP) — เราจะเพิ่มเองในโจทย์ และเจอของจริงในตอน 12</text>
</svg>
