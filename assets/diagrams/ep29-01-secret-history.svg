<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img">
<defs>
<style>
  .t  { font-family: sans-serif; font-size: 14px; fill: #12263a; }
  .s  { font-family: sans-serif; font-size: 12px; fill: #3b4a5a; }
  .sm { font-family: sans-serif; font-size: 11px; fill: #4a5b6c; }
  .h  { font-family: sans-serif; font-size: 21px; font-weight: 700; fill: #0b2545; }
  .hd { font-family: sans-serif; font-size: 14px; font-weight: 700; fill: #0b2545; }
  .n  { font-family: sans-serif; font-size: 19px; font-weight: 700; fill: #0b2545; }
  .m  { font-family: monospace; font-size: 12px; fill: #0b2545; }
  .mm { font-family: monospace; font-size: 11px; fill: #3b4a5a; }
  .bad { font-family: sans-serif; font-size: 12px; fill: #7a1f1f; }
  .good{ font-family: sans-serif; font-size: 12px; fill: #14532d; }
  .big { font-family: sans-serif; font-size: 24px; font-weight: 700; fill: #0b2545; }
</style>
</defs>
<text x="28" y="40" class="h">ความลับที่ถูกลบ ยังอยู่ในประวัติ — และแต่ละแหล่งเก็บไว้นานเท่าไร</text>
<text x="28" y="64" class="s">6 commit · ตรวจ 11 รายการ (ต้องแก้ 5 · allowlist 6) · out/01</text>
<rect x="28" y="88" width="520" height="300" rx="10" fill="#f5f7f9" stroke="#9aa9b8" stroke-width="1.5"/>
<text x="44" y="114" class="hd">ประวัติที่จำลอง: commit ไหนยังพาความลับอยู่</text>
<circle cx="56" cy="146" r="5" fill="#c05050" stroke="#ffffff" stroke-width="2"/>
<text x="76" y="150" class="s">c1  เพิ่ม deploy/config.yaml</text>
<text x="532" y="150" class="sm" text-anchor="end">snapshot + diff</text>
<line x1="44" y1="164" x2="532" y2="164" stroke="#e3e9f0" stroke-width="1"/>
<circle cx="56" cy="184" r="5" fill="#c05050" stroke="#ffffff" stroke-width="2"/>
<text x="76" y="188" class="s">c2  ลบไฟล์ + เพิ่ม .gitignore</text>
<text x="532" y="188" class="sm" text-anchor="end">diff เท่านั้น</text>
<line x1="44" y1="202" x2="532" y2="202" stroke="#e3e9f0" stroke-width="1"/>
<circle cx="56" cy="222" r="5" fill="#c9a227" stroke="#ffffff" stroke-width="2"/>
<text x="76" y="226" class="s">c3  ci ใส่ token ลง workflow</text>
<text x="532" y="226" class="sm" text-anchor="end">diff (ถูกใช้ซ้ำ)</text>
<line x1="44" y1="240" x2="532" y2="240" stroke="#e3e9f0" stroke-width="1"/>
<circle cx="56" cy="260" r="5" fill="#c9a227" stroke="#ffffff" stroke-width="2"/>
<text x="76" y="264" class="s">c4  ย้ายไป repository secrets</text>
<text x="532" y="264" class="sm" text-anchor="end">diff (บรรทัดที่ลบ)</text>
<line x1="44" y1="278" x2="532" y2="278" stroke="#e3e9f0" stroke-width="1"/>
<circle cx="56" cy="298" r="5" fill="#c05050" stroke="#ffffff" stroke-width="2"/>
<text x="76" y="302" class="s">c5  เพิ่ม tls private key</text>
<text x="532" y="302" class="sm" text-anchor="end">diff</text>
<line x1="44" y1="316" x2="532" y2="316" stroke="#e3e9f0" stroke-width="1"/>
<circle cx="56" cy="336" r="5" fill="#3f9c63" stroke="#ffffff" stroke-width="2"/>
<text x="76" y="340" class="s">c6  fixture ใน testdata/</text>
<text x="532" y="340" class="sm" text-anchor="end">allowlist</text>
<rect x="568" y="88" width="404" height="300" rx="10" fill="#fdeeee" stroke="#c05050" stroke-width="1.5"/>
<text x="584" y="114" class="hd">ความลับหนึ่งค่ายังอยู่กี่ revision</text>
<text x="584" y="168" class="big">1</text>
<text x="640" y="166" class="s">snapshot (เนื้อไฟล์ ณ commit นั้น)</text>
<text x="584" y="214" class="big">2</text>
<text x="640" y="212" class="s">diff (รวมบรรทัดที่ถูกลบ)</text>
<text x="580" y="250" class="sm">.gitignore ถูกเพิ่มที่ commit 2</text>
<text x="580" y="274" class="sm">แต่ commit 1 ยังอยู่ในทุก clone</text>
<text x="580" y="298" class="m">gitignore_removes_history=0</text>
<text x="580" y="322" class="s">→ ต้องเขียนประวัติใหม่ + หมุนความลับ</text>
<rect x="28" y="404" width="944" height="84" rx="8" fill="#eef4fb" stroke="#4a7bb5" stroke-width="1.5"/>
<text x="44" y="428" class="hd">กฎที่ยิงได้ (ค่าถูกปิดด้วย *** ในผลรัน)</text>
<rect x="44" y="440" width="128.60000000000002" height="34" rx="6" fill="#ffffff" stroke="#4a7bb5" stroke-width="1"/>
<text x="54" y="462" class="s">private key 1</text>
<rect x="184.60000000000002" y="440" width="102.2" height="34" rx="6" fill="#ffffff" stroke="#4a7bb5" stroke-width="1"/>
<text x="194.60000000000002" y="462" class="s">aws key 3</text>
<rect x="298.8" y="440" width="135.2" height="34" rx="6" fill="#ffffff" stroke="#4a7bb5" stroke-width="1"/>
<text x="308.8" y="462" class="s">github token 2</text>
<rect x="446.0" y="440" width="127.28" height="34" rx="6" fill="#ffffff" stroke="#4a7bb5" stroke-width="1"/>
<text x="456.0" y="462" class="s">ชื่อ field 3</text>
<rect x="585.28" y="440" width="132.56" height="34" rx="6" fill="#ffffff" stroke="#4a7bb5" stroke-width="1"/>
<text x="595.28" y="462" class="s">entropy สูง 2</text>
<rect x="28" y="500" width="944" height="76" rx="8" fill="#fdf7e3" stroke="#c9a227" stroke-width="1.5"/>
<text x="40" y="522" class="s">ไฟล์ 0644 ให้ group/other อ่านได้ → ประตูตอนบูตปฏิเสธ (1 เคส) · envelope 0600 ผ่านประตู (ปฏิเสธ 0 เคส)</text>
<text x="40" y="546" class="sm">ความลับใน env: โปรเซสลูกรันได้ทุกตัวเห็นค่า (1 เคส) · lease 900 วินาที คืออายุที่สั้นที่สุดในสามแหล่ง</text>
</svg>
