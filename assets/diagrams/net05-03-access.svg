<text class="small" x="40" y="194" text-anchor="start">35 เหตุการณ์แรกจาก 48 ที่บันทึกไว้</text>
<text class="small" x="1040" y="194" text-anchor="end">สีเขียว = ส่งสำเร็จ · เทา = ช่องว่าง · แดง = ชนกัน</text>
<text class="ptitle" x="40" y="216" text-anchor="start">scheduled (cellular): base station จ่ายสิทธิ์ให้ทีละ station</text>
