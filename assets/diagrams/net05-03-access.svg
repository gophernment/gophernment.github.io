<rect x="0" y="0" width="1100" height="740" fill="#ffffff"/>
<text class="hdr" x="550" y="40" text-anchor="middle">ช่องสัญญาณเดียว สองวิธีแบ่ง: แย่งกันเอง กับมีคนจ่ายสิทธิ์</text>
<text class="sub" x="550" y="66" text-anchor="middle">airtime ของช่องสัญญาณหนึ่งช่อง — ช่วงส่งข้อมูลจริง ช่วงว่าง และช่วงที่ชนกันจนเสียเปล่า</text>
<text class="ptitle" x="40" y="108" text-anchor="start">CSMA/CA (802.11): ทุก station แย่งกันเองด้วย random backoff</text>
