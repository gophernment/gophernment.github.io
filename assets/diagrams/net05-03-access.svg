<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" width="1100" height="740" role="img" aria-label="การแบ่งช่องสัญญาณวิทยุสองวิธี: แย่งกันเองแบบ CSMA/CA กับให้ base station จ่ายสิทธิ์">
<style>
