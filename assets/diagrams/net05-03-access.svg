<text class="small" x="40" y="286" text-anchor="start">ต่อเนื่อง ไม่มีช่วงว่าง ไม่มีช่วงชน: ตัวเลขในแท่งคือ station ที่ได้รับสิทธิ์</text>
<text class="ptitle" x="40" y="312" text-anchor="start">สัดส่วน airtime ที่พา data จริง (ต่อพัน) — 48 เฟรมเท่ากันทุกกรณี</text>
<text class="txt" x="40" y="350" text-anchor="start">CSMA/CA 2 station</text>
<rect class="bar1" x="300" y="336" width="465.62" height="20" rx="3"/>
<text class="monos" x="776" y="351" text-anchor="start">751</text>
<text class="txt" x="40" y="384" text-anchor="start">CSMA/CA 3 station</text>
<rect class="bar1" x="300" y="370" width="432.76" height="20" rx="3"/>
<text class="monos" x="743" y="385" text-anchor="start">698</text>
<text class="txt" x="40" y="418" text-anchor="start">CSMA/CA 6 station</text>
<rect class="bar1" x="300" y="404" width="386.88" height="20" rx="3"/>
<text class="monos" x="697" y="419" text-anchor="start">624</text>
<text class="txt" x="40" y="452" text-anchor="start">CSMA/CA 12 station</text>
<rect class="bar1" x="300" y="438" width="327.98" height="20" rx="3"/>
<text class="monos" x="638" y="453" text-anchor="start">529</text>
<text class="txt" x="40" y="486" text-anchor="start">scheduled 12 station</text>
<rect class="bar2" x="300" y="472" width="620.0" height="20" rx="3"/>
<text class="monos" x="930" y="487" text-anchor="start">1000</text>
<rect class="boxy" x="40" y="520" width="1020" height="190" rx="8"/>
<text class="ptitle" x="60" y="548" text-anchor="start">ทำไม WiFi ยอมเสีย airtime มากกว่า cellular</text>
<text class="txt" x="60" y="574" text-anchor="start">CSMA/CA ไม่ต้องมีใครสั่ง: station ฟังช่องว่างก่อน แล้วนับถอยหลังตาม backoff ที่สุ่มมา</text>
<text class="txt" x="60" y="593" text-anchor="start">ยิ่งคนเยอะ ยิ่งชนกันบ่อย (2 station ชน 1 ครั้ง, 12 station ชน 19 ครั้ง) และแต่ละครั้งเสีย airtime เต็มเฟรม</text>
<text class="txt" x="60" y="613" text-anchor="start">ที่ 12 station เหลือ airtime ที่เป็นประโยชน์ 529 จาก 1000 — scheduled ได้ 1000 เต็ม</text>
<text class="txt" x="60" y="632" text-anchor="start">แลกกับการที่ cellular ต้องมี spectrum ที่จองไว้ (licensed) และมี base station คอยจ่ายสิทธิ์</text>
</svg>
