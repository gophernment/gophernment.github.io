<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" role="img" aria-label="preprocessor แทนข้อความ: macro ที่ไม่มีวงเล็บให้ผลผิด และ macro ที่ใช้พารามิเตอร์ซ้ำทำให้เรียกฟังก์ชันสองครั้ง">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 18px; }
    .sub { fill: #57606a; font-size: 12.5px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .lbl { fill: #57606a; font-size: 11.5px; }
    .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; }
    .monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #0550ae; }
    .monor { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #cf222e; }
    .monog { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #1a7f37; }
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .bandc { fill: #eef4ff; stroke: #0969da; stroke-width: 1.4; }
    .bandg { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
    .bandr { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.4; }
    .bandy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
    .cell { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.1; }
    .arrow { stroke: #57606a; stroke-width: 2; fill: none; }
    .arrowg { stroke: #1a7f37; stroke-width: 2.4; fill: none; }
    .arrowb { stroke: #0550ae; stroke-width: 2.4; fill: none; }
    .arrowr { stroke: #cf222e; stroke-width: 2.2; fill: none; }
    .dash { stroke: #8c959f; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="a-n" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="a-g" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="a-b" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0550ae"/></marker>
    <marker id="a-r" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  </defs>
  <rect x="0" y="0" width="1040" height="640" fill="#ffffff"/>

<text class="hdr" x="520" y="36" text-anchor="middle">preprocessor ไม่เข้าใจคณิตศาสตร์ — มันแค่ "แทนข้อความ"</text>
<text class="sub" x="520" y="60" text-anchor="middle">จาก macro_trap.c (รันจริง: gcc -std=c17 -Wall -Wextra -Wpedantic -o macro_trap macro_trap.c)</text>
<rect class="bandr" x="40" y="88" width="460" height="196" rx="10"/>
<text class="ptitle" x="60" y="116">บทเรียนที่ 1: ไม่มีวงเล็บ</text>
<text class="mono" x="60" y="142">#define BAD_SQ(x) x * x</text>
<text class="lbl" x="60" y="166">เขียน</text>
<text class="mono" x="60" y="188">BAD_SQ(1 + 2)</text>
<text class="lbl" x="60" y="212">preprocess แทนข้อความตรง ๆ เป็น</text>
<text class="monor" x="60" y="234">1 + 2 * 1 + 2</text>
<text class="monor" x="60" y="258">= 5  (คาดหวัง 9) — ผลรันจริง: 5</text>
<rect class="bandg" x="540" y="88" width="460" height="196" rx="10"/>
<text class="ptitle" x="560" y="116">วิธีที่ถูก: ครอบวงเล็บทั้งพารามิเตอร์และนิพจน์</text>
<text class="mono" x="560" y="142">#define GOOD_SQ(x) ((x) * (x))</text>
<text class="lbl" x="560" y="166">เขียน</text>
<text class="mono" x="560" y="188">GOOD_SQ(1 + 2)</text>
<text class="lbl" x="560" y="212">preprocess แทนข้อความตรง ๆ เป็น</text>
<text class="monog" x="560" y="234">((1 + 2) * (1 + 2))</text>
<text class="monog" x="560" y="258">= 9  (ถูกต้อง) — ผลรันจริง: 9</text>
<rect class="bandy" x="40" y="304" width="960" height="180" rx="10"/>
<text class="ptitle" x="60" y="332">บทเรียนที่ 2: ใช้พารามิเตอร์ซ้ำ = งานถูกทำซ้ำ (ฟังก์ชันจริงทำครั้งเดียว)</text>
<text class="mono" x="60" y="358">#define MAX(a, b) ((a) &gt; (b) ? (a) : (b))   ·   MAX(next_value(), 0)</text>
<text class="lbl" x="60" y="382">a ถูกใช้ 2 ครั้ง → next_value() ถูกเรียก 2 ครั้ง · calls = 2 (ผลรันจริงจาก macro_trap.c)</text>
<text class="lbl" x="60" y="404">เทียบ Go: max2(next(), 0) → เรียก 1 ครั้ง · calls = 1 (ผลรันจริงจาก go_stages/main.go)</text>
<text class="lbl" x="60" y="430">Go ไม่มี preprocessor เลย: ไม่มี #include · ไม่มี #define · const เป็นค่าจริงที่ compiler รู้ชนิด</text>
<text class="lbl" x="60" y="456">สิ่งที่พี่น้อง C ต้องจำ: macro = แทนข้อความ → (1) ครอบวงเล็บเสมอ (2) ถ้างานซับซ้อน ใช้ฟังก์ชัน/static inline ดีกว่า</text>
</svg>