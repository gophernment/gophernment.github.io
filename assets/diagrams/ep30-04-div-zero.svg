  <text x="24.0" y="32.0" class="hdr">กับดัก: 7 / 0 ผ่าน 3 ทางเดิน ให้ผลต่างกัน</text>
  <text x="24.0" y="54.0" class="sub">โค้ดเครื่องไม่มีตาข่ายนิรภัยของ interpreter — codegen ต้องปล่อยโค้ดตรวจเอง</text>
  <rect x="24.0" y="96.0" width="224.0" height="120.0" rx="8.0" class="bandg"/>
