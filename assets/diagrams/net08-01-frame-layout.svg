<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="1080" height="620" role="img" aria-label="โครงสร้าง Ethernet frame: preamble/SFD และ IPG เป็นของชั้น 1, frame 64 ไบต์ประกอบจาก dst 6, src 6, ethertype 2, payload 28, pad 18 และ FCS 4">
<style>
text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12.5px; fill: #1a1a1a; }
.hdr { font-weight: 700; font-size: 17.5px; }
.sub { fill: #57606a; font-size: 12.5px; }
.ptitle { font-weight: 700; font-size: 14px; }
.txt { font-size: 12.5px; }
.lbl { fill: #57606a; font-size: 11px; }
.small { fill: #57606a; font-size: 10.5px; }
.big { font-weight: 700; font-size: 20px; fill: #0550ae; }
.mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 11.5px; fill: #0a3069; }
.monos { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 10.5px; fill: #57606a; }
.boxg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
.boxb { fill: #eef4ff; stroke: #0969da; stroke-width: 1.5; }
.boxy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
.boxi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
.boxr { fill: #fdeff0; stroke: #b62324; stroke-width: 1.4; }
.bgph { fill: #f2f4f6; stroke: #b6bfc8; stroke-width: 1.2; stroke-dasharray: 4 3; }
.bgth { fill: #eef4ff; stroke: #8c959f; stroke-width: 1.2; }
.bgpl { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
.bgpd { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.2; }
.bgfs { fill: #fdeff0; stroke: #b62324; stroke-width: 1.2; }
.bgwt { fill: #ffffff; stroke: none; }
.wire { stroke: #8c959f; stroke-width: 1.8; fill: none; }
.wire2 { stroke: #b6bfc8; stroke-width: 1.2; fill: none; stroke-dasharray: 5 5; }
.wire3 { stroke: #b62324; stroke-width: 2.0; fill: none; stroke-dasharray: 6 4; }
.wire4 { stroke: #1a7f37; stroke-width: 1.8; fill: none; }
.head { fill: #8c959f; }
.headr { fill: #b62324; }
.headg { fill: #1a7f37; }
.rule { stroke: #d0d7de; stroke-width: 1.2; }
.dotg { fill: #1a7f37; stroke: #1a7f37; }
.dotb { fill: #0969da; stroke: #0969da; }
.dotr { fill: #b62324; stroke: #b62324; }
.dot0 { fill: #ffffff; stroke: #8c959f; stroke-width: 2; }
.onbar { fill: #ffffff; font-size: 10.5px; }
.onbar2 { fill: #1a1a1a; font-size: 10.5px; }
.onbar3 { fill: #57606a; font-size: 10.5px; }
</style>
<rect x="0" y="0" width="1080" height="620" fill="#ffffff"/>
<text class="hdr" x="40" y="40" text-anchor="start">Ethernet frame: 64 ไบต์ที่เป็น frame กับ 84 ไบต์ที่วิ่งบนสาย</text>
<text class="sub" x="40" y="66" text-anchor="start">ตัวเลขทุกตัวในภาพนี้อ่านจาก out/01_frame.txt — หน่วยเป็นไบต์</text>
<text class="lbl" x="40" y="96" text-anchor="start">สิ่งที่วิ่งบนสาย (ชั้น 1 + ชั้น 2)</text>
<rect class="bgph" x="40" y="104" width="96" height="40" rx="8"/>
<text class="onbar3" x="88" y="129" text-anchor="middle">preamble+SFD 8</text>
<rect class="bgth" x="136" y="104" width="768" height="40" rx="8"/>
<text class="onbar2" x="520" y="130" text-anchor="middle">frame 64 ไบต์</text>
<rect class="bgph" x="904" y="104" width="144" height="40" rx="8"/>
<text class="onbar3" x="976" y="129" text-anchor="middle">IPG 12</text>
<text class="small" x="40" y="162" text-anchor="start">ชั้น 1 — NIC ตัดทิ้งก่อนส่งขึ้นมา จึงไม่เห็นใน tcpdump</text>
<text class="small" x="918" y="162" text-anchor="start">รวม 84 ไบต์</text>
<rect class="bgth" x="40" y="200" width="72" height="46" rx="8"/>
<text class="onbar2" x="76" y="228" text-anchor="middle">dst 6</text>
<rect class="bgth" x="112" y="200" width="72" height="46" rx="8"/>
<text class="onbar2" x="148" y="228" text-anchor="middle">src 6</text>
<rect class="bgpl" x="184" y="200" width="24" height="46" rx="8"/>
<rect class="bgpl" x="208" y="200" width="336" height="46" rx="8"/>
<text class="onbar2" x="376" y="228" text-anchor="middle">payload 28</text>
<rect class="bgpd" x="544" y="200" width="216" height="46" rx="8"/>
<text class="onbar2" x="652" y="228" text-anchor="middle">pad 18</text>
<rect class="bgfs" x="760" y="200" width="48" height="46" rx="8"/>
<text class="onbar2" x="784" y="228" text-anchor="middle">FCS 4</text>
<text class="small" x="196" y="194" text-anchor="middle">EtherType 2 = 0x0806 (ARP)</text>
<line class="wire2" x1="40" y1="246" x2="40" y2="252"/>
<text class="monos" x="40" y="264" text-anchor="middle">0</text>
<line class="wire2" x1="112" y1="246" x2="112" y2="252"/>
<text class="monos" x="112" y="264" text-anchor="middle">6</text>
<line class="wire2" x1="184" y1="246" x2="184" y2="252"/>
<text class="monos" x="184" y="264" text-anchor="middle">12</text>
<line class="wire2" x1="208" y1="246" x2="208" y2="252"/>
<text class="monos" x="208" y="264" text-anchor="middle">14</text>
<line class="wire2" x1="544" y1="246" x2="544" y2="252"/>
<text class="monos" x="544" y="264" text-anchor="middle">42</text>
<line class="wire2" x1="760" y1="246" x2="760" y2="252"/>
<text class="monos" x="760" y="264" text-anchor="middle">60</text>
<line class="wire2" x1="808" y1="246" x2="808" y2="252"/>
<text class="monos" x="808" y="264" text-anchor="middle">64</text>
<text class="small" x="40" y="284" text-anchor="start">offset 42–59 คือ padding 18 ไบต์ ที่ NIC เติมให้ถึง payload ขั้นต่ำ 46</text>
<rect class="boxy" x="40" y="300" width="1000" height="92" rx="8"/>
<text class="mono" x="60" y="328" text-anchor="start">64 = 14 (dst+src+ethertype) + 46 (payload ขั้นต่ำ) + 4 (FCS)</text>
<text class="txt" x="60" y="352" text-anchor="start">ทำไมต้อง 46: slot time ของ Ethernet ยุค 10 Mbit/s คือ 512 bit times = 64 ไบต์ (51.2 µs)</text>
<text class="small" x="60" y="374" text-anchor="start">frame ต้องยังส่งไม่จบเมื่อสัญญาณชนสะท้อนกลับมา — ถ้าส่งจบก่อนจะไม่รู้ว่าชนและข้อมูลหายเงียบ</text>
<text class="lbl" x="60" y="416" text-anchor="start">payload</text>
<text class="lbl" x="200" y="416" text-anchor="start">pad</text>
<text class="lbl" x="300" y="416" text-anchor="start">frame</text>
<text class="lbl" x="420" y="416" text-anchor="start">บนสาย</text>
<text class="monos" x="60" y="440" text-anchor="start">1</text>
<text class="monos" x="200" y="440" text-anchor="start">45</text>
<text class="monos" x="300" y="440" text-anchor="start">64</text>
<text class="monos" x="420" y="440" text-anchor="start">84</text>
<text class="monos" x="60" y="464" text-anchor="start">28</text>
<text class="monos" x="200" y="464" text-anchor="start">18</text>
<text class="monos" x="300" y="464" text-anchor="start">64</text>
<text class="monos" x="420" y="464" text-anchor="start">84</text>
<text class="monos" x="60" y="488" text-anchor="start">46</text>
<text class="monos" x="200" y="488" text-anchor="start">0</text>
<text class="monos" x="300" y="488" text-anchor="start">64</text>
<text class="monos" x="420" y="488" text-anchor="start">84</text>
<text class="monos" x="60" y="512" text-anchor="start">100</text>
<text class="monos" x="200" y="512" text-anchor="start">0</text>
<text class="monos" x="300" y="512" text-anchor="start">118</text>
<text class="monos" x="420" y="512" text-anchor="start">138</text>
<text class="monos" x="60" y="536" text-anchor="start">1500</text>
<text class="monos" x="200" y="536" text-anchor="start">0</text>
<text class="monos" x="300" y="536" text-anchor="start">1518</text>
<text class="monos" x="420" y="536" text-anchor="start">1538</text>
<text class="txt" x="540" y="420" text-anchor="start">payload 1 ไบต์ยังกิน 84 ไบต์บนสาย — overhead ไม่ได้แปรตามขนาดข้อมูล</text>
<rect class="boxi" x="540" y="440" width="500" height="96" rx="8"/>
<text class="txt" x="560" y="464" text-anchor="start">FCS: พลิก 1 บิตจับได้ 480/480 ตำแหน่ง</text>
<text class="small" x="560" y="486" text-anchor="start">แต่ CRC เป็นฟังก์ชันเชิงเส้น: 33 probe ก็เจอ error</text>
<text class="small" x="560" y="506" text-anchor="start">15 บิตที่ FCS มองไม่เห็น (อยู่ในไบต์ 0–4 = dst MAC)</text>
</svg>
