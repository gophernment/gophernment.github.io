<text x="40" y="44" class="h">complete mediation: ทุกเส้นทาง ทุกวัตถุ ทุกครั้ง</text>
<text x="40" y="72" class="s">เส้นทางเข้าถึง invoices 7 เส้นทาง · ถ้าการตรวจอยู่ผิดที่ ผู้ใช้ที่ถูกถอนสิทธิ์ก็ยังผ่าน</text>
