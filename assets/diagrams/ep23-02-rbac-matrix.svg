<text x="40" y="470" class="hd">ครึ่งหนึ่งของตารางว่าง — นั่นคือ deny by default</text>
<text x="34" y="494" class="s">อนุญาต 18 ช่อง · ว่าง 18 ช่อง จาก 36 ช่อง</text>
<text x="34" y="518" class="s">ช่องที่ไม่ได้เขียนสิทธิ์ไว้ = ปฏิเสธ</text>
<text x="34" y="542" class="s">ไม่มี wildcard · role ที่ไม่รู้จักได้ 0 สิทธิ์</text>
<rect x="540" y="442" width="416" height="128" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="1.5"/>
<text x="556" y="470" class="hd">ทำไมต้องเป็นบทบาท ไม่ใช่รายคน</text>
<text x="550" y="494" class="s">ให้สิทธิ์รายคน 5 คน = 45 ช่อง</text>
<text x="550" y="518" class="s">โตเป็น 50 คน = 450 ช่องที่ต้องดูแล</text>
<text x="550" y="542" class="s">ตารางบทบาทยัง 36 ช่องเท่าเดิม</text>
<text x="40" y="620" class="sm">ตัวเลขบนภาพทุกตัวอ่านจาก out/02_matrix.txt — ไม่มีตัวไหนพิมพ์ด้วยมือ</text>
