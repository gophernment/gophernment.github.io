<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" width="1060" height="700" role="img" aria-label="ตารางผลรันเดโม CSRF สี่กรณี: ไม่กันเลย SameSite=Lax CSRF token และกรณีที่มี XSS ในขอบเขตเดียวกัน">
<style>
text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
.hdr { font-weight: 700; font-size: 17.5px; }
.ptitle { font-weight: 700; font-size: 14.5px; }
.sub { fill: #57606a; font-size: 12.5px; }
.lbl { fill: #57606a; font-size: 11.5px; }
.txt { font-size: 13px; }
.small { fill: #57606a; font-size: 11px; }
.mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
.monob { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; font-weight: 700; fill: #0550ae; }
.boxn { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.6; }
.boxi { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.6; }
.boxg { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.3; }
.boxw { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
.boxy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
.boxb { fill: #eef4ff; stroke: #0969da; stroke-width: 1.4; }
</style>
<rect x="0" y="0" width="1060" height="700" fill="#ffffff"/>
<text class="hdr" x="530" y="36" text-anchor="middle">เดโม CSRF: คุกกี้ถูกแนบไปกับคำขอที่ผู้ใช้ไม่ได้ตั้งใจ — แต่ละเกราะกันได้แค่ไหน</text>
<text class="sub" x="530" y="60" text-anchor="middle">ตัวเลขทุกตัวดึงจาก out/02_csrf.txt (ธนาคารจำลองรันบน 127.0.0.1 เว็บโจมตีอยู่อีก site)</text>
<rect class="boxb" x="30" y="84" width="190" height="32" rx="7"/>
<text class="ptitle" x="125.0" y="105" text-anchor="middle">กรณี</text>
<rect class="boxb" x="228" y="84" width="250" height="32" rx="7"/>
<text class="ptitle" x="353.0" y="105" text-anchor="middle">เกราะที่เปิดใช้</text>
<rect class="boxb" x="486" y="84" width="170" height="32" rx="7"/>
<text class="ptitle" x="571.0" y="105" text-anchor="middle">คำขอข้าม site</text>
<rect class="boxb" x="664" y="84" width="150" height="32" rx="7"/>
<text class="ptitle" x="739.0" y="105" text-anchor="middle">ยอดเงินหาย</text>
<rect class="boxb" x="822" y="84" width="208" height="32" rx="7"/>
<text class="ptitle" x="926.0" y="105" text-anchor="middle">สรุป</text>
<rect class="boxn" x="30" y="122" width="190" height="62" rx="9"/>
<text class="monob" x="46" y="160" text-anchor="start">[A]</text>
<rect class="boxw" x="228" y="122" width="250" height="62" rx="9"/>
<text class="small" x="240" y="146" text-anchor="start">ไม่มี (cookie ไม่ระบุ SameSite)</text>
<rect class="boxn" x="486" y="122" width="170" height="62" rx="9"/>
<text class="monob" x="500" y="160" text-anchor="start">HTTP 200</text>
<rect class="boxn" x="664" y="122" width="150" height="62" rx="9"/>
<text class="monob" x="678" y="160" text-anchor="start">หาย</text>
<rect class="boxw" x="822" y="122" width="208" height="62" rx="9"/>
<text class="small" x="834" y="146" text-anchor="start">โจมตีสำเร็จ —</text>
<text class="small" x="834" y="163" text-anchor="start">คุกกี้ถูกแนบให้เอง</text>
<rect class="boxi" x="30" y="188" width="190" height="62" rx="9"/>
<text class="monob" x="46" y="226" text-anchor="start">[B]</text>
<rect class="boxw" x="228" y="188" width="250" height="62" rx="9"/>
<text class="small" x="240" y="212" text-anchor="start">SameSite=Lax บนคุกกี้ session</text>
<rect class="boxi" x="486" y="188" width="170" height="62" rx="9"/>
<text class="monob" x="500" y="226" text-anchor="start">HTTP 401</text>
<rect class="boxi" x="664" y="188" width="150" height="62" rx="9"/>
<text class="monob" x="678" y="226" text-anchor="start">ไม่หาย</text>
<rect class="boxw" x="822" y="188" width="208" height="62" rx="9"/>
<text class="small" x="834" y="212" text-anchor="start">ถูกตัดที่ประตูแรก</text>
<text class="small" x="834" y="229" text-anchor="start">(ไม่มีคุกกี้) · navigation</text>
<text class="small" x="834" y="246" text-anchor="start">ปกติยังได้ 200</text>
<rect class="boxi" x="30" y="254" width="190" height="62" rx="9"/>
<text class="monob" x="46" y="292" text-anchor="start">[C]</text>
<rect class="boxw" x="228" y="254" width="250" height="62" rx="9"/>
<text class="small" x="240" y="278" text-anchor="start">CSRF token แบบ synchronizer</text>
<rect class="boxi" x="486" y="254" width="170" height="62" rx="9"/>
<text class="monob" x="500" y="292" text-anchor="start">HTTP 403</text>
<rect class="boxi" x="664" y="254" width="150" height="62" rx="9"/>
<text class="monob" x="678" y="292" text-anchor="start">ไม่หาย</text>
<rect class="boxw" x="822" y="254" width="208" height="62" rx="9"/>
<text class="small" x="834" y="278" text-anchor="start">ปฏิเสธเพราะ token ไม่ตรง</text>
<text class="small" x="834" y="295" text-anchor="start">(403)</text>
<rect class="boxn" x="30" y="320" width="190" height="62" rx="9"/>
<text class="monob" x="46" y="358" text-anchor="start">[D]</text>
<rect class="boxw" x="228" y="320" width="250" height="62" rx="9"/>
<text class="small" x="240" y="344" text-anchor="start">token + มี XSS ในหน้าเว็บเดียวกัน</text>
<rect class="boxn" x="486" y="320" width="170" height="62" rx="9"/>
<text class="monob" x="500" y="358" text-anchor="start">HTTP 200</text>
<rect class="boxn" x="664" y="320" width="150" height="62" rx="9"/>
<text class="monob" x="678" y="358" text-anchor="start">หาย</text>
<rect class="boxw" x="822" y="320" width="208" height="62" rx="9"/>
<text class="small" x="834" y="344" text-anchor="start">XSS อ่าน token จาก DOM</text>
<text class="small" x="834" y="361" text-anchor="start">แล้วยิงได้ — token กัน CSRF</text>
<text class="small" x="834" y="378" text-anchor="start">ไม่ได้กัน XSS</text>
<rect class="boxi" x="30" y="394" width="1000" height="92" rx="9"/>
<text class="ptitle" x="46" y="420" text-anchor="start">HttpOnly ทำให้ XSS "ขโมยคุกกี้" ไม่ได้ — แต่มันไม่หยุด XSS</text>
<text class="small" x="46" y="444" text-anchor="start">สคริปต์ในหน้าเว็บอ่าน document.cookie: คุกกี้ที่ไม่มี HttpOnly ได้ค่า 32 ตัวอักษร · คุกกี้ที่มี HttpOnly ได้ 0 (อ่านไม่ได้) — ในขณะที่ "คำขอ"</text>
<text class="small" x="46" y="461" text-anchor="start">ที่ปลอดภัยยังแนบคุกกี้ไปตามปกติ เพราะ HttpOnly จำกัดแค่การอ่านจากสคริปต์ ไม่ได้ห้ามการส่ง</text>
<rect class="boxy" x="30" y="498" width="1000" height="100" rx="9"/>
<text class="ptitle" x="46" y="524" text-anchor="start">หลักคิดที่ได้จากสี่กรณีนี้</text>
<text class="small" x="46" y="548" text-anchor="start">เกราะที่ "แนบมากับคำขอ" (SameSite) ทำงานที่เบราว์เซอร์ — คำขอที่ไม่มีคุกกี้ก็ไม่รู้ว่าใครเป็นใคร · เกราะที่</text>
<text class="small" x="46" y="565" text-anchor="start">"แนบมากับคำขอแต่ต้องรู้ความลับ" (token) ทำงานที่เซิร์ฟเวอร์ และพังทันทีเมื่อผู้โจมตีอยู่ในขอบเขตเดียวกัน (XSS) · HttpOnly</text>
<text class="small" x="46" y="582" text-anchor="start">ไม่ได้ป้องกันการโจมตี แต่ลดความเสียหาย — ใช้ทั้งสามชั้นร่วมกันจึงจะครบ</text>
</svg>
