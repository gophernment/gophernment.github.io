<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 780" width="1060" height="780" role="img" aria-label="ลำดับชั้นเครื่องคำนวณ: FA, PDA และ Turing machine พร้อมตัวเลขจากผลรันจริง">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 19px; }
    .sub { fill: #57606a; font-size: 12.5px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .btitle { font-weight: 700; font-size: 12.5px; }
    .lbl { fill: #57606a; font-size: 11.5px; }
    .lblb { fill: #0550ae; font-size: 11.5px; font-weight: 700; }
    .lblr { fill: #cf222e; font-size: 11.5px; font-weight: 700; }
    .lblg { fill: #1a7f37; font-size: 11.5px; font-weight: 700; }
    .lblo { fill: #9a6700; font-size: 11.5px; font-weight: 700; }
    .mono { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 12px; }
    .monos { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 11.5px; }
    .monob { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #0550ae; }
    .monor { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #cf222e; }
    .monog { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #1a7f37; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .bandw { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .bandc { fill: #eef4ff; stroke: #0969da; stroke-width: 1.4; }
    .bandg { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
    .bandr { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.4; }
    .bandy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
    .cell { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.1; }
    .cellt { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.1; }
    .cellg { fill: #eafaf0; stroke: #1a7f37; stroke-width: 1.3; }
    .cellr { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.3; }
    .celly { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.3; }
    .celld { fill: #e7f0ff; stroke: #0969da; stroke-width: 2.4; }
    .diagmark { fill: none; stroke: #0969da; stroke-width: 2.6; }
    .head { fill: #fff8e5; stroke: #bf8700; stroke-width: 2.2; }
    .arrow { stroke: #57606a; stroke-width: 2; fill: none; }
    .arrowb { stroke: #0550ae; stroke-width: 2.2; fill: none; }
    .arrowg { stroke: #1a7f37; stroke-width: 2.2; fill: none; }
    .arrowr { stroke: #cf222e; stroke-width: 2.2; fill: none; }
    .dash { stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0550ae"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect x="0.0" y="0.0" width="1060.0" height="780.0" class="bandw"/>
  <text x="30.0" y="36.0" class="hdr">ลำดับชั้นเครื่องคำนวณ: เพิ่มความจำทีละชั้น แล้วได้ภาษาที่ “ทำได้” เพิ่มขึ้น</text>
  <text x="30.0" y="60.0" class="sub">ทุกตัวเลขในภาพมาจากผลรันจริง (โปรแกรม 01, 02 และ 05) — ไม่ใช่ค่าที่พิมพ์มือ</text>
  <rect x="30.0" y="92.0" width="1000.0" height="148.0" class="bandy"/>
  <rect x="46.0" y="108.0" width="140.0" height="116.0" class="bandw"/>
  <text x="64.0" y="144.0" class="hdr">FA</text>
  <text x="52.0" y="172.0" class="lbl">finite automaton</text>
  <text x="196.0" y="130.0" class="btitle">สถานะจำกัด ไม่มีหน่วยความจำเพิ่ม</text>
  <text x="196.0" y="160.0" class="lblg">✓ รับได้: a*b, จำนวนนับแบบมีเพดาน</text>
  <text x="196.0" y="186.0" class="lblr">✗ ทำไม่ได้: aⁿbⁿ (จำนวนไม่มีเพดาน) — พิสูจน์ในตอนที่ 22 และ 23</text>
  <text x="196.0" y="214.0" class="lbl">ชั้นภาษา: regular (ภาษาปกติ) — ตรวจได้ด้วยสถานะจำกัดล้วน ๆ</text>
  <rect x="30.0" y="260.0" width="1000.0" height="148.0" class="bandc"/>
  <rect x="46.0" y="276.0" width="140.0" height="116.0" class="bandw"/>
  <text x="64.0" y="312.0" class="hdr">PDA</text>
  <text x="52.0" y="340.0" class="lbl">pushdown automaton</text>
  <text x="196.0" y="298.0" class="btitle">FA + stack 1 กอง (เข้าทีหลังออกก่อน)</text>
  <text x="196.0" y="328.0" class="lblg">✓ รับได้: วงเล็บสมดุล, aⁿbⁿ, palindrome (ตอนที่ 23)</text>
  <text x="196.0" y="354.0" class="lblr">✗ ทำไม่ได้: aⁿbⁿcⁿ — เทียบจำนวนได้ทีละคู่ · ผลรันจริง 3 กลยุทธ์ ผิดกลยุทธ์ละ 9 จาก 64 เส้น</text>
  <text x="196.0" y="382.0" class="lbl">ชั้นภาษา: context-free (ไวยากรณ์นอกบริบท) — ตรวจได้ด้วย stack 1 กอง</text>
  <rect x="30.0" y="428.0" width="1000.0" height="148.0" class="bandg"/>
  <rect x="46.0" y="444.0" width="140.0" height="116.0" class="bandw"/>
  <text x="64.0" y="480.0" class="hdr">TM</text>
  <text x="52.0" y="508.0" class="lbl">Turing machine</text>
  <text x="196.0" y="466.0" class="btitle">FA + เทปอนันต์ (เขียนทับ + หัวอ่านเดินสองทาง)</text>
  <text x="196.0" y="496.0" class="lblg">✓ รับได้: aⁿbⁿcⁿ → ผิด 0 จาก 64 เส้น · aabbcc = 29 ก้าว · aaabbbccc = 58 ก้าว</text>
  <text x="196.0" y="522.0" class="lblr">✗ ทำไม่ได้: ตัดสิน halting problem (รับรู้ได้ แต่ตัดสินไม่ได้ — หัวข้อ 6–8)</text>
  <text x="196.0" y="550.0" class="lbl">ชั้นภาษา: decidable (ตัดสินได้) — และยังมี recognizable ที่ตัดสินไม่ได้อยู่เหนือขึ้นไปอีก</text>
  <text x="78.0" y="616.0" class="lblb">ความจำมากขึ้น → เครื่องทำได้มากขึ้น (และภาษาที่รับได้เป็นเซตย่อยแท้ของชั้นถัดไป)</text>
  <rect x="30.0" y="644.0" width="1000.0" height="130.0" class="band"/>
  <text x="46.0" y="670.0" class="ptitle">หลักฐานเชิงตัวเลขที่เพิ่งรันจริง</text>
  <text x="46.0" y="694.0" class="lbl">PDA กับ aⁿbⁿcⁿ: เทียบ a กับ b ผิด 9/64 · เทียบ a กับ c ผิด 9/64 · เทียบ b กับ c ผิด 9/64</text>
  <text x="46.0" y="716.0" class="lblg">Turing machine ตัวเดียวกัน: ผิด 0 จาก 64 เส้น (และตัดสินได้ 13/13 สตริงในชุดทดสอบ)</text>
  <text x="46.0" y="738.0" class="lbl">palindrome (TM เดินสองทาง): ทดสอบครบทุกสตริงยาว 1–12 = 8190 เส้น · ไม่ตรงกับ oracle 0 · ค้าง 0</text>
  <text x="46.0" y="760.0" class="lbl">จำนวนก้าวของ TM กับ palindrome ยาว n = (n+1)(n+2)/2 ตรง 12 จาก 12 ค่า · ตัวอย่าง abba: 15 ก้าว (ขวา 8 · ซ้าย 6 · กลับทิศ 4)</text>
</svg>
