<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 950" width="1040" height="950" role="img" aria-label="เส้นแบ่ง user space (EL0) กับ kernel space (EL1) บน arm64 พร้อมหลักฐานจากการรันจริง">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 13px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 18px; }
    .sub { fill: #57606a; font-size: 12.5px; }
    .ptitle { font-weight: 700; font-size: 14.5px; }
    .btitle { font-weight: 700; font-size: 12.5px; }
    .lbl { fill: #57606a; font-size: 11.5px; }
    .lbl2 { fill: #1a1a1a; font-size: 11.5px; }
    .mono { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 12px; }
    .monob { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #0550ae; }
    .monor { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 700; fill: #cf222e; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .bandc { fill: #eef4ff; stroke: #0969da; stroke-width: 1.4; }
    .bandg { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
    .bandr { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.4; }
    .bandy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
    .cell { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.1; }
    .arrow { stroke: #57606a; stroke-width: 2; fill: none; }
    .arrowb { stroke: #0550ae; stroke-width: 2.4; fill: none; }
    .arrowr { stroke: #cf222e; stroke-width: 2.2; fill: none; }
    .dash { stroke: #8c959f; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="a-n" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="a-b" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0550ae"/></marker>
    <marker id="a-r" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
    <marker id="a-g" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
  </defs>
  <rect x="0" y="0" width="1040" height="950" fill="#ffffff"/>

<text class="hdr" x="520" y="36" text-anchor="middle">CPU มีสองโหมดสิทธิ์: user space (EL0) กับ kernel space (EL1)</text>
<text class="sub" x="520" y="60" text-anchor="middle">หลักฐานทุกชิ้นมาจาก boundary_demo.c · enosys_probe.c ที่รันบน Raspberry Pi 5 (Linux 6.18.39 aarch64)</text>
<rect class="bandg" x="40" y="88" width="960" height="250" rx="10"/>
<text class="ptitle" x="60" y="118">user space — โปรแกรมของเราทำงานที่ EL0 (Exception Level 0 = ระดับสิทธิ์ต่ำสุด)</text>
<rect class="cell" x="60" y="136" width="300" height="150" rx="8"/>
<text class="btitle" x="72" y="160">โปรแกรมของเรา</text>
<text class="lbl" x="72" y="184">คำสั่งทุกบรรทัดวิ่งที่ EL0</text>
<text class="lbl" x="72" y="204">สั่ง hardware ตรง ๆ ไม่ได้</text>
<text class="lbl" x="72" y="224">แตะได้แค่ที่อยู่ในตารางของตัวเอง</text>
<rect class="cell" x="380" y="136" width="300" height="150" rx="8"/>
<text class="btitle" x="392" y="160">libc (ตัวห่อ)</text>
<text class="lbl" x="392" y="184">รับคำสั่งอย่าง printf()/read()</text>
<text class="lbl" x="392" y="204">เตรียมรีจิสเตอร์แล้วยิง syscall</text>
<text class="lbl" x="392" y="224">แปลงค่าลบจาก kernel เป็น errno</text>
<rect class="cell" x="700" y="136" width="300" height="150" rx="8"/>
<text class="btitle" x="712" y="160">หน่วยความจำที่แตะได้จริง</text>
<text class="lbl" x="712" y="184">0x5556265e0000 .. 0x7fffd8760000</text>
<text class="lbl" x="712" y="204">16 region (อ่านได้ 15 · เขียนได้ 7)</text>
<text class="lbl" x="712" y="224">ที่อยู่ 0xffff... ไม่มีในตารางเลย</text>
<text class="lbl" x="60" y="310">ข้อจำกัดที่พิสูจน์ได้: อ่าน CurrentEL / sctlr_el1 / ttbr0_el1 จาก EL0 → SIGILL (Illegal instruction)</text>
<rect class="bandy" x="40" y="352" width="960" height="76" rx="10"/>
<text class="ptitle" x="60" y="380">กำแพงบังคับโดย hardware (CPU + MMU) ไม่ใช่ข้อตกลงของโปรแกรมเมอร์ — ประตูมีบานเดียว</text>
<text class="mono" x="60" y="406">ประตูบานเดียว: svc #0 (เข้า kernel) · eret (กลับ user) — ค่าที่ส่งผ่านอยู่ในรีจิสเตอร์ x0..x8</text>
<line class="arrowb" x1="890" y1="358" x2="890" y2="422" marker-end="url(#a-b)"/>
<text class="monob" x="880" y="390" text-anchor="end">svc #0</text>
<line class="arrowr" x1="960" y1="422" x2="960" y2="358" marker-end="url(#a-r)"/>
<text class="monor" x="970" y="390">eret</text>
<rect class="bandc" x="40" y="442" width="960" height="230" rx="10"/>
<text class="ptitle" x="60" y="472">kernel space — เคอร์เนลทำงานที่ EL1 (สิทธิ์เต็ม: ตั้ง MMU, สั่ง hardware, เห็นทุกโปรเซส)</text>
<rect class="cell" x="60" y="490" width="215" height="130" rx="8"/>
<text class="btitle" x="72" y="514">syscall table</text>
<text class="lbl" x="72" y="538">ตารางหมายเลข 0..469</text>
<text class="lbl" x="72" y="558">nr=469 → -EINVAL (22)</text>
<text class="lbl" x="72" y="578">nr=470+ → -ENOSYS (38)</text>
<rect class="cell" x="295" y="490" width="215" height="130" rx="8"/>
<text class="btitle" x="307" y="514">หน่วยความจำ/paging</text>
<text class="lbl" x="307" y="538">ถือ page table ของทุกโปรเซส</text>
<text class="lbl" x="307" y="558">ตั้ง MMU ว่าใครเห็นอะไร</text>
<text class="lbl" x="307" y="578">(ตอนที่ 20 จะลงลึก)</text>
<rect class="cell" x="530" y="490" width="215" height="130" rx="8"/>
<text class="btitle" x="542" y="514">ระบบไฟล์ + drivers</text>
<text class="lbl" x="542" y="538">เปิด/อ่าน/เขียนไฟล์จริง</text>
<text class="lbl" x="542" y="558">คุมดิสก์ การ์ดเน็ต จอ</text>
<text class="lbl" x="542" y="578">คีย์บอร์ด กล้อง เซนเซอร์</text>
<rect class="cell" x="765" y="490" width="215" height="130" rx="8"/>
<text class="btitle" x="777" y="514">scheduler + interrupt</text>
<text class="lbl" x="777" y="538">แบ่ง CPU ให้ทุกงาน</text>
<text class="lbl" x="777" y="558">รับสัญญาณจาก hardware</text>
<text class="lbl" x="60" y="644">ทำไมต้องแยก: กันโปรแกรมทำลายกันเอง · กันแอปเล่น hardware ตรง ๆ · กันอ่านหน่วยความจำของโปรเซสอื่น</text>
<rect class="bandr" x="40" y="692" width="960" height="164" rx="10"/>
<text class="ptitle" x="60" y="722">ถ้าโปรแกรมพยายามข้ามกำแพงเอง — ผลที่เกิดจริงบนเครื่องนี้</text>
<text class="lbl2" x="60" y="750">อ่าน system register ฝั่ง kernel</text>
<text class="mono" x="390" y="750">sctlr_el1 / ttbr0_el1 / CurrentEL</text>
<text class="lbl2" x="720" y="750">→ SIGILL (signal 4)</text>
<line class="dash" x1="60" y1="758" x2="980" y2="758"/>
<text class="lbl2" x="60" y="780">แตะที่อยู่ใน kernel space</text>
<text class="mono" x="390" y="780">0xffff000000000000</text>
<text class="lbl2" x="720" y="780">→ SIGSEGV · si_code=1 (SEGV_MAPERR)</text>
<line class="dash" x1="60" y1="788" x2="980" y2="788"/>
<text class="lbl2" x="60" y="810">บังคับข้ามด้วยตัวเลข syscall มั่ว</text>
<text class="mono" x="390" y="810">__NR_syscalls = 470 · ยิง nr=999</text>
<text class="lbl2" x="720" y="810">→ x0 = -38 = -ENOSYS</text>
<line class="dash" x1="60" y1="818" x2="980" y2="818"/>
<text class="lbl" x="60" y="854">ทั้งหมดนี้ไม่ใช่ "ตกลงกันว่าไม่ทำ" — CPU และ MMU ปฏิเสธจริง สังเกตได้จากสัญญาณที่โปรเซสโดน</text>
</svg>