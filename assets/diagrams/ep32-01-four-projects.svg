<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 556" width="1400" height="556" role="img" aria-label="แผนที่ 4 โปรเจกต์ capstone และความรู้ที่นํามาใช้">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12.5px; fill: #1a1a1a; }
