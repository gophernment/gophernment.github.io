  <path d="M 150.0 376.0 L 648.0 376.0" class="arrow" marker-end="url(#a)"/>
  <path d="M 150.0 376.0 L 150.0 144.0" class="arrow" marker-end="url(#a)"/>
  <text x="36.0" y="408.0" class="lbl">แกนนอน: ขนาด input n</text>
  <text x="150.0" y="394.0" class="axis" text-anchor="middle">10</text>
  <text x="248.0" y="394.0" class="axis" text-anchor="middle">20</text>
  <text x="346.0" y="394.0" class="axis" text-anchor="middle">30</text>
  <text x="444.0" y="394.0" class="axis" text-anchor="middle">40</text>
  <text x="542.0" y="394.0" class="axis" text-anchor="middle">50</text>
  <text x="640.0" y="394.0" class="axis" text-anchor="middle">60</text>
  <polyline points="150.0,376.0 248.0,376.0 346.0,376.0 444.0,376.0 542.0,376.0 640.0,376.0" class="ln1"/>
  <circle cx="150.0" cy="376.0" r="2.6" fill="#8c959f"/>
