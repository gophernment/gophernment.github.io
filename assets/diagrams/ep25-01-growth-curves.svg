  <rect x="0.0" y="0.0" width="1080.0" height="830.0" class="bandw"/>
  <text x="30.0" y="36.0" class="hdr">การเติบโตของจำนวนขั้นตอน — ทำไม n โตขึ้นนิดเดียว งานโตขึ้นมหาศาล</text>
  <text x="30.0" y="58.0" class="sub">ทุกตัวเลขในภาพนี้มาจากผลรันจริงของโปรแกรม 01 (Raspberry Pi 5 · 1 ขั้นตอน = 1 รอบของ spin)</text>
  <rect x="28.0" y="74.0" width="1024.0" height="356.0" class="bandw"/>
  <text x="44.0" y="98.0" class="ptitle">1) จำนวนขั้นตอนของแต่ละอัลกอริทึม (แกนตั้งสเกลลอการิทึม: แต่ละขีดคูณ 10)</text>
