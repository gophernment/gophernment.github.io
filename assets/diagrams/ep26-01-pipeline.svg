<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 560" width="1010" height="560" role="img" aria-label="จากซอร์สโค้ดถึง token stream">
  <style>
    text { font-family: "Noto Sans Thai", "DejaVu Sans", sans-serif; font-size: 12.5px; fill: #1a1a1a; }
    .hdr { font-weight: 700; font-size: 19px; }
    .sub { fill: #57606a; font-size: 12.5px; }
    .btitle { font-weight: 700; font-size: 12.5px; }
    .lbl { fill: #57606a; font-size: 11.5px; }
    .lblb { fill: #0550ae; font-size: 11.5px; font-weight: 700; }
    .lblg { fill: #1a7f37; font-size: 11.5px; font-weight: 700; }
    .lblr { fill: #cf222e; font-size: 11.5px; font-weight: 700; }
    .axis { fill: #8c959f; font-size: 10px; }
    .mono { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 11.5px; }
    .mono11 { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 11.5px; }
    .monob { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 11.5px; font-weight: 700; fill: #0550ae; }
    .monog { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 11.5px; font-weight: 700; fill: #1a7f37; }
    .monor { font-family: ui-monospace, "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 11.5px; font-weight: 700; fill: #cf222e; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .bandw { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .bandc { fill: #eef4ff; stroke: #0969da; stroke-width: 1.4; }
    .bandg { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.4; }
    .bandr { fill: #fdf2f2; stroke: #cf222e; stroke-width: 1.4; }
    .bandy { fill: #fff8e5; stroke: #bf8700; stroke-width: 1.4; }
    .bandd { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .cell { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.1; }
    .cellt { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.1; }
    .cellhl { fill: #dbe9ff; stroke: #0969da; stroke-width: 1.6; }
    .arrow { stroke: #57606a; stroke-width: 1.8; fill: none; }
    .arrowb { stroke: #0550ae; stroke-width: 2; fill: none; }
    .bus { stroke: #bf8700; stroke-width: 1.8; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0550ae"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf8700"/>
    </marker>
  </defs>
  <text x="32.0" y="38.0" class="hdr">จากซอร์สโค้ด → token: งานของ lexer ในท่อของตัวแปลภาษา</text>
  <text x="32.0" y="60.0" class="sub">lexer รับ “ข้อความ” ก้อนเดียว แล้วส่ง “ลำดับคำ” ต่อให้ชั้นถัดไป — ทุกค่าในภาพดึงจากผลรันจริงใน out/</text>
  <rect x="32.0" y="88.0" width="300.0" height="196.0" class="bandw" rx="8.0"/>
  <text x="44.0" y="112.0" class="lblb">1) ซอร์สโค้ด — เป็น string ก้อนเดียว</text>
  <text x="44.0" y="136.0" class="mono11">let x = 3 + 4 * 5;</text>
  <text x="44.0" y="153.0" class="mono11">let y = (x - 2) * 2;</text>
  <text x="44.0" y="170.0" class="mono11">if y &gt; 10 { print y; }</text>
  <text x="44.0" y="216.0" class="lbl">3 บรรทัด · 62 ตัวอักษร</text>
  <text x="44.0" y="234.0" class="lbl">โปรแกรมไม่รู้ว่า “ตัวเลข” หรือ “ชื่อตัวแปร”</text>
  <text x="44.0" y="252.0" class="lbl">คืออะไร — เห็นแค่ตัวอักษรเรียงกันไปเรื่อย ๆ</text>
  <text x="44.0" y="270.0" class="lbl">ช่องว่าง ขึ้นบรรทัดใหม่ คอมเมนต์ ก็ปนอยู่ที่เดียวกัน</text>
  <path d="M 332.0 186.0 L 388.0 186.0" class="arrowb" marker-end="url(#ab)"/>
  <rect x="392.0" y="130.0" width="160.0" height="112.0" class="bandc" rx="8.0"/>
  <text x="472.0" y="158.0" class="btitle" text-anchor="middle">lexer</text>
  <text x="472.0" y="180.0" class="lbl" text-anchor="middle">เดินอ่านทีละ</text>
  <text x="472.0" y="196.0" class="lbl" text-anchor="middle">ตัวอักษร</text>
  <text x="472.0" y="216.0" class="lbl" text-anchor="middle">switch + peek</text>
  <text x="472.0" y="232.0" class="lbl" text-anchor="middle">1 รอบ = 1 คำ</text>
  <path d="M 552.0 186.0 L 606.0 186.0" class="arrowb" marker-end="url(#ab)"/>
  <rect x="610.0" y="88.0" width="368.0" height="196.0" class="bandg" rx="8.0"/>
  <text x="622.0" y="112.0" class="lblg">2) token stream — ลำดับคำ (30 ตัว)</text>
  <text x="622.0" y="136.0" class="mono11">LET(let) IDENT(x) ASSIGN(=) NUMBER(3) PLUS(+)</text>
  <text x="622.0" y="153.0" class="mono11">NUMBER(4) STAR(*) NUMBER(5) SEMI(;) LET(let)</text>
  <text x="622.0" y="170.0" class="mono11">IDENT(y) ASSIGN(=) LPAREN(() IDENT(x) MINUS(-)</text>
  <text x="622.0" y="187.0" class="mono11">NUMBER(2) RPAREN()) STAR(*) NUMBER(2) SEMI(;)</text>
  <text x="622.0" y="204.0" class="mono11">IF(if) IDENT(y) GT(&gt;) NUMBER(10) LBRACE({)</text>
  <text x="622.0" y="221.0" class="mono11">PRINT(print) IDENT(y) SEMI(;) RBRACE(}) EOF()</text>
  <text x="622.0" y="268.0" class="lbl">ทุกคำรู้ว่าตัวเองเป็นอะไร · ข้อความจริง · ตำแหน่ง</text>
  <path d="M 794.0 284.0 L 794.0 302.0" class="arrow" marker-end="url(#a)"/>
  <rect x="610.0" y="306.0" width="368.0" height="68.0" class="bandd" rx="8.0"/>
  <text x="622.0" y="330.0" class="btitle">ตอนถัดไป: parser (ตอนที่ 27) → AST</text>
  <text x="622.0" y="350.0" class="lbl">แล้วปิดท้ายระยะที่ 6 ด้วย interpreter (28) ·</text>
  <text x="622.0" y="365.0" class="lbl">type/scope (29) · codegen (30)</text>
  <rect x="32.0" y="306.0" width="546.0" height="154.0" class="band" rx="8.0"/>
  <text x="44.0" y="330.0" class="lblb">ตัวเลขจริงจาก out/ (ไม่พิมพ์มือ)</text>
  <text x="44.0" y="352.0" class="">ตัวอย่าง 1 → 6 token · ตัวอย่าง 2 → 24 token · ตัวอย่าง 3 → 30 token</text>
  <text x="44.0" y="373.0" class="">รวมทั้ง 3 ตัวอย่าง 60 token · ชนิด token ทั้งหมด 23 ชนิด ใน 5 กลุ่ม</text>
  <text x="44.0" y="394.0" class="">สเปกตรวจตัวเอง 5/5 กลุ่ม · ตรวจตำแหน่งอิสระ 60 token → ไม่ตรง 0 จุด</text>
  <text x="44.0" y="415.0" class="">peek ตรงกับ lexer จริง 8/8 กรณี · เก็บ error ได้ 3 จุดในรอบเดียว</text>
  <rect x="32.0" y="480.0" width="946.0" height="46.0" class="bandg" rx="8.0"/>
  <text x="44.0" y="508.0" class="btitle">lexer เป็นด่านแรกของท่อ: ถ้าตัดคำผิด ทุกชั้นถัดไป (parser → interpreter → codegen) ผิดตามทั้งหมด</text>
  <text x="32.0" y="548.0" class="lbl">ภาพที่ 1 — บันทึก 2026-09-29 · Go go1.24.4 linux/arm64 · ผลรันจริงอยู่ที่ course/code/ep26/out/</text>
</svg>
